<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2022 개정 교육과정 초등 성취기준·성취수준 찾기</title>
<style>
:root{
  --bg:#fff; --panel:#fff; --sunk:#fafafa;
  --ink:#111; --ink2:#333; --dim:#6e6e6e; --faint:#9a9a9a;
  --line:#e3e3e3; --line2:#c9c9c9; --accent:#111; --soft:#f2f2f2;
  --mark:#ececec;
  --radius:8px;
}
html[data-theme="dark"]{
  --bg:#0e0e0f; --panel:#161617; --sunk:#1b1b1d;
  --ink:#f2f2f2; --ink2:#dcdcdc; --dim:#9d9d9d; --faint:#767676;
  --line:#2a2a2c; --line2:#3d3d40; --accent:#f2f2f2; --soft:#232325;
  --mark:#3a3a3d;
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:"Pretendard","Malgun Gothic","맑은 고딕",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  font-size:15px;line-height:1.62;-webkit-text-size-adjust:100%;
}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
a{color:var(--ink)}
.mono{font-family:"Consolas","D2Coding",ui-monospace,monospace}

/* ===== 헤더 ===== */
header{position:sticky;top:0;z-index:30;background:var(--panel);border-bottom:1px solid var(--line2);padding:10px 16px 0}
.hrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-weight:800;font-size:16.5px;letter-spacing:-.02em;white-space:nowrap;line-height:1.25}
.brand small{display:block;font-weight:500;font-size:11.5px;color:var(--dim);letter-spacing:0;margin-top:1px}
.btn{border:1px solid var(--line2);border-radius:7px;padding:6px 11px;font-size:12.5px;font-weight:600;color:var(--dim);background:var(--panel)}
.btn:hover{border-color:var(--ink);color:var(--ink)}
.btn.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.searchwrap{position:relative;flex:1;min-width:230px}
.searchwrap input{width:100%;padding:10px 74px 10px 34px;border:1.5px solid var(--line2);border-radius:8px;background:var(--bg);outline:none}
.searchwrap input:focus{border-color:var(--ink)}
.searchwrap .ico{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--faint);font-size:14px}
.searchwrap .clr{position:absolute;right:7px;top:50%;transform:translateY(-50%);border:1px solid var(--line);border-radius:6px;padding:3px 8px;font-size:11.5px;color:var(--dim)}
.searchwrap .clr[hidden]{display:none}

.filters{padding:9px 0 10px;display:flex;flex-direction:column;gap:6px}
.frow{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.flabel{font-size:11px;color:var(--faint);font-weight:800;letter-spacing:.03em;min-width:34px}
.chip{border:1px solid var(--line);border-radius:999px;padding:3.5px 11px;font-size:12.5px;font-weight:600;color:var(--dim);white-space:nowrap;background:var(--panel)}
.chip:hover{border-color:var(--ink);color:var(--ink)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .hi{font-size:10px;opacity:.65;margin-left:4px;font-weight:700}
.chip.on .hi{opacity:.8}
.fnote{font-size:11.5px;color:var(--faint)}

/* ===== 본문 ===== */
main{display:grid;grid-template-columns:minmax(320px,400px) 1fr;gap:13px;padding:13px 16px 96px;align-items:start}
.col{background:var(--panel);border:1px solid var(--line2);border-radius:var(--radius)}
.listhead{display:flex;align-items:center;gap:7px;padding:9px 12px;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--dim);flex-wrap:wrap}
.listhead b{color:var(--ink);font-size:14px}
.list{max-height:calc(100vh - 268px);overflow:auto;overscroll-behavior:contain}
.grouphead{position:sticky;top:0;background:var(--sunk);border-bottom:1px solid var(--line);border-top:1px solid var(--line);
  padding:5px 12px;font-size:11.5px;font-weight:800;color:var(--dim);letter-spacing:.01em;z-index:2}
.grouphead .n{float:right;font-weight:600;color:var(--faint)}
.item{display:flex;gap:9px;padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer;align-items:flex-start}
.item:hover{background:var(--soft)}
.item.sel{background:var(--soft);box-shadow:inset 3px 0 0 var(--ink)}
.item input[type=checkbox]{margin-top:4px;width:14px;height:14px;accent-color:#111;flex:none}
.itemmain{min-width:0;flex:1}
.code{font-family:"Consolas","D2Coding",ui-monospace,monospace;font-size:12px;font-weight:700}
.meta{font-size:11.5px;color:var(--dim);margin-left:6px}
.badge{font-size:10px;font-weight:700;color:var(--dim);border:1px solid var(--line2);border-radius:4px;padding:0 5px;margin-left:5px;white-space:nowrap}
.itemtext{font-size:13.5px;margin-top:1px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.empty{padding:38px 20px;text-align:center;color:var(--dim);font-size:13.5px}
.relaxnote{padding:8px 12px;background:var(--sunk);color:var(--dim);font-size:12px;border-bottom:1px solid var(--line)}

/* ===== 상세 ===== */
.dhead{padding:15px 19px 12px;border-bottom:1px solid var(--line)}
.dcode{font-family:"Consolas","D2Coding",ui-monospace,monospace;font-size:15px;font-weight:800}
.dtags{display:flex;gap:5px;flex-wrap:wrap;margin:7px 0 9px}
.tag{border:1px solid var(--line);border-radius:5px;padding:2px 7px;font-size:11.5px;font-weight:600;color:var(--dim)}
.dtext{font-size:17px;font-weight:600;line-height:1.55;letter-spacing:-.01em}
.dact{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}

.tabs{display:flex;gap:0;padding:0 12px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{border-bottom:2.5px solid transparent;padding:10px 11px;font-size:13px;font-weight:700;color:var(--faint);white-space:nowrap}
.tab.on{color:var(--ink);border-bottom-color:var(--ink)}
.pane{padding:15px 19px 22px}

.lv{display:grid;grid-template-columns:30px 1fr;gap:11px;margin-bottom:11px;align-items:start}
.lvb{width:30px;height:30px;border-radius:6px;display:grid;place-items:center;font-weight:800;font-size:14px;border:1.5px solid var(--ink)}
.lv-A .lvb{background:var(--ink);color:var(--bg)}
.lv-B .lvb{background:var(--dim);color:var(--bg);border-color:var(--dim)}
.lv-C .lvb{background:transparent;color:var(--ink)}
.lvt{padding-top:3px;font-size:14.5px}
.catrow{margin-bottom:8px}
.catname{font-size:11px;font-weight:800;color:var(--faint);letter-spacing:.03em}
.cattext{font-size:14px}
.hint{font-size:12.5px;color:var(--dim);background:var(--sunk);border:1px solid var(--line);border-radius:7px;padding:9px 12px;margin-bottom:13px}
.extra{margin-top:14px;padding:11px 13px;background:var(--sunk);border:1px solid var(--line);border-radius:7px;font-size:13.5px}
.extra ul{margin:5px 0 0;padding-left:18px}

/* 범주 성향 막대 */
.prof{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:9px 0 0}
@media (max-width:520px){ .prof{grid-template-columns:1fr} }
.pcell{min-width:0}
.pbar{height:7px;background:var(--soft);border-radius:99px;overflow:hidden;margin-top:3px}
.pbar i{display:block;height:100%;background:var(--ink)}
.pcell.dim .pbar i{background:var(--line2)}
.plab{font-size:11px;font-weight:700;color:var(--dim);display:flex;justify-content:space-between}

/* 연관/위계 카드 */
.rel{border:1px solid var(--line);border-radius:7px;padding:10px 12px;margin-bottom:8px;cursor:pointer;background:var(--panel)}
.rel:hover{border-color:var(--ink);background:var(--soft)}
.relhead{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.score{margin-left:auto;font-size:10.5px;font-weight:800;color:var(--dim);border:1px solid var(--line2);border-radius:999px;padding:1px 7px}
.relkw{margin-top:5px;display:flex;gap:4px;flex-wrap:wrap}
.kw{border:1px solid var(--line2);border-radius:4px;padding:1px 6px;font-size:11px;font-weight:700;color:var(--dim)}
.kw.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
mark{background:var(--mark);color:inherit;font-weight:700;border-radius:2px;padding:0 1px}

/* 위계 타임라인 */
.tl{position:relative;padding-left:16px}
.tl:before{content:"";position:absolute;left:4px;top:6px;bottom:6px;width:1.5px;background:var(--line2)}
.tlband{position:relative;margin-bottom:16px}
.tlband:before{content:"";position:absolute;left:-16px;top:7px;width:9px;height:9px;border-radius:50%;background:var(--bg);border:2px solid var(--ink)}
.tlband.cur:before{background:var(--ink)}
.tlname{font-size:12px;font-weight:800;color:var(--dim);margin-bottom:6px}
.tlrow{display:flex;gap:9px;padding:6px 9px;border:1px solid var(--line);border-radius:6px;margin-bottom:5px;cursor:pointer;font-size:13px;align-items:flex-start}
.tlrow .code{white-space:nowrap;flex:none}
.tlrow:hover{border-color:var(--ink);background:var(--soft)}
.tlrow.me{border-color:var(--ink);background:var(--soft);font-weight:600}

/* 온톨로지 */
.ontowrap{overflow-x:auto;border:1px solid var(--line);border-radius:7px;background:var(--sunk)}
.onto{display:block;width:100%;min-width:720px}
.onto text{font-family:inherit;fill:var(--ink)}
.onto .edge{stroke:var(--line2);fill:none}
.onto .edge.seq{stroke-dasharray:4 3}
.onto .nd{cursor:pointer}
.onto .nd:hover .box{stroke-width:2.2}
.box{fill:var(--panel);stroke:var(--line2);stroke-width:1.2}
.nd.center .box{fill:var(--ink);stroke:var(--ink)}
.nd.center text{fill:var(--bg)}
.nd.concept .box{fill:var(--soft);stroke:var(--line2)}
.legend{display:flex;gap:13px;flex-wrap:wrap;font-size:11.5px;color:var(--dim);margin-top:9px}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:16px;height:0;border-top:1.5px solid var(--line2);display:inline-block}
.legend i.d{border-top-style:dashed}
.legend b{width:11px;height:11px;border:1.5px solid var(--line2);background:var(--soft);border-radius:50%;display:inline-block}
.legend b.sq{border-radius:3px;background:var(--panel)}

/* ===== 담기 바 / 푸터 ===== */
.cart{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--panel);border-top:1px solid var(--line2);
  padding:9px 16px;display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.cart[hidden]{display:none}
footer{padding:16px;text-align:center;font-size:11.5px;color:var(--faint);border-top:1px solid var(--line)}
footer a{color:var(--faint);text-decoration:none}

dialog{border:1px solid var(--line2);border-radius:12px;padding:0;max-width:min(740px,94vw);width:100%;background:var(--panel);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.5)}
.mhead{display:flex;align-items:center;padding:14px 19px;border-bottom:1px solid var(--line);font-weight:800;font-size:15.5px}
.mbody{padding:17px 21px 22px;max-height:70vh;overflow:auto;font-size:14px}
.mbody h4{margin:15px 0 5px;font-size:13.5px}
.mbody ul{margin:5px 0;padding-left:18px}
.mbody li{margin:3px 0}
.mbody code{background:var(--soft);border-radius:3px;padding:1px 5px;font-family:"Consolas",monospace;font-size:12.5px}
.x{margin-left:auto;border:1px solid var(--line);border-radius:6px;width:29px;height:29px;font-size:15px;color:var(--dim)}

@media (max-width:920px){
  main{grid-template-columns:1fr}
  .col.detailcol{position:fixed;inset:0;z-index:50;border-radius:0;overflow:auto;display:none}
  .col.detailcol.open{display:block}
  .list{max-height:none}
  .backbtn{display:inline-block!important}
}
.backbtn{display:none}

@media print{
  header,.cart,.tabs,.dact,.col.listcol,.btn,.backbtn,footer{display:none!important}
  body{background:#fff}
  main{display:block;padding:0}
  .col{border:0}
  .printarea{display:block!important}
}
.printarea{display:none}
</style>
</head>
<body>

<header>
  <div class="hrow">
    <div class="brand">2022 개정 교육과정 성취기준·성취수준<small>초등학교 1~2 · 3~4 · 5~6학년군 통합 검색</small></div>
    <div class="searchwrap">
      <span class="ico">🔎</span>
      <input id="q" type="search" placeholder="낱말 일부만 넣어도 찾습니다 — 생태, 자료분석, 2국01, ㅍㅎㅌㅇ" autocomplete="off" spellcheck="false">
      <button class="clr" id="clr" hidden>지우기</button>
    </div>
    <div style="flex:1"></div>
    <button class="btn" id="btnHelp">도움말</button>
    <button class="btn" id="btnTheme">야간</button>
  </div>
  <div class="filters">
    <div class="frow"><span class="flabel">학년군</span><span id="fBand" style="display:contents"></span></div>
    <div class="frow"><span class="flabel">교과</span><span id="fSubj" style="display:contents"></span></div>
    <div class="frow" id="areaRow"><span class="flabel">영역</span><span id="fArea" style="display:contents"></span></div>
  </div>
</header>

<main>
  <section class="col listcol">
    <div class="listhead">
      <b id="cnt">0건</b><span id="scope"></span>
      <span style="flex:1"></span>
      <button class="btn" id="btnSort" style="padding:3px 8px;font-size:11.5px" hidden>관련도 순</button>
      <button class="btn" id="btnAll" style="padding:3px 8px;font-size:11.5px">전체 담기</button>
      <button class="btn" id="btnCsv" style="padding:3px 8px;font-size:11.5px">CSV</button>
    </div>
    <div class="list" id="list"></div>
  </section>
  <section class="col detailcol" id="detailcol"><div id="detail"></div></section>
</main>

<div class="cart" id="cart" hidden>
  <b id="cartN">0개</b>
  <span style="color:var(--dim);font-size:12.5px">수업 바구니</span>
  <span style="flex:1"></span>
  <button class="btn" id="cartView">목록</button>
  <button class="btn" id="cartCopy">표로 복사</button>
  <button class="btn" id="cartPrint">인쇄 / PDF</button>
  <button class="btn on" id="cartCsv">CSV 내려받기</button>
  <button class="btn" id="cartClear">비우기</button>
</div>

<footer>
  제작: 하는교사(<a href="mailto:4lolo@naver.com">4lolo@naver.com</a>)<br>
  <span id="srcline"></span>
</footer>

<dialog id="dlg"><div class="mhead"><span id="dlgTitle">도움말</span><button class="x" onclick="dlg.close()">✕</button></div><div class="mbody" id="dlgBody"></div></dialog>
<div class="printarea" id="printarea"></div>

ak":"읽기","t":"의미가 잘 드러나도록 문장과 짧은 글을 알맞게 띄어 읽는다.","A":"글에 의미 단위가 있음을 인식하며 의미가 잘 드러나도록 문장과 짧은 글을 알맞게 띄어 읽을 수 있다.","B":"글의 의미가 잘 드러나도록 문장과 짧은 글을 알맞게 띄어 읽을 수 있다.","C":"문장과 짧은 글을 부분적으로 알맞게 띄어 읽는다.","p":22,"sr":"0-02"},{"c":"[2국02-03]","b":0,"s":0,"a":"읽기","ak":"읽기","t":"글을 읽고 중심 내용을 확인한다.","A":"다양한 유형의 글을 읽고 중심 내용을 정확하게 확인할 수 있다.","B":"글을 읽고 중심 내용을 정확하게 확인할 수 있다.","C":"글을 읽고 중심 내용을 부분적으로 확인한다.","p":22,"sr":"0-02"},{"c":"[2국02-04]","b":0,"s":0,"a":"읽기","ak":"읽기","t":"인물의 마음이나 생각을 짐작하고 이를 자신과 비교하며 글을 읽는다.","A":"인물의 마음이나 생각을 정확하게 짐작하고 이를 자신의 관점과 능동적으로 비교하며 글을 읽을 수 있다.","B":"인물의 마음이나 생각을 짐작하고 이를 자신의 관점과 비교하며 글을 읽을 수 있다.","C":"인물의 마음이나 생각을 부분적으로 짐작하고 이를 자신의 관점과 일부 비교하며 글을 읽는다.","p":22,"sr":"0-02"},{"c":"[2국02-05]","b":0,"s":0,"a":"읽기","ak":"읽기","t":"읽기에 흥미를 가지고 즐겨 읽는 태도를 지닌다.","A":"읽기에 흥미를 가지고 읽기 경험을 긍정적으로 수용하며 즐겨 읽는 태도를 지닌다.","B":"읽기에 흥미를 가지고 긍정적으로 즐겨 읽는 태도를 지닌다.","C":"읽기에 일부 흥미를 보인다.","p":22,"sr":"0-02"},{"c":"[2국03-01]","b":0,"s":0,"a":"쓰기","ak":"쓰기","t":"글자와 단어를 바르게 쓴다.","A":"바른 자세로 글자와 단어를 바르고 정확하게 쓸 수 있다.","B":"글자와 단어를 바르고 정확하게 쓸 수 있다.","C":"글자와 간단한 단어를 쓴다.","p":22,"sr":"0-03"},{"c":"[2국03-02]","b":0,"s":0,"a":"쓰기","ak":"쓰기","t":"쓰기에 흥미를 가지며 자신의 생각이나 느낌을 문장으로 표현한다.","A":"쓰기에 흥미를 가지며 자신의 생각과 느낌을 다양한 문장으로 다채롭게 표현할 수 있다.","B":"쓰기에 흥미를 가지며 자신의 생각이나 느낌을 다양한 문장으로 표현할 수 있다.","C":"쓰기에 일부 흥미를 가지며 자신의 생각이나 느낌의 일부를 문장으로 표현한다.","p":22,"sr":"0-03"},{"c":"[2국03-03]","b":0,"s":0,"a":"쓰기","ak":"쓰기","t":"주변 소재에 대해 소개하는 글을 쓴다.","A":"주변 소재에 대해 쓸 내용을 풍부하게 생성하고 다양하게 표현하며 소개하는 글을 쓸 수 있다.","B":"주변 소재에 대해 쓸 내용을 생성하여 소개하는 글을 쓸 수 있다.","C":"주변 소재에 대해 부분적인 수준에서 소개하는 글을 쓴다.","p":22,"sr":"0-03"},{"c":"[2국03-04]","b":0,"s":0,"a":"쓰기","ak":"쓰기","t":"겪은 일을 표현하는 글을 자유롭게 쓰고, 쓴 글을 함께 읽고 생각이나 느낌을 나눈다.","A":"겪은 일에 대해 쓸 내용을 다양하게 생성하여 자유롭게 쓰고, 쓴 글을 함께 읽고 서로의 생각과 느낌을 적극적으로 나눌 수 있다.","B":"겪은 일을 표현하는 글을 자유롭게 쓰고, 쓴 글을 함께 읽고 자신의 생각이나 느낌을 표현하거나 타인의 생각이나 느낌을 받아들일 수 있다.","C":"자신이 겪은 일을 글로 쓰고, 다른 사람이 쓴 글을 읽고 자신의 생각이나 느낌의 일부를 표현한다.","p":23,"sr":"0-03"},{"c":"[2국04-01]","b":0,"s":0,"a":"문법","ak":"문법","t":"한글 자모의 이름과 소릿값을 알고 정확하게 발음하고 쓴다.","A":"한글 자모의 이름과 소릿값을 바르게 알고 한글 자모를 소릿값대로 정확하게 발음하고 쓸 수 있다.","B":"한글 자모의 이름과 소릿값을 알고 한글 자모를 소릿값대로 발음하고 쓸 수 있다.","C":"한글 자모의 이름과 소릿값의 일부를 알고 발음하며 쓴다.","p":23,"sr":"0-04"},{"c":"[2국04-02]","b":0,"s":0,"a":"문법","ak":"문법","t":"소리와 표기가 다를 수 있음을 알고 단어를 바르게 읽고 쓴다.","A":"소리와 표기가 같거나 다를 수 있음을 정확하게 알고 단어를 바르게 읽고 쓸 수 있다.","B":"소리와 표기가 같거나 다를 수 있음을 알고 단어를 읽고 쓸 수 있다.","C":"소리와 표기가 같거나 다를 수 있음을 부분적인 수준에서 알고 단어를 읽고 쓴다.","p":23,"sr":"0-04"},{"c":"[2국04-03]","b":0,"s":0,"a":"문법","ak":"문법","t":"문장과 문장 부호를 알맞게 쓰고 한글에 호기심을 가진다.","A":"문장 부호를 정확하게 알며, 문장과 문장 부호를 적절하게 쓰고 한글에 지속적인 호기심을 가진다.","B":"문장 부호를 알며, 문장과 문장 부호를 적절하게 쓰고 한글에 호기심을 가진다.","C":"문장 부호를 일부 알며, 문장과 문장 부호를 쓰고 한글에 호기심을 가진다.","p":23,"sr":"0-04"},{"c":"[2국05-01]","b":0,"s":0,"a":"문학","ak":"문학","t":"말놀이, 낭송 등을 통해 말의 재미와 즐거움을 느낀다.","A":"말놀이에 적극적으로 참여하고 분위기를 살려 작품을 낭송하며 말의 재미와 즐거움을 느낄 수 있다.","B":"말놀이에 참여하고 작품을 낭송하며 말의 재미와 즐거움을 느낄 수 있다.","C":"간단한 말놀이나 작품 낭송에서 말의 재미를 느낀다.","p":23,"sr":"0-05"},{"c":"[2국05-02]","b":0,"s":0,"a":"문학","ak":"문학","t":"작품을 듣거나 읽으면서 느끼거나 생각한 점을 말한다.","A":"작품을 듣거나 읽으면서 느끼거나 생각한 점을 구체적으로 말하며 감상을 다른 사람과 즐겨 나눌 수 있다.","B":"작품을 듣거나 읽으면서 느끼거나 생각한 점을 말하며 감상을 다른 사람과 나눌 수 있다.","C":"작품을 듣거나 읽으면서 느끼거나 생각한 점을 간단한 말로 표현한다.","p":23,"sr":"0-05"},{"c":"[2국05-03]","b":0,"s":0,"a":"문학","ak":"문학","t":"작품 속 인물의 모습, 행동, 마음을 상상하여 시, 노래, 이야기, 그림 등으로 표현한다.","A":"작품 속 인물의 모습, 행동, 마음을 구체적으로 상상하여 시, 노래, 이야기, 그림 등 다양한 방식으로 창의적으로 표현할 수 있다.","B":"작품 속 인물의 모습, 행동, 마음을 상상하여 시, 노래, 이야기, 그림 등으로 표현할 수 있다.","C":"작품 속 인물의 모습, 행동, 마음을 일부 상상하여 시, 노래, 이야기, 그림 등으로 간단하게 표현한다.","p":23,"sr":"0-05"},{"c":"[2국05-04]","b":0,"s":0,"a":"문학","ak":"문학","t":"시나 노래, 이야기에 흥미를 가진다.","A":"다양한 시나 노래, 이야기를 스스로 찾아 감상하며 흥미를 가진다.","B":"다양한 시나 노래, 이야기를 감상하는 데에 흥미를 가진다.","C":"시나 노래, 이야기를 듣거나 읽는 데 관심을 가진다.","p":24,"sr":"0-05"},{"c":"[2국06-01]","b":0,"s":0,"a":"매체","ak":"매체","t":"일상의 다양한 매체와 매체 자료에 흥미와 관심을 가진다.","A":"일상의 다양한 매체와 매체 자료에 대해 흥미와 관심이 높고 매체와 매체 자료의 종류와 특징을 구체적으로 안다.","B":"일상의 다양한 매체와 매체 자료에 대해 흥미와 관심이 있고 매체와 매체 자료의 종류를 안다.","C":"매체와 매체 자료에 대한 흥미나 관심을 가지고, 매체와 매체 자료의 일부 종류를 안다.","p":24,"sr":"0-06"},{"c":"[2국06-02]","b":0,"s":0,"a":"매체","ak":"매체","t":"일상의 경험과 생각을 글과 그림으로 표현한다.","A":"다양한 방식으로 글과 그림을 활용하여 일상의 경험과 자신의 생각을 효과적으로 표현할 수 있다.","B":"글과 그림을 활용하여 일상의 경험과 자신의 생각을 표현할 수 있다.","C":"글이나 그림을 일부 활용하여 자신의 경험이나 생각을 부분적으로 표현한다.","p":24,"sr":"0-06"},{"c":"[2수01-01]","b":0,"s":3,"a":"수와 연산","ak":"수와연산","t":"수의 필요성을 인식하면서 0과 100까지의 수 개념을 이해하고, 수를 세고 읽고 쓸 수 있다.","A":"수가 사용되는 여러 가지 실생활 상황에서 수의 필요성을 말하고, 0과 50까지 또는 100까지의 수를 10개씩 묶음과 낱개로 나타내며, 수를 읽고 쓸 수 있다.","B":"실생활에서 수가 사용되는 상황을 말하고, 10개씩 묶음과 낱개를 이용하여 0과 50까지 또는 100까지의 수 개념을 이해하며, 수를 읽고 쓸 수 있다.","C":"실생활에서 수가 사용됨을 알고, 구체물을 세어 0과 50까지 또는 100까지의 수 개념을 이해하며, 수를 읽고 쓸 수 있다.","p":32,"sr":"3-01"},{"c":"[2수01-02]","b":0,"s":3,"a":"수와 연산","ak":"수와연산","t":"일, 십, 백, 천의 자릿값과 위치적 기수법을 이해하고, 네 자리 이하의 수를 읽고 쓸 수 있다.","A":"세 자리 수 또는 네 자리 수를 각 자리의 숫자가 나타내는 수들의 합으로 나타내고, 수를 읽고 쓸 수 있다.","B":"세 자리 수 또는 네 자리 수에서 각 자리의 숫자가 나타내는 수를 말하고, 수를 읽고 쓸 수 있다.","C":"일, 십, 백 또는 천의 자리를 알고, 세 자리 수 또는 네 자리 수를 읽고 쓸 수 있다.","p":32,"sr":"3-01"},{"c":"[2수01-03]","b":0,"s":3,"a":"수와 연산","ak":"수와연산","t":"네 자리 이하의 수의 범위에서 수의 계열을 이해하고, 수의 크기를 비교할 수 있다.","A":"네 자리 이하의 수의 범위에서 수의 계열을 이해하고 여러 가지 방법으로 수를 세며, 수의 크기를 비교하고 그 방법을 설명할 수 있다.","B":"네 자리 이하의 수의 범위에서 수의 계열을 이해하여 뛰어 세기를 하고, 수의 크기를 비교할 수 있다.","C":"네 자리 이하의 수의 범위에서 수를 순서대로 말하고, 구체적인 조작 활동을 통하여 수의 크기를 비교할 수 있다.","p":32,"sr":"3-01"},{"c":"[2수01-04]","b":0,"s":3,"a":"수와 연산","ak":"수와연산","t":"하나의 수를 두 수로 분해하고 두 수를 하나의 수로 합성하는 활동을 통하여 수 감각을 기른다.","A":"수 감각을 바탕으로 하나의 수를 여러 가지 경우의 두 수로 가르고, 두 수를 하나의 수로 모을 수 있다.","B":"수 감각을 바탕으로 하나의 수를 두 수로 가르고, 두 수를 하나의 수로 모을 수 있다.","C":"구체물을 이용하여 하나의 수를 두 수로 가르고, 두 수를 하나의 수로 모을 수 있다.","p":32,"sr":"3-01"},{"c":"[2수01-05]","b":0,"s":3,"a":"수와 연산","ak":"수와연산","t":"덧셈과 뺄셈이 이루어지는 실생활 상황과 연결하여 덧셈과 뺄셈의 의미를 이해한다.","A":"덧셈과 뺄셈이 이루어지는 실생활 상황과 연결하여 덧셈과 뺄셈의 의미를 말하고, 그 상황을 덧셈식이나 뺄셈식으로 나타낼 수 있다.","B":"실생활 상황을 덧셈식이나 뺄셈식으로 나타낼 수 있다.","C":"안내된 절차에 따라 덧셈이 이루어지는 상황을 덧셈식으로, 뺄셈이 이루어지는 상황을 뺄셈식으로 나타낼 수 있다.","p":33,"sr":"3-01"},{"c":"[2수01-06]","b":0,"s":3,"a":"수와 연산","ak":"수와연산","t":"두 자리 수의 범위에서 덧셈과 뺄셈의 계산 원리를 이해하고 그 계산을 할 수 있다.","A":"두 자리 수의 범위에서 덧셈과 뺄셈을 하고, 그 계산 원리를 말할 수 있다.","B":"두 자리 수의 범위에서 덧셈과 뺄셈의 계산 원리를 이해하고, 그 계산을 할 수 있다.","C":"안내된 절차에 따라 두 자리 수의 범위에서 간단한 덧셈과 뺄셈을 할 수 있다.","p":33,"sr":"3-01"},{"c":"[2수01-07]","b":0,"s":3,"a":"수와 연산","ak":"수와연산","t":"덧셈과 뺄셈의 관계를 이해한다.","A":"한 가지 상황을 덧셈식과 뺄셈식으로 나타내고, 그 상황과 연계해서 덧셈식과 뺄셈식의 관계를 말할 수 있다.","B":"한 가지 상황을 덧셈식과 뺄셈식으로 나타낼 수 있다.","C":"안내된 절차에 따라 덧셈식을 뺄셈식으로, 뺄셈식을 덧셈식으로 나타낼 수 있다.","p":33,"sr":"3-01"},{"c":"[2수01-08]","b":0,"s":3,"a":"수와 연산","ak":"수와연산","t":"두 자리 수의 범위에서 세 수의 덧셈과 뺄셈을 할 수 있다.","A":"두 자리 수의 범위에서 세 수의 덧셈과 뺄셈을 계산하고, 그 방법을 말할 수 있다.","B":"두 자리 수의 범위에서 세 수의 덧셈과 뺄셈을 계산할 수 있다.","C":"안내된 절차에 따라 두 자리 수의 범위에서 간단한 세 수의 덧셈과 뺄셈을 할 수 있다.","p":33,"sr":"3-01"},{"c":"[2수01-09]","b":0,"s":3,"a":"수와 연산","ak":"수와연산","t":"□가 사용된 덧셈식과 뺄셈식을 만들고, □의 값을 구할 수 있다.","A":"실생활 상황을 □가 사용된 덧셈식과 뺄셈식으로 나타내며, □의 값을 구하고 그 방법을 말할 수 있다.","B":"주어진 상황을 □가 사용된 덧셈식과 뺄셈식으로 나타내고, □의 값을 구할 수 있다.","C":"안내된 절차에 따라 □가 사용된 간단한 덧셈식과 뺄셈식에서 □의 값을 구할 수 있다.","p":33,"sr":"3-01"},{"c":"[2수01-10]","b":0,"s":3,"a":"수와 연산","ak":"수와연산","t":"곱셈이 이루어지는 실생활 상황과 연결하여 곱셈의 의미를 이해한다.","A":"곱셈이 이루어지는 실생활 상황과 연결하여 곱셈의 의미를 말하고, 그 상황을 곱셈식으로 나타낼 수 있다.","B":"곱셈이 이루어지는 실생활 상황을 곱셈식으로 나타낼 수 있다.","C":"안내된 절차에 따라 곱셈이 이루어지는 실생활 상황을 곱셈식으로 나타낼 수 있다.","p":34,"sr":"3-01"},{"c":"[2수01-11]","b":0,"s":3,"a":"수와 연산","ak":"수와연산","t":"곱셈구구를 이해하고, 한 자리 수의 곱셈을 할 수 있다.","A":"곱셈구구의 원리에 대한 이해를 바탕으로 한 자리 수의 곱셈을 하고, 곱셈구구를 유창하게 말할 수 있다.","B":"곱셈구구의 원리에 대한 이해를 바탕으로 한 자리 수의 곱셈을 하고, 곱셈구구를 말할 수 있다.","C":"안내된 절차에 따라 곱셈구구를 말할 수 있다.","p":34,"sr":"3-01"},{"c":"[2수02-01]","b":0,"s":3,"a":"변화와 관계","ak":"변화와관계","t":"물체, 무늬, 수 등의 배열에서 규칙을 찾아 여러 가지 방법으로 표현할 수 있다.","A":"물체, 무늬, 수 등의 배열에서 규칙을 찾아 말하고, 여러 가지 방법으로 표현할 수 있다.","B":"물체, 무늬, 수 등의 배열에서 규칙을 찾아 말, 수, 그림, 구체물 등을 이용하여 표현할 수 있다.","C":"안내된 절차에 따라 물체, 무늬, 수 등의 간단한 배열에서 규칙을 찾을 수 있다.","p":34,"sr":"3-02"},{"c":"[2수02-02]","b":0,"s":3,"a":"변화와 관계","ak":"변화와관계","t":"자신이 정한 규칙에 따라 물체, 무늬, 수 등을 배열할 수 있다.","A":"여러 가지 규칙을 정하고, 그 규칙에 따라 물체, 무늬, 수 등을 배열할 수 있다.","B":"규칙을 정하고, 그 규칙에 따라 물체, 무늬, 수 등을 배열할 수 있다.","C":"주어진 규칙에 따라 물체, 무늬, 수 등을 배열할 수 있다.","p":34,"sr":"3-02"},{"c":"[2수03-01]","b":0,"s":3,"a":"도형과 측정","ak":"도형과측정","t":"교실 및 생활 주변에서 여러 가지 물건을 관찰하여 직육면체, 원기둥, 구의 모양을 찾고, 이를 이용하여 여러 가지 모양을 만들 수 있다.","A":"주변 물건을 직육면체, 원기둥, 구의 모양으로 분류하여 특징을 말하고, 그 모양들을 이용하여 여러 가지 모양을 만들 수 있다.","B":"주변 물건에서 직육면체, 원기둥, 구의 모양을 찾고, 그 모양들을 이용하여 여러 가지 모양을 만들 수 있다.","C":"주어진 물건에서 직육면체, 원기둥, 구의 모양을 찾고, 그 모양들을 이용하여 간단한 모양을 만들 수 있다.","p":35,"sr":"3-03"},{"c":"[2수03-02]","b":0,"s":3,"a":"도형과 측정","ak":"도형과측정","t":"쌓기나무를 이용하여 여러 가지 입체도형의 모양을 만들고, 그 모양에 대해 위치나 방향을 이용하여 말할 수 있다.","A":"쌓기나무를 이용하여 다양한 입체도형의 모양을 만들고, 그 모양에 대해 위치나 방향을 이용하여 여러 가지 방법으로 말할 수 있다.","B":"쌓기나무를 이용하여 입체도형의 모양을 만들고, 그 모양에 대해 위치나 방향을 이용하여 말할 수 있다.","C":"안내된 절차에 따라 쌓기나무로 간단한 입체도형의 모양을 만들고, 그 모양에 대해 위치나 방향을 이용하여 말할 수 있다.","p":35,"sr":"3-03"},{"c":"[2수03-03]","b":0,"s":3,"a":"도형과 측정","ak":"도형과측정","t":"교실 및 생활 주변에서 여러 가지 물건을 관찰하여 삼각형, 사각형, 원의 모양을 찾고, 이를 이용하여 여러 가지 모양을 만들 수 있다.","A":"주변 물건을 삼각형, 사각형, 원의 모양으로 분류하여 특징을 말하고, 그 모양들을 이용하여 여러 가지 모양을 만들 수 있다.","B":"주변 물건에서 삼각형, 사각형, 원의 모양을 찾고, 그 모양들을 이용하여 여러 가지 모양을 만들 수 있다.","C":"주어진 물건에서 삼각형, 사각형, 원의 모양을 찾고, 이를 이용하여 간단한 모양을 만들 수 있다.","p":35,"sr":"3-03"},{"c":"[2수03-04]","b":0,"s":3,"a":"도형과 측정","ak":"도형과측정","t":"삼각형, 사각형, 원을 직관적으로 이해하고, 그 모양을 그릴 수 있다.","A":"삼각형, 사각형, 원의 예인 것과 아닌 것을 각각 분류하고, 여러 가지 모양의 삼각형, 사각형, 원을 그릴 수 있다.","B":"도형의 예를 통해 삼각형, 사각형, 원을 직관적으로 이해하고, 여러 가지 방법(본뜨기, 도형판 이용 등)으로 삼각형, 사각형, 원을 그릴 수 있다.","C":"주어진 도형에서 삼각형, 사각형, 원을 찾고, 물건을 본떠서 삼각형, 사각형, 원을 그릴 수 있다.","p":35,"sr":"3-03"},{"c":"[2수03-05]","b":0,"s":3,"a":"도형과 측정","ak":"도형과측정","t":"삼각형, 사각형에서 각각의 공통점을 찾아 말할 수 있다.","A":"삼각형 또는 사각형에서 각 도형의 여러 가지 공통점을 찾고, 이를 이용하여 주어진 도형이 삼각형 또는 사각형임을 말할 수 있다.","B":"삼각형 또는 사각형에서 각 도형의 여러 가지 공통점을 찾아 말할 수 있다.","C":"안내된 절차에 따라 삼각형 또는 사각형에서 각 도형의 공통점을 찾을 수 있다.","p":35,"sr":"3-03"},{"c":"[2수03-06]","b":0,"s":3,"a":"도형과 측정","ak":"도형과측정","t":"구체물의 길이, 들이, 무게, 넓이를 비교하여 각각 ‘길다, 짧다’, ‘많다, 적다’, ‘무겁다, 가볍다’, ‘넓다, 좁다’ 등을 구별하여 말할 수 있다.","A":"구체물의 길이, 들이, 무게, 넓이를 여러 가지 방법으로 비교하여 각각 ‘길다, 짧다’, ‘많다, 적다’, ‘무겁다, 가볍다’, ‘넓다, 좁다’ 등을 구별하여 말할 수 있다.","B":"구체물의 길이, 들이, 무게, 넓이를 비교하여 각각 ‘길다, 짧다’, ‘많다, 적다’, ‘무겁다, 가볍다’, ‘넓다, 좁다’ 등을 구별할 수 있다.","C":"안내된 절차에 따라 구체물의 길이, 들이, 무게, 넓이를 비교하여 어느 것이 더 긴지, 더 많은지, 더 무거운지, 더 넓은지를 구별할 수 있다.","p":36,"sr":"3-03"},{"c":"[2수03-07]","b":0,"s":3,"a":"도형과 측정","ak":"도형과측정","t":"시계를 보고 시각을 ‘몇 시 몇 분’까지 읽을 수 있다.","A":"시계가 나타내는 여러 가지 시각을 ‘몇 시’, ‘몇 시 30분’, ‘몇 시 몇 분’ 등으로 읽고, 주어진 시각을 시계에 나타낼 수 있다.","B":"시계가 나타내는 여러 가지 시각을 ‘몇 시’, ‘몇 시 30분’, ‘몇 시 몇 분’ 등으로 읽을 수 있다.","C":"시계에서 짧은바늘은 ‘시’, 긴바늘은 ‘분’을 나타냄을 알고, 안내된 절차에 따라 간단한 시각을 읽을 수 있다.","p":36,"sr":"3-03"},{"c":"[2수03-08]","b":0,"s":3,"a":"도형과 측정","ak":"도형과측정","t":"1시간과 1분의 관계를 이해하고, 시간을 ‘시간’, ‘분’으로 표현할 수 있다.","A":"1시간과 1분의 관계를 이용하여 실생활 상황에서 시간을 ‘몇 시간 몇 분’과 ‘몇 분’으로 각각 나타낼 수 있다.","B":"1시간과 1분의 관계를 이용하여 ‘몇 시간 몇 분’을 ‘몇 분’으로, ‘몇 분’을 ‘몇 시간 몇 분’으로 나타낼 수 있다.","C":"1시간이 60분임을 알고, 안내된 절차에 따라 ‘몇 시간’을 ‘몇 분’으로, ‘몇 분’을 ‘몇 시간’으로 나타낼 수 있다.","p":36,"sr":"3-03"},{"c":"[2수03-09]","b":0,"s":3,"a":"도형과 측정","ak":"도형과측정","t":"실생활 문제 상황과 연결하여 1분, 1시간, 1일, 1주일, 1개월, 1년 사이의 관계를 이해한다.","A":"1분, 1시간, 1일 사이의 관계와 1일, 1주일, 1개월, 1년 사이의 관계를 말하고, 이를 실생활 상황에 적용할 수 있다.","B":"1시간은 60분, 1일은 24시간임을 이용하여 1분, 1시간, 1일 사이의 관계를 말하고, 달력을 이용하여 1일, 1주일, 1개월, 1년 사이의 관계를 말할 수 있다.","C":"1시간은 60분, 1일은 24시간, 1주일은 7일, 1년은 12개월임을 말할 수 있다.","p":36,"sr":"3-03"},{"c":"[2수03-10]","b":0,"s":3,"a":"도형과 측정","ak":"도형과측정","t":"길이 단위 1cm와 1m를 알고, 이를 이용하여 주변 사물의 길이를 측정할 수 있다.","A":"임의 단위와 표준 단위를 비교하여 표준 단위의 필요성을 말하고, 1cm 또는 1m의 단위로 여러 가지 물건의 길이를 측정하여 비교할 수 있다.","B":"표준 단위의 필요성을 알고, 1cm 또는 1m의 단위로 여러 가지 물건의 길이를 측정할 수 있다.","C":"안내된 절차에 따라 1cm 또는 1m의 단위로 주어진 사물의 길이를 측정할 수 있다.","p":37,"sr":"3-03"},{"c":"[2수03-11]","b":0,"s":3,"a":"도형과 측정","ak":"도형과측정","t":"1m와 1cm의 관계를 이해하고, 길이를 ‘몇 m 몇 cm’와 ‘몇 cm’로 표현할 수 있다.","A":"1m와 1cm의 관계를 이용하여 실생활 상황에서 여러 가지 길이를 ‘몇 m 몇 cm’와 ‘몇 cm’로 표현할 수 있다.","B":"1m와 1cm의 관계를 이용하여 ‘몇 m 몇 cm’를 ‘몇 cm’로, ‘몇 cm’를 ‘몇 m 몇cm’로 나타낼 수 있다.","C":"1m가 100cm임을 알고, 안내된 절차에 따라 ‘몇 m’를 ‘몇 cm’로, ‘몇 cm’를 ‘몇 m’로 나타낼 수 있다.","p":37,"sr":"3-03"},{"c":"[2수03-12]","b":0,"s":3,"a":"도형과 측정","ak":"도형과측정","t":"여러 가지 물건의 길이를 어림하고, 길이에 대한 양감을 기른다.","A":"길이에 대한 양감을 이용하여 물건의 길이를 여러 가지 방법으로 어림하고, 어림한 방법을 말할 수 있다.","B":"길이에 대한 양감을 바탕으로 주어진 물건의 길이를 어림하고, 어림한 길이를 자로 잰 길이와 비교할 수 있다.","C":"안내된 절차에 따라 1cm 또는 1m와 비교하여 물건의 길이를 어림할 수 있다.","p":37,"sr":"3-03"},{"c":"[2수03-13]","b":0,"s":3,"a":"도형과 측정","ak":"도형과측정","t":"실생활 문제 상황과 연결하여 길이의 덧셈과 뺄셈을 할 수 있다.","A":"실생활 문제 상황을 길이의 덧셈과 뺄셈으로 나타내어 계산하고, 그 과정을 말할 수 있다.","B":"실생활 문제 상황을 길이의 덧셈과 뺄셈으로 나타내고, 그 계산을 할 수 있다.","C":"안내된 절차에 따라 간단한 길이의 덧셈과 뺄셈을 할 수 있다.","p":37,"sr":"3-03"},{"c":"[2수04-01]","b":0,"s":3,"a":"자료와 가능성","ak":"자료와가능성","t":"여러 가지 사물을 정해진 기준 또는 자신이 정한 기준으로 분류하여 개수를 세어 보고, 기준에 따른 결과를 말할 수 있다.","A":"사물을 여러 가지 기준으로 분류하고, 분류한 결과와 분류할 때 분명한 기준이 필요함을 말할 수 있다.","B":"사물을 정해진 기준 또는 자신이 정한 기준으로 분류하고, 개수를 세어 분류한 결과를 말할 수 있다.","C":"안내된 절차에 따라 사물을 간단한 기준으로 분류하고, 개수를 셀 수 있다.","p":38,"sr":"3-04"},{"c":"[2수04-02]","b":0,"s":3,"a":"자료와 가능성","ak":"자료와가능성","t":"자료를 분류하여 표로 나타내고, 자료를 표로 나타내면 편리한 점을 말할 수 있다.","A":"자료를 분류하여 표로 나타내고, 표를 보고 알게 된 사실과 자료를 표로 나타내면 편리한 점을 말할 수 있다.","B":"분류한 자료를 표로 나타내고, 자료를 표로 나타내면 편리한 점을 말할 수 있다.","C":"자료를 보고 일부가 주어진 표를 완성할 수 있다.","p":38,"sr":"3-04"},{"c":"[2수04-03]","b":0,"s":3,"a":"자료와 가능성","ak":"자료와가능성","t":"자료를 분류하여 ○, ×, / 등을 이용한 그래프로 나타내고, 자료를 그래프로 나타내면 편리한 점을 말할 수 있다.","A":"자료를 분류하여 ○, ×, / 등을 이용한 그래프로 나타내고, 그래프를 보고 알게 된 사실과 자료를 그래프로 나타내면 편리한 점을 말할 수 있다.","B":"분류한 자료를 ○, ×, / 등을 이용한 그래프로 나타내고, 자료를 그래프로 나타내면 편리한 점을 말할 수 있다.","C":"표를 보고 일부가 주어진 ○, ×, / 등을 이용한 그래프를 완성할 수 있다.","p":38,"sr":"3-04"},{"c":"[2바01-01]","b":0,"s":10,"a":"우리는 누구로 살아갈까","ak":"우리는누구로살아갈까","t":"학교 생활 습관과 학습 습관을 형성하여 안전하고 건강하게 생활한다.","A":"학교에서 지켜야 할 규칙과 올바른 학습 습관이 필요한 이유와 중요성을 이해하고 스스로 실천하여 습관화하며, 안전하고 건강한 학교생활을 한다.","B":"학교에서 지켜야 할 규칙을 알고 올바른 학습 습관의 필요성을 이해하고 실천하여 안전하고 건강한 학교생활을 한다.","C":"학교에서 지켜야 할 규칙과 올바른 학습 습관의 필요성을 일부 이해하고 실천하여 안전하고 건강한 생활을 하고자 노력한다.","p":57},{"c":"[2바01-02]","b":0,"s":10,"a":"우리는 누구로 살아갈까","ak":"우리는누구로살아갈까","t":"나를 이해하고 존중하며 생활한다.","A":"몸과 마음을 소중하게 생각해야 하는 까닭과 필요한 상황을 알고, 나를 이해하고 존중하며 자신감을 가지고 매사에 긍정적인 태도로 자신의 일을 스스로 해결한다.","B":"몸과 마음을 소중하게 생각해 행동해야 하는 상황을 알고, 나에게 긍정적인 태도로 자신의 일을 해결한다.","C":"몸과 마음이 소중함을 알고 자신의 일을 해결하려고 노력한다.","p":57},{"c":"[2바01-03]","b":0,"s":10,"a":"우리는 누구로 살아갈까","ak":"우리는누구로살아갈까","t":"가족이나 주변 사람을 배려하며 관계를 맺는다.","A":"타인 존중 및 배려의 의미와 그것이 필요한 상황을 이해하며 가족이나 주변 사람에게 배려와 나눔을 실천하고, 예의를 지키며 감사의 마음을 적극적으로 표현한다.","B":"타인을 존중해야 하는 상황을 이해하고 가족이나 주변 사람에게 배려와 나눔을 실천하며 감사하는 마음을 갖는다.","C":"타인을 존중해야 하는 상황을 구별하고 가족이나 주변 사람에게 배려와 나눔을 실천하려고 노력하며 주변 사람에게 관심을 갖는다.","p":57},{"c":"[2바01-04]","b":0,"s":10,"a":"우리는 누구로 살아갈까","ak":"우리는누구로살아갈까","t":"생태환경에서 더불어 살기 위해 노력한다.","A":"우리 주변의 생태환경과 나의 삶과의 관계를 이해하고, 지속가능한 생태환경을 만드는데 필요한 행동을 적극적으로 실천한다.","B":"우리 주변의 생태환경과 나의 삶과의 관계를 이해하고, 지속가능한 생태환경을 만드는데 필요한 행동을 실천한다.","C":"생태환경과 나의 삶과의 관계를 생각해 보며 생태환경을 만들기 위해 실천하려고 노력한다.","p":57},{"c":"[2바02-01]","b":0,"s":10,"a":"우리는 어디서 살아갈까","ak":"우리는어디서살아갈까","t":"공동체에서 내가 할 수 있는 일을 찾아보고 실천한다.","A":"우리 집과 학교, 마을이 내가 속한 공동체임을 알고, 공동체 생활에서 내가 할 수 있는 일을 적극적으로 찾아 꾸준히 실천하는 태도를 갖는다.","B":"우리 집과 학교, 마을이 내가 속한 공동체임을 알고, 공동체 생활에서 내가 할 수 있는 일을 찾아 실천한다.","C":"우리 집과 학교, 마을을 위해 내가 할 수 있는 일을 구별하며, 공동체 생활에서 내가 할 수 있는 일을 찾아 실천하려고 노력한다.","p":58},{"c":"[2바02-02]","b":0,"s":10,"a":"우리는 어디서 살아갈까","ak":"우리는어디서살아갈까","t":"우리나라의 소중함을 알고 사랑하는 마음을 기른다.","A":"우리나라 상징과 문화에 대하여 이해하고 나라에 대한 긍지를 가지며, 나라를 위해 애쓰신 분들에게 감사하는 마음을 적극적으로 표현하고, 나라를 사랑하는 마음을 갖는다.","B":"우리나라의 상징과 문화에 대하여 이해하고 존중하며, 나라를 위해 애쓰신 분들에게 감사하는 마음을 표현하고, 나라를 사랑하는 마음을 갖는다.","C":"우리나라의 상징과 문화에 대하여 알고, 나라를 위해 애쓰신 분들의 사례를 이해하며, 나라의 소중함을 느낀다.","p":58},{"c":"[2바02-03]","b":0,"s":10,"a":"우리는 어디서 살아갈까","ak":"우리는어디서살아갈까","t":"차이나 다양성을 서로 존중하면서 생활한다.","A":"다른 나라의 언어, 의상, 음식 및 놀이 등 다양한 문화에 대하여 호기심을 가지고 조사하며, 서로 다른 문화를 이해하고 차이를 존중하며 공감하는 태도를 갖는다.","B":"다른 나라의 언어, 의상, 음식 및 놀이의 종류를 조사하고, 서로 다른 문화를 존중하고 공감하는 태도를 갖는다.","C":"다른 문화에 대하여 알아보고 서로 다름을 존중하려는 태도를 기르기 위해 노력한다.","p":58},{"c":"[2바02-04]","b":0,"s":10,"a":"우리는 어디서 살아갈까","ak":"우리는어디서살아갈까","t":"새로운 활동에 호기심을 갖고 도전한다.","A":"여러 디지털 도구와 매체의 효과적인 활용법을 익혀 우리 주변의 다양한 공간을 탐구하며, 새로운 일에 호기심을 갖고 적극적으로 도전한다.","B":"디지털 도구와 매체의 사용법을 익혀 우리 주변의 다양한 공간에 대하여 알아보며, 새로운 일에 관심을 갖고 도전한다.","C":"디지털 도구와 매체의 사용법을 알기 위해 노력하며 우리 주변의 공간을 살피고, 새로운 일에 관심을 가진다.","p":58},{"c":"[2바03-01]","b":0,"s":10,"a":"우리는 지금 어떻게 살아갈까","ak":"우리는지금어떻게살아갈까","t":"하루의 가치를 느끼며 지금을 소중히 여긴다.","A":"생활 습관의 의미와 중요성을 알고, 올바른 하루 생활 습관 계획을 수립하여 실천하며, 자신의 생활을 스스로 관리해 하루를 소중히 여긴다.","B":"생활 습관의 의미와 중요성을 알고, 하루 생활 습관 계획을 수립해 실천한다.","C":"생활 습관의 의미를 알고, 지금을 소중히 여기는 마음가짐을 갖는다.","p":59},{"c":"[2바03-02]","b":0,"s":10,"a":"우리는 지금 어떻게 살아갈까","ak":"우리는지금어떻게살아갈까","t":"계절의 변화에 대응하며 생활한다.","A":"계절의 특징과 관련지어 계절에 알맞은 생활 모습을 파악하며, 계절에 따른 생활 모습의 변화가 중요한 이유를 발견해 이를 일상생활에 적용하며 계절 변화에 대응한다.","B":"계절에 따라 알맞은 생활 모습이 달라지는 이유를 알고 중요성을 파악해 일상생활에서 실천한다.","C":"계절에 따라 알맞은 생활 모습의 차이를 구분하며 일상생활에서 계절의 변화에 관심을 갖는다.","p":59},{"c":"[2바03-03]","b":0,"s":10,"a":"우리는 지금 어떻게 살아갈까","ak":"우리는지금어떻게살아갈까","t":"여러 인물의 삶을 통해 공동체성을 기른다.","A":"함께 사는 삶을 위해 노력한 인물을 조사해 훌륭한 점을 살펴보며, 공동체를 위해 우리가 할 수 있는 일을 구체적으로 찾아 실천한다.","B":"함께 사는 삶을 위해 노력한 인물에 대해 알아보고 공동체를 위해 우리가 할 수 있는 일을 실천한다.","C":"함께 사는 삶을 위해 노력한 인물을 알고 공동체를 위해 우리가 할 수 있는 일을 실천하려고 노력한다.","p":59},{"c":"[2바03-04]","b":0,"s":10,"a":"우리는 지금 어떻게 살아갈까","ak":"우리는지금어떻게살아갈까","t":"공동체 속에서 지속가능성을 위한 삶의 방식을 찾아 실천한다.","A":"자원 절약 등 공동체 생활에 필요한 생활 태도의 중요성을 이해하고, 지속가능성을 위한 삶의 방식을 탐색하여 생활 속에서 실천한다.","B":"자원 절약 등 공동체 속의 생활 태도를 알고, 지속가능성을 위한 생활 방식을 찾아 실천한다.","C":"자원 절약 등 공동체 속의 생활 태도를 구별하고, 생활 속에서 실천하고자 노력한다.","p":59},{"c":"[2바04-01]","b":0,"s":10,"a":"우리는 무엇을 하며 살아갈까","ak":"우리는무엇을하며살아갈까","t":"모두를 위한 생활환경을 만드는 데 참여한다.","A":"생활에서 불편함을 겪는 사람들의 사례를 통해 당사자들의 어려움을 발견하고 공감하며, 개선하기 위한 방법을 탐색하고 실천한다.","B":"생활에서 불편함을 겪는 사람들의 사례를 통해 당사자들의 어려움에 관심을 가지고, 개선 방법을 찾아 실천한다.","C":"생활에서 불편함을 겪는 사람들이 있다는 것을 알고, 당사자들의 어려움에 대해 관심을 가진다.","p":60},{"c":"[2바04-02]","b":0,"s":10,"a":"우리는 무엇을 하며 살아갈까","ak":"우리는무엇을하며살아갈까","t":"다양한 생각이나 의견에 대해 개방적인 태도를 형성한다.","A":"개방적인 태도로 소통해야 하는 이유와 방법, 필요한 상황을 정확하게 이해하고, 상대를 존중하며 소통한다.","B":"개방적인 태도로 소통해야 하는 이유와 방법을 알고 상대와 소통한다.","C":"나와 상대의 의견이 다를 수 있음을 알고, 다른 사람의 생각이나 의견을 경청하려고 노력한다.","p":60},{"c":"[2바04-03]","b":0,"s":10,"a":"우리는 무엇을 하며 살아갈까","ak":"우리는무엇을하며살아갈까","t":"여럿이 하는 활동에 관심을 갖고 자발적으로 협력한다.","A":"다른 사람과 협력하는 삶의 의미와 협력하며 살아가야 하는 까닭을 이해하고, 여럿이 함께 하는 활동에 관심을 가지며 자발적으로 협력한다.","B":"다른 사람과 협력하며 살아가야 하는 까닭을 이해하고, 여럿이 함께 하는 활동에 협력한다.","C":"다른 사람과 협력하며 살아가는 삶의 필요성을 알고, 여럿이 함께 하는 활동에서 협력하려고 노력한다.","p":60},{"c":"[2바04-04]","b":0,"s":10,"a":"우리는 무엇을 하며 살아갈까","ak":"우리는무엇을하며살아갈까","t":"지금까지의 생활 습관과 학습 습관을 되돌아본다.","A":"올바른 생활 습관과 학습 습관이 무엇인지 알아보고 자신의 습관을 스스로 점검한 후 더 나아지기 위한 계획을 세운다.","B":"올바른 생활 습관과 학습 습관이 무엇인지 알고 자신의 습관을 점검하여 되돌아보고 반성한다.","C":"올바른 생활 습관과 학습 습관이 무엇인지 관심을 갖고 자신의 습관과 관련지어 생각한다.","p":60},{"c":"[2슬01-01]","b":0,"s":11,"a":"우리는 누구로 살아갈까?","ak":"우리는누구로살아갈까","t":"학교 안팎의 모습과 생활을 탐색하며 안전한 학교 생활을 한다.","A":"학교 안팎의 다양한 시설의 이름과 모습을 파악하고, 학교 안팎에서의 생활 모습을 탐색하며, 안전 수칙을 익혀 안전하게 생활한다.","B":"학교 안팎의 주요 시설을 알고, 학교 안팎에서의 생활 모습을 관찰하며, 안전하게 생활하는 태도를 기른다.","C":"학교 안팎의 주요 시설을 둘러보고, 학교 안팎에서의 생활 모습을 살펴보며, 안전하게 생활하고자 노력한다.","p":70},{"c":"[2슬01-02]","b":0,"s":11,"a":"우리는 누구로 살아갈까?","ak":"우리는누구로살아갈까","t":"나를 탐색하여 나에 대해 설명한다.","A":"내가 무엇을 잘하고 무엇을 좋아하는지 알아보는 탐색 활동에 적극 참여하여 나’에 대해 알게 된 내용을 다른 사람에게 구체적으로 설명한다.","B":"내가 무엇을 잘하고 무엇을 좋아하는지 알아보는 탐색 활동에 참여하며 나’에 대해 알게 된 내용을 말한다.","C":"내가 잘하거나 좋아하는 것은 무엇인지 탐색하며, 나’에 대해 관심을 가진다.","p":70},{"c":"[2슬01-03]","b":0,"s":11,"a":"우리는 누구로 살아갈까?","ak":"우리는누구로살아갈까","t":"가족이나 주변 사람에게 관심을 갖고 함께 살아가는 모습을 탐구한다.","A":"가족, 친구, 선생님, 이웃 등 나를 둘러싼 주변 사람들에 관심을 가지며 그 관계에 대해 이해하고, 이들이 함께 살아가는 모습을 적극적으로 탐구한다.","B":"나의 가족이나 친구 등 주변 사람들을 알고 관심을 가지며, 이들이 함께 살아가는 모습을 조사한다.","C":"나의 가족이나 친구들에게 관심을 가지고, 이들이 살아가는 모습을 살펴본다.","p":70},{"c":"[2슬01-04]","b":0,"s":11,"a":"우리는 누구로 살아갈까?","ak":"우리는누구로살아갈까","t":"사람과 자연, 동식물이 어우러져 사는 생태를 탐구한다.","A":"인간은 동식물과 함께하는 자연 생태의 일부임을 알고, 사람과 자연, 동식물이 어우러져 사는 생태에 대해 호기심을 갖고 탐구한다.","B":"인간은 동식물과 함께 자연 속에서 살아감을 알고, 사람과 자연, 동식물이 어우러져 사는 생태의 모습을 조사한다.","C":"인간은 자연 속에서 살아감을 알고, 주변의 동식물을 살펴본다.","p":70},{"c":"[2슬02-01]","b":0,"s":11,"a":"우리는 어디서 살아갈까","ak":"우리는어디서살아갈까","t":"우리가 살고 있는 마을과 사람들이 생활하는 모습을 살펴본다.","A":"우리가 사는 마을의 모습과 마을 사람들이 하는 일을 적극적으로 살펴 사람들의 생활 모습을 파악하며, 마을에서 안전한 장소와 도움을 청할 수 있는 장소를 확인하여 소개한다.","B":"우리가 사는 마을의 모습과 사람들의 생활 모습을 살펴보고 사람들이 하는 일을 파악하며, 마을에서 안전한 장소와 도움을 청할 수 있는 곳을 찾아본다.","C":"우리가 사는 마을의 모습과 마을 사람들이 하는 일을 살펴보고, 마을의 안전을 지켜주는 곳과 도움을 청할 수 있는 곳에 관심을 갖는다.","p":71},{"c":"[2슬02-02]","b":0,"s":11,"a":"우리는 어디서 살아갈까","ak":"우리는어디서살아갈까","t":"우리나라의 모습이나 문화를 조사한다.","A":"우리나라의 모습과 상징 및 특징, 문화에 대해 조사하여 그 내용을 이해하고, 나라를 사랑하는 마음을 갖는다.","B":"우리나라의 문화에 대해 조사하여 그 내용을 이해하고, 우리나라의 소중함을 깨닫는다.","C":"우리나라의 모습과 상징을 조사하여 주요 내용을 이해하고, 우리나라에 관심을 갖는다.","p":71},{"c":"[2슬02-03]","b":0,"s":11,"a":"우리는 어디서 살아갈까","ak":"우리는어디서살아갈까","t":"알고 싶은 나라를 탐구하며 다른 나라에 관심을 갖는다.","A":"알고 싶은 나라를 선택하여 다양한 방법으로 탐구하며, 나라마다 가진 문화의 차이를 이해하고 존중하는 태도를 갖는다.","B":"알고 싶은 나라에 대해 탐구하고, 그 나라의 문화를 존중하는 태도를 갖는다.","C":"알고 싶은 나라를 떠올리고 그 나라에 대해 조사하며, 다른 나라에 관심을 갖는 태도를 기른다.","p":71},{"c":"[2슬02-04]","b":0,"s":11,"a":"우리는 어디서 살아갈까","ak":"우리는어디서살아갈까","t":"궁금한 세계를 다양한 매체로 탐색한다.","A":"우주, 바닷속, 땅속, 가상 공간 등 궁금한 세계에 대해 흥미를 가지고 다양한 매체를 활용하여 탐색하며, 새로운 것에 호기심을 갖고 탐구하는 태도를 가진다.","B":"우주, 바닷속, 땅속, 가상 공간 등 궁금한 세계에 흥미를 가지고 매체를 활용하여 탐색하며, 새로운 것에 호기심을 가진다.","C":"우주, 바닷속, 땅속, 가상 공간 등 궁금한 세계에 대해 상상하고, 매체를 활용하여 관련 내용을 확인하려는 태도를 지닌다.","p":71},{"c":"[2슬03-01]","b":0,"s":11,"a":"우리는 지금 어떻게 살아갈까","ak":"우리는지금어떻게살아갈까","t":"하루의 변화와 사람들이 하루를 살아가는 모습을 탐색한다.","A":"하루의 변화를 이해하고 하루 동안 사람들의 생활 모습을 탐색하며, 나의 하루와 비교하여 같은 시각 사람들은 무엇을 하고 있을지 구체적으로 예측한다.","B":"하루의 변화를 알고 하루 동안 사람들의 생활 모습을 탐색하며, 같은 시각 사람들은 무엇을 하고 있을지 예측한다.","C":"하루의 변화를 알고 하루 동안 사람들의 생활 모습을 살펴보며 같은 시각 사람들은 무엇을 하고 있을지 관심을 가진다.","p":72},{"c":"[2슬03-02]","b":0,"s":11,"a":"우리는 지금 어떻게 살아갈까","ak":"우리는지금어떻게살아갈까","t":"계절과 생활의 관계를 탐구한다.","A":"계절의 변화에 따라 영향을 받는 생활 모습을 자료(그림이나 표 등)로 파악하고, 기초적인 탐구과정에 따라 계절의 변화에 영향을 받는 사람들의 생활 모습을 탐구한다.","B":"계절의 변화에 따라 영향을 받는 생활 모습을 알고, 계절의 변화에 따른 사람들의 생활 모습을 조사한다.","C":"계절의 변화에 따라 영향을 받는 생활 모습을 알고, 계절별 사람들의 생활 모습을 살펴본다.","p":72},{"c":"[2슬03-03]","b":0,"s":11,"a":"우리는 지금 어떻게 살아갈까","ak":"우리는지금어떻게살아갈까","t":"관심 있는 대상의 과거와 현재를 살펴보고 미래를 상상한다.","A":"내가 관심을 갖는 대상의 특징을 이해하고, 이 대상이 과거부터 현재까지 어떻게 변화해왔는지를 탐구하며, 이를 바탕으로 미래에는 어떻게 변화할지 상상한다.","B":"내가 관심을 가진 대상이 과거부터 현재까지 변화해온 모습을 살펴보며, 미래에는 어떻게 달라질지 상상한다.","C":"내가 관심을 가진 대상의 과거와 현재의 모습을 살펴보며, 미래의 모습에 관심을 가진다.","p":72},{"c":"[2슬03-04]","b":0,"s":11,"a":"우리는 지금 어떻게 살아갈까","ak":"우리는지금어떻게살아갈까","t":"우리의 생활과 관련된 지속가능성의 다양한 사례를 찾고 탐색한다.","A":"우리 생활과 관련된 지속가능성의 사례를 찾아 삶과 연관지어 파악하고, 지속가능한 삶을 위해 내가 할 수 있는 일을 다양하게 탐색한다.","B":"우리 생활과 관련된 지속가능성의 사례를 파악하고, 지속가능한 삶을 위해 내가 할 수 있는 일을 탐색한다.","C":"우리 생활과 관련된 지속가능성의 사례를 알고, 지속가능한 삶을 위해 내가 할 수 있는 일을 떠올린다.","p":72},{"c":"[2슬04-01]","b":0,"s":11,"a":"우리는 무엇을 하며 살아갈까","ak":"우리는무엇을하며살아갈까","t":"생활도구의 모양이나 기능을 탐색하고 바꾸어본다.","A":"생활에 필요한 다양한 도구의 모양과 기능, 쓰임새를 탐색하며, 생활 도구를 새롭게 바꾸어 보고, 대상을 바라보는 여러 가지 관점을 수용하는 태도를 갖는다.","B":"생활에 필요한 도구의 모양과 기능을 알아보고, 생활 도구를 새롭게 바꿔보며, 대상을 바라보는 여러 가지 관점을 수용하려고 노력한다.","C":"생활에 필요한 도구에는 무엇이 있는지 알고, 생활도구의 모양이나 기능의 일부를 바꾸어보며 대상을 바라보는 여러 가지 관점이 있음을 느낀다.","p":73},{"c":"[2슬04-02]","b":0,"s":11,"a":"우리는 무엇을 하며 살아갈까","ak":"우리는무엇을하며살아갈까","t":"상상한 것을 다양한 매체와 재료로 구현한다.","A":"대상을 떠올리며 엉뚱하고 기발하게 상상하고, 매체의 정확한 사용법과 재료의 특징을 파악하여 상상한 것을 창의적으로 구현한다.","B":"대상을 떠올리며 다양하게 상상하고, 매체의 기초적인 사용법과 재료의 특징을 파악하여 상상한 것을 구현한다.","C":"대상을 떠올리며 상상하고, 주어진 매체와 재료를 활용하여 상상한 것을 구현한다.","p":73},{"c":"[2슬04-03]","b":0,"s":11,"a":"우리는 무엇을 하며 살아갈까","ak":"우리는무엇을하며살아갈까","t":"경험한 것 중에서 관심 있는 주제를 정하고 조사한다.","A":"자신이 경험한 것들을 연결 지어 이해하고, 관심 있는 주제를 정해 다양한 매체를 바르게 활용하여 조사한다.","B":"자신이 경험한 것들의 내용을 비교하며, 관심 있는 주제를 정해 매체를 활용하여 조사한다.","C":"자신이 경험한 내용을 떠올리고, 주제를 정해 매체를 활용하여 조사한다.","p":73},{"c":"[2슬04-04]","b":0,"s":11,"a":"우리는 무엇을 하며 살아갈까","ak":"우리는무엇을하며살아갈까","t":"배운 것과 배울 것을 연결하며 앞으로의 배움을 상상한다.","A":"이번 학년에서 배운 것을 이해하고 다음 학년에서 배울 내용과 연결하여 앞으로의 배움에 관심과 흥미를 가진다.","B":"이번 학년에서 배운 것을 알고 다음 학년에서 배울 내용과 연결하며 앞으로의 배움에 관심을 가진다.","C":"이번 학년에서 배운 것을 떠올리고 다음 학년에서의 배움을 상상하며 관심을 가진다.","p":73},{"c":"[2즐01-01]","b":0,"s":12,"a":"우리는 누구로 살아갈까","ak":"우리는누구로살아갈까","t":"즐겁게 놀이하며, 건강하고 안전하게 생활한다.","A":"놀이 장소의 안전 상황을 명확하게 파악하고 놀이 규칙을 적극적으로 준수하여 창의적으로 놀이 활동에 참여한다.","B":"놀이 장소의 안전 상황을 살피고 놀이 규칙을 준수하여 놀이 활동에 참여한다.","C":"안전한 놀이 장소의 중요성을 알고 놀이 활동에 참여한다.","p":81},{"c":"[2즐01-02]","b":0,"s":12,"a":"우리는 누구로 살아갈까","ak":"우리는누구로살아갈까","t":"놀이하며 내 몸의 움직임이나 감각을 느낀다.","A":"신체를 이용한 여러 가지 놀이를 수행하며 자신의 신체 움직임과 감각을 인식하고 다양한 놀이에 적극적으로 참여한다.","B":"신체를 이용한 놀이를 수행하고 자신의 신체 움직임과 감각을 인식하며 놀이 활동에 참여한다.","C":"자신의 신체 변화와 몸의 움직임을 느끼고 놀이 활동에 참여한다.","p":81},{"c":"[2즐01-03]","b":0,"s":12,"a":"우리는 누구로 살아갈까","ak":"우리는누구로살아갈까","t":"가족이나 주변 사람과 소통하며 어울린다.","A":"가족, 친구, 이웃 등 주변 사람들에 대해 관심을 가지고 존중하는 태도로 서로 의견을 주고받으며 함께 활동한다.","B":"가족, 친구, 이웃 등 주변 사람들에 대해 관심을 가지고 서로 의견을 주고받으며 함께 활동한다.","C":"가족, 친구, 이웃 등 주변 사람들과 이야기를 나누며 함께 활동한다.","p":81},{"c":"[2즐01-04]","b":0,"s":12,"a":"우리는 누구로 살아갈까","ak":"우리는누구로살아갈까","t":"우리를 둘러싼 자연의 아름다움을 감상한다.","A":"계절의 변화를 인식하고 일상 속 자연이 주는 아름다움을 적극적으로 감상하고 표현한다.","B":"계절의 변화를 알고 일상 속 자연의 아름다움에 대한 감상을 표현한다.","C":"자연의 아름다움에 대한 자신의 느낌을 간단히 표현한다.","p":81},{"c":"[2즐02-01]","b":0,"s":12,"a":"우리는 어디서 살아갈까","ak":"우리는어디서살아갈까","t":"내가 참여할 수 있는 문화 예술을 향유한다.","A":"자신이 참여할 수 있는 놀이, 표현, 감상 활동을 명확히 이해해 일상생활 속 문화 예술 활동에 적극적으로 참여하며 즐긴다.","B":"자신이 참여할 수 있는 놀이, 표현, 감상 활동을 알고 일상생활 속 문화 예술 활동에 참여한다.","C":"자신이 참여할 수 있는 놀이, 표현, 감상 활동을 알고 일상생활에서 즐긴다.","p":82},{"c":"[2즐02-02]","b":0,"s":12,"a":"우리는 어디서 살아갈까","ak":"우리는어디서살아갈까","t":"우리나라의 문화 예술을 즐긴다.","A":"우리나라 문화 예술에 대해 흥미와 호기심을 가지고 적극적인 태도로 문화 예술 활동에 즐겁게 스스로 참여한다.","B":"우리나라 문화 예술에 대해 관심을 가지고 문화 예술 활동에 참여한다.","C":"우리나라 문화 예술을 경험하고 문화 예술 활동에 참여한다.","p":82},{"c":"[2즐02-03]","b":0,"s":12,"a":"우리는 어디서 살아갈까","ak":"우리는어디서살아갈까","t":"다른 나라의 문화 예술을 체험한다.","A":"다른 나라 문화 예술의 다양한 특징을 알고 즐겁게 경험하며 각 나라의 문화 다양성을 존중한다.","B":"다른 나라 문화 예술의 특징을 알고 경험하며 각 나라의 문화 다양성을 존중한다.","C":"다른 나라의 문화 예술을 경험하며 각 나라의 문화 다양성을 인식한다.","p":82},{"c":"[2즐02-04]","b":0,"s":12,"a":"우리는 어디서 살아갈까","ak":"우리는어디서살아갈까","t":"다양한 세상을 상상하고 표현한다.","A":"다양한 세상의 영역을 자세하게 파악하고 창의적인 생각과 폭넓은 상상을 통해 자신의 생각을 적극적으로 표현한다.","B":"다양한 세상의 영역을 파악하고 폭넓은 상상을 통해 자신의 생각을 표현한다.","C":"다양한 세상의 영역을 알고 자신의 생각을 표현한다.","p":82},{"c":"[2즐03-01]","b":0,"s":12,"a":"우리는 지금 어떻게 살아갈까?","ak":"우리는지금어떻게살아갈까","t":"하루를 건강하고 활기차게 지낸다.","A":"건강을 위해 자신이 실천할 수 있는 운동과 생활 습관을 알고, 건강하고 활기차게 생활하기 위한 다양한 습관을 형성한다.","B":"건강에 도움이 되는 운동과 생활 습관을 알고, 건강하고 활기차게 생활하기 위한 습관을 형성한다.","C":"건강이 운동과 생활 습관에 영향을 받음을 알고, 건강하고 활기차게 생활하기 위한 습관을 기르기 위해 노력한다.","p":83},{"c":"[2즐03-02]","b":0,"s":12,"a":"우리는 지금 어떻게 살아갈까?","ak":"우리는지금어떻게살아갈까","t":"자연의 변화를 느끼며 놀이한다.","A":"날씨와 계절의 변화에 따른 놀이의 차이를 이해하고, 자연이 변화하는 특징을 살려 놀이한다.","B":"날씨와 계절에 따라 달라지는 놀이의 다양한 사례를 알고, 자연의 특징을 살려 놀이한다.","C":"날씨와 계절에 따라 놀이가 달라진다는 것을 알고, 자연에 대한 놀이를 한다.","p":83},{"c":"[2즐03-03]","b":0,"s":12,"a":"우리는 지금 어떻게 살아갈까?","ak":"우리는지금어떻게살아갈까","t":"전통문화를 새롭게 표현한다.","A":"전통문화를 창의적으로 해석하여 주제를 표현하며, 전통문화를 소중히 여긴다.","B":"전통문화를 반영하여 주제를 표현하며, 전통문화의 중요성을 느낀다.","C":"전통문화와 관련된 내용을 포함하여 표현하며, 전통문화의 중요성을 느낀다.","p":83},{"c":"[2즐03-04]","b":0,"s":12,"a":"우리는 지금 어떻게 살아갈까?","ak":"우리는지금어떻게살아갈까","t":"안전과 안녕을 위한 아동의 권리가 있음을 알고 누린다.","A":"아동 권리를 일상 장면에 적용하고, 다양한 상황에서 적용되는 아동 권리를 효과적으로 표현하며, 안전하고 안녕한 생활을 일상화한다.","B":"아동 권리를 보호하는 사례를 알고, 다양한 상황에서 적용되는 아동 권리를 표현하며, 안전하고 안녕한 생활을 일상화하고자 한다.","C":"아동 권리의 의미에 대해 알고, 일부 상황에서 적용되는 아동 권리를 표현하며, 안전하고 안녕한 생활을 하기 위해 노력한다.","p":83},{"c":"[2즐04-01]","b":0,"s":12,"a":"우리는 무엇을 하며 살아갈까","ak":"우리는무엇을하며살아갈까","t":"주변의 물건을 활용하여 놀잇감을 만든다.","A":"제작의 즐거움을 느끼며 주변의 다양한 재료의 특징을 고려하여 창의적으로 놀잇감을 만든다.","B":"제작에 관심을 보이며 주변의 다양한 재료의 특징을 고려하여 놀잇감을 만든다.","C":"제작에 참여하여 주변의 재료를 활용해 놀잇감을 만든다.","p":84},{"c":"[2즐04-02]","b":0,"s":12,"a":"우리는 무엇을 하며 살아갈까","ak":"우리는무엇을하며살아갈까","t":"자유롭게 상상하며 놀이한다.","A":"상황에 어울리는 창의적인 방식으로 놀이하고, 자유롭게 상상하는 활동에 몰입하여 참여한다.","B":"상황에 어울리는 방식으로 놀이하고, 자유롭게 상상하는 활동에 관심을 갖고 참여한다.","C":"상황에 따라 놀이를 하고, 자유롭게 상상하는 활동에 참여한다.","p":84},{"c":"[2즐04-03]","b":0,"s":12,"a":"우리는 무엇을 하며 살아갈까","ak":"우리는무엇을하며살아갈까","t":"생각이나 느낌을 살려 전시나 공연 활동을 한다.","A":"주제에 대한 다른 사람의 다양한 생각과 느낌을 이해하고, 여럿의 생각과 느낌을 살려 창의적으로 전시나 공연을 준비해 적극적으로 수행한다.","B":"주제에 대한 생각과 느낌이 사람마다 다를 수 있음을 알고, 생각과 느낌이 드러나도록 전시나 공연을 준비하고 수행한다.","C":"주제에 대한 자신의 생각과 느낌을 알고, 전시나 공연을 준비하고 수행하는 과제에 소극적으로 참여한다.","p":84},{"c":"[2즐04-04]","b":0,"s":12,"a":"우리는 무엇을 하며 살아갈까","ak":"우리는무엇을하며살아갈까","t":"기억에 남는 경험을 떠올리며 의미를 부여한다.","A":"시간의 연속성에 대해 이해하고, 과거의 경험을 토대로 앞으로 하고 싶은 일을 떠올리며, 과거의 경험에 의미를 부여하고 미래를 기대한다.","B":"과거·현재·미래의 관계에 대해 이해하고, 과거의 일과 가까운 미래에 하고 싶은 일을 떠올리며, 과거의 경험에 대해 감정을 느끼고 미래를 기대한다.","C":"시간을 나타내는 말을 알고, 과거의 일을 떠올리며 감정을 느낀다.","p":84},{"c":"[4국01-01]","b":1,"s":0,"a":"듣기·말하기","ak":"듣기말하기","t":"중요한 내용과 주제를 파악하며 듣고 그 내용을 요약한다.","A":"중요한 내용과 주제를 정확하게 파악하며 듣고, 중심 내용과 세부 내용을 구분하여 자신의 언어로 요약할 수 있다.","B":"중요한 내용과 주제를 파악하며 듣고, 중심 내용과 세부 내용을 구분하여 요약할 수 있다.","C":"중요한 내용과 주제의 일부를 파악하며 듣고, 자신이 파악한 내용을 중심으로 요약한다.","p":21,"sr":"0-01"},{"c":"[4국01-02]","b":1,"s":0,"a":"듣기·말하기","ak":"듣기말하기","t":"원인과 결과의 관계를 고려하여 내용을 예측하며 듣고 말한다.","A":"원인과 결과의 관계를 올바르게 고려하여 이어질 내용을 예측하며 듣고, 원인과 결과가 분명히 드러나게 말할 수 있다.","B":"원인과 결과의 관계를 고려하여 이어질 내용을 예측하며 듣고, 원인과 결과가 드러나게 말할 수 있다.","C":"원인과 결과의 관계를 알고 이어질 내용을 부분적으로 예측하며 듣고, 원인이나 결과가 일부 드러나게 말한다.","p":21,"sr":"0-01"},{"c":"[4국01-03]","b":1,"s":0,"a":"듣기·말하기","ak":"듣기말하기","t":"상황에 적절한 준언어·비언어적 표현을 활용하여 듣고 말한다.","A":"담화 상황에 적절한 준언어·비언어적 표현을 활용하여 의미를 효과적으로 전달하고 이해하며 듣고 말할 수 있다.","B":"담화 상황에 적절한 준언어·비언어적 표현을 활용하여 의미를 전달하고 이해하며 듣고 말할 수 있다.","C":"담화 상황에서 준언어·비언어적 표현을 일부 활용하여 듣고 말한다.","p":21,"sr":"0-01"},{"c":"[4국01-04]","b":1,"s":0,"a":"듣기·말하기","ak":"듣기말하기","t":"상황과 상대의 입장을 이해하고 예의를 지키며 대화한다.","A":"상황과 상대의 입장을 정확히 이해하고, 상대를 배려하는 표현을 적극적으로 활용하여 예의를 지키며 대화할 수 있다.","B":"상황과 상대의 입장을 이해하고, 상대를 배려하는 표현을 사용하여 예의를 지키며 대화할 수 있다.","C":"상황과 상대의 입장을 부분적으로 이해하고, 일부 상황에서 예의를 지키며 대화한다.","p":21,"sr":"0-01"},{"c":"[4국01-05]","b":1,"s":0,"a":"듣기·말하기","ak":"듣기말하기","t":"목적과 주제에 알맞게 자료를 정리하여 자신감 있게 발표한다.","A":"주어진 자료에서 발표 목적과 주제에 알맞은 내용을 중심으로 발표 내용을 정리하고, 발표 전 연습을 통해 점검한 사항을 바탕으로 자신감 있게 발표할 수 있다.","B":"주어진 자료에서 발표 목적과 주제에 알맞은 내용을 중심으로 발표 내용을 정리하고, 자신감 있게 발표할 수 있다.","C":"주어진 자료에서 발표 목적과 주제를 부분적으로 고려하여 발표 내용을 정리하고, 이를 나열하는 수준에서 발표한다.","p":22,"sr":"0-01"},{"c":"[4국01-06]","b":1,"s":0,"a":"듣기·말하기","ak":"듣기말하기","t":"주제에 적절한 의견과 이유를 제시하고 서로의 생각을 교환하며 토의한다.","A":"주제에 적절한 의견과 타당한 이유를 분명하게 제시하고, 서로의 생각을 적극적으로 교환하며 다른 사람을 존중하는 태도로 토의에 참여할 수 있다.","B":"주제에 적절한 의견과 이유를 제시하고, 서로의 생각을 교환하며 다른 사람을 존중하는 태도로 토의에 참여할 수 있다.","C":"주제에 대한 의견과 이유를 일부 제시하고, 서로의 생각을 부분적으로 묻고 답하며 토의에 참여한다.","p":22,"sr":"0-01"},{"c":"[4국02-01]","b":1,"s":0,"a":"읽기","ak":"읽기","t":"글의 의미를 파악하며 유창하게 글을 읽는다.","A":"글의 의미를 정확하게 파악하고, 글의 의미를 효과적으로 표현하는 방법을 사용하여 유창하게 소리 내어 글을 읽을 수 있다.","B":"글의 의미를 파악하고, 글의 의미를 효과적으로 표현하는 방법을 사용하여 유창하게 글을 읽을 수 있다.","C":"글의 의미를 부분적으로 파악하며 글을 소리 내어 읽는다.","p":23,"sr":"0-02"},{"c":"[4국02-02]","b":1,"s":0,"a":"읽기","ak":"읽기","t":"문단과 글에서 중심 생각을 파악하고 내용을 간추린다.","A":"문단별로 중요 단어와 중심 문장을 정확하게 파악하고, 문단별 중심 내용을 통합하여 글의 중심 생각을 파악할 수 있으며, 이를 자신의 말로 바꾸어 간추릴 수 있다.","B":"문단별로 중요 단어와 중심 문장을 파악하고, 문단별 중심 내용을 통합하여 글의 중심 생각을 파악할 수 있으며, 이를 간추릴 수 있다.","C":"문단별 중심 내용을 일부 파악하고, 글의 중심 생각을 부분적으로 파악하여 이를 간추린다.","p":23,"sr":"0-02"},{"c":"[4국02-03]","b":1,"s":0,"a":"읽기","ak":"읽기","t":"질문을 활용하여 글을 예측하며 읽고 자신의 읽기 과정을 점검한다.","A":"질문을 활용하여 글의 의미나 내용을 예측하며 읽고 글에 대한 이해 수준과 읽기 과정에서 겪는 어려움을 적극적으로 점검하며 읽을 수 있다.","B":"질문을 활용하여 글의 내용을 예측하며 읽고 자신의 읽기 과정에서 겪는 어려움을 점검할 수 있다.","C":"질문을 활용하여 부분적으로 글을 예측하며 읽고 자신의 읽기 과정에서 겪는 어려움을 일부 점검한다.","p":23,"sr":"0-02"},{"c":"[4국02-04]","b":1,"s":0,"a":"읽기","ak":"읽기","t":"글에 나타난 사실과 의견을 구분하고 필자와 자신의 의견을 비교한다.","A":"글에 나타난 사실과 의견을 구분하고 의견에 대한 타당성 평가를 바탕으로 필자와 자신의 의견을 적극적으로 비교할 수 있다.","B":"글에 나타난 사실과 의견을 구분하고 필자의 의견을 일방적으로 수용하지 않고 자신의 의견을 비교할 수 있다.","C":"글에 나타난 사실과 의견을 부분적으로 구분하고, 필자와 자신의 의견을 일부 비교한다.","p":23,"sr":"0-02"},{"c":"[4국02-05]","b":1,"s":0,"a":"읽기","ak":"읽기","t":"글이나 자료의 출처가 믿을 만한지 판단한다.","A":"글이나 자료를 찾아 읽을 때 출처를 정확하게 확인하고 평가 기준에 따라 출처가 믿을 만한지 능동적으로 판단할 수 있다.","B":"글이나 자료를 찾아 읽을 때 출처를 확인하고 평가 기준에 따라 출처가 믿을 만한지 판단할 수 있다.","C":"글이나 자료를 찾아 읽을 때 출처를 일부 확인하고 출처가 믿을 만한지 부분적으로 판단한다.","p":23,"sr":"0-02"},{"c":"[4국02-06]","b":1,"s":0,"a":"읽기","ak":"읽기","t":"바람직한 읽기 습관을 형성하고 읽기에 대한 자신감을 기른다.","A":"다양한 읽기 활동에 적극적으로 참여하면서 바람직한 읽기 습관을 형성하고, 읽기에 대한 자신감을 갖는다.","B":"읽기 경험을 통해 바람직한 읽기 습관을 형성하고, 읽기에 대한 자신감을 기를 수 있다.","C":"바람직한 읽기 습관과 읽기에 대한 자신감의 형성이 제한적이다.","p":23,"sr":"0-02"},{"c":"[4국03-01]","b":1,"s":0,"a":"쓰기","ak":"쓰기","t":"중심 문장과 뒷받침 문장을 갖추어 문단을 쓰고, 문장과 문단을 중심으로 고쳐 쓴다.","A":"중심 문장과 뒷받침 문장을 갖추어 문단을 짜임새 있게 쓸 수 있고, 문장과 문단을 중심으로 글의 내용과 표현을 효과적으로 고쳐 쓸 수 있다.","B":"중심 문장과 뒷받침 문장을 갖추어 문단을 쓸 수 있고, 문장과 문단을 중심으로 글의 내용과 표현을 고쳐 쓸 수 있다.","C":"중심 문장이 있는 문단을 쓰고, 문장을 중심으로 글의 내용이나 표현을 일부 고쳐 쓴다.","p":24,"sr":"0-03"},{"c":"[4국03-02]","b":1,"s":0,"a":"쓰기","ak":"쓰기","t":"절차와 결과가 드러나게 정확한 표현으로 보고하는 글을 쓴다.","A":"절차와 결과가 드러나게 글의 내용을 짜임새 있게 조직하고, 사실에 기반한 내용을 간결하고 정확한 표현으로 보고하는 글을 쓸 수 있다.","B":"절차와 결과가 드러나게 글의 내용을 조직하고 사실에 기반한 내용과 정확한 표현으로 보고하는 글을 쓸 수 있다.","C":"절차와 결과가 부분적으로 드러나게 글의 내용을 조직하고 일부 정확한 표현을 사용하여 보고하는 글을 쓴다.","p":24,"sr":"0-03"},{"c":"[4국03-03]","b":1,"s":0,"a":"쓰기","ak":"쓰기","t":"대상에 대한 자신의 의견과 그렇게 생각한 이유가 드러나게 글을 쓴다.","A":"대상에 대해 자신의 의견을 제시하고 의견을 뒷받침하는 이유가 명료하게 드러나도록 글을 쓸 수 있다.","B":"대상에 대해 자신의 의견을 제시하고 의견을 뒷받침하는 이유를 들어 글을 쓸 수 있다.","C":"대상에 대해 자신의 의견을 제한적으로 제시하거나 의견에 대한 이유가 부분적으로 드러나게 글을 쓴다.","p":24,"sr":"0-03"},{"c":"[4국03-04]","b":1,"s":0,"a":"쓰기","ak":"쓰기","t":"목적과 주제를 고려하여 독자에게 마음을 전하는 글을 쓴다.","A":"목적과 주제와 같은 상황 맥락을 전체적으로 고려하여 독자에게 마음을 전하는 글을 쓸 수 있다.","B":"목적과 주제와 같은 상황 맥락을 고려하여 독자에게 마음을 전하는 글을 쓸 수 있다.","C":"목적 또는 주제를 부분적으로 고려하여 독자에게 마음을 전하는 글을 쓴다.","p":24,"sr":"0-03"},{"c":"[4국03-05]","b":1,"s":0,"a":"쓰기","ak":"쓰기","t":"자신의 쓰기 과정을 점검하며 쓰기에 자신감을 갖는다.","A":"자신의 쓰기 과정을 능동적으로 점검하여 글의 내용과 표현을 수정·보완할 수 있고, 다양한 유형의 글을 쓰면서 쓰기에 자신감을 갖는다.","B":"자신의 쓰기 과정을 점검하여 글의 내용이나 표현을 수정·보완할 수 있고, 다양한 유형의 글을 쓰면서 쓰기에 자신감을 갖는다.","C":"자신의 쓰기 과정을 제한적으로 점검하고, 일부 유형의 글을 쓰면서 쓰기에 자신감을 갖는다.","p":24,"sr":"0-03"},{"c":"[4국04-01]","b":1,"s":0,"a":"문법","ak":"문법","t":"단어와 단어 간의 의미 관계를 파악한다.","A":"다양한 단어 간의 의미 관계를 종합적으로 분석할 수 있다.","B":"단어와 단어 간의 의미 관계를 이해할 수 있다.","C":"단어와 단어 간의 의미 관계를 제한적으로 이해한다.","p":25,"sr":"0-04"},{"c":"[4국04-02]","b":1,"s":0,"a":"문법","ak":"문법","t":"단어를 분류하고 국어사전을 활용하여 능동적인 국어 활동을 한다.","A":"단어를 다양한 기준에 따라 분류하고 국어사전의 정보를 종합적으로 활용하여 능동적인 국어 활동을 할 수 있다.","B":"단어를 분류하고 국어사전의 정보를 활용하여 국어 활동을 할 수 있다.","C":"단어의 분류 기준을 확인하고 국어사전의 정보를 일부 활용하여 국어 활동을 한다.","p":25,"sr":"0-04"},{"c":"[4국04-03]","b":1,"s":0,"a":"문법","ak":"문법","t":"기본적인 문장의 짜임을 이해하고 적절하게 사용한다.","A":"다양한 문장에서 기본적인 문장의 짜임을 분석하고 여러 가지 짜임의 문장을 적절하게 사용할 수 있다.","B":"기본적인 문장의 짜임을 이해하고 여러 가지 짜임의 문장을 사용할 수 있다.","C":"기본적인 문장의 짜임을 제한적으로 이해하고 사용한다.","p":25,"sr":"0-04"},{"c":"[4국04-04]","b":1,"s":0,"a":"문법","ak":"문법","t":"글과 담화에 쓰인 높임 표현과 지시·접속 표현을 이해하고 상황에 맞게 표현한다.","A":"글과 담화에 쓰인 다양한 높임 표현과 지시·접속 표현을 분석하고 적절한 표현을 상황에 따라 효과적으로 활용할 수 있다.","B":"글과 담화에 쓰인 다양한 높임 표현과 지시·접속 표현을 이해하고 이를 상황에 따라 표현할 수 있다.","C":"글과 담화에 쓰인 높임 표현과 지시·접속 표현을 확인하고 일부를 상황에 따라 제한적으로 표현한다.","p":25,"sr":"0-04"},{"c":"[4국04-05]","b":1,"s":0,"a":"문법","ak":"문법","t":"언어가 의사소통과 관계 형성의 수단임을 이해하고 국어를 소중히 여기는 태도를 지닌다.","A":"언어가 의사소통과 관계 형성의 수단임을 종합적으로 이해하고 국어를 소중히 여기는 태도를 내면화한다.","B":"언어가 의사소통과 관계 형성의 수단임을 이해하고 국어의 소중함을 인식하는 태도를 지닌다.","C":"언어가 의사소통과 관계 형성의 수단임을 확인하고 국어의 소중함에 관심을 가진다.","p":25,"sr":"0-04"},{"c":"[4국05-01]","b":1,"s":0,"a":"문학","ak":"문학","t":"인물과 이야기의 흐름을 중심으로 작품을 감상한다.","A":"인물과 이야기의 흐름을 적절하게 파악하며 작품을 능동적으로 감상할 수 있다.","B":"인물과 이야기의 흐름을 파악하며 작품을 감상할 수 있다.","C":"인물과 이야기의 흐름에 관심을 가지며 작품을 감상한다.","p":26,"sr":"0-05"},{"c":"[4국05-02]","b":1,"s":0,"a":"문학","ak":"문학","t":"자신의 경험을 바탕으로 작품 속 세계와 현실 세계를 비교하여 작품을 감상한다.","A":"자신의 경험을 바탕으로 작품 속 세계와 현실 세계의 공통점이나 차이점을 구체적으로 비교하고 작품에 대한 의견을 나누며 적극적으로 감상할 수 있다.","B":"자신의 경험을 바탕으로 작품 속 세계와 현실 세계의 공통점이나 차이점을 비교하며 작품을 감상할 수 있다.","C":"자신의 경험을 바탕으로 작품 속 세계와 현실 세계의 공통점이나 차이점을 부분적으로 비교하며 작품을 감상한다.","p":26,"sr":"0-05"},{"c":"[4국05-03]","b":1,"s":0,"a":"문학","ak":"문학","t":"작품을 듣거나 읽고 마음에 드는 작품을 소개한다.","A":"작품을 듣거나 읽고 작품이 마음에 든 이유를 구체적으로 말하며 작품을 자세하게 소개할 수 있다.","B":"작품을 듣거나 읽고 작품이 마음에 든 이유를 말하며 작품을 소개할 수 있다.","C":"작품을 듣거나 읽고 작품에서 마음에 드는 부분을 일부 말한다.","p":26,"sr":"0-05"},{"c":"[4국05-04]","b":1,"s":0,"a":"문학","ak":"문학","t":"감각적 표현에 유의하여 작품을 감상하고, 감각적 표현을 활용하여 자신의 생각이나 감정을 표현한다.","A":"감각적 표현의 특성과 효과를 파악하며 작품을 감상하고, 감각적 표현을 적절하게 활용하여 자신의 생각이나 감정을 적극적으로 표현할 수 있다.","B":"감각적 표현의 특성을 파악하며 작품을 감상하고, 감각적 표현을 활용하여 자신의 생각이나 감정을 표현할 수 있다.","C":"감각적 표현의 특성을 부분적으로 파악하며 작품을 감상하고, 감각적 표현을 활용하여 자신의 생각이나 감정을 간단하게 표현한다.","p":26,"sr":"0-05"},{"c":"[4국05-05]","b":1,"s":0,"a":"문학","ak":"문학","t":"재미나 감동을 느끼며 작품을 즐겨 감상하는 태도를 지닌다.","A":"재미나 감동을 느끼며 작품을 적극적으로 찾아 읽고 즐겨 감상하는 태도를 지닌다.","B":"재미나 감동을 느끼며 작품을 읽고 즐기는 태도를 지닌다.","C":"주어진 작품을 읽고 재미나 감동을 느끼는 태도를 지닌다.","p":26,"sr":"0-05"},{"c":"[4국06-01]","b":1,"s":0,"a":"매체","ak":"매체","t":"인터넷에서 학습에 필요한 다양한 자료를 탐색하고 목적에 맞게 자료를 선택한다.","A":"학습 상황에 필요한 다양한 자료를 인터넷에서 효과적으로 탐색하고 목적에 적합한 자료를 선택하여 활용할 수 있다.","B":"학습 상황에 필요한 다양한 자료를 인터넷에서 탐색하고 목적에 적합한 자료를 선택할 수 있다.","C":"학습에 필요한 자료를 인터넷에서 탐색한다.","p":27,"sr":"0-06"},{"c":"[4국06-02]","b":1,"s":0,"a":"매체","ak":"매체","t":"매체를 활용하여 간단한 발표 자료를 만든다.","A":"다양한 매체를 활용하여 간단한 발표 자료를 짜임새 있게 만들 수 있다.","B":"매체를 활용하여 간단한 발표 자료를 만들 수 있다.","C":"매체를 활용하여 발표 자료의 일부를 만든다.","p":27,"sr":"0-06"},{"c":"[4국06-03]","b":1,"s":0,"a":"매체","ak":"매체","t":"매체 소통 윤리를 고려하여 매체 자료를 활용하고 공유한다.","A":"매체 소통 윤리를 이해하고 이를 지키며 매체 자료를 적극적으로 활용하고 공유할 수 있다.","B":"기본적인 매체 소통 윤리를 이해하면서 매체 자료를 활용하고 공유할 수 있다.","C":"매체 소통 윤리를 부분적으로 이해하면서 매체 자료를 일부 활용하거나 공유한다.","p":27,"sr":"0-06"},{"c":"[4사01-01]","b":1,"s":1,"a":"우리가 사는 곳","ak":"우리가사는곳","t":"주변 여러 장소에서의 경험과 느낌을 다양한 방식으로 표현하고, 장소감을 나누며 서로 존중하는 태도를 지닌다.","A":"주변 여러 장소에서의 경험과 느낌을 다양한 방식으로 표현하며 주변 장소에 관심을 가지고, 다른 사람과 장소감을 비교하며 서로 다른 장소감을 존중하는 태도를 가진다.","B":"주변 여러 장소에서의 경험과 느낌을 다양한 방식으로 표현하고, 다른 사람의 장소감을 관찰하며 서로 다른 장소감을 존중하는 태도를 가진다.","C":"주변 여러 장소에서의 경험과 느낌을 표현하고, 다른 사람의 장소감을 관찰하며 서로 다른 장소감의 차이를 발견할 수 있다.","p":38},{"c":"[4사01-02]","b":1,"s":1,"a":"우리가 사는 곳","ak":"우리가사는곳","t":"주변의 여러 장소를 살펴보고, 우리가 사는 곳을 더 살기 좋은 곳으로 만드는 방안을 탐색한다.","A":"주변 여러 장소를 조사하여 좋은 점과 불편한 점을 구분하고, 살기 좋은 곳의 조건을 분석하여 우리가 사는 곳을 더 살기 좋은 곳으로 만드는 방법을 제안할 수 있다.","B":"주변의 여러 장소를 조사하여 좋은 점과 불편한 점을 구분하고, 우리가 사는 곳을 더 살기 좋은 곳으로 만드는 방법을 제시할 수 있다.","C":"주변의 여러 장소를 조사하여, 좋은 점과 불편한 점을 나열할 수 있다.","p":38,"note":"내용 체계표의 가치·태도 요소를 포함하여 성취수준 개발"},{"c":"[4사02-01]","b":1,"s":1,"a":"일상에서 만나는 과거","ak":"일상에서만나는과거","t":"일상 속에서 시간의 흐름을 경험할 수 있는 사례를 살펴보고, 이를 바탕으로 역사의 시간 개념을 이해한다.","A":"일상 속에서 시간의 흐름을 경험할 수 있는 사례를 분석하여 역사의 시간 개념을 탐구하고 시간의 흐름 속에서 자신의 위치를 확인할 수 있다.","B":"일상 속에서 시간의 흐름을 경험할 수 있는 사례를 찾아보고 이를 바탕으로 역사의 시간 개념을 설명할 수 있다.","C":"일상 속에서 시간의 흐름을 경험할 수 있는 사례를 찾을 수 있다.","p":38},{"c":"[4사02-02]","b":1,"s":1,"a":"일상에서 만나는 과거","ak":"일상에서만나는과거","t":"오래된 물건이나 자료들을 주변에서 찾아보고, 이를 통해 과거의 모습을 살펴볼 수 있음을 이해한다.","A":"주변에서 오래된 물건이나 자료들을 찾아보며 과거의 모습을 탐색하고, 역사가 증거를 바탕으로 구성된다는 것을 추정할 수 있다.","B":"주변에서 오래된 물건이나 자료들을 찾아보고, 이들이 과거의 모습을 알려주는 증거임을 짐작하여 설명할 수 있다.","C":"주변에서 과거의 모습을 살펴볼 수 있는 오래된 물건이나 자료들을 찾을 수 있다.","p":38},{"c":"[4사02-03]","b":1,"s":1,"a":"일상에서 만나는 과거","ak":"일상에서만나는과거","t":"지역의 변화상을 보여주는 역사 자료를 분석하여 지역 사람들의 달라진 생활 모습을 파악한다.","A":"지역의 변화상을 보여주는 다양한 역사 자료를 선정하고 분석하여 지역 사람들의 달라진 생활 모습을 유추할 수 있다.","B":"지역의 변화상을 보여주는 역사 자료를 조사하여 지역 사람들의 달라진 생활 모습을 비교할 수 있다.","C":"지역의 변화상을 보여주는 역사 자료를 통해 지역 사람들의 달라진 생활 모습을 찾을 수 있다.","p":39},{"c":"[4사03-01]","b":1,"s":1,"a":"사회 변화와 다양한 문화","ak":"사회변화와다양한문화","t":"최근 사회 변화의 양상과 특징을 파악하고, 그로 인해 나타난 생활모습의 변화를 탐색한다.","A":"사례를 통해 최근 사회 변화의 양상과 특징을 도출하고, 그로 인해 변화한 생활모습을 분석할 수 있다.","B":"최근 사회 변화의 양상과 특징을 분석하고, 그로 인해 변화한 생활모습을 설명할 수 있다.","C":"최근 사회 변화의 양상과 특징을 생활모습의 변화와 관련지어 나열할 수 있다.","p":39},{"c":"[4사03-02]","b":1,"s":1,"a":"사회 변화와 다양한 문화","ak":"사회변화와다양한문화","t":"우리 사회에 다양한 문화가 확산되면서 나타나는 긍정적 효과와 문제를 분석하고, 나와 다른 사람이나 집단의 문화를 존중하는 태도를 기른다.","A":"다양한 자료를 통해 우리 사회에 다양한 문화가 확산되면서 나타나는 긍정적 효과와 문제를 도출하고, 나와 다른 사람이나 집단의 문화를 존중할 수 있다.","B":"우리 사회에 다양한 문화가 확산되면서 나타나는 긍정적 효과와 문제를 분석하고, 나와 다른 사람이나 집단의 문화를 존중하는 태도를 가진다.","C":"우리 사회에 다양한 문화가 확산되면서 나타나는 긍정적 효과와 문제를 나열하고, 나와 다른 사람의 문화를 존중해야 함을 안다.","p":39},{"c":"[4사04-01]","b":1,"s":1,"a":"옛날과 오늘날의 생활 모습","ak":"옛날과오늘날의생활모습","t":"옛날 풍습에 대해 알아보고, 오늘날과 비교하여 변화상을 파악한다.","A":"옛날 풍습을 조사하고, 오늘날과 비교하여 변화상을 분석할 수 있다.","B":"옛날 풍습을 살펴보고, 오늘날과 비교하여 변화상을 제시할 수 있다.","C":"옛날 풍습의 종류를 설명하고, 오늘날의 풍습과 비교할 수 있다.","p":39},{"c":"[4사04-02]","b":1,"s":1,"a":"옛날과 오늘날의 생활 모습","ak":"옛날과오늘날의생활모습","t":"옛날부터 오늘날까지 교통의 변화에 따른 이동과 생활 모습의 변화를 이해한다.","A":"옛날부터 오늘날까지 교통의 변화에 따른 이동과 생활 모습의 변화를 일상생활의 경험과 관련지어 탐구할 수 있다.","B":"옛날부터 오늘날까지 교통의 변화에 따른 이동과 생활 모습의 변화를 설명할 수 있다.","C":"옛날부터 오늘날까지 교통의 변화에 따라 이동 수단이 달라졌음을 말할 수 있다.","p":39},{"c":"[4사04-03]","b":1,"s":1,"a":"옛날과 오늘날의 생활 모습","ak":"옛날과오늘날의생활모습","t":"옛날부터 오늘날까지 통신수단의 변화에 따른 정보 교류와 의사소통 방식의 변화를 설명한다.","A":"옛날부터 오늘날까지 통신수단의 변화에 따른 정보 교류와 의사소통 방식의 변화를 일상생활의 경험과 관련지어 탐구할 수 있다.","B":"옛날부터 오늘날까지 통신수단의 변화에 따른 정보 교류와 의사소통 방식의 변화를 설명할 수 있다.","C":"옛날부터 오늘날까지 통신수단의 변화에 따라 정보 교류와 의사소통 방식이 달라졌음을 짐작하여 말할 수 있다.","p":40},{"c":"[4사05-01]","b":1,"s":1,"a":"지도로 만나는 우리 지역","ak":"지도로만나는우리지역","t":"우리 지역을 표현한 다양한 종류의 지도를 찾아보고, 지도의 요소를 이해한다.","A":"우리 지역을 표현한 다양한 지도의 종류와 기능을 분석하고 지도에 나타난 요소의 의미와 쓰임을 설명하며, 실생활에서 지도를 활용할 수 있다.","B":"우리 지역을 표현한 다양한 종류의 지도를 조사하고, 지도에 나타난 요소가 의미하는 바를 설명할 수 있다.","C":"우리 지역을 표현한 다양한 종류의 지도를 보고, 지도의 요소를 구별할 수 있다.","p":40},{"c":"[4사05-02]","b":1,"s":1,"a":"지도로 만나는 우리 지역","ak":"지도로만나는우리지역","t":"지도에서 우리 지역의 위치를 파악하고, 우리 지역의 지리 정보를 탐색한다.","A":"지도를 통해 우리 지역의 위치 특성을 분석하고, 우리 지역의 지리 정보를 조사하여 우리 지역의 특징을 다른 지역과 비교하여 설명할 수 있다.","B":"지도에서 우리 지역의 위치를 확인하고, 우리 지역의 지리 정보를 조사하여 우리 지역의 특징을 설명할 수 있다.","C":"지도에서 우리 지역의 위치를 찾고, 우리 지역의 지리 정보를 조사할 수 있다.","p":40},{"c":"[4사06-01]","b":1,"s":1,"a":"우리 지역의 문화유산","ak":"우리지역의문화유산","t":"지역의 문화유산을 통해 문화유산의 의미와 유형을 알아보고, 문화유산의 가치를 탐색한다.","A":"지역의 문화유산을 통해 문화유산의 의미, 유형, 가치를 탐구하고, 문화유산의 가치를 탐색하여 문화유산을 보존하려는 태도를 가진다.","B":"지역의 문화유산을 통해 문화유산의 의미와 유형을 설명하고, 문화유산의 가치를 찾아 문화유산을 지키려는 태도를 가진다.","C":"지역의 문화유산을 통해 문화유산의 의미와 유형을 탐색하고, 문화유산에 관심을 가진다.","p":41},{"c":"[4사06-02]","b":1,"s":1,"a":"우리 지역의 문화유산","ak":"우리지역의문화유산","t":"지역의 박물관, 기념관, 유적지 등을 체험하고 지역의 역사를 이해한다.","A":"지역의 박물관, 기념관, 유적지 등을 체험하며 다양한 역사적 사실을 탐구하고 지역의 역사를 지키려는 태도를 가진다.","B":"지역의 박물관, 기념관, 유적지 등을 체험하며 알게 된 역사적 사실을 설명하고 지역의 역사에 지속적으로 관심을 가진다.","C":"지역의 박물관, 기념관, 유적지 등을 살펴보며 지역의 역사에 관심을 가진다.","p":41},{"c":"[4사07-01]","b":1,"s":1,"a":"경제활동과 지역 간 교류","ak":"경제활동과지역간교류","t":"자원의 희소성으로 인해 경제활동에서 선택의 문제가 발생함을 이해하고, 경제활동에서 합리적 선택의 방법을 탐색한다.","A":"자원의 희소성으로 인해 경제활동에서 선택의 문제가 발생하는 사례를 조사하고, 경제활동에서 합리적 선택의 방법을 실천할 수 있다.","B":"자원의 희소성으로 인해 경제활동에서 선택의 문제가 발생함을 설명하고, 경제활동에서 합리적 선택의 방법을 탐색할 수 있다.","C":"자원의 희소성으로 인해 경제활동에서 선택의 문제가 발생함을 말할 수 있다.","p":41},{"c":"[4사07-02]","b":1,"s":1,"a":"경제활동과 지역 간 교류","ak":"경제활동과지역간교류","t":"생산과 소비 활동을 파악하고, 인적·물적 교류의 사례를 통해 각 지역 및 사람들이 상호 의존 관계를 맺고 있음을 탐색한다.","A":"사례를 통해 생산과 소비 활동을 분석하고, 여러 인적·물적 교류의 사례를 조사하여 각 지역 및 사람들이 상호 의존 관계를 맺고 있음을 도출할 수 있다.","B":"사례를 통해 생산과 소비 활동을 구분하고, 인적·물적 교류의 사례를 통해 각 지역 및 사람들이 상호 의존 관계에 있음을 설명할 수 있다.","C":"생산과 소비 활동을 구분하고, 인적·물적 교류의 사례를 조사할 수 있다.","p":41},{"c":"[4사08-01]","b":1,"s":1,"a":"민주주의와 자치","ak":"민주주의와자치","t":"학교 자치 사례를 통하여 민주주의의 의미를 이해하고, 학교생활에서 민주주의를 실천하는 능력을 기른다.","A":"학교 자치 활동의 사례를 조사하여 민주주의의 의미를 도출하고, 학교생활에서 민주주의를 실천하는 데 참여할 수 있다.","B":"학교 자치 활동의 사례를 통하여 민주주의의 의미를 설명하고, 학교생활에서 민주주의를 실천하는 데 관심을 가진다.","C":"학교 자치 활동의 사례를 통하여 민주주의의 의미를 제시하고, 학교생활에서 민주주의를 실천하고자 노력한다.","p":42,"note":"내용 체계표의 가치·태도 요소를 포함하여 성취수준 개발"},{"c":"[4사08-02]","b":1,"s":1,"a":"민주주의와 자치","ak":"민주주의와자치","t":"지역에서 이루어지는 민주주의 사례를 통해 주민 자치와 주민 참여의 중요성을 파악하고, 지역사회의 문제 해결에 참여하는 태도를 기른다.","A":"지역에서 이루어지는 민주주의의 사례를 통해 주민 자치와 주민 참여의 중요성을 설명하고, 지역사회에서 발생하는 문제를 조사하고 해결하기 위해 노력한다.","B":"지역에서 이루어지는 민주주의의 사례를 통해 주민 자치와 주민 참여의 중요성을 파악하고, 지역사회에서 발생하는 문제와 이에 대한 해결에 관심을 가진다.","C":"지역에서 이루어지는 민주주의의 사례를 통해 주민 자치와 주민 참여의 중요성을 파악하고, 지역사회에서 발생하는 문제에 주의를 기울인다.","p":42},{"c":"[4사09-01]","b":1,"s":1,"a":"지역문제를 해결하고 지역을 알리는 노력","ak":"지역문제를해결하고지역을알리는노력","t":"생활 주변에서 찾을 수 있는 여러 가지 문제를 파악하고, 그 문제를 합리적으로 해결하는 능력을 기른다.","A":"생활 주변에서 찾을 수 있는 지역의 여러 가지 문제를 조사하고, 그 문제를 합리적으로 해결하는 방안을 근거를 들어 제안할 수 있다.","B":"생활 주변에서 찾을 수 있는 지역의 여러 가지 문제를 파악하고, 그 문제를 합리적으로 해결하기 위한 방안을 탐색할 수 있다.","C":"생활 주변에서 찾을 수 있는 여러 가지 문제를 제시하고 문제 해결에 관심을 가진다.","p":42},{"c":"[4사09-02]","b":1,"s":1,"a":"지역문제를 해결하고 지역을 알리는 노력","ak":"지역문제를해결하고지역을알리는노력","t":"지역의 자연환경, 역사, 문화, 생산물 등을 알리려는 지역사회의 노력을 알고 관심을 갖는다.","A":"지역의 자연환경, 역사, 문화, 생산물 등을 알리려는 지역사회의 여러 활동을 조사하고, 지역사회의 노력에 다양한 방식으로 참여할 수 있다.","B":"지역의 자연환경, 역사, 문화, 생산물 등을 알리려는 지역사회의 활동을 조사하고, 지역사회의 노력에 지속적으로 관심을 가진다.","C":"지역의 자연환경, 역사, 문화, 생산물 등을 알리려는 지역사회의 활동을 탐색할 수 있다.","p":42},{"c":"[4사10-01]","b":1,"s":1,"a":"다양한 환경과 삶의 모습","ak":"다양한환경과삶의모습","t":"여러 지역의 자연환경과 인문환경의 특징을 살펴보고, 환경의 이용과 개발에 따른 변화를 탐구한다.","A":"여러 지역의 자연환경과 인문환경을 분석하여 특징을 파악하고, 개발과 보전에 관한 균형 있는 관점을 바탕으로 환경의 이용과 개발에 따른 변화를 설명할 수 있다.","B":"여러 지역의 자연환경과 인문환경을 조사하여 우리 지역과의 유사점과 차이점을 발견하고, 환경의 이용과 개발에 따른 변화를 설명할 수 있다.","C":"여러 지역의 자연환경과 인문환경을 조사하여 다양한 환경의 모습을 확인하고, 환경의 이용과 개발에 따른 변화를 살펴볼 수 있다.","p":43},{"c":"[4사10-02]","b":1,"s":1,"a":"다양한 환경과 삶의 모습","ak":"다양한환경과삶의모습","t":"사례에서 도시의 인구, 교통, 산업 등의 특징을 탐구하고, 도시에서의 삶의 모습을 이해한다.","A":"우리나라 여러 도시의 사례를 분석하여 도시의 인구, 교통, 산업 등의 특징을 도출하고, 도시 생활의 장점과 단점을 중심으로 도시에서의 삶의 모습을 설명할 수 있다.","B":"우리나라 여러 도시의 인구, 교통, 산업의 특징을 조사하고, 도시 생활의 장점과 단점을 설명할 수 있다.","C":"우리나라 여러 도시의 인구, 교통, 산업의 특징을 찾을 수 있고, 도시에서의 생활 모습을 말할 수 있다.","p":43},{"c":"[4도01-01]","b":1,"s":2,"a":"자신과의 관계","ak":"자신과의관계","t":"자신의 감정을 소중히 여기며 존중하는 태도를 바탕으로 내가 누구인가를 탐구한다.","A":"자신의 감정을 꾸준히 존중하는 태도를 바탕으로 내가 누구인가를 다각도로 탐구한다.","B":"자신의 감정을 존중하는 태도를 바탕으로 내가 누구인가를 탐구한다.","C":"자신의 감정에 관심을 가지고 내가 누구인가를 탐구하려고 노력한다.","p":55,"sr":"2-01"},{"c":"[4도01-02]","b":1,"s":2,"a":"자신과의 관계","ak":"자신과의관계","t":"정직의 의미를 알고 모범적인 사례를 탐색하여 바르게 행동하려는 태도를 기른다.","A":"정직의 의미를 포괄적으로 이해하고 다양한 모범 사례를 탐색하여 생활 전반에서 바르게 행동하려는 태도를 기른다.","B":"정직의 의미를 이해하고 모범 사례를 탐색하여 바르게 행동하려는 태도를 기른다.","C":"정직의 의미를 단편적으로 이해하고 모범 사례 탐색에 관심을 가지며 바르게 행동하려는 태도를 기르고자 노력한다.","p":55,"sr":"2-01"},{"c":"[4도01-03]","b":1,"s":2,"a":"자신과의 관계","ak":"자신과의관계","t":"성실한 생활의 모범 사례를 탐색하고 시간 관리를 위한 생활을 계획하여 지속적인 자기 성장을 모색한다.","A":"성실한 생활의 다양한 모범 사례를 탐색하고 생활 전반에 걸쳐 시간 관리를 위한 생활 계획을 세우며 지속적인 자기 성장을 모색한다.","B":"성실한 생활의 모범 사례를 탐색하고 시간 관리를 위한 생활 계획을 세우며 자기 성장을 모색한다.","C":"성실한 생활의 모범 사례를 인식하고 시간 관리를 위한 생활 계획을 세우려 노력하며 자기 성장에 관심을 가진다.","p":55,"sr":"2-01"},{"c":"[4도01-04]","b":1,"s":2,"a":"자신과의 관계","ak":"자신과의관계","t":"다른 사람의 관점을 수용할 수 있는지를 도덕적으로 검토하고 도덕규범을 내면화하여 도덕적으로 행동할 수 있는 자세를 기른다.","A":"다른 사람의 관점을 수용할 수 있는지를 도덕적으로 검토하며 생활 전반에서 도덕규범을 내면화하여 도덕적으로 행동할 수 있는 자세를 가진다.","B":"다른 사람의 관점을 수용할 수 있는지를 도덕적으로 검토하며 도덕규범을 내면화하여 도덕적으로 행동할 수 있는 자세를 가진다.","C":"다른 사람의 관점을 수용할 수 있는지를 검토하려고 노력하며 도덕규범에 관심을 가지고 도덕적으로 행동하려고 노력한다.","p":55,"sr":"2-01"},{"c":"[4도02-01]","b":1,"s":2,"a":"타인과의 관계","ak":"타인과의관계","t":"효, 우애의 의미와 필요성을 명료하게 이해하고 가족의 행복을 위해 할 수 있는 일을 탐색하여 실천 계획을 세운다.","A":"효, 우애의 의미와 필요성에 대해 명료하게 이해하고 가족의 행복을 위해 자신이 할 수 있는 다양한 일을 탐색하여 실천 계획을 세운다.","B":"효, 우애의 의미와 필요성에 대해 이해하고 가족의 행복을 위해 자신이 할 수 있는 일을 탐색하여 실천 계획을 세운다.","C":"효, 우애의 의미와 필요성에 대해 대략적으로 이해하고 가족의 행복을 위해 자신이 할 수 있는 일을 탐색하여 실천 계획을 세우는 것에 관심을 가진다.","p":56,"sr":"2-02"},{"c":"[4도02-02]","b":1,"s":2,"a":"타인과의 관계","ak":"타인과의관계","t":"친구 사이의 배려에 대한 올바른 이해를 바탕으로 일상생활에서 배려에 기반한 도덕적 관계를 맺을 수 있는 방안을 탐색한다.","A":"친구 사이의 배려에 대한 올바른 이해를 바탕으로 일상생활에서 배려에 기반한 도덕적 관계를 맺을 수 있는 방안을 다각도로 탐색한다.","B":"친구 사이의 배려에 대한 올바른 이해를 바탕으로 일상생활에서 배려에 기반한 도덕적 관계를 맺을 수 있는 방안을 탐색한다.","C":"친구 사이의 배려에 대한 이해를 바탕으로 배려에 기반한 도덕적 관계를 맺을 수 있는 방안에 관심을 가진다.","p":56,"sr":"2-02"},{"c":"[4도02-03]","b":1,"s":2,"a":"타인과의 관계","ak":"타인과의관계","t":"공감의 태도가 필요한 이유를 이해하고 도덕적 상상력을 바탕으로 대상과 상황에 따라 감정을 나누는 방법을 탐구하여 실천한다.","A":"타인 공감의 태도가 필요한 이유를 포괄적으로 이해하고 도덕적 상상력을 바탕으로 대상과 상황에 따라 감정 나누는 방법을 다각도로 탐구하여 생활 전반에서 실천한다.","B":"타인 공감의 태도가 필요한 이유를 이해하고 도덕적 상상력을 바탕으로 대상과 상황에 따라 감정 나누는 방법을 탐구하여 실천한다.","C":"타인 공감의 태도가 필요한 이유를 단편적으로 이해하고 도덕적 상상력을 바탕으로 대상과 상황에 따라 감정 나누는 방법에 관심을 가지고 실천하려고 노력한다.","p":56,"sr":"2-02"},{"c":"[4도03-01]","b":1,"s":2,"a":"사회·공동체와의 관계","ak":"사회공동체와의관계","t":"불공정의 사례를 탐구하고, 일상생활에서 공정의 가치를 추구하는 활동을 통해 실천 의지를 함양한다.","A":"불공정의 사례를 다각도로 탐구하고 일상생활에서 공정의 가치를 추구하는 활동을 통해 적극적인 실천 의지를 가진다.","B":"불공정의 사례를 탐구하고 일상생활에서 공정의 가치를 추구하는 활동을 통해 실천 의지를 가진다.","C":"불공정의 사례를 인식하고 일상생활에서 공정의 가치를 추구하는 활동에 관심을 가진다.","p":56,"sr":"2-03"},{"c":"[4도03-02]","b":1,"s":2,"a":"사회·공동체와의 관계","ak":"사회공동체와의관계","t":"디지털 사회에서 발생하는 다양한 문제를 살펴보고, 해결 방안을 탐구하여 정보통신 윤리에 대한 민감성을 기른다.","A":"디지털 사회에서 발생하는 다양한 문제를 살펴보고 해결 방안을 다각도로 탐구하여 정보통신 윤리에 대한 민감성을 가진다.","B":"디지털 사회에서 발생하는 문제를 살펴보고 해결 방안을 탐구하여 정보통신 윤리에 대한 민감성을 가진다.","C":"디지털 사회에서 발생하는 문제를 살펴보고 해결 방안에 관심을 가지며 정보통신 윤리에 대한 민감성을 기르고자 노력한다.","p":56,"sr":"2-03"},{"c":"[4도03-03]","b":1,"s":2,"a":"사회·공동체와의 관계","ak":"사회공동체와의관계","t":"통일의 필요성을 이해하고, 통일 감수성을 길러 바람직한 통일의 방향을 모색한다.","A":"통일의 필요성에 대해 전반적으로 이해하고 통일 감수성을 길러 바람직한 통일의 방향을 다각도로 모색한다.","B":"통일의 필요성에 대해 이해하고 통일 감수성을 길러 바람직한 통일의 방향을 모색한다.","C":"통일의 필요성에 대해 부분적으로 이해하고 통일 감수성을 기르고자 노력하여 바람직한 통일의 방향에 관심을 가진다.","p":57,"sr":"2-03"},{"c":"[4도04-01]","b":1,"s":2,"a":"자연과의 관계","ak":"자연과의관계","t":"생명 경시 사례를 조사하고 문제 해결 방법을 탐구함으로써 생명의 소중함을 이해한다.","A":"다양한 생명 경시 사례를 조사하고 문제 해결 방법을 다각도로 탐구함으로써 생명의 소중함을 포괄적으로 이해한다.","B":"생명 경시 사례를 조사하고 문제 해결 방법을 탐구함으로써 생명의 소중함을 이해한다.","C":"생명 경시 사례에 관심을 가짐으로써 생명의 소중함을 단편적으로 이해한다.","p":57,"sr":"2-04"},{"c":"[4도04-02]","b":1,"s":2,"a":"자연과의 관계","ak":"자연과의관계","t":"인간과 자연이 함께 살아야 하는 이유를 이해하고 공생을 위한 구체적인 실천 계획을 세우며 생태 감수성을 기른다.","A":"인간과 자연이 함께 살아야 하는 이유를 포괄적으로 이해하고 자연과의 공생을 위한 구체적인 실천 계획을 다양하게 수립하며 생태 감수성을 기른다.","B":"인간과 자연이 함께 살아야 하는 이유를 이해하고 자연과의 공생을 위한 구체적인 실천 계획을 세우며 생태 감수성을 기른다.","C":"인간과 자연이 함께 살아야 하는 이유를 단편적으로 이해하고 자연과의 공생을 위한 실천 계획을 세우는 것에 관심을 가지며 생태 감수성을 기르고자 노력한다.","p":57,"sr":"2-04"},{"c":"[4수01-01]","b":1,"s":3,"a":"수와 연산","ak":"수와연산","t":"큰 수의 필요성을 인식하면서 10000 이상의 큰 수에 대한 자릿값과 위치적 기수법을 이해하고, 수를 읽고 쓸 수 있다.","A":"실생활에서 큰 수의 필요성을 설명하고, 10000 이상의 수를 각 자리의 숫자가 나타내는 수들의 합으로 나타내며, 수를 읽고 쓸 수 있다.","B":"실생활에서 큰 수의 필요성을 알고, 10000 이상의 수에서 각 자리의 숫자가 나타내는 수를 말하며, 수를 읽고 쓸 수 있다.","C":"실생활에서 큰 수가 사용됨을 알고, 수 카드, 자릿값 카드 등을 이용하여 10000 이상의 수에서 각 자리의 숫자가 나타내는 수를 알고, 수를 읽고 쓸 수 있다.","p":65,"sr":"3-01"},{"c":"[4수01-02]","b":1,"s":3,"a":"수와 연산","ak":"수와연산","t":"다섯 자리 이상의 수의 범위에서 수의 계열을 이해하고, 수의 크기를 비교하며 그 방법을 설명할 수 있다.","A":"수의 계열에 대한 이해를 바탕으로 다섯 자리 이상의 수를 여러 가지 방법으로 세며, 수의 크기를 비교하고 그 방법을 설명할 수 있다.","B":"다섯 자리 이상의 수를 만, 억, 조씩 뛰어 세면서 수의 계열을 이해하고, 수의 크기를 비교할 수 있다.","C":"안내된 절차에 따라 다섯 자리 이상의 수를 뛰어 세고, 간단한 두 수의 크기를 비교할 수 있다.","p":65,"sr":"3-01"},{"c":"[4수01-03]","b":1,"s":3,"a":"수와 연산","ak":"수와연산","t":"세 자리 수의 덧셈과 뺄셈의 계산 원리를 이해하고 그 계산을 할 수 있다.","A":"받아올림이 있는 (세 자리 수)+(세 자리 수)와 받아내림이 있는 (세 자리 수)-(세 자리 수)를 계산하고, 그 계산 원리를 설명할 수 있다.","B":"받아올림이 있는 (세 자리 수)+(세 자리 수)와 받아내림이 있는 (세 자리 수)-(세 자리 수)의 계산 원리를 이해하고, 그 계산을 할 수 있다.","C":"안내된 절차에 따라 받아올림이 있는 (세 자리 수)+(세 자리 수)와 받아내림이 있는 (세 자리 수)-(세 자리 수)의 간단한 계산을 할 수 있다.","p":65,"sr":"3-01"},{"c":"[4수01-04]","b":1,"s":3,"a":"수와 연산","ak":"수와연산","t":"곱하는 수가 한 자리 수 또는 두 자리 수인 곱셈의 계산 원리를 이해하고 그 계산을 할 수 있다.","A":"(두 자리 수)×(한 자리 수), (세 자리 수)×(한 자리 수), (두 자리 수)×(두 자리 수), (세 자리 수)×(두 자리 수)를 계산하고, 그 계산 원리를 설명할 수 있다.","B":"(두 자리 수)×(한 자리 수), (세 자리 수)×(한 자리 수), (두 자리 수)×(두 자리 수), (세 자리 수)×(두 자리 수)의 계산 원리를 이해하고, 그 계산을 할 수 있다.","C":"안내된 절차에 따라 (두 자리 수)×(한 자리 수), (두 자리 수)×(두 자리 수)의 간단한 계산을 할 수 있다.","p":66,"sr":"3-01"},{"c":"[4수01-05]","b":1,"s":3,"a":"수와 연산","ak":"수와연산","t":"나눗셈이 이루어지는 실생활 상황과 연결하여 나눗셈의 의미를 알고, 곱셈과 나눗셈의 관계를 이해한다.","A":"나눗셈이 이루어지는 실생활 상황과 연결하여 나눗셈의 의미를 설명하고, 한 가지 상황을 곱셈식과 나눗셈식으로 나타내어 곱셈과 나눗셈의 관계를 설명할 수 있다.","B":"나눗셈이 이루어지는 실생활 상황과 연결하여 나눗셈의 의미를 이해하고, 이를 나눗셈식으로 나타내며, 한 가지 상황을 곱셈식과 나눗셈식으로 나타낼 수 있다.","C":"안내된 절차에 따라 나눗셈이 이루어지는 실생활 상황을 나눗셈식으로 나타내고, 곱셈식을 나눗셈식으로, 나눗셈식을 곱셈식으로 나타낼 수 있다.","p":66,"sr":"3-01"},{"c":"[4수01-06]","b":1,"s":3,"a":"수와 연산","ak":"수와연산","t":"나누는 수가 한 자리 수인 나눗셈의 계산 원리를 이해하고 그 계산을 할 수 있으며, 나눗셈에서 몫과 나머지의 의미를 안다.","A":"나누는 수가 한 자리 수인 나눗셈을 계산하여 몫과 나머지를 구하고, 나눗셈에서 몫과 나머지의 의미와 계산 원리를 설명할 수 있다.","B":"나누는 수가 한 자리 수인 나눗셈의 계산 원리를 이해하고, 그 계산을 하여 몫과 나머지를 구할 수 있다.","C":"안내된 절차에 따라 나누는 수가 한 자리 수인 나눗셈을 하여 몫과 나머지를 구할 수 있다.","p":66,"sr":"3-01"},{"c":"[4수01-07]","b":1,"s":3,"a":"수와 연산","ak":"수와연산","t":"나누는 수가 두 자리 수인 나눗셈의 계산 원리를 이해하고 그 계산을 할 수 있다.","A":"(두 자리 수)÷(두 자리 수)와 (세 자리 수)÷(두 자리 수)를 계산하고, 그 계산 원리를 설명할 수 있다.","B":"(두 자리 수)÷(두 자리 수)와 (세 자리 수)÷(두 자리 수)의 계산 원리를 이해하고, 그 계산을 할 수 있다.","C":"안내된 절차에 따라 (두 자리 수)÷(두 자리 수)와 (세 자리 수)÷(두 자리 수)의 간단한 계산을 할 수 있다.","p":66,"sr":"3-01"},{"c":"[4수01-08]","b":1,"s":3,"a":"수와 연산","ak":"수와연산","t":"자연수의 덧셈, 뺄셈, 곱셈, 나눗셈과 관련한 여러 가지 상황에서 어림셈을 할 수 있다.","A":"자연수의 덧셈, 뺄셈, 곱셈, 나눗셈에서 계산 결과를 어림하며, 어림셈을 이용하여 계산 결과가 타당한지를 확인하고, 실생활 문제를 해결할 수 있다.","B":"자연수의 덧셈, 뺄셈, 곱셈, 나눗셈에서 계산 결과를 어림하며, 어림셈을 이용하여 계산 결과가 타당한지를 확인할 수 있다.","C":"안내된 절차에 따라 간단한 자연수의 덧셈, 뺄셈, 곱셈, 나눗셈의 계산 결과를 어림할 수 있다.","p":67,"sr":"3-01"},{"c":"[4수01-09]","b":1,"s":3,"a":"수와 연산","ak":"수와연산","t":"양의 등분할을 통하여 분수의 필요성을 인식하고, 분수를 이해하고 읽고 쓸 수 있다.","A":"양의 등분할을 이용하여 분수의 필요성과 의미를 설명하고, 분수를 읽고 쓸 수 있다.","B":"양의 등분할을 통하여 분수의 필요성과 의미를 알고, 분수를 읽고 쓸 수 있다.","C":"안내된 절차에 따라 분모와 분자를 구별하여 분수를 읽고 쓸 수 있다.","p":67,"sr":"3-01"},{"c":"[4수01-10]","b":1,"s":3,"a":"수와 연산","ak":"수와연산","t":"단위분수, 진분수, 가분수, 대분수를 알고, 그 관계를 이해한다.","A":"단위분수, 진분수, 가분수, 대분수의 관계를 설명하고, 가분수를 대분수로, 대분수를 가분수로 나타낼 수 있다.","B":"단위분수, 진분수, 가분수, 대분수를 알고, 가분수를 대분수로, 대분수를 가분수로 나타낼 수 있다.","C":"안내된 절차에 따라 단위분수, 진분수, 가분수, 대분수를 구분하고, 가분수를 대분수로, 대분수를 가분수로 나타낼 수 있다.","p":67,"sr":"3-01"},{"c":"[4수01-11]","b":1,"s":3,"a":"수와 연산","ak":"수와연산","t":"분모가 같은 분수끼리, 단위분수끼리 크기를 비교하고 그 방법을 설명할 수 있다.","A":"분모가 같은 분수끼리, 단위분수끼리 크기를 비교하고, 그 방법을 설명할 수 있다.","B":"분모가 같은 분수끼리, 단위분수끼리 크기를 비교할 수 있다.","C":"구체물이나 그림을 보고 분모가 같은 분수끼리, 단위분수끼리 크기를 직관적으로 비교할 수 있다.","p":67,"sr":"3-01"},{"c":"[4수01-12]","b":1,"s":3,"a":"수와 연산","ak":"수와연산","t":"분모가 10인 진분수와 연결하여 소수 한 자리 수를 이해하고 읽고 쓸 수 있다.","A":"분모가 10인 진분수를 소수 한 자리 수로 나타내고 읽고 쓰며, 실생활에서 소수가 활용되는 사례를 찾아 소수의 필요성을 말할 수 있다.","B":"분모가 10인 진분수를 소수 한 자리 수로 나타내고 읽고 쓰며, 실생활에서 소수가 활용되는 사례를 찾을 수 있다.","C":"임을 알고, 소수 한 자리 수를 읽고 쓸 수 있다.","p":68,"sr":"3-01"},{"c":"[4수01-13]","b":1,"s":3,"a":"수와 연산","ak":"수와연산","t":"자릿값의 원리를 바탕으로 소수 두 자리 수와 소수 세 자리 수를 이해하고 읽고 쓸 수 있다.","A":"소수 두 자리 수와 소수 세 자리 수에서 자릿값의 원리를 설명하고, 소수를 읽고 쓸 수 있다.","B":"소수 두 자리 수와 소수 세 자리 수에서 자릿값의 원리를 이해하고, 소수를 읽고 쓸 수 있다.","C":"안내된 절차에 따라 분모가 100, 1000인 분수를 소수로 나타내고, 그 소수를 읽을 수 있다.","p":68,"sr":"3-01"},{"c":"[4수01-14]","b":1,"s":3,"a":"수와 연산","ak":"수와연산","t":"소수의 크기를 비교하고 그 방법을 설명할 수 있다.","A":"여러 가지 소수의 크기를 비교하고, 그 방법을 설명할 수 있다.","B":"여러 가지 소수의 크기를 비교할 수 있다.","C":"구체물이나 그림을 이용하여 소수의 크기를 비교할 수 있다.","p":68,"sr":"3-01"},{"c":"[4수01-15]","b":1,"s":3,"a":"수와 연산","ak":"수와연산","t":"분모가 같은 분수의 덧셈과 뺄셈의 계산 원리를 이해하고 그 계산을 할 수 있다.","A":"분모가 같은 분수의 덧셈과 뺄셈을 여러 가지 방법으로 계산하고, 그 계산 원리를 설명할 수 있다.","B":"분모가 같은 분수의 덧셈과 뺄셈의 계산 원리를 이해하고, 그 계산을 할 수 있다.","C":"안내된 절차에 따라 분모가 같은 간단한 분수의 덧셈과 뺄셈을 할 수 있다.","p":68,"sr":"3-01"},{"c":"[4수01-16]","b":1,"s":3,"a":"수와 연산","ak":"수와연산","t":"소수 두 자리 수의 범위에서 소수의 덧셈과 뺄셈의 계산 원리를 이해하고 그 계산을 할 수 있다.","A":"소수 두 자리 수의 범위에서 소수의 덧셈과 뺄셈을 계산하고, 그 계산 원리를 설명할 수 있다.","B":"소수 두 자리 수의 범위에서 소수의 덧셈과 뺄셈의 계산 원리를 이해하고, 그 계산을 할 수 있다.","C":"안내된 절차에 따라 소수 두 자리 수의 범위에서 간단한 소수의 덧셈과 뺄셈을 할 수 있다.","p":69,"sr":"3-01"},{"c":"[4수02-01]","b":1,"s":3,"a":"변화와 관계","ak":"변화와관계","t":"다양한 변화 규칙을 찾아 설명하고, 그 규칙을 수나 식으로 나타낼 수 있다.","A":"여러 가지 배열에서 다양한 변화 규칙을 찾아 수나 식으로 나타내고, 그 방법을 설명할 수 있다.","B":"주어진 배열에서 변화 규칙을 찾아 말하고, 그 규칙을 수나 식으로 나타낼 수 있다.","C":"안내된 절차에 따라 간단한 배열에서 변화 규칙을 찾아 수나 식으로 나타낼 수 있다.","p":69,"sr":"3-02"},{"c":"[4수02-02]","b":1,"s":3,"a":"변화와 관계","ak":"변화와관계","t":"계산식의 배열에서 규칙을 찾고, 계산 결과를 추측할 수 있다.","A":"계산식의 배열에서 규칙을 찾아 계산 결과를 추측하고, 추측한 계산 결과가 옳은지 확인하여 설명할 수 있다.","B":"계산식의 배열에서 규칙을 찾아 말하고, 계산 결과를 추측할 수 있다.","C":"간단한 계산식의 배열에서 이어질 계산 결과를 추측할 수 있다.","p":69,"sr":"3-02"},{"c":"[4수02-03]","b":1,"s":3,"a":"변화와 관계","ak":"변화와관계","t":"등호를 사용하여 크기가 같은 두 양의 관계를 식으로 나타낼 수 있다.","A":"등호를 사용하여 크기가 같은 두 양의 관계를 식으로 나타내고, 등호가 사용된 식이 옳은지를 설명할 수 있다.","B":"등호를 사용하여 크기가 같은 두 양의 관계를 식으로 나타낼 수 있다.","C":"안내된 절차에 따라 등호를 사용하여 크기가 같은 두 양의 관계를 식으로 나타낼 수 있다.","p":69,"sr":"3-02"},{"c":"[4수03-01]","b":1,"s":3,"a":"도형과 측정","ak":"도형과측정","t":"직선, 선분, 반직선을 이해하고 구별할 수 있다.","A":"직선, 선분, 반직선의 예를 제시하고, 그 차이를 설명할 수 있다.","B":"주어진 도형에서 직선, 선분, 반직선을 구별하고, 그 차이를 말할 수 있다.","C":"주어진 도형에서 직선, 선분, 반직선을 구별할 수 있다.","p":70,"sr":"3-03"},{"c":"[4수03-02]","b":1,"s":3,"a":"도형과 측정","ak":"도형과측정","t":"각과 직각을 이해하고, 직각과 비교하는 활동을 통하여 예각과 둔각을 구별할 수 있다.","A":"각, 직각의 예를 제시하고, 직각과 비교하여 예각과 둔각의 차이를 설명할 수 있다.","B":"주어진 도형에서 각과 직각을 찾고, 여러 가지 각을 직각, 예각, 둔각으로 분류할 수 있다.","C":"주어진 도형에서 각을 찾고, 직각이 있는 구체물을 이용하여 직각, 예각, 둔각을 찾을 수 있다.","p":70,"sr":"3-03"},{"c":"[4수03-03]","b":1,"s":3,"a":"도형과 측정","ak":"도형과측정","t":"직선의 수직 관계와 평행 관계를 이해한다.","A":"수직 관계인 두 직선이나 평행 관계인 두 직선을 그리고, 그 성질을 설명할 수 있다.","B":"수직과 평행의 의미를 알고, 주어진 그림에서 수직 관계 또는 평행 관계인 직선을 찾을 수 있다.","C":"안내된 절차에 따라 주어진 그림에서 한 직선에 수직 또는 평행인 직선을 찾을 수 있다.","p":70,"sr":"3-03"},{"c":"[4수03-04]","b":1,"s":3,"a":"도형과 측정","ak":"도형과측정","t":"구체물이나 평면도형의 밀기, 뒤집기, 돌리기 활동을 통하여 그 변화를 이해한다.","A":"구체물이나 평면도형의 밀기, 뒤집기, 돌리기를 한 결과를 예상하고, 위치나 방향의 변화를 설명할 수 있다.","B":"구체물이나 평면도형의 밀기, 뒤집기, 돌리기를 하고, 위치나 방향의 변화를 말할 수 있다.","C":"간단한 구체물이나 평면도형의 밀기, 뒤집기, 돌리기를 하고, 그 결과를 그림으로 나타낼 수 있다.","p":70,"sr":"3-03"},{"c":"[4수03-05]","b":1,"s":3,"a":"도형과 측정","ak":"도형과측정","t":"평면에서 점의 이동에 대해 위치와 방향을 이용하여 설명할 수 있다.","A":"평면에서 점을 이동하고, 그 결과를 위치와 방향의 용어(위, 아래, 오른쪽, 왼쪽, ~칸, ~cm 등)를 사용하여 여러 가지 방법으로 설명할 수 있다.","B":"평면에서 점의 이동을 위치와 방향의 용어(위, 아래, 오른쪽, 왼쪽, ~칸, ~cm 등)를 사용하여 말할 수 있다.","C":"안내된 절차에 따라 주어진 점을 위치와 방향에 맞게 이동할 수 있다.","p":70,"sr":"3-03"},{"c":"[4수03-06]","b":1,"s":3,"a":"도형과 측정","ak":"도형과측정","t":"원의 중심, 반지름, 지름을 이해하고, 그 성질을 안다.","A":"원의 중심, 반지름, 지름에 대한 이해를 바탕으로 원의 여러 가지 성질을 찾아 설명할 수 있다.","B":"원의 중심, 반지름, 지름을 이해하고, 이를 이용하여 원의 성질을 찾을 수 있다.","C":"주어진 원에서 원의 중심, 반지름, 지름을 찾을 수 있다.","p":71,"sr":"3-03"},{"c":"[4수03-07]","b":1,"s":3,"a":"도형과 측정","ak":"도형과측정","t":"컴퍼스를 이용하여 여러 가지 크기의 원을 그릴 수 있다.","A":"컴퍼스를 이용하여 여러 가지 크기의 원을 그리고, 원의 중심, 반지름, 지름을 이용하여 그 방법을 설명할 수 있다.","B":"컴퍼스를 이용하여 주어진 원과 크기가 같은 원을 그릴 수 있다.","C":"컴퍼스를 이용하여 원을 그릴 수 있다.","p":71,"sr":"3-03"},{"c":"[4수03-08]","b":1,"s":3,"a":"도형과 측정","ak":"도형과측정","t":"여러 가지 모양의 삼각형에 대한 분류 활동을 통하여 이등변삼각형, 정삼각형을 이해하고, 그 성질을 탐구하고 설명할 수 있다.","A":"여러 가지 삼각형을 분류하는 활동을 통하여 이등변삼각형과 정삼각형을 구분하고, 각각의 성질을 설명할 수 있다.","B":"주어진 삼각형에서 이등변삼각형과 정삼각형을 찾고, 각각의 성질을 말할 수 있다.","C":"구체적 조작 활동을 통하여 주어진 삼각형에서 이등변삼각형과 정삼각형을 찾을 수 있다.","p":71,"sr":"3-03"},{"c":"[4수03-09]","b":1,"s":3,"a":"도형과 측정","ak":"도형과측정","t":"여러 가지 모양의 삼각형에 대한 분류 활동을 통하여 직각삼각형, 예각삼각형, 둔각삼각형을 이해한다.","A":"여러 가지 삼각형을 분류하는 활동을 통하여 직각삼각형, 예각삼각형, 둔각삼각형을 구분하고, 그 차이를 설명할 수 있다.","B":"주어진 삼각형을 직각삼각형, 예각삼각형, 둔각삼각형으로 구분할 수 있다.","C":"구체적 조작 활동을 통하여 주어진 삼각형에서 직각삼각형, 예각삼각형, 둔각삼각형을 찾을 수 있다.","p":71,"sr":"3-03"},{"c":"[4수03-10]","b":1,"s":3,"a":"도형과 측정","ak":"도형과측정","t":"여러 가지 모양의 사각형에 대한 분류 활동을 통하여 직사각형, 정사각형, 사다리꼴, 평행사변형, 마름모를 이해하고, 그 성질을 탐구하고 설명할 수 있다.","A":"여러 가지 사각형을 분류하는 활동을 통하여 직사각형, 정사각형, 사다리꼴, 평행사변형, 마름모를 구분하고, 각각의 성질을 설명할 수 있다.","B":"주어진 사각형에서 직사각형, 정사각형, 사다리꼴, 평행사변형, 마름모를 찾고, 그 성질을 말할 수 있다.","C":"구체적 조작 활동을 통하여 주어진 사각형에서 직사각형, 정사각형, 사다리꼴, 평행사변형, 마름모를 찾을 수 있다.","p":72,"sr":"3-03"},{"c":"[4수03-11]","b":1,"s":3,"a":"도형과 측정","ak":"도형과측정","t":"다각형과 정다각형을 이해한다.","A":"다각형과 정다각형의 여러 가지 예를 제시하고, 각 도형의 공통점을 설명할 수 있다.","B":"주어진 도형에서 다각형과 정다각형을 찾고, 그 의미를 말할 수 있다.","C":"주어진 도형에서 다각형과 정다각형을 찾을 수 있다.","p":72,"sr":"3-03"},{"c":"[4수03-12]","b":1,"s":3,"a":"도형과 측정","ak":"도형과측정","t":"주어진 도형을 이용하여 여러 가지 모양을 만들거나 채우고 설명할 수 있다.","A":"주어진 도형을 이용하여 여러 가지 모양을 만들거나 채우고, 그 방법을 설명할 수 있다.","B":"주어진 도형을 이용하여 모양을 만들거나 채울 수 있다.","C":"안내된 절차에 따라 주어진 도형을 이용하여 일부가 제시된 모양의 전체를 완성할 수 있다.","p":72,"sr":"3-03"},{"c":"[4수03-13]","b":1,"s":3,"a":"도형과 측정","ak":"도형과측정","t":"1분과 1초의 관계를 이해하고, 초 단위까지 시각을 읽을 수 있다.","A":"1분과 1초의 관계를 이용하여 여러 가지 시각을 초 단위까지 읽으며, 시계에 나타낼 수 있다.","B":"1분이 60초임을 알고, 여러 가지 시각을 초 단위까지 읽을 수 있다.","C":"1분이 60초임을 알고, 안내된 절차에 따라 주어진 시각을 초 단위까지 읽을 수 있다.","p":72,"sr":"3-03"},{"c":"[4수03-14]","b":1,"s":3,"a":"도형과 측정","ak":"도형과측정","t":"실생활 문제 상황과 연결하여 초 단위까지의 시간의 덧셈과 뺄셈을 할 수 있다.","A":"실생활 문제 상황을 초 단위까지 시간의 덧셈과 뺄셈으로 나타내어 계산하고, 그 과정을 설명할 수 있다.","B":"실생활 문제 상황을 초 단위까지 시간의 덧셈과 뺄셈으로 나타내고, 그 계산을 할 수 있다.","C":"안내된 절차에 따라 초 단위까지의 간단한 시간의 덧셈과 뺄셈을 할 수 있다.","p":72,"sr":"3-03"},{"c":"[4수03-15]","b":1,"s":3,"a":"도형과 측정","ak":"도형과측정","t":"길이 단위 1mm와 1km를 알고, 이를 이용하여 길이를 측정하고 어림하며 수학의 유용성을 인식할 수 있다.","A":"1mm와 1km를 이용하여 여러 가지 길이를 측정하거나 어림하고, 실생활에서 이를 활용하는 예를 찾아 수학의 유용성을 설명할 수 있다.","B":"1mm와 1km를 이용하여 길이를 측정하거나 어림하고, 실생활에서 이를 활용하는 예에서 수학의 유용성을 인식한다.","C":"안내된 절차에 따라 1mm와 1km를 이용하여 길이를 측정할 수 있다.","p":73,"sr":"3-03"},{"c":"[4수03-16]","b":1,"s":3,"a":"도형과 측정","ak":"도형과측정","t":"1cm와 1mm, 1km와 1m의 관계를 이해하고, 길이를 ‘몇 cm 몇 mm’와 ‘몇 mm’, ‘몇 km 몇 m’와 ‘몇 m’로 다양하게 표현할 수 있다.","A":"길이를 여러 가지 방법으로 표현하고, 1cm와 1mm, 1km와 1m의 관계를 설명할 수 있다.","B":"주어진 길이를 ‘몇 cm 몇 mm’와 ‘몇 mm’, ‘몇 km 몇 m’와 ‘몇 m’로 표현할 수 있다.","C":"안내된 절차에 따라 ‘몇 cm’를 ‘몇 mm’로, ‘몇 km’를 ‘몇 m’로 표현할 수 있다.","p":73,"sr":"3-03"},{"c":"[4수03-17]","b":1,"s":3,"a":"도형과 측정","ak":"도형과측정","t":"들이 단위 1L와 1mL를 알고, 이를 이용하여 들이를 측정하고 어림하며 수학의 유용성을 인식할 수 있다.","A":"1L와 1mL를 이용하여 여러 가지 들이를 측정하거나 어림하고, 실생활에서 이를 활용하는 예를 찾아 수학의 유용성을 설명할 수 있다.","B":"1L와 1mL를 이용하여 들이를 측정하거나 어림하고, 실생활에서 이를 활용하는 예에서 수학의 유용성을 인식한다.","C":"안내된 절차에 따라 1L와 1mL를 이용하여 간단한 들이를 측정할 수 있다.","p":73,"sr":"3-03"},{"c":"[4수03-18]","b":1,"s":3,"a":"도형과 측정","ak":"도형과측정","t":"1L와 1mL의 관계를 이해하고, 들이를 ‘몇 L 몇 mL’와 ‘몇 mL’로 표현할 수 있다.","A":"들이를 ‘몇 L 몇 mL’ 또는 ‘몇 mL’로 표현하고, 1L와 1mL의 관계를 설명할 수 있다.","B":"주어진 들이를 ‘몇 L 몇 mL’와 ‘몇 mL’로 표현할 수 있다.","C":"안내된 절차에 따라 ‘몇 L’를 ‘몇 mL’로, ‘몇 mL’를 ‘몇 L’로 표현할 수 있다.","p":73,"sr":"3-03"},{"c":"[4수03-19]","b":1,"s":3,"a":"도형과 측정","ak":"도형과측정","t":"실생활 문제 상황과 연결하여 들이의 덧셈과 뺄셈을 할 수 있다.","A":"실생활 문제 상황을 들이의 덧셈과 뺄셈으로 나타내어 계산하고, 그 과정을 설명할 수 있다.","B":"실생활 문제 상황을 들이의 덧셈과 뺄셈으로 나타내고, 그 계산을 할 수 있다.","C":"안내된 절차에 따라 간단한 들이의 덧셈과 뺄셈을 할 수 있다.","p":73,"sr":"3-03"},{"c":"[4수03-20]","b":1,"s":3,"a":"도형과 측정","ak":"도형과측정","t":"실생활에서 무게를 나타낼 때 사용하는 단위 1g과 1kg을 알고, 이를 이용하여 무게를 측정하고 어림하며 수학의 유용성을 인식할 수 있다.","A":"1g과 1kg을 이용하여 여러 가지 무게를 측정하거나 어림하고, 실생활에서 1g과 1kg을 활용하는 예를 찾아 수학의 유용성을 설명할 수 있다.","B":"1g과 1kg을 이용하여 무게를 측정하거나 어림하고, 실생활에서 이를 활용하는 예를 찾아 수학의 유용성을 인식한다.","C":"안내된 절차에 따라 1g과 1kg을 이용하여 간단한 무게를 측정할 수 있다.","p":74,"sr":"3-03"},{"c":"[4수03-21]","b":1,"s":3,"a":"도형과 측정","ak":"도형과측정","t":"1kg과 1g의 관계를 이해하고, 무게를 ‘몇 kg 몇 g’과 ‘몇 g’으로 표현할 수 있다.","A":"무게를 ‘몇 kg 몇 g’ 또는 ‘몇 g’으로 표현하고, 1kg과 1g의 관계를 설명할 수 있다.","B":"주어진 무게를 ‘몇 kg 몇 g’과 ‘몇 g’으로 표현할 수 있다.","C":"안내된 절차에 따라 ‘몇 kg’을 ‘몇 g’으로, ‘몇 g’을 ‘몇 kg’으로 표현할 수 있다.","p":74,"sr":"3-03"},{"c":"[4수03-22]","b":1,"s":3,"a":"도형과 측정","ak":"도형과측정","t":"실생활에서 무게를 나타낼 때 사용하는 단위 1t을 알고, 1t과 1kg의 관계를 이해한다.","A":"실생활에서 t를 활용하는 예를 찾고, 1t과 1kg의 관계를 이용하여 다양한 무게를 표현할 수 있다.","B":"1t이 1000kg임을 이용하여 ‘몇 t’을 ‘몇 kg’으로, ‘몇 kg’을 ‘몇 t’으로 표현할 수 있다.","C":"안내된 절차에 따라 ‘몇 t’을 ‘몇 kg’으로, ‘몇 kg’을 ‘몇 t’으로 표현할 수 있다.","p":74,"sr":"3-03"},{"c":"[4수03-23]","b":1,"s":3,"a":"도형과 측정","ak":"도형과측정","t":"실생활 문제 상황과 연결하여 무게의 덧셈과 뺄셈을 할 수 있다.","A":"실생활 문제 상황을 무게의 덧셈과 뺄셈으로 나타내어 계산하고, 그 과정을 설명할 수 있다.","B":"실생활 문제 상황을 무게의 덧셈과 뺄셈으로 나타내고, 그 계산을 할 수 있다.","C":"안내된 절차에 따라 간단한 무게의 덧셈과 뺄셈을 할 수 있다.","p":74,"sr":"3-03"},{"c":"[4수03-24]","b":1,"s":3,"a":"도형과 측정","ak":"도형과측정","t":"각의 크기의 단위인 1도(°)를 알고, 각도기를 이용하여 각의 크기를 측정하고 어림할 수 있다.","A":"각도기를 이용하여 여러 가지 각의 크기를 측정하거나 어림하고, 그 방법을 설명할 수 있다.","B":"각의 크기의 단위인 1도(°)를 알고, 각도기를 이용하여 주어진 각의 크기를 측정하거나 어림할 수 있다.","C":"안내된 절차에 따라 각도기를 이용하여 간단한 각의 크기를 측정할 수 있다.","p":75,"sr":"3-03"},{"c":"[4수03-25]","b":1,"s":3,"a":"도형과 측정","ak":"도형과측정","t":"여러 가지 방법으로 삼각형과 사각형의 내각의 크기의 합을 추론하고, 자신의 추론 과정을 설명할 수 있다.","A":"삼각형과 사각형의 내각의 크기의 합을 여러 가지 방법으로 추론하고, 그 방법을 설명할 수 있다.","B":"구체물이나 그림을 이용하여 삼각형과 사각형의 내각의 크기의 합이 각각 180°, 360°임을 설명할 수 있다.","C":"삼각형과 사각형의 내각의 크기의 합이 각각 180°, 360°임을 말할 수 있다.","p":75,"sr":"3-03"},{"c":"[4수04-01]","b":1,"s":3,"a":"자료와 가능성","ak":"자료와가능성","t":"자료를 수집하여 그림그래프나 막대그래프로 나타내고 해석할 수 있다.","A":"실생활 자료를 수집하여 그림그래프나 막대그래프로 나타내고, 그래프를 해석할 수 있다.","B":"주어진 자료를 그림그래프나 막대그래프로 나타내고, 그래프에서 여러 가지 사실을 찾을 수 있다.","C":"안내된 절차에 따라 일부가 제시된 그림그래프나 막대그래프를 완성하고, 그래프에서 간단한 사실을 찾을 수 있다.","p":75,"sr":"3-04"},{"c":"[4수04-02]","b":1,"s":3,"a":"자료와 가능성","ak":"자료와가능성","t":"자료를 수집하여 꺾은선그래프로 나타내고 해석할 수 있다.","A":"실생활 자료를 수집하여 꺾은선그래프로 나타내고, 그래프를 해석할 수 있다.","B":"주어진 자료를 꺾은선그래프로 나타내고, 그래프에서 여러 가지 사실을 찾을 수 있다.","C":"안내된 절차에 따라 일부가 제시된 꺾은선그래프를 완성하고, 그래프에서 간단한 사실을 찾을 수 있다.","p":75,"sr":"3-04"},{"c":"[4수04-03]","b":1,"s":3,"a":"자료와 가능성","ak":"자료와가능성","t":"탐구 문제를 해결하기 위해 자료를 수집, 정리하여 막대그래프나 꺾은선그래프로 나타내고 해석할 수 있다.","A":"탐구 문제를 해결하기 위해 자료를 수집, 정리하여 막대그래프나 꺾은선그래프로 나타내고, 그 그래프를 해석할 수 있다.","B":"자료를 정리하여 막대그래프나 꺾은선그래프로 나타내고, 그래프에서 여러 가지 사실을 찾을 수 있다.","C":"안내된 절차에 따라 주어진 자료를 막대그래프나 꺾은선그래프로 나타내고, 그래프에서 간단한 사실을 찾을 수 있다.","p":75,"sr":"3-04"},{"c":"[4과01-01]","b":1,"s":4,"a":"힘과 우리 생활","ak":"힘과우리생활","t":"일상생활에서 힘과 관련된 현상에 흥미를 갖고, 물체를 밀거나 당길 때 나타나는 현상을 관찰할 수 있다.","A":"일상생활에서 힘과 관련된 현상에 흥미를 가지고, 무거운 물체와 가벼운 물체를 밀거나 당길 때 드는 힘의 크기를 비교하여 설명할 수 있다.","B":"물체를 밀거나 당길 때 나타나는 현상에 흥미를 가지고 이를 관찰할 수 있다.","C":"물체를 밀고 당기는 것과 같이 힘과 관련된 현상에 흥미를 가진다.","p":107,"q":["무거운 물체를 밀 때와 가벼운 물체를 밀 때의 특징 탐구하기"]},{"c":"[4과01-02]","b":1,"s":4,"a":"힘과 우리 생활","ak":"힘과우리생활","t":"수평잡기 활동을 통해 물체의 무게를 비교할 수 있다.","A":"수평잡기 활동을 통해 무게가 같거나 다른 여러 물체의 무게를 비교할 수 있다.","B":"수평잡기 활동에서 기울어지는 현상을 관찰하여 두 물체 중에서 무거운 물체를 찾을 수 있다.","C":"수평잡기 활동을 통해 물체의 무게가 서로 다름을 알 수 있다.","p":107},{"c":"[4과01-03]","b":1,"s":4,"a":"힘과 우리 생활","ak":"힘과우리생활","t":"무게를 정확히 비교하기 위해서는 저울이 필요함을 알고, 저울을 사용해 무게를 비교할 수 있다.","A":"저울의 필요성을 알고, 저울을 사용해 여러 가지 물체들의 무게를 비교할 수 있으며, 이 과정을 통해 과학의 유용성을 인식한다.","B":"저울의 필요성을 알고, 저울을 사용해 물체의 무게를 측정할 수 있다.","C":"일상생활에서 물체의 무게를 측정하기 위해 저울이 사용되고 있음을 말할 수 있다.","p":107,"note":"내용 체계표의 가치·태도 요소를 포함하여 성취수준 개발"},{"c":"[4과01-04]","b":1,"s":4,"a":"힘과 우리 생활","ak":"힘과우리생활","t":"지레, 빗면과 같은 도구를 이용하면 물체를 들어 올릴 때 드는 힘의 크기가 달라짐을 알고, 도구가 일상생활에서 어떻게 쓰이는지 조사하여 공유할 수 있다.","A":"지레, 빗면과 같은 도구를 이용하면 작은 힘으로 물체를 들 수 있음을 알고, 일상생활에서 도구가 사용되는 예를 조사하여 공유할 수 있으며, 이 과정을 통해 도구 사용의 과학적 유용성을 인식한다.","B":"지레, 빗면을 사용하면 작은 힘으로 물체를 들 수 있다는 사실을 알고, 도구가 사용되는 예를 조사할 수 있다.","C":"일상생활에서 물체를 들어 올릴 때 지레와 빗면과 같은 도구가 사용되고 있음을 말할 수 있다.","p":107,"note":"내용 체계표의 가치·태도 요소를 포함하여 성취수준 개발"},{"c":"[4과02-01]","b":1,"s":4,"a":"동물의 생활","ak":"동물의생활","t":"여러 가지 동물을 관찰하여 특징에 따라 동물을 분류할 수 있다.","A":"여러 가지 동물을 관찰하고 특징에 따라 분류 기준을 정하여 동물을 분류할 수 있다.","B":"여러 가지 동물을 관찰하여 공통된 특징과 구별되는 특징을 말할 수 있다.","C":"여러 가지 동물을 관찰하여 그 특징을 말할 수 있다.","p":108,"q":["동물 분류 기준 정하기"]},{"c":"[4과02-02]","b":1,"s":4,"a":"동물의 생활","ak":"동물의생활","t":"다양한 환경에 서식하는 동물을 조사하여 동물의 생김새와 생활 방식이 환경과 관련되어 있음을 설명할 수 있다.","A":"다양한 환경에 서식하는 동물을 조사하여 동물의 생김새와 생활 방식이 사는 환경과 어떻게 관련되어 있는지 설명할 수 있다.","B":"다양한 환경에 따라 동물의 생김새와 생활 방식이 다름을 발표할 수 있다.","C":"다양한 환경에 사는 동물의 생김새를 말할 수 있다.","p":108},{"c":"[4과02-03]","b":1,"s":4,"a":"동물의 생활","ak":"동물의생활","t":"동물의 특징을 이용하여 일상생활에서 활용할 수 있는 생활용품을 설계하여 협력적으로 소통할 수 있다.","A":"동물의 특징을 이용하여 일상생활에서 활용할 수 있는 생활용품을 독창적인 아이디어로 설계하고 협력적으로 소통할 수 있다.","B":"동물의 특징을 이용하여 일상생활에서 활용할 수 있는 생활용품을 설계하고 발표할 수 있다.","C":"동물의 특징을 이용하여 설계한 생활용품을 말할 수 있다.","p":108,"note":"내용 체계표의 가치·태도 요소를 포함하여 성취수준 개발"},{"c":"[4과03-01]","b":1,"s":4,"a":"식물의 생활","ak":"식물의생활","t":"여러 가지 식물을 관찰하여 특징에 따라 식물을 분류할 수 있다.","A":"여러 가지 식물을 관찰하고 특징에 따라 분류 기준을 정하여 식물을 분류할 수 있다.","B":"여러 가지 식물을 관찰하여 공통된 특징과 구별되는 특징을 말할 수 있다.","C":"여러 가지 식물을 관찰하여 그 특징을 말할 수 있다.","p":109,"q":["식물 분류 기준 정하기"]},{"c":"[4과03-02]","b":1,"s":4,"a":"식물의 생활","ak":"식물의생활","t":"다양한 환경에 서식하는 식물을 조사하여 식물의 생김새와 생활 방식이 환경과 관련되어 있음을 설명할 수 있다.","A":"다양한 환경에 서식하는 식물을 조사하여 식물의 생김새와 생활 방식이 서식하는 환경과 어떻게 관련
