 통일을 위해 우리가 할 수 있는 일을 조사하고, 민주화와 산업화로 인해 달라진 사람들의 생활 문화를 분석할 수 있다.","가치·태도":"평화 통일에 관심을 가지고, 이를 위해 노력하는 태도를 지닌다."},"C":{"지식·이해":"분단으로 인해 나타난 문제점과 평화 통일을 위한 노력을 알고 민주화와 산업화로 인해 사람들의 생활 모습이 달라졌음을 이해한다.","과정·기능":"분단으로 인해 나타난 문제점, 분단과 관련된 장소를 평화의 장소로 만들려는 노력, 평화 통일을 위해 우리가 할 수 있는 일을 탐색하고, 민주화와 산업화로 인해 달라진 사람들의 생활 문화를 찾을 수 있다.","가치·태도":"평화 통일에 관심을 가진다."}},"p":48},{"b":2,"s":2,"a":"사회·공동체와의 관계","ak":"사회공동체와의관계","n":"사회·공동체와의 관계","L":{"A":{"지식·이해":"사회 정의를 바탕으로 인권 및 공동체 규칙을 포괄적으로 이해하고, 인류 번영과 세계 평화를 위해 통일 및 인류의 문제를 다양한 맥락에서 이해한다.","과정·기능":"시민의 인간다운 삶을 위해 다양한 맥락에서 인권 관련 문제를 조사하고 공정한 규칙을 제안하며, 인류 번영과 세계 평화에 이바지하기 위해 통일 및 인류 관련 문제 해결 방법을 다각도로 탐구한다.","가치·태도":"생활 전반에서 사회 정의를 위해 인권 및 공동체 관련 문제 해결 의지를 기르고, 다양한 맥락에서 인류 번영과 세계 평화를 위해 통일을 추구하고 인류애를 가진다."},"B":{"지식·이해":"사회 정의를 바탕으로 인권 및 공동체 규칙을 이해하고, 인류 번영과 세계 평화를 위해 통일 및 인류의 문제를 이해한다.","과정·기능":"시민의 인간다운 삶을 위해 인권 관련 문제를 조사하고 공정한 규칙을 제안하며, 인류 번영과 세계 평화에 이바지하기 위해 통일 및 인류 관련 문제 해결 방법을 탐구한다.","가치·태도":"사회 정의를 위해 인권 및 공동체 관련 문제 해결 의지를 기르고, 인류 번영과 세계 평화를 위해 통일 및 인류애를 추구한다."},"C":{"지식·이해":"사회 정의를 바탕으로 인권 및 공동체 규칙을 부분적으로 이해하고, 인류 번영과 세계 평화를 위해 통일 및 인류의 문제를 제한적으로 이해한다.","과정·기능":"시민의 인간다운 삶을 위해 인권 관련 문제 및 공정한 규칙을 인식하고, 인류 번영과 세계 평화에 이바지하기 위해 통일 및 인류 관련 문제를 탐구하려고 노력한다.","가치·태도":"사회 정의를 위해 인권 및 공동체 관련 문제에 관심을 가지고, 인류 번영과 세계 평화를 위해 통일 및 인류애를 추구하려고 노력한다."}},"p":61},{"b":2,"s":2,"a":"자신과의 관계","ak":"자신과의관계","n":"자신과의 관계","L":{"A":{"지식·이해":"도덕적 삶을 위해 자주적인 삶이 필요한 이유와 도덕 공부와 진로 선택의 기초로서 자아에 대한 탐구와 성찰이 갖는 의미를 포괄적으로 이해한다.","과정·기능":"다양한 맥락에서 자신의 삶을 점검하여 자주적인 삶 및 자아에 대한 탐구와 성찰이 필요한 상황을 탐색한다.","가치·태도":"생활 전반에서 자아에 대한 탐구와 성찰을 통해 도덕적인 삶을 적극적으로 살아가려는 자세와 태도를 실천한다."},"B":{"지식·이해":"도덕적 삶을 위해 자주적인 삶이 필요한 이유와 도덕 공부와 진로 선택의 기초로서 자아에 대한 탐구와 성찰이 갖는 의미를 이해한다.","과정·기능":"자신의 삶을 점검하여 자주적인 삶 및 자아에 대한 탐구와 성찰이 필요한 상황을 탐색한다.","가치·태도":"자아에 대한 탐구와 성찰을 통해 도덕적인 삶을 살아가려는 자세와 태도를 실천한다."},"C":{"지식·이해":"도덕적 삶을 위해 자주적인 삶이 필요한 이유와 도덕 공부와 진로 선택의 기초로서 자아에 대한 탐구와 성찰이 갖는 의미를 부분적으로 이해한다.","과정·기능":"단순한 맥락에서 자신의 삶에서 자주적인 삶 및 자아에 대한 탐구와 성찰이 필요한 상황에 대해 탐색한다.","가치·태도":"자아에 대한 탐구와 성찰을 통해 도덕적인 삶을 살아가려는 자세와 태도에 관심을 가진다."}},"p":60},{"b":2,"s":2,"a":"자연과의 관계","ak":"자연과의관계","n":"자연과의 관계","L":{"A":{"지식·이해":"자연에 대한 윤리적 책임을 위해 환경 위기와 지속가능한 삶의 의미를 포괄적으로 이해한다.","과정·기능":"자연의 본래적 가치를 높이기 위해 환경 위기 및 지속가능한 미래 관련 실천 방안을 다양한 맥락에서 탐색한다.","가치·태도":"생태 전환을 위해 생활 전반에서 환경 위기를 극복하고 미래 세대를 위한 행동을 구체적으로 실천한다."},"B":{"지식·이해":"자연에 대한 윤리적 책임을 위해 환경 위기와 지속가능한 삶의 의미를 이해한다.","과정·기능":"자연의 본래적 가치를 높이기 위해 환경 위기 및 지속가능한 미래 관련 실천 방안을 탐색한다.","가치·태도":"생태 전환을 위해 환경 위기 극복하고 미래 세대를 위한 행동을 실천한다."},"C":{"지식·이해":"자연에 대한 윤리적 책임을 위해 환경 위기와 지속가능한 삶의 의미를 부분적으로 이해한다.","과정·기능":"자연의 본래적 가치를 높이기 위해 환경 위기 및 지속가능한 미래 관련 실천 방안을 탐색하고자 노력한다.","가치·태도":"생태 전환을 위해 환경 위기 극복하고 미래 세대를 위한 행동을 실천하고자 노력한다."}},"p":62},{"b":2,"s":2,"a":"타인과의 관계","ak":"타인과의관계","n":"타인과의관계","L":{"A":{"지식·이해":"타인과 더불어 사는 삶을 위해 타인을 적극적으로 돕고 다름을 존중해야 하는 이유에 대해 포괄적으로 이해한다.","과정·기능":"타인과 더불어 사는 과정에서 발생하는 갈등 해결 방안을 다양한 맥락에서 탐색한다.","가치·태도":"생활 전반에서 배려와 차이의 존중을 통해 타인과 더불어 사는 삶을 지향한다."},"B":{"지식·이해":"타인과 더불어 사는 삶을 위해 타인을 돕고 다름을 존중해야 하는 이유에 대해 이해한다.","과정·기능":"타인과 더불어 사는 과정에서 발생하는 갈등 해결 방안을 탐색한다.","가치·태도":"배려와 차이의 존중을 통해 타인과 더불어 사는 삶을 지향한다."},"C":{"지식·이해":"타인과 더불어 사는 삶을 위해 타인을 돕고 다름을 존중해야 하는 이유에 대해 부분적으로 이해한다.","과정·기능":"타인과 더불어 사는 과정에서 발생하는 갈등 해결 방안 탐색이 필요한 상황에 대해 인식한다.","가치·태도":"배려와 차이의 존중을 통해 타인과 더불어 사는 삶에 관심을 갖고자 노력한다."}},"p":60},{"b":2,"s":3,"a":"도형과 측정","ak":"도형과측정","n":"도형과 측정","L":{"A":{"지식·이해":"도형의 합동의 의미와 합동인 도형의 성질, 선대칭도형과 점대칭도형과 그 성질 등을 종합적으로 이해한다. 직육면체와 정육면체, 각기둥과 각뿔, 원기둥, 원뿔, 구를 알고, 각각의 구성 요소와 성질을 종합적으로 이해한다. 쌓기나무의 개수를 구하는 여러 가지 방법과 입체도형의 위, 앞, 옆에서 본 모양의 표현을 이해하고, 이를 문제해결에 능숙하게 적용할 수 있다. 평면도형의 둘레와 넓이, 입체도형의 겉넓이와 부피를 구하는 방법, 각각의 측정 단위와 단위 사이의 관계 등을 종합적으로 이해한다.","과정·기능":"도형의 합동, 선대칭도형, 점대칭도형에 대한 이해를 바탕으로 합동인 도형, 선대칭도형, 점대칭도형의 성질을 탐구하거나 도형을 그리며, 이를 적용하여 문제를 능숙하게 해결할 수 있다. 직육면체와 정육면체, 각기둥과 각뿔, 원기둥, 원뿔, 구에 대한 이해를 바탕으로 각 도형의 여러 가지 성질을 설명할 수 있으며, 겨냥도와 전개도를 능숙하게 그리고, 그 방법을 설명할 수 있다. 입체도형을 만드는 데 사용된 쌓기나무의 개수를 여러 가지 방법으로 구할 수 있고, 입체도형의 위, 앞, 옆에서 본 모양을 정확하게 표현하며, 이러한 표현을 보고 입체도형의 모양을 추론하여 설명할 수 있다. 적절한 측정 단위를 사용하여 평면도형의 둘레와 넓이, 입체도형의 겉넓이와 부피를 구하고, 그 방법을 설명할 수 있다.","가치·태도":"실생활에서 합동인 도형, 선대칭도형, 점대칭도형의 예를 찾는 과정에서 수학의 아름다움을 느끼고, 여러 가지 입체도형을 학습하는 데 흥미와 관심을 가진다. 넓이 단위와 부피 단위의 필요성과 넓이와 부피를 구하는 방법의 편리함을 인식한다. 도형과 측정 영역의 다양한 문제해결에 적극적으로 참여하고, 자신의 문제해결 과정을 논리적으로 설명하며, 친구의 문제해결 과정에 대해 비판적으로 사고하는 태도를 지닌다."},"B":{"지식·이해":"도형의 합동, 선대칭도형, 점대칭도형을 이해한다. 직육면체와 정육면체, 각기둥과 각뿔, 원기둥, 원뿔, 구를 알고, 각각의 구성 요소와 성질을 이해한다. 쌓기나무의 개수를 구하는 방법과 입체도형의 위, 앞, 옆에서 본 모양의 표현을 이해하고, 이를 문제해결에 적용할 수 있다. 평면도형의 둘레와 넓이, 입체도형의 겉넓이와 부피를 구하는 방법을 이해하고, 각각의 측정 단위와 단위 사이의 관계를 안다.","과정·기능":"도형의 합동, 선대칭도형, 점대칭도형에 대한 이해를 바탕으로 합동인 도형, 선대칭도형, 점대칭도형을 그리고, 문제를 해결할 수 있다. 직육면체와 정육면체, 각기둥과 각뿔, 원기둥, 원뿔, 구에 대한 이해를 바탕으로 여러 가지 도형을 구분하고, 각각의 구성 요소를 찾을 수 있다. 직육면체와 정육면체, 각기둥과 원기둥의 겨냥도와 전개도를 그릴 수 있다. 사용된 쌓기나무의 개수를 구할 수 있으며, 입체도형의 위, 앞, 옆에서 본 모양을 표현하고, 이러한 표현을 보고 입체도형의 모양을 추측할 수 있다. 적절한 측정 단위를 사용하여 평면도형의 둘레와 넓이, 입체도형의 겉넓이와 부피를 구할 수 있다.","가치·태도":"실생활에서 합동인 도형, 선대칭도형, 점대칭도형의 예를 찾는 활동을 통하여 수학의 아름다움을 느끼고, 입체도형을 학습하는 데 관심을 가진다. 넓이"},"C":{"지식·이해":"구체적 조작 활동을 통하여 도형의 합동, 선대칭도형, 점대칭도형을 직관적으로 이해한다. 직육면체와 정육면체, 각기둥과 각뿔, 원기둥, 원뿔, 구를 알고, 각각의 기본적인 구성 요소를 이해한다. 안내된 절차에 따라 사용된 쌓기나무의 개수를 구하는 방법과 입체도형의 위, 앞, 옆에서 본 모양의 표현을 이해하고, 평면도형의 둘레와 넓이, 입체도형의 겉넓이와 부피를 구하는 방법을 이해한다.","과정·기능":"구체적 조작 활동을 통하여 도형의 합동, 선대칭도형, 점대칭도형을 찾고, 직육면체와 정육면체, 각기둥과 각뿔, 원기둥, 원뿔, 구를 구분하며, 각각의 기본적인 구성 요소를 찾을 수 있다. 안내된 절차에 따라 일부가 주어진 직육면체와 정육면체의 겨냥도와 전개도, 각기둥과 원기둥의 전개도를 완성할 수 있다. 안내된 절차에 따라 사용된 쌓기나무의 개수를 구하고, 입체도형의 위, 앞, 옆에서 본 모양을 표현할 수 있으며, 기본적인 평면도형의 둘레와 넓이, 입체도형의 겉넓이와 부피를 구할 수 있다.","가치·태도":"도형의 합동, 선대칭도형과 점대칭도형, 입체도형을 학습하는 데 관심을 가진다. 실생활에서 넓이와 부피 단위, 넓이와 부피를 구하는 방법이 활용됨을 안다. 도형과 측정 영역의 문제를 해결하고, 자신의 문제해결 과정을 설명하려고 노력한다."}},"p":82},{"b":2,"s":3,"a":"변화와 관계","ak":"변화와관계","n":"변화와 관계","L":{"A":{"지식·이해":"대응 관계를 나타낸 표에서 규칙을 찾아 □, △ 등을 사용하여 식으로 나타내는 방법을 종합적으로 이해한다. 비가 적용되는 간단한 상황에서 비와 비율의 의미와 표현 방법, 비례식과 비례배분의 의미를 종합적으로 이해하고, 이를 실생활 문제해결에 능숙하게 적용할 수 있다.","과정·기능":"대응 관계를 나타낸 표에서 규칙을 찾아 □, △ 등을 사용하여 식으로 나타내고, 그 방법을 설명할 수 있다. 비와 비율, 비례식, 비례배분에 대한 이해를 바탕으로 비가 적용되는 간단한 상황에서 주어진 양을 비와 비율, 비례식으로 나타내거나 비례배분 하여 문제를 해결하고, 그 방법을 설명할 수 있다.","가치·태도":"대응 관계를 식으로 나타내어 수학적 표현의 편리함을 알고, 실생활이나 타 교과 상황에서 비와 비율, 비례식, 비례배분의 유용성을 인식한다. 변화와 관계 영역의 다양한 문제해결에 적극적으로 참여하고, 자신의 문제해결 과정을 논리적으로 설명하며, 친구의 문제해결 과정에 대해 비판적으로 사고하는 태도를 지닌다."},"B":{"지식·이해":"대응 관계를 나타낸 표에서 규칙을 찾아 □, △ 등을 사용하여 식으로 나타내는 방법을 이해한다. 비와 비율, 비례식, 비례배분의 의미와 표현 방법을 이해하고, 이를 문제해결에 적용할 수 있다.","과정·기능":"대응 관계를 나타낸 표에서 규칙을 찾아 □, △ 등을 사용하여 식으로 나타낼 수 있다. 주어진 양을 비와 비율, 비례식으로 나타내거나 비례배분 하여 간단한 문제를 해결할 수 있다.","가치·태도":"실생활 문제를 해결하는 데 대응 관계, 비와 비율, 비례식, 비례배분이 활용됨을 안다. 변화와 관계 영역의 문제해결에 흥미와 관심을 가지고 참여하며, 자신의 문제해결 과정을 친구의 문제해결 과정과 비교하려는 태도를 지닌다."},"C":{"지식·이해":"안내된 절차에 따라 대응 관계를 나타낸 표에서 규칙을 찾아 □, △ 등을 사용하여 식으로 나타내는 방법을 이해한다. 비와 비율, 비례식, 비례배분을 부분적으로 이해한다.","과정·기능":"대응 관계를 나타낸 표에서 규칙을 찾아 □, △ 등을 사용하여 말할 수 있다. 안내된 절차에 따라 비와 비율, 비례식, 비례배분에 대한 간단한 문제를 해결할 수 있다.","가치·태도":"실생활에서 대응 관계, 비와 비율, 비례식, 비례배분이 활용됨을 알고, 변화와 관계 영역의 문제를 해결하고, 자신의 문제해결 과정을 설명하려고 노력한다."}},"p":81},{"b":2,"s":3,"a":"수와 연산","ak":"수와연산","n":"수와 연산","L":{"A":{"지식·이해":"수의 범위와 올림, 버림, 반올림의 의미, 약수와 배수의 의미와 구하는 방법, 분수와 소수의 관계를 종합적으로 이해한다. 자연수의 혼합 계산, 분수의 사칙계산, 소수의 곱셈과 나눗셈의 계산 원리를 종합적으로 이해하고, 이를 계산 과정에 능숙하게 적용할 수 있다.","과정·기능":"수의 범위와 올림, 버림, 반올림, 약수와 배수, 분수와 소수의 관계에 대한 이해를 바탕으로 이상, 이하, 초과, 미만을 사용하여 수의 범위를 나타내고, 여러 가지 수를 어림값으로 나타내며, 분수를 소수로, 소수를 분수로 나타내고, 이를 활용하여 실생활 문제를 능숙하게 해결할 수 있다. 자연수의 혼합 계산, 분수의 사칙계산, 소수의 곱셈과 나눗셈을 여러 가지 방법으로 계산하고, 그 계산 원리를 설명할 수 있다.","가치·태도":"수의 범위와 올림, 버림, 반올림의 필요성과 유용성을 인식하고, 약수와 배수, 분수와 소수의 관계에서 수학적 표현의 편리함을 인식하며, 실생활 문제를 해결하는 데 자연수의 혼합 계산, 분수의 사칙계산, 소수의 곱셈과 나눗셈이 유용하게 활용됨을 안다. 수와 연산 영역의 다양한 문제해결에 적극적으로 참여하고, 자신의 문제해결 과정을 논리적으로 설명하며, 친구의 문제해결 과정에 대해 비판적으로 사고하는 태도를 지닌다."},"B":{"지식·이해":"수의 범위와 올림, 버림, 반올림, 약수와 배수, 분수와 소수의 관계를 이해한다. 자연수의 혼합 계산, 분수의 사칙계산, 소수의 곱셈과 나눗셈의 계산 원리를 이해하고, 이를 계산 과정에 적용할 수 있다.","과정·기능":"수의 범위와 올림, 버림, 반올림, 약수와 배수, 분수와 소수의 관계에 대한 이해를 바탕으로 이상, 이하, 초과, 미만을 사용하여 수의 범위를 나타내고, 여러 가지 수를 어림값으로 나타내며, 분수를 소수로, 소수를 분수로 나타낼 수 있다. 자연수의 혼합 계산, 분수의 사칙계산, 소수의 곱셈과 나눗셈의 계산 원리에 대한 이해를 바탕으로 그 계산을 할 수 있다.","가치·태도":"수의 범위와 올림, 버림, 반올림의 필요성을 인식하고, 약수와 배수, 분수와 소수의 관계에 관심을 가지며, 실생활 문제를 해결하는 데 자연수의 혼합 계산, 분수의 사칙계산, 소수의 곱셈과 나눗셈이 활용됨을 안다. 수와 연산 영역의 문제해결에 흥미와 관심을 가지고 참여하며, 자신의 문제해결 과정을 친구의 문제해결 과정과 비교하려는 태도를 지닌다."},"C":{"지식·이해":"안내된 절차나 구체적 조작 활동을 통하여 수의 범위와 올림, 버림, 반올림, 약수와 배수, 분수와 소수의 관계를 이해한다. 안내된 절차에 따라 자연수의 혼합 계산, 분수의 사칙계산, 소수의 곱셈과 나눗셈의 기초적인 계산 원리를 이해한다.","과정·기능":"안내된 절차나 구체적 조작 활동을 통하여 이상, 이하, 초과, 미만을 사용하여 간단한 수의 범위를 나타내고, 올림, 버림, 반올림을 사용하여 수를 어림값으로 나타내며, 간단한 분수를 소수로, 간단한 소수를 분수로 나타낼 수 있다. 안내된 절차에 따라 자연수의 혼합 계산, 분수의 사칙계산, 소수의 곱셈과 나눗셈의 간단한 계산을 할 수 있다.","가치·태도":"수의 범위와 올림, 버림, 반올림, 약수와 배수, 분수와 소수의 관계에 관심을 가지고, 실생활에서 자연수의 혼합 계산, 분수의 사칙계산, 소수의 곱셈과 나눗셈이 활용됨을 안다. 수와 연산 영역의 문제를 해결하고, 자신의 문제해결 과정을 설명하려고 노력한다."}},"p":80},{"b":2,"s":3,"a":"자료와 가능성","ak":"자료와가능성","n":"자료와 가능성","L":{"A":{"지식·이해":"평균의 의미와 평균을 구하는 방법을 종합적으로 이해한다. 자료를 수집하여 띠그래프와 원그래프로 나타내고 해석하는 일련의 과정을 알고, 이를 탐구 문제를 해결하는 데 능숙하게 적용할 수 있다. 실생활에서 사건이 일어날 가능성을 말이나 수로 표현하는 방법을 안다.","과정·기능":"평균에 대한 이해를 바탕으로 여러 집단의 자료를 수집하여 평균을 구하고 비교할 수 있다. 자료를 띠그래프나 원그래프로 나타낼 수 있고, 탐구 문제를 설정한 후 자료를 수집, 정리하여 적절한 그래프로 나타내며, 그래프를 해석할 수 있다. 실생활에서 여러 가지 사건이 일어날 가능성을 말과 수로 능숙하게 표현하고, 자료를 보고 가능성을 예상하고 비교하여 적절한 판단을 내릴 수 있다.","가치·태도":"실생활에서 평균과 비율그래프의 유용성과 편리함을 인식한다. 통계적 문제해결의 가치를 알고, 실생활에서 가능성에 근거하여 판단하는 태도를 보인다. 자료와 가능성 영역의 다양한 문제해결에 적극적으로 참여하고, 자신의 문제해결 과정을 논리적으로 설명하며, 친구의 문제해결 과정에 대해 비판적으로 사고하는 태도를 지닌다."},"B":{"지식·이해":"평균의 의미와 평균을 구하는 방법을 이해한다. 주어진 자료를 띠그래프나 원그래프로 나타내고 해석하는 방법을 알고, 이를 탐구 문제를 해결하는 데 적용할 수 있다. 사건이 일어날 가능성을 말이나 수로 표현하는 방법을 안다.","과정·기능":"평균에 대한 이해를 바탕으로 자료를 수집하여 평균을 구하고, 해석할 수 있다. 주어진 자료를 띠그래프나 원그래프로 나타낼 수 있고, 탐구 문제에 맞는 자료를 수집, 정리하여 적절한 그래프로 나타내고, 그래프를 해석할 수 있다. 사건이 일어날 가능성을 말과 수로 표현하여 비교할 수 있으며, 자료를 보고 가능성을 예상할 수 있다.","가치·태도":"실생활에서 평균과 비율그래프가 활용됨을 알고, 통계적 문제해결의 필요성을 인식한다. 자료와 가능성 영역의 문제해결에 흥미와 관심을 가지고 참여하고, 자신의 문제해결 과정과 친구의 문제해결 과정을 비교하려는 태도를 지닌다."},"C":{"지식·이해":"주어진 자료의 평균을 구하는 방법을 안다. 안내된 절차에 따라 자료를 띠그래프나 원그래프로 나타내고 해석하는 방법을 알고, 사건이 일어날 가능성을 말이나 수로 표현하는 방법을 안다.","과정·기능":"간단한 자료의 평균을 구할 수 있다. 안내된 절차에 따라 주어진 자료를 띠그래프나 원그래프로 나타내거나 자료에 적절한 그래프를 선택하여 나타낼 수 있고, 그래프에서 간단한 사실을 찾을 수 있다. 안내된 절차에 따라 주어진 사건이 일어날 가능성을 말과 수로 표현하고, 자료를 보고 가능성을 예상할 수 있다.","가치·태도":"실생활에서 평균과 비율그래프, 통계적 문제해결이 활용됨을 알고, 자료와 가능성 영역의 문제를 해결하고, 자신의 문제해결 과정을 설명하려고 노력한다."}},"p":84},{"b":2,"s":4,"a":"계절의 변화","ak":"계절의변화","n":"계절의 변화","L":{"A":{"지식·이해":"태양 고도를 알고 하루 동안 태양 고도, 그림자 길이, 기온의 관계와 계절에 따른 태양의 남중 고도, 낮의 길이 사이의 관계를 이해하며, 계절 변화의 원인을 지구의 자전축 기울기와 공전으로 설명할 수 있다.","과정·기능":"하루 동안 태양 고도, 그림자 길이, 기온을 측정하고, 디지털 자료를 활용하여 계절별 태양의 남중 고도, 낮의 길이를 조사하며 이들 사이의 관계를 추론할 수 있다.","가치·태도":"계절의 변화에 호기심을 가지고, 태양 고도 측정기를 만들어 과학적으로 문제를 해결하려는 자세를 가진다."},"B":{"지식·이해":"하루 동안 태양 고도, 그림자 길이, 기온의 변화를 이해하고, 계절별 태양의 남중 고도와 낮의 길이의 관계를 설명하며, 지구 공전과 자전축의 기울기가 계절 변화와 관련이 있음을 말할 수 있다.","과정·기능":"하루 동안 태양 고도, 그림자 길이, 기온을 측정하고, 디지털 자료를 활용하여 계절별 태양의 남중 고도, 낮의 길이를 조사하여 비교할 수 있다.","가치·태도":"계절의 변화에 호기심을 가지고, 태양 고도 측정기를 만들 수 있다."},"C":{"지식·이해":"하루 동안 태양 고도, 그림자 길이, 기온이 달라진다는 것과 계절별로 태양의 남중 고도 및 낮의 길이가 달라진다는 것을 이해하며, 지구 공전이 계절 변화와 관련이 있다는 것을 말할 수 있다.","과정·기능":"하루 동안 태양 고도, 그림자 길이, 기온을 측정하고, 디지털 자료를 활용하여 계절별 태양의 남중 고도, 낮의 길이를 조사할 수 있다.","가치·태도":"계절의 변화에 호기심을 가진다."}},"p":142},{"b":2,"s":4,"a":"과학과 나의 진로","ak":"과학과나의진로","n":"과학과 나의 진로","L":{"A":{"지식·이해":"미래 사회의 문제를 해결하는 데 과학이 기여하는 방법을 말하고, 다양한 진로와 과학의 관련성에 대한 이해를 바탕으로 나의 진로와 과학과의 관련성을 설명할 수 있다.","과정·기능":"미래 사회의 문제를 해결하는 데 과학이 기여하는 방법과 과학이 가지는 한계점을 토의하고, 다양한 진로와 과학의 관련성을 조사할 수 있다.","가치·태도":"과학의 유용성과 가치를 인식하고, 과학과 관련지어 자신의 진로를 탐색하는 활동을 적극적으로 실천하려는 태도를 가진다."},"B":{"지식·이해":"미래 사회의 문제를 해결하는 데 과학이 기여할 수 있는 방법을 말하고, 다양한 진로와 과학의 관련성을 설명할 수 있다.","과정·기능":"미래 사회의 문제를 해결하는 데 과학이 기여하는 방법을 토의하고, 다양한 진로와 과학의 관련성을 조사할 수 있다.","가치·태도":"과학의 유용성을 인식하고, 과학과 관련지어 진로를 탐색하는 활동에 흥미를 가진다."},"C":{"지식·이해":"미래 사회에 일어날 수 있는 문제와 다양한 진로가 과학과 관련되어 있음을 말할 수 있다.","과정·기능":"미래 사회에 일어날 수 있는 문제를 토의하고, 진로에 영향을 주는 과학적 요소를 찾을 수 있다.","가치·태도":"미래 사회의 문제 해결과 자신의 진로 탐색에 과학이 유용함을 인식한다."}},"p":145},{"b":2,"s":4,"a":"날씨와 우리 생활","ak":"날씨와우리생활","n":"날씨와 우리 생활","L":{"A":{"지식·이해":"기온, 바람, 습도, 구름의 양, 강수량 등의 기상 요소에 대해 이해하고, 날씨가 우리 생활에 주는 영향을 설명할 수 있다. 이슬, 안개, 구름의 공통점과 차이점을 이해하고, 고기압과 저기압에서 나타나는 날씨의 특징을 설명할 수 있다.","과정·기능":"기온, 바람, 습도, 구름의 양, 강수량 등의 기상 요소를 조사하고, 이슬, 안개, 구름을 관찰할 수 있다. 바람 발생에 대한 모형실험을 통해 고기압에서 저기압으로 부는 바람의 방향을 설명할 수 있다.","가치·태도":"날씨에 대해 호기심을 가지고, 일상생활에서 기온 및 강수량과 같은 기상 요소의 유용함을 인식한다."},"B":{"지식·이해":"기온, 바람, 습도, 구름의 양, 강수량 등의 기상 요소에 대해 이해하고, 이슬, 안개, 구름의 공통점과 차이점을 설명할 수 있다. 바람이 고기압에서 저기압으로 분다는 것을 말할 수 있다.","과정·기능":"기온, 바람, 습도, 구름의 양, 강수량 등의 기상 요소를 조사하고, 이슬, 안개, 구름을 관찰하며, 바람 발생에 대한 모형실험을 할 수 있다.","가치·태도":"일상생활에서 사용되는 기상 요소에 관심을 가진다."},"C":{"지식·이해":"날씨가 우리 생활에 주는 영향에 대해 인식하고, 이슬, 안개, 구름을 구별하며, 고기압과 저기압의 의미를 말할 수 있다.","과정·기능":"날씨가 우리 생활에 주는 영향을 조사하고, 이슬, 안개, 구름을 관찰할 수 있다.","가치·태도":"날씨에 대해 호기심을 가진다."}},"p":135},{"b":2,"s":4,"a":"물질의 연소","ak":"물질의연소","n":"물질의 연소","L":{"A":{"지식·이해":"물질의 성질이 달라지는 변화와 달라지지 않는 변화가 있음을 설명할 수 있다. 여러 연소 사례를 통해 연소에 필요한 조건을 말하고, 연소 과정에서 물질의 성질이 달라짐을 설명할 수 있다.","과정·기능":"서로 다른 물질을 섞기 전과 후의 성질 변화를 비교하여 기술하고, 연소의 공통적인 현상과 연소에 필요한 조건을 찾아낼 수 있다. 연소 실험을 수행하여 연소 생성물을 관찰하고, 연소 전과 후의 물질을 비교할 수 있다. 연소 생성물로 인한 생태계의 피해 사례를 수집하고 분석하여 해결책을 제안하고 공유할 수 있다.","가치·태도":"연소 현상에 관심을 가지고, 연소 생성물로 인한 생태계 피해의 심각성을 느끼며, 문제 해결을 위해 노력하려는 태도를 가진다."},"B":{"지식·이해":"서로 다른 물질을 섞을 때 물질의 성질이 달라지는 변화가 있음을 설명하고, 연소의 의미와 연소 과정에서 생성되는 물질을 말할 수 있다.","과정·기능":"서로 다른 물질을 섞은 후 나타나는 변화를 관찰하여 기술할 수 있다. 연소 실험을 수행하여 연소 생성물을 확인하고, 연소 전과 후의 물질을 비교할 수 있다. 연소 생성물로 인한 생태계의 피해 사례를 수집하고 분석할 수 있다.","가치·태도":"연소 현상에 관심을 가지고, 연소 생성물로 인한 생태계 피해 사례를 통해 문제의 심각성에 공감한다."},"C":{"지식·이해":"서로 다른 물질을 섞었을 때 물질의 성질이 달라질 수 있음을 알고, 연소 과정에서 생성된 물질이 있음을 말할 수 있다.","과정·기능":"서로 다른 물질을 섞은 후 나타나는 변화와 연소 현상을 관찰할 수 있다.","가치·태도":"연소 현상과 연소 생성물로 인한 생태계 피해 사례에 관심을 가진다."}},"p":143},{"b":2,"s":4,"a":"물체의 운동","ak":"물체의운동","n":"물체의 운동","L":{"A":{"지식·이해":"운동하는 물체는 시간에 따라 위치가 변한다는 특징을 이해하고, 물체의 빠르기를 속력으로 표현하며, 교통 규칙을 속력과 관련하여 설명할 수 있다.","과정·기능":"운동하는 물체의 공통적인 특징을 탐구하고, 물체의 이동 거리와 걸린 시간을 측정하여 물체의 속력을 구해 빠르기를 비교하며, 속력과 관련된 안전 수칙 및 안전장치에 대해 조사한 결과를 공유할 수 있다.","가치·태도":"속력과 관련된 안전 수칙과 안전장치를 조사한 내용을 바탕으로 일상생활에서 교통안전을 실천한다."},"B":{"지식·이해":"물체의 이동 거리와 걸린 시간으로 속력을 구함을 알고, 속력과 관련된 교통안전 수칙을 말할 수 있다.","과정·기능":"물체가 일정한 시간 동안 이동한 거리를 측정하여 물체의 속력을 비교하고, 속력과 관련된 안전 수칙과 안전장치를 조사할 수 있다.","가치·태도":"일상생활에서 속력과 관련된 안전 수칙과 안전장치에 관심을 가지고, 안전 수칙을 지키기 위한 태도를 가진다."},"C":{"지식·이해":"운동하는 물체의 위치는 변한다는 사실을 말하며, 일상생활에서의 교통안전 수칙을 말할 수 있다.","과정·기능":"운동하는 물체의 이동 거리와 걸린 시간을 측정하고, 일상생활에서 속력과 관련된 안전 수칙과 안전장치를 찾을 수 있다.","가치·태도":"일상생활에서 속력과 관련된 안전 수칙에 관심을 가지고, 교통안전에 대한 필요성을 인식한다."}},"p":139},{"b":2,"s":4,"a":"빛의 성질","ak":"빛의성질","n":"빛의 성질","L":{"A":{"지식·이해":"물체를 보는 데에 빛이 필요함을 알고, 빛이 직진, 반사, 굴절하여 나아감을 구분하여 설명하며, 거울과 렌즈의 쓰임새를 빛의 직진, 반사, 굴절과 연관 지어 설명할 수 있다.","과정·기능":"어둠상자 실험을 이용해 물체를 보는 데에 빛이 필요함을 이끌어 내고, 빛과 관련된 현상에서 빛의 직진, 반사, 굴절을 추리할 수 있다. 일상생활에서 쓰이는 거울과 렌즈를 조사하고, 이를 이용한 장치를 만들 수 있다.","가치·태도":"빛의 직진, 반사, 굴절과 같은 빛의 성질에 흥미를 가지고, 그 원리를 탐구하려는 태도를 가진다."},"B":{"지식·이해":"물체를 보는 데에 빛이 있어야 함을 알고, 공기 중이나 평면거울, 렌즈에서 빛이 나아가는 성질을 빛의 직진, 반사, 굴절로 설명할 수 있다.","과정·기능":"어둠상자 실험에서 물체에 빛을 비추는 경우와 비추지 않는 경우에 나타나는 현상을 비교하고, 공기 중이나 평면거울, 렌즈에서 빛이 나아가는 모습을 관찰하며, 거울과 렌즈의 쓰임새를 조사하여 거울과 렌즈로 인해 생활이 편리해진 점을 말할 수 있다.","가치·태도":"빛이 주는 이로운 점과 여러 가지 빛의 성질에 대해 흥미를 가진다."},"C":{"지식·이해":"빛이 없는 곳에서는 물체를 볼 수 없음을 알고, 빛이 공기 중이나 평면거울, 렌즈에서 나아가는 모습이 다르다는 사실을 알 수 있다.","과정·기능":"어둠상자 속의 물체에 빛을 비추는 활동을 수행하고, 공기 중이나 평면거울, 렌즈에서 빛이 나아가는 모습을 관찰하며, 일상생활에서 거울과 렌즈가 쓰이는 예를 찾을 수 있다.","가치·태도":"우리 주위의 빛과 관련된 현상에 흥미를 가진다."}},"p":131},{"b":2,"s":4,"a":"산과 염기","ak":"산과염기","n":"산과 염기","L":{"A":{"지식·이해":"산성 용액과 염기성 용액의 성질과 산성 용액과 염기성 용액을 섞을 때 나타나는 용액의 성질 변화를 설명할 수 있다. 일상생활에서의 산성 용액과 염기성 용액의 이용 사례를 말할 수 있다.","과정·기능":"지시약을 이용하여 산성 용액과 염기성 용액으로 분류하고, 산성 용액과 염기성 용액을 섞었을 때 나타나는 용액의 성질 변화를 추론할 수 있다. 산성화로 인한 환경의 피해 사례를 소개하는 자료를 만들어 공유할 수 있다.","가치·태도":"산성화로 인한 환경 피해의 심각성을 인식하고, 적극적인 자세로 문제 해결을 위해 노력한다."},"B":{"지식·이해":"산성 용액과 염기성 용액의 성질과 일상생활에서의 이용 사례를 말할 수 있다.","과정·기능":"지시약을 이용하여 같은 성질을 지닌 용액을 구분하고, 산성 용액과 염기성 용액을 섞었을 때 나타나는 현상을 관찰하여 기술할 수 있다. 산성화로 인한 환경의 피해 사례를 조사할 수 있다.","가치·태도":"산성화로 인한 환경 피해 사례를 조사하여 환경 문제의 심각성에 관심을 가진다."},"C":{"지식·이해":"산성 용액과 염기성 용액의 성질을 말하고, 산성화로 인한 환경 피해를 설명할 수 있다.","과정·기능":"산성 용액과 염기성 용액의 성질을 관찰하여 기술할 수 있다.","가치·태도":"산성화로 인한 피해 사례에 관심을 가진다."}},"p":138},{"b":2,"s":4,"a":"식물의 구조와 기능","ak":"식물의구조와기능","n":"식물의 구조와 기능","L":{"A":{"지식·이해":"생물을 이루고 있는 기본 단위가 세포임을 말하고, 실험을 통해 뿌리, 줄기, 잎, 꽃의 구조와 기능을 이해하며 각각의 기관이 연결되어 있음을 설명할 수 있다.","과정·기능":"세포 영구 표본을 이용하여 현미경으로 세포의 핵, 세포벽 등을 관찰하고, 줄기에서의 물의 이동, 증산 작용 실험, 광합성 산물을 확인하는 실험을 설계하고 수행할 수 있다. 여러 가지 식물의 구조와 기능을 관찰하거나 조사하고, 이를 설명하는 자료를 만들어 발표하고 공유할 수 있다.","가치·태도":"식물의 구조와 기능을 관찰하면서 생명의 신비로움을 느끼고, 실험 활동에 참여하면서 흥미와 관심을 가진다."},"B":{"지식·이해":"생물을 이루고 있는 기본 단위가 세포임을 말하고, 실험을 통해 식물의 뿌리, 줄기, 잎, 꽃의 구조와 각각의 기능을 말할 수 있다.","과정·기능":"식물 세포 영구 표본을 이용하여 현미경으로 세포의 핵을 관찰할 수 있다. 식물의 각 기관의 구조를 관찰하고 기능을 알아보는 실험을 수행하며, 여러 가지 식물의 특징을 설명하는 자료를 만들 수 있다.","가치·태도":"식물의 구조와 기능에 흥미를 가지고, 식물 관찰에 관심을 가진다."},"C":{"지식·이해":"생물을 이루고 있는 기본 단위가 세포임을 말하고, 식물의 뿌리, 줄기, 잎, 꽃 등의 특징을 말할 수 있다.","과정·기능":"식물을 관찰하여 뿌리, 줄기, 잎, 꽃으로 구분할 수 있다.","가치·태도":"식물에 관심을 가진다."}},"p":140},{"b":2,"s":4,"a":"열과 우리 생활","ak":"열과우리생활","n":"열과 우리 생활","L":{"A":{"지식·이해":"물체의 따뜻하고 차가운 정도를 온도로 표현하고, 온도가 다른 두 물체가 접촉했을 때 나타나는 온도 변화를 열의 이동으로 설명 수 있다. 열이 이동하는 방식의 특징을 비교하고, 단열의 의미를 설명할 수 있다.","과정·기능":"온도계를 이용하여 온도를 측정하고, 온도가 다른 두 물체가 접촉할 때 두 물체의 온도 변화의 원인을 추리하며, 일상생활에서 단열을 이용하는 사례를 조사하고, 온도를 유지할 수 있는 장치를 만들 수 있다.","가치·태도":"열과 관련된 현상에 관심을 가지고 탐구하려는 자세를 가지며, 일상생활의 문제 해결에 과학 지식을 활용하려고 노력한다."},"B":{"지식·이해":"물체의 따뜻하고 차가운 정도를 온도로 표현할 수 있음을 알고, 온도가 다른 두 물체가 접촉했을 때 두 물체의 온도가 변한다는 사실을 말할 수 있다. 열의 이동 방식이 다양하다는 사실을 말하고, 일상생활에서의 단열이 이용되는 예를 들 수 있다.","과정·기능":"온도계의 사용법을 알고, 온도가 다른 두 물체가 접촉할 때 시간에 따른 두 물체의 온도 변화를 측정할 수 있다. 일상생활에서 단열이 이용되는 예를 조사하고, 온도를 유지할 수 있는 장치를 만들 수 있다.","가치·태도":"물체의 따뜻하고 차가운 정도를 온도로 나타내는 것은 일상생활을 편리하게 하는 온도의 유용성임을 인식한다."},"C":{"지식·이해":"온도는 물체의 따뜻하고 차가운 정도임을 알고, 온도가 다른 두 물체가 접촉했을 때 두 물체의 온도가 변한다는 사실을 말할 수 있다. 열의 이동 방식이 다를 수 있음을 알고, 단열의 예를 들 수 있다.","과정·기능":"온도가 다른 두 물체가 접촉할 때 두 물체의 온도가 변하는 현상을 관찰할 수 있다. 일상생활에서 단열의 예를 찾고, 온도가 일정하게 유지되는 장치가 쓰이는 예를 찾고 필요성을 말할 수 있다.","가치·태도":"일상생활에서 물체의 따뜻하고 차가운 정도를 나타내는 사례를 찾아 관련 현상에 관심을 가진다."}},"p":136},{"b":2,"s":4,"a":"용해와 용액","ak":"용해와용액","n":"용해와 용액","L":{"A":{"지식·이해":"용해 현상의 의미와 일상생활에서 용액이 쓰이는 사례를 알고, 실험을 통해 용질의 종류와 물의 온도에 따라 물에 녹는 용질의 양이 달라짐을 설명할 수 있다.","과정·기능":"진하기를 비교하는 방법으로 용액의 진하기를 상대적으로 비교하고, 일상생활에서 용액이 쓰이는 사례를 조사하여 용액의 필요성을 알리는 자료를 만들어 공유할 수 있다.","가치·태도":"용액의 쓰임새를 조사하는 활동과 용액의 필요성에 관한 자료를 만들고 알리는 활동에 적극적으로 참여함으로써 용액의 성질과 쓰임새에 관심을 가진다."},"B":{"지식·이해":"용해 현상의 의미와 일상생활에서 용액이 쓰이는 사례를 알고, 용질의 종류 또는 물의 온도에 따라 물에 녹는 용질의 양이 달라짐을 설명할 수 있다.","과정·기능":"물체의 뜨는 정도를 이용하여 용액의 진하기를 비교하고, 일상생활에서 용액이 쓰이는 사례를 조사하여 용액의 필요성을 알리는 자료를 만들 수 있다.","가치·태도":"용액의 쓰임새를 조사하는 활동과 용액의 필요성을 알리는 자료를 만드는 활동에 흥미를 가지고 적극적으로 참여한다."},"C":{"지식·이해":"용해 현상의 의미와 용질이나 물의 양에 따라 용액의 진하기가 달라짐을 말할 수 있다.","과정·기능":"진하기가 다른 용액에 물체를 띄워 나타나는 현상을 관찰할 수 있다.","가치·태도":"일상생활에서 용액이 쓰이는 사례에 관심을 가진다."}},"p":132},{"b":2,"s":4,"a":"우리 몸의 구조와 기능","ak":"우리몸의구조와기능","n":"우리 몸의 구조와 기능","L":{"A":{"지식·이해":"뼈와 근육의 생김새, 몸이 움직이는 원리, 운동할 때 우리 몸에서 일어나는 변화를 설명할 수 있다. 소화, 순환, 호흡, 배설 기관의 종류, 위치, 생김새와 기능을 이해하여 우리 몸의 여러 기관이 서로 관련되어 있음을 설명할 수 있다. 우리 몸의 여러 기관과 관련된 질병을 이해하여 건강을 유지하기 위한 생활 방식을 설명할 수 있다.","과정·기능":"뼈와 근육의 생김새를 관찰하여 모형을 만들고, 운동할 때 우리 몸에서 일어나는 변화를 관찰할 수 있다. 우리 몸의 여러 기관과 관련된 질병을 조사하고, 건강을 유지하기 위한 생활 방식을 토의할 수 있다.","가치·태도":"생활 속에서 과학이 건강에 활용됨을 인식하여 건강을 유지하기 위한 생활 방식을 실천할 수 있다."},"B":{"지식·이해":"뼈와 근육의 움직임을 통해 몸이 움직이는 것을 말하고, 소화, 순환, 호흡, 배설 기관의 구조와 기능을 알 수 있다. 우리 몸의 여러 기관과 관련된 질병을 알고, 건강을 유지하기 위한 생활 방식을 설명할 수 있다.","과정·기능":"뼈와 근육이 움직이는 것을 관찰하여 모형을 만들고, 우리 몸의 여러 기관과 관련된 질병을 조사하며, 건강을 유지하기 위한 생활 방식을 발표할 수 있다.","가치·태도":"건강을 유지하기 위한 실천 방법을 탐색할 수 있다."},"C":{"지식·이해":"뼈와 근육의 생김새와 소화, 순환, 호흡, 배설 기관의 종류를 말하고, 우리 몸의 여러 기관과 관련된 질병을 말할 수 있다.","과정·기능":"뼈와 근육의 생김새를 관찰하여 모형을 만들고, 우리 몸의 여러 기관과 관련된 질병을 조사할 수 있다.","가치·태도":"건강에 관심을 가진다."}},"p":133},{"b":2,"s":4,"a":"자원과 에너지","ak":"자원과에너지","n":"자원과 에너지","L":{"A":{"지식·이해":"일상생활에서 이용하는 다양한 자원과 에너지를 이해하여 자원과 에너지의 효율적 사용에 대한 중요성을 알고, 자원과 에너지를 효율적으로 이용하는 다양한 방법을 설명할 수 있다.","과정·기능":"일상생활에서 이용하는 다양한 자원과 주위에서 활용되는 재생에너지의 종류를 조사할 수 있다. 자원과 에너지를 효율적으로 활용하기 위한 다양한 방법을 조사하고, 생활 속 다양한 실천 사례를 공유할 수 있다.","가치·태도":"자원과 에너지의 소중함과 효율적 이용의 필요성에 대한 이해를 바탕으로 자원과 에너지를 효율적으로 활용하는 것에 관심을 가지고 이를 실천하기 위해 노력한다."},"B":{"지식·이해":"주위에서 이용하는 자원의 예를 들고, 재생에너지의 종류와 활용되는 예를 말할 수 있으며, 일상생활에서 자원과 에너지를 효율적으로 활용하기 위한 방법을 설명할 수 있다.","과정·기능":"주위에서 이용되는 자원을 조사하고, 재생에너지의 종류와 활용되는 예를 찾아 발표할 수 있다.","가치·태도":"자원과 에너지의 소중함과 효율적 이용의 필요성을 알고, 자원과 에너지를 절약하고자 노력한다."},"C":{"지식·이해":"주위에서 이용하고 있는 자원의 예를 알고, 재생에너지의 의미를 말할 수 있다.","과정·기능":"주위에서 이용하는 자원의 예를 찾아 발표할 수 있다.","가치·태도":"자원과 에너지의 소중함과 효율적 이용의 필요성을 인식한다."}},"p":137},{"b":2,"s":4,"a":"전기의 이용","ak":"전기의이용","n":"전기의 이용","L":{"A":{"지식·이해":"전구에 불이 켜지는 전기 회로의 특징과 전기 회로에 연결된 전기의 수에 따른 전구의 밝기 변화를 설명할 수 있다. 일상생활에서 전자석이 사용되는 예를 전자석의 성질과 관련지어 설명하고, 전기를 효율적이고 안전하게 사용하는 방법을 설명할 수 있다.","과정·기능":"전지 한 개와 전지 두 개가 직렬연결된 전기 회로에 전구, 전동기와 같은 전기 부품을 연결하여 전기 회로의 특징을 비교할 수 있다. 전자석을 제작하여 영구 자석과 비교하고, 전자석이 사용되는 예를 조사하며, 일상생활에서 전기를 효율적이고 안전하게 사용하는 방법을 조사하여 실천 계획을 세울 수 있다.","가치·태도":"효율적이고 안전한 전기 사용 계획을 세우고 일상생활에서 이를 실천한다."},"B":{"지식·이해":"전기 회로 중에서 전구의 불이 켜지는 전기 회로를 찾고, 전기 회로에 연결된 전지의 수에 따라 전구의 밝기가 달라질 수 있음을 말할 수 있다. 전자석과 영구 자석의 차이를 구별하며, 전기를 안전하게 사용하는 방법을 설명할 수 있다.","과정·기능":"전지 한 개와 전지 두 개가 직렬연결된 전기 회로에서 전구의 밝기를 비교할 수 있다. 실험을 통해 전자석의 세기와 방향을 바꾸는 방법과 전자석이 사용되는 예를 찾으며, 전기를 안전하게 사용하는 방법을 조사할 수 있다.","가치·태도":"일상생활에서 효율적이고 안전한 전기 사용에 관심을 가진다."},"C":{"지식·이해":"전지, 전구, 전선을 연결하면 전구에 불이 켜짐을 이해하고, 전기 회로에 연결된 전지의 수와 전구의 밝기가 연관됨을 말할 수 있다. 전류가 흐르고 있는 전자석은 자석의 성질을 띤다는 사실을 알고, 일상생활에서 전기를 안전하게 사용하는 경우를 말할 수 있다.","과정·기능":"전지, 전구, 전선을 연결하여 전구에 불을 켜고, 전지 한 개와 전지 두 개가 직렬연결된 전기 회로를 만들 수 있다. 전자석을 만들어 전자석이 자석의 성질을 나타냄을 관찰하고, 일상생활에서 전기를 안전하게 사용하는 경우를 찾을 수 있다.","가치·태도":"일상생활에서 전기 안전의 중요성을 인식한다."}},"p":144},{"b":2,"s":4,"a":"지구의 운동","ak":"지구의운동","n":"지구의 운동","L":{"A":{"지식·이해":"지구의 자전을 알고, 하루 동안 태양과 별의 위치가 규칙적으로 달라진다는 것과 낮과 밤이 생기는 원인을 설명할 수 있다. 지구의 공전을 알고 계절에 따라 달라지는 별자리를 말할 수 있다.","과정·기능":"하루 동안 태양과 별을 관찰하고 기록하여 천체의 위치 변화에 대한 규칙성을 찾을 수 있다. 모형실험을 통해 낮과 밤이 생기는 이유를 추론하고, 천체 관측 프로그램을 이용하여 계절별 대표적인 별자리를 관찰할 수 있다.","가치·태도":"지구의 운동에 따른 여러 현상에 관심을 가지고, 계절별 대표적인 별자리를 관찰하려는 자세를 가진다."},"B":{"지식·이해":"하루 동안 천체의 위치가 달라진다는 것과 낮과 밤이 생기는 이유를 설명하고, 계절에 따라 달라지는 별자리를 말할 수 있다.","과정·기능":"하루 동안 태양과 별을 관찰하고 기록하며 낮과 밤이 생기는 이유를 탐구하기 위한 모형실험을 할 수 있다. 천체 관측 프로그램을 이용하여 계절별 대표적인 별자리를 관찰할 수 있다.","가치·태도":"하루 동안 태양의 위치 변화와 계절별 별자리에 대해 흥미를 가진다."},"C":{"지식·이해":"하루 동안 태양의 위치가 달라진다는 것과 지구의 자전을 설명하고, 계절에 따라 별자리가 달라진다는 것을 말할 수 있다.","과정·기능":"하루 동안 태양의 위치 변화를 관찰하고, 계절별 별자리를 관찰할 수 있다.","가치·태도":"하루 동안 태양의 위치 변화에 호기심을 가진다."}},"p":141},{"b":2,"s":4,"a":"지층과 화석","ak":"지층과화석","n":"지층과 화석","L":{"A":{"지식·이해":"지층의 특징과 형성 과정을 설명하고, 지층이 퇴적암으로 이루어져 있다는 점과 퇴적암의 분류 방법을 알 수 있다. 화석의 생성 과정을 설명하고, 지구의 과거 생물과 환경을 추리할 수 있는 화석의 가치를 설명할 수 있다.","과정·기능":"지층을 관찰하고 지층의 형성 과정을 모형으로 표현하며, 이암, 사암, 역암을 알갱이의 크기에 따라 분류할 수 있다. 화석을 관찰하고 화석 모형을 만들며, 화석을 이용하여 지구의 과거 생물과 환경을 추리할 수 있다.","가치·태도":"화석에 대해 흥미를 가지고, 화석을 통해 지구의 과거를 상상하며, 화석의 가치를 인식한다."},"B":{"지식·이해":"지층의 특징과 주요 퇴적암의 종류를 알고, 퇴적암을 알갱이의 크기로 분류할 수 있음을 이해하며, 화석의 생성 과정을 설명할 수 있다.","과정·기능":"지층을 관찰하고 모형으로 표현하며, 이암, 사암, 역암을 관찰하여 알갱이의 크기에 따라 분류할 수 있다. 화석을 관찰하고 화석 모형을 만들 수 있다.","가치·태도":"화석에 대해 흥미를 가지고, 화석의 가치를 인식한다."},"C":{"지식·이해":"지층의 특징과 이암, 사암, 역암의 알갱이 크기가 다르다는 것을 말하고, 화석의 특징을 간단히 말할 수 있다.","과정·기능":"지층을 관찰하여 두께와 색을 비교하고, 이암, 사암, 역암의 알갱이 크기를 관찰하며, 여러 가지 화석을 관찰할 수 있다.","가치·태도":"화석에 대해 관심을 가진다."}},"p":130},{"b":2,"s":4,"a":"혼합물의 분리","ak":"혼합물의분리","n":"혼합물의 분리","L":{"A":{"지식·이해":"혼합물의 의미를 말하고, 알갱이의 크기 차이, 물에 용해되는 성질과 물이 증발하는 성질을 이용하여 혼합물을 분리하는 방법을 설명할 수 있다.","과정·기능":"알갱이의 크기가 다른 고체 혼합물, 골고루 섞이지 않는 액체 혼합물을 분리하고, 혼합물을 분리할 때에 물에 용해되는 성질과 물이 증발하는 성질을 이용할 수 있다. 지속가능한 삶을 위한 과학기술 사례 중 혼합물 분리를 이용한 장치를 조사하여 공유할 수 있다.","가치·태도":"지속가능한 삶을 이용한 과학기술 사례 중 혼합물 분리를 이용한 장치를 조사하는 활동에 참여하여 혼합물의 분리가 지속가능한 삶에 기여함을 인식한다."},"B":{"지식·이해":"혼합물의 의미를 말하고, 알갱이 크기 차이, 물에 용해되는 성질을 이용하여 고체 혼합물을 분리하는 방법을 설명할 수 있다.","과정·기능":"알갱이의 크기 차이와 물에 용해되는 성질을 이용하여 혼합물을 분리하고, 과학기술 사례 중 혼합물의 분리를 이용한 장치를 조사할 수 있다.","가치·태도":"지속가능한 삶을 이용한 과학기술 사례를 통해 혼합물 분리의 필요성에 관심을 가진다."},"C":{"지식·이해":"혼합물의 사례와 실험에서 관찰한 혼합물의 특징을 말할 수 있다.","과정·기능":"일상생활에서 혼합물과 혼합물 분리 사례를 조사할 수 있다.","가치·태도":"일상생활에서 혼합물 분리의 필요성에 관심을 가진다."}},"p":134},{"b":2,"s":6,"a":"스포츠","ak":"스포츠","n":"스포츠","L":{"A":{"지식·이해":"기술형·전략형·생태형 스포츠의 의미와 유형을 명확하게 알고, 기술형의 기록형·동작형·투기형 스포츠, 전략형의 영역형·필드형·네트형 스포츠, 생태형의 생활환경형·자연환경형 스포츠 각각의 특성을 예를 들어 구체적으로 설명할 수 있다. 또한 기술형·전략형·생태형 스포츠를 변형한 게임 활동의 경기 방법이나 활동 방법을 명확히 파악할 수 있다.","과정·기능":"기술형·전략형·생태형 스포츠에서 기본 움직임 기술을 응용한 여러 가지 기본 기능을 다양한 게임 및 활동 상황에서 효율적으로 수행할 수 있다. 또한 기술형·전략형·생태형 스포츠를 변형한 다양한 게임이나 활동 상황에서 여러 가지 기본 전략을 수행할 수 있다.","가치·태도":"스스로 설정한 목표를 달성하기 위한 의지를 실천하며 스포츠 활동에 참여하고, 상대의 기술을 인정하는 태도를 갖고 이를 스포츠 활동에서 적극적으로 실천할 수 있다. 또한 다양한 스포츠 활동에서 최선을 다하고 팀원과 협력하며 구성원 전체를 적극적으로 배려할 수 있다. 그리고 다양한 스포츠 활동 중 환경을 아끼고 스포츠 환경에 감사하는 태도를 가지며 이를 자기 주도적으로 실천할 수 있다."},"B":{"지식·이해":"기술형·전략형·생태형 스포츠의 의미와 유형을 대략적으로 알고, 기술형의 기록형·동작형·투기형 스포츠, 전략형의 영역형·필드형·네트형 스포츠, 생태형의 생활환경형·자연환경형 스포츠 각각의 특성을 설명할 수 있다. 또한 기술형·전략형·생태형 스포츠를 변형한 게임 활동의 경기 방법이나 활동 방법을 대략적으로 파악할 수 있다.","과정·기능":"기술형·전략형·생태형 스포츠에서 기본 움직임 기술을 응용한 일부 기본 기능을 다양한 게임 및 활동 상황에서 수행할 수 있다. 또한 기술형·전략형·생태형 스포츠를 변형한 다양한 게임이나 활동 상황에서 일부 기본 전략을 수행할 수 있다.","가치·태도":"목표를 달성하기 위한 의지를 실천하며 스포츠 활동에 참여하고, 상대의 기술을 인정하는 태도를 갖고 이를 스포츠 활동에서 실천할 수 있다. 또한 일부 스포츠 활동에서 최선을 다하고 팀원과 협력하며 구성원을 배려할 수 있다. 그리고 일부 스포츠 활동 중 환경을 아끼고 스포츠 환경에 감사하는 태도를 가지며 이를 실천할 수 있다."},"C":{"지식·이해":"기술형·전략형·생태형 스포츠의 의미를 대략적으로 알고, 기술형의 기록형·동작형·투기형 스포츠, 전략형의 영역형·필드형·네트형 스포츠, 생태형의 생활환경형·자연환경형 스포츠의 종류를 구별할 수 있다. 또한 기술형·전략형·생태형 스포츠를 변형한 게임 활동의 경기 방법이나 활동 방법 중 일부를 대략적으로 파악할 수 있다.","과정·기능":"기술형·전략형·생태형 스포츠에서 기본 움직임 기술을 응용한 일부 기본 기능을 게임 및 활동 상황에서 부분적으로 수행할 수 있다. 또한 기술형·전략형·생태형 스포츠를 변형한 게임이나 활동 상황에서 일부 기본 전략을 부분적으로 수행할 수 있다.","가치·태도":"목표를 달성하기 위한 의지를 일부 실천하며 스포츠 활동에 참여하고, 상대의 기술을 인정하는 태도를 갖고 이를 스포츠 활동에서 실천하기 위해 노력할 수 있다. 또한 일부 스포츠 활동에 열심히 참여하고 팀원과 부분적으로 협력하며 구성원을 배려하기 위해 노력할 수 있다. 그리고 일부 스포츠 활동 중 환경을 아끼고 스포츠 환경에 감사하는 태도를 가지며 이를 실천하기 위해 노력할 수 있다."}},"p":202},{"b":2,"s":6,"a":"운동","ak":"운동","n":"운동","L":{"A":{"지식·이해":"건강 체력 및 운동 체력의 의미와 요소, 성장 발달의 의미와 특성을 명확하게 알고, 건강 체력 및 운동 체력의 다양한 운동 방법과 운동이 성장 발달에 미치는 영향을 신체적·정서적·사회적 관점에서 예를 들어 구체적으로 설명할 수 있다. 또한 운동 및 생활 속 위험 상황과 성장 발달을 저해하는 생활 방식의 문제점을 명확하게 알 수 있다.","과정·기능":"건강 체력과 운동 체력을 측정하여 자신의 체력 수준에 맞는 다양한 운동을 꾸준히 시도할 수 있다. 또한 운동 및 생활 속에서 위험 상황 및 문제점에 대한 예방 및 대처 방법을 종합적으로 익혀 안전하게 활동할 수 있다.","가치·태도":"체력 증진을 저해하는 개인적 조건과 환경적 조건 모두를 고려하여 전반적으로 극복하며 체력 운동을 끈기 있게 규칙적으로 수행할 수 있다. 또한 성장과 발달 과정에서 나타나는 특성과 차이를 신체적·정서적·사회적 관점 모 대해 잘 안다.","과정·기능":"표현하고자 하는 느낌이나 아이디어를 구체적으로 떠올려 적합한 음악 매체나 방법으로 표현하고, 기초적인 기보·음악 요소·생활 주변의 상황이나 이야기를 적절하게 활용하여 간단한 조건에 따라 악곡의 일부를 바꾸거나 창의적으로 간단한 음악을 만든다.","가치·태도":"음악 표현 활동에 대한 자신감과 음악에 대한 열린 태도를 적극적으로 갖는다."},"B":{"지식·이해":"표현하고자 하는 느낌과 아이디어를 나타낼 수 있는 음악 매체나 방법을 이해하고 악곡의 일부를 바꾸거나 간단한 음악을 만들 수 있는 음악 요소, 기초적인 기보에 대해 안다.","과정·기능":"표현하고자 하는 느낌이나 아이디어를 떠올려 음악 매체나 방법으로 표현하고, 기초적인 기보·음악 요소·생활 주변의 상황이나 이야기를 활용하여 간단한 조건에 따라 악곡의 일부를 바꾸거나 간단한 음악을 만든다.","가치·태도":"음악 표현 활동에 대한 자신감과 음악에 대해 열린 태도를 갖는다."},"C":{"지식·이해":"표현하고자 하는 느낌과 아이디어를 나타낼 수 있는 음악 매체나 방법을 부분적으로 이해하고 악곡의 일부를 바꾸거나 간단한 음악을 만들 수 있는 음악 요소, 기초적인 기보에 대해 일부 안다.","과정·기능":"표현하고자 하는 느낌이나 아이디어를 떠올려 음악 매체나 방법으로 표현하고, 기초적인 기보·음악 요소·생활 주변의 상황이나 이야기를 부분적으로 활용하여 간단한 조건에 따라 악곡의 일부를 바꾸거나 간단한 음악을 만들려고 노력한다.","가치·태도":"음악 표현 활동에 대한 자신감과 음악에 대한 열린 태도를 가지려고 노력한다."}},"p":213},{"b":2,"s":8,"a":"감상","ak":"감상","n":"감상","L":{"A":{"지식·이해":"미술 작품을 작품과 배경의 관련성 및 내용과 형식의 분석을 바탕으로 연결하여 폭넓게 이해하고 설명할 수 있다.","과정·기능":"미술 작품과 배경을 연결하고 미술 작품의 내용과 형식을 다양한 방법으로 분석하여 이를 바탕으로 작품의 특징을 구체적으로 설명하며, 미술 문화 활동 경험을 다양한 방법으로 공유할 수 있다.","가치·태도":"미술에 대한 서로 다른 관점을 발견하고 존중할 수 있으며 공동체 문화에 대한 폭넓은 관심을 바탕으로 공동체 미술문화에 적극적으로 참여할 수 있다."},"B":{"지식·이해":"미술 작품을 배경과의 관련성 및 내용과 형식의 분석을 바탕으로 이해하고 설명할 수 있다.","과정·기능":"미술 작품과 배경을 연결하고 미술 작품의 내용과 형식을 분석하여 이를 바탕으로 작품의 특징을 설명하며, 미술 문화 활동 경험을 공유할 수 있다.","가치·태도":"미술에 대한 서로 다른 관점을 존중할 수 있으며 공동체 문화에 대한 관심을 바탕으로 공동체 미술 문화에 참여할 수 있다."},"C":{"지식·이해":"미술 작품의 이해에서 배경의 관련성 및 내용과 형식을 부분적으로 이해하고 설명할 수 있다.","과정·기능":"미술 작품과 배경을 연결하고 미술 작품의 내용과 형식을 고려하며 미술 문화 활동을 경험을 부분적으로 공유할 수 있다.","가치·태도":"미술에 대한 서로 다른 관점에 관심을 가지며 공동체의 미술 문화 활동에 부분적으로 참여할 수 있다."}},"p":226},{"b":2,"s":8,"a":"미적 체험","ak":"미적체험","n":"미적 체험","L":{"A":{"지식·이해":"미적 체험에서 감각과 매체가 하는 역할을 이해하고, 대상에서 찾은 감각적 특징, 느낌, 생각 등의 관계에서 새로운 의미를 발견하여 설명할 수 있으며, 이미지가 나타내는 의미를 해석할 수 있다.","과정·기능":"다양한 감각과 매체를 적절하게 활용하여 자신과 대상을 적극적으로 탐색하고, 대상에서 찾은 감각적 특징, 느낌, 생각 등의 관계를 다양한 방식으로 관련짓는 상호 작용을 통해 새로운 의미를 발견하여 설명할 수 있다. 이미지가 나타내는 의미를 비판적으로 해석하고 자신의 느낌과 생각을 전달하는 데 적절하게 활용할 수 있다.","가치·태도":"주변 환경에 민감한 태도로 대상과 적극 교감하며 이미지를 비판적으로 이해하는 태도를 실천한다."},"B":{"지식·이해":"미적 체험에서 감각과 매체가 하는 역할을 발견하고, 대상에서 찾은 감각적 특징, 느낌, 생각 등을 토대로 새로운 의미를 발견할 수 있으며, 이미지가 나타내는 의미를 이해할 수 있다.","과정·기능":"다양한 감각과 매체를 활용하여 자신과 대상을 탐색하고, 대상에서 찾은 감각적 특징, 느낌, 생각 등을 관련지어 나타내는 상호 작용을 통해 새로운 의미를 발견할 수 있다. 이미지가 나타내는 의미를 비판적으로 이해하고 자신의 느낌과 생각을 전달하는 데 활용할 수 있다.","가치·태도":"주변 환경을 민감하게 살펴보며 이미지를 비판적으로 이해하는 태도를 가진다."},"C":{"지식·이해":"미적 체험에서 감각과 매체가 쓰인다는 것을 알고, 이미지가 나타내는 의미를 일부 이해할 수 있다.","과정·기능":"다양한 감각과 매체를 일부 활용하여 자신과 대상을 부분적으로 탐색하고, 감각적 특징, 느낌, 생각 등을 떠올려 상호 작용하며 의미를 발견하는 활동에 참여할 수 있다. 이미지가 나타내는 의미를 일부 이해하고 자신의 느낌과 생각을 전달하는 데 제한적으로 활용할 수 있다.","가치·태도":"주변 환경에 관심을 보이며 이미지가 나타내는 의미를 이해하고자 노력한다."}},"p":225},{"b":2,"s":8,"a":"표현","ak":"표현","n":"표현","L":{"A":{"지식·이해":"디지털 매체 등 다양한 표현 재료와 용구를 탐색하여 특성을 이해하고 조형 요소의 어울림을 통해 다양한 조형 원리를 이해할 수 있다.","과정·기능":"다양한 방법으로 아이디어를 연결하여 확장된 표현 주제로 구체화하여 발전시키고, 디지털 매체 등 다양한 표현 재료와 용구를 작품 제작에 적절하게 활용하며, 조형 요소와 조형 원리를 주제 표현에 적합하게 연결할 수 있다. 표현의 전 과정을 지속적으로 돌아보며 작품을 발전시킬 수 있고 미술과 타 교과 내용과 방법을 다양하게 융합할 수 있다.","가치·태도":"주제 표현에 적극적인 의지를 갖고 미술과 타 교과의 내용과 방법을 융합하는 활동을 자유롭게 시도할 수 있다."},"B":{"지식·이해":"조형 요소의 어울림을 통해 조형 원리를 이해할 수 있다.","과정·기능":"다양한 방법으로 아이디어를 연결하여 확장된 표현 주제로 발전시키고 작품 제작에 재료와 용구를 활용하며, 조형 요소와 조형 원리를 주제 표현에 연결할 수 있다. 표현 과정을 돌아보며 작품을 발전시킬 수 있고 미술과 타 교과의 내용과 방법을 융합할 수 있다.","가치·태도":"주제 표현에 의지를 갖고 미술과 타 교과의 내용과 방법을 융합하는 활동을 자유롭게 시도할 수 있다."},"C":{"지식·이해":"조형 요소와 조형 원리를 안다.","과정·기능":"다양한 방법으로 아이디어를 떠올려 표현 주제로 나타내고, 작품 제작에 디지털 매체 등 다양한 표현 재료와 용구, 조형 요소와 조형 원리를 부분적으로 활용할 수 있다. 표현 과정을 돌아보며 작품을 제작할 수 있고 미술과 타 교과의 내용과 방법을 융합할 수 있다.","가치·태도":"주제 표현에 관심을 갖고 미술과 타 교과의 내용과 방법을 융합하는 활동을 부분적으로 시도할 수 있다."}},"p":226},{"b":2,"s":9,"a":"이해","ak":"이해","n":"이해","L":{"A":{"지식·이해":"일상생활 주제에 관한 의사소통 상황 및 목적, 다양한 문화권에 속한 사람들의 언어적·비언어적 소통 방식 등의 맥락에 맞게 간단한 단어, 어구, 문장, 다양한 유형의 간단한 담화나 글을 듣거나 읽으며 정확하게 이해할 수 있다.","과정·기능":"간단한 단어, 어구, 문장을 듣고 강세, 리듬, 억양을 정확하게 식별하여 소리 내어 읽으며, 다양한 매체로 표현된 간단한 담화나 글에서 의미, 사실 정보와 맥락 정보, 적절한 전략을 활용하여 세부 정보, 중심 내용, 일이나 사건의 순서, 특정 정보나 내용을 정확하게 확인할 수 있다.","가치·태도":"일상생활 주제에 관한 다양한 유형의 간단한 담화나 글을 흥미를 가지고 스스로 찾아 듣거나 읽으면서 상대방의 감정을 느끼고 적극적으로 공감하는 태도를 보이며, 다양한 문화와 생각이나 의견을 존중하고 적극적으로 포용한다."},"B":{"지식·이해":"일상생활 주제에 관한 의사소통 상황 및 목적, 다양한 문화권에 속한 사람들의 언어적·비언어적 소통 방식 등의 맥락에 맞게 간단한 단어, 어구, 문장, 다양한 유형의 간단한 담화나 글을 듣거나 읽으며 대체로 이해할 수 있다.","과정·기능":"간단한 단어, 어구, 문장을 듣고 강세, 리듬, 억양을 식별하여 소리 내어 읽으며, 다양한 매체로 표현된 간단한 담화나 글에서 의미, 사실 정보와 맥락 정보, 적절한 전략을 활용하여 세부 정보, 중심 내용, 일이나 사건의 순서, 특정 정보나 내용을 대체로 확인할 수 있다.","가치·태도":"일상생활 주제에 관한 다양한 유형의 간단한 담화나 글을 흥미를 가지고 듣거나 읽으면서 상대방의 감정을 느끼고 공감하며, 다양한 문화와 생각이나 의견을 포용한다."},"C":{"지식·이해":"일상생활 주제에 관한 의사소통 상황 및 목적, 다양한 문화권에 속한 사람들의 언어적·비언어적 소통 방식 등의 맥락에 맞게 간단하고 짧은 단어, 어구, 문장, 다양한 유형의 간단하고 짧은 담화나 글을 듣거나 읽으며 부분적으로 이해할 수 있다.","과정·기능":"간단한 단어, 어구, 문장을 듣고 강세, 리듬, 억양을 식별하거나 소리 내어 읽으며, 다양한 매체로 표현된 간단하고 짧은 담화나 글에서 의미, 사실 정보와 맥락 정보, 간단한 전략을 활용하여 세부 정보, 중심 내용, 일이나 사건의 순서, 특정 정보나 내용을 주어진 도움 자료를 참고하여 반복하여 듣거나 읽으며 내용을 부분적으로 확인할 수 있다.","가치·태도":"일상생활 주제에 관한 다양한 유형의 간단하고 짧은 담화나 글을 흥미를 가지려고 노력하며 듣거나 읽으면서 상대방의 감정을 느끼고 공감하려고 노력하며, 다양한 문화와 생각이나 의견을 포용하는 태도를 가지려고 노력한다."}},"p":244},{"b":2,"s":9,"a":"표현","ak":"표현","n":"표현","L":{"A":{"지식·이해":"일상생활 주제에 관한 의사소통 상황 및 목적, 다양한 문화권에 속한 사람들의 언어적·비언어적 소통 방식 등의 맥락에 맞게 간단한 단어, 어구, 문장, 다양한 유형의 간단한 담화나 글로 정확하게 표현할 수 있다.","과정·기능":"주변 사람이나 사물 소개하기, 주변 장소나 위치 설명하기, 행동 순서나 방법 설명하기, 자신의 감정이나 의견 표현하기, 경험이나 계획 표현하기와 같은 의사소통 기능을 적절한 단어와 언어 형식을 사용하여 정확하게 표현할 수 있으며, 적절한 매체와 전략을 다양하게 활용하여 창의적으로 의미를 생성하고 표현할 수 있다.","가치·태도":"의사소통 활동에 높은 흥미와 자신감을 가지고 참여하며, 동료들과 적극적으로 협력하여 수행한다."},"B":{"지식·이해":"일상생활 주제에 관한 의사소통 상황 및 목적, 다양한 문화권에 속한 사람들의 언어적·비언어적 소통 방식 등의 맥락에 맞게 간단한 단어, 어구, 문장, 다양한 유형의 간단한 담화나 글로 대체로 표현할 수 있다.","과정·기능":"주변 사람이나 사물 소개하기, 주변 장소나 위치 설명하기, 행동 순서나 방법 설명하기, 자신의 감정이나 의견 표현하기, 경험이나 계획 표현하기와 같은 의사소통 기능을 적절한 단어를 사용하여 대체로 표현할 수 있으며, 적절한 매체와 전략을 활용하여 창의적으로 의미를 생성하고 표현할 수 있다.","가치·태도":"의사소통 활동에 흥미와 자신감을 가지고 참여하려는 태도를 보이며, 동료들과 대체로 협력하여 활동을 수행한다."},"C":{"지식·이해":"일상생활 주제에 관한 의사소통 상황 및 목적, 다양한 문화권에 속한 사람들의 언어적·비언어적 소통 방식 등의 맥락에 맞게 간단하고 짧은 단어, 어구, 문장, 다양한 유형의 간단하고 짧은 담화나 글로 부분적으로 표현할 수 있다.","과정·기능":"주변 사람이나 사물 소개하기, 주변 장소의 위치 설명하기, 행동 순서나 방법 설명하기, 자신의 감정이나 의견 표현하기, 경험이나 계획 표현하기와 같은 의사소통 기능을 주어진 도움 자료를 참고하여 부분적으로 표현할 수 있으며, 예시를 참고하여 간단한 매체와 전략을 일부 활용하여 창의적으로 의미를 표현할 수 있다.","가치·태도":"의사소통 활동에 일부 흥미와 자신감을 가지고 참여하고자 노력하며, 동료들과 부분적으로 협력하여 수행한다."}},"p":244}]};

<script>
/* ============================================================
   2022 개정 교육과정 초등 성취기준·성취수준 찾기
   ============================================================ */
const $ = s => document.querySelector(s);
const el = (t,c,x) => { const n=document.createElement(t); if(c) n.className=c; if(x!=null) n.textContent=x; return n; };
const svgEl = (t,attrs) => { const n=document.createElementNS('http://www.w3.org/2000/svg',t);
  for(const k in attrs) n.setAttribute(k, attrs[k]); return n; };

const BANDS=DATA.bands, SUBJ=DATA.subjects, STD=DATA.std, AREA=DATA.area;
const CATS=['지식·이해','과정·기능','가치·태도'];
const shortBand = b => b.replace('초등 ','');

/* ---------- 정규화 / 초성 ---------- */
const CHO=['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
const norm = s => (s||'').toLowerCase().replace(/[･ㆍ・•]/g,'·').replace(/[‘’'"“”]/g,'').replace(/\s+/g,'');
function chosung(s){ let o=''; for(const ch of (s||'')){ const c=ch.charCodeAt(0);
  if(c>=0xAC00&&c<=0xD7A3) o+=CHO[Math.floor((c-0xAC00)/588)]; else if(c>=0x3131&&c<=0x314E) o+=ch; } return o; }
const isChoQuery = s => /^[ㄱ-ㅎ]{2,}$/.test(s.replace(/\s+/g,''));

/* ---------- 색인 ---------- */
STD.forEach((r,i)=>{ r.i=i; r.band=BANDS[r.b]; r.subj=SUBJ[r.s];
  r._head=norm(r.c+r.t+r.a+r.subj+r.band); r._body=norm(r.A+r.B+r.C); r._cho=chosung(r.t+' '+r.a); });
const AREAIDX = new Map(AREA.map(a=>[a.b+'|'+a.s+'|'+a.ak, a]));
const areaOf = r => AREAIDX.get(r.b+'|'+r.s+'|'+r.ak);

/* ---------- 형태 정리 / 토큰 ---------- */
const JOSA=/(으로써|으로서|이라는|라는|에서의|에게서|으로|에서|에게|부터|까지|보다|처럼|과의|와의|의|을|를|이|가|은|는|에|와|과|로|도|만|나|며|고)$/;
const EOMI=/(하였다|하였고|합니다|한다|하는|하여|하고|하며|하기|할|함|됨|되는|되어|되고|된|있다|있는|이다|으면서|면서|인|적인|적으로|적|들)$/;
const STOP=new Set(('수 등 및 것 그 이 저 때 더 잘 또 통해 위해 위한 위하여 대해 관해 다양 다양한 여러 여러가지 '+
 '가지 자신 우리 서로 무엇 어떻 있다 있음 한다 하기 대한 관한 알맞 알맞은 적절 적절한 정확 정확하게 부분 부분적 '+
 '일부 적극 적극적 다소 대체 대체로 능숙 간단 간단한 안내 절차 주어진 제시 따라 찾아 구체 다른 기본 바탕 통하여 '+
 '대략 가진다 갖는다 지닌다 성취 기준 수준 학생 학습 평가 영역').split(' '));
function tokens(text){
  const out=[];
  for(let w of (text||'').replace(/[^가-힣A-Za-z0-9\s]/g,' ').split(/\s+/)){
    if(!w) continue;
    if(/^[A-Za-z0-9]+$/.test(w)){ if(w.length>1) out.push(w.toLowerCase()); continue; }
    let t=w;
    for(let k=0;k<2;k++){ const b=t; t=t.replace(EOMI,''); t=t.replace(JOSA,''); if(t===b) break; }
    if(t.length>=2&&t.length<=9&&!STOP.has(t)) out.push(t);
    if(t.length>=6){ const h=t.slice(0,4); if(!STOP.has(h)) out.push(h); }
  }
  return out;
}

/* ---------- TF-IDF ---------- */
const DF=new Map(); const N=STD.length;
STD.forEach(r=>{ const tf=new Map();
  tokens(r.t).forEach(t=>tf.set(t,(tf.get(t)||0)+3));
  tokens(r.A+' '+r.B+' '+r.C).forEach(t=>tf.set(t,(tf.get(t)||0)+1));
  (r.q||[]).forEach(x=>tokens(x).forEach(t=>tf.set(t,(tf.get(t)||0)+1)));
  r._tf=tf; for(const t of tf.keys()) DF.set(t,(DF.get(t)||0)+1); });
function vecFromTf(tf){
  const v=new Map(); let sum=0;
  for(const [t,f] of tf){ const df=DF.get(t); if(!df||df>N*0.35) continue;
    const w=(1+Math.log(f))*Math.log(N/df); v.set(t,w); sum+=w*w; }
  const nr=Math.sqrt(sum)||1; for(const [t,w] of v) v.set(t,w/nr); return v;
}
STD.forEach(r=>{ r._v=vecFromTf(r._tf); });
function vecOfText(text){ const tf=new Map(); tokens(text).forEach(t=>tf.set(t,(tf.get(t)||0)+1)); return vecFromTf(tf); }
function cos(a,b){ let d=0; const s=a.size<b.size?a:b, g=s===a?b:a;
  for(const [t,w] of s){ const u=g.get(t); if(u) d+=w*u; } return d; }

/* ---------- 범주 성향 (지식·이해 / 과정·기능 / 가치·태도) ----------
   ① 성취기준 서술어 규칙  ② 소속 영역의 범주별 성취수준 서술과의 유사도. 둘을 합쳐 추정한다. */
const CATRULE=[
  [/이해한다|이해하고|안다|알고|알며|설명한다|설명하고|파악한다|파악하고|인식한다|구별한다|구분한다|의미를|개념을|특징을|원리를/g, 0],
  [/탐구한다|탐구하고|조사한다|조사하고|분석한다|분석하고|비교한다|비교하고|관찰한다|관찰하고|표현한다|표현하고|나타낸다|만든다|만들고|설계한다|해결한다|활용한다|수행한다|그린다|연주한다|발표한다|토의한다|토론한다|측정한다|계산한다|읽는다|쓴다|말한다|듣는다/g, 1],
  [/태도를|흥미를|관심을|실천한다|실천하며|존중한다|존중하며|노력한다|즐긴다|참여한다|참여하며|기른다|가진다|지닌다|갖는다|배려한다|감상한다|공감한다/g, 2],
];
const AREAVEC=new Map();
function areaCatVec(a,cat){
  const k=a.b+'|'+a.s+'|'+a.ak+'|'+cat;
  if(!AREAVEC.has(k)){
    let txt=''; for(const L of ['A','B','C']){ const d=a.L[L]; if(d){ for(const c in d) if(c===cat) txt+=' '+d[c]; } }
    AREAVEC.set(k, txt.trim()? vecOfText(txt) : new Map());
  }
  return AREAVEC.get(k);
}
function catProfile(r){
  if(r._prof) return r._prof;
  const rule=[0,0,0];
  CATRULE.forEach(([re,i])=>{ const m=r.t.match(re); if(m) rule[i]+=m.length; });
  const sim=[0,0,0], a=areaOf(r);
  if(a) CATS.forEach((c,i)=>{ sim[i]=cos(r._v, areaCatVec(a,c)); });
  // 성취기준은 대개 여러 범주를 아우르므로 한쪽으로 쏠리지 않게 완만하게 다듬는다
  const nz=(v,sm)=>{ const w=v.map(x=>x+sm); const s=w.reduce((x,y)=>x+y,0); return w.map(x=>x/s); };
  const R=nz(rule.map(x=>Math.log(1+x)), 0.32), Sm=nz(sim, 0.02);
  let p=[0,1,2].map(i=> R[i]*0.62 + Sm[i]*0.38);
  const s=p.reduce((x,y)=>x+y,0);
  p = s>0 ? p.map(x=>x/s) : [1/3,1/3,1/3];
  return r._prof=p;
}
const mainCat = r => CATS[catProfile(r).indexOf(Math.max(...catProfile(r)))];

/* ---------- 개념어 ----------
   성취기준 본문에서만 뽑고, 동사 어간(이루어지는·살펴보고 …)은 개념으로 보지 않는다. */
const esc=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
const isVerbStem=(t,text)=> new RegExp(esc(t)+'(는|며|여|고|어|아|게|던)').test(text);
function conceptsOf(r,k){
  if(!r._con){
    const cand=[...vecFromTf(new Map((()=>{ const m=new Map();
        tokens(r.t).forEach(t=>m.set(t,(m.get(t)||0)+1)); return m; })())).entries()]
      .filter(([t])=>{ const df=DF.get(t);
        return df>=2 && df<=N*0.07 && !/다$/.test(t) && !isVerbStem(t,r.t); })
      .sort((a,b)=>b[1]-a[1]).map(x=>x[0]);
    const out=[];
    for(const t of cand){ if(out.some(o=>o.startsWith(t)||t.startsWith(o))) continue; out.push(t); if(out.length>=8) break; }
    r._con=out;
  }
  return k? r._con.slice(0,k) : r._con;
}
const CONIDX=new Map();
STD.forEach(r=>conceptsOf(r,6).forEach(t=>{ if(!CONIDX.has(t)) CONIDX.set(t,[]); CONIDX.get(t).push(r); }));

/* ---------- 연관 성취기준 ---------- */
function scopeFilter(r,o,mode){
  if(mode==='bandCross') return o.b===r.b && o.s!==r.s;
  if(mode==='band')      return o.b===r.b;
  if(mode==='subject')   return o.s===r.s;
  return true;
}
function similar(r,mode,catOnly){
  const out=[];
  for(const o of STD){
    if(o===r || !scopeFilter(r,o,mode)) continue;
    if(catOnly && mainCat(o)!==catOnly) continue;
    const d=cos(r._v,o._v);
    if(d>0.04) out.push({o,s:d});
  }
  out.sort((a,b)=>b.s-a.s);
  return out.slice(0,14);
}
function commonKw(a,b){
  const arr=[];
  for(const [t,w] of a._v){ const u=b._v.get(t); if(u) arr.push([t,w*u]); }
  arr.sort((x,y)=>y[1]-x[1]);
  const out=[];
  for(const [t] of arr){
    if(DF.get(t)>N*0.06) continue;
    const i=out.findIndex(o=>o.startsWith(t)||t.startsWith(o));
    if(i>=0){ if(t.length>out[i].length) out[i]=t; continue; }
    out.push(t); if(out.length>=5) break;
  }
  return out;
}
/* 위계: 같은 계열(교과+영역번호)의 학년군별 성취기준 */
const SERIES=new Map();
STD.forEach(r=>{ if(r.sr){ if(!SERIES.has(r.sr)) SERIES.set(r.sr,[]); SERIES.get(r.sr).push(r); } });
function seriesOf(r){ return r.sr ? SERIES.get(r.sr) : null; }
/* 계열이 없는 교과(과학·사회 등)는 같은 교과·다른 학년군에서 내용이 가까운 것으로 대신한다 */
function seqGuess(r,band){
  return STD.filter(o=>o.s===r.s && o.b===band)
    .map(o=>({o,s:cos(r._v,o._v)})).filter(x=>x.s>0.08)
    .sort((a,b)=>b.s-a.s).slice(0,3);
}

/* ---------- 검색 ---------- */
function splitCandidates(t){
  const n=t.length,res=[];
  if(n<4||n>14) return res;
  for(let i=2;i<=n-2;i++){ res.push([t.slice(0,i),t.slice(i)]);
    for(let j=i+2;j<=n-2;j++) res.push([t.slice(0,i),t.slice(i,j),t.slice(j)]); }
  return res;
}
function scoreIn(hay,t,hit){
  if(hay.includes(t)){ hit&&hit.add(t); return 2; }
  for(const parts of splitCandidates(t)) if(parts.every(p=>hay.includes(p))){ hit&&parts.forEach(p=>hit.add(p)); return 1; }
  return 0;
}
let ALLTEXT=null;
function greedyPieces(t){
  if(ALLTEXT===null) ALLTEXT=STD.map(r=>r._head+''+r._body).join('');
  const res=[]; let i=0;
  while(i<t.length){ let best='';
    for(let len=Math.min(9,t.length-i);len>=2;len--){ const p=t.slice(i,i+len); if(ALLTEXT.includes(p)){ best=p; break; } }
    if(best){ res.push(best); i+=best.length; } else i++; }
  return res;
}
let HILITE=[], RELAX=null;
function filtered(){
  const raw=S.q.trim();
  const base=STD.filter(r=>
    (!S.bands.size||S.bands.has(r.b)) && (!S.subjs.size||S.subjs.has(r.s)) && (!S.areas.size||S.areas.has(r.ak)));
  HILITE=[]; RELAX=null;
  if(!raw) return base;
  if(isChoQuery(raw)){ const c=raw.replace(/\s+/g,''); return base.filter(r=>r._cho.includes(c)); }
  const terms=raw.split(/\s+/).map(norm).filter(Boolean);
  if(!terms.length) return base;
  const hits=new Set(), out=[];
  for(const r of base){
    let sc=0,ok=true,inBody=false;
    for(const t of terms){
      const h=scoreIn(r._head,t,hits), b=h?0:scoreIn(r._body,t,hits);
      if(!h&&!b){ ok=false; break; }
      sc+= h? h*2 : b; if(!h) inBody=true;
    }
    if(ok){ r._sc=sc; r._inBody=inBody; out.push(r); }
  }
  if(!out.length){
    const ps=[...new Set(terms.flatMap(greedyPieces))].filter(p=>p.length>=2);
    if(ps.length && !(ps.length===1&&ps[0]===terms[0])){
      RELAX=ps;
      for(const r of base){ let sc=0,inBody=false;
        for(const p of ps){ if(r._head.includes(p)){ sc+=4; hits.add(p); }
          else if(r._body.includes(p)){ sc+=1; inBody=true; hits.add(p); } }
        if(sc>0){ r._sc=sc; r._inBody=inBody; out.push(r); } }
    }
  }
  HILITE=[...hits];
  if(S.sort==='rel') out.sort((a,b)=>b._sc-a._sc || a.b-b.b || a.s-b.s || (a.c<b.c?-1:1));
  return out;
}
function hl(text,terms){
  const frag=document.createDocumentFragment();
  text=text||'';
  if(!terms||!terms.length){ frag.appendChild(document.createTextNode(text)); return frag; }
  const map=[]; let n='';
  for(let i=0;i<text.length;i++){ const c=norm(text[i]); if(c){ n+=c; for(let k=0;k<c.length;k++) map.push(i); } }
  const marks=new Array(text.length).fill(false);
  terms.forEach(t=>{ let p=0; while(t&&(p=n.indexOf(t,p))>=0){ for(let k=p;k<p+t.length;k++) marks[map[k]]=true; p+=t.length; } });
  let buf='',on=false;
  const flush=()=>{ if(!buf) return; frag.appendChild(on? el('mark',null,buf) : document.createTextNode(buf)); buf=''; };
  for(let i=0;i<text.length;i++){ if(marks[i]!==on){ flush(); on=marks[i]; } buf+=text[i]; }
  flush(); return frag;
}

    const row=el('div','lv lv-'+L); row.appendChild(el('div','lvb',L));
    const box=el('div','lvt');
    for(const [cat,txt] of Object.entries(a.L[L])){
      const c=el('div','catrow'); c.appendChild(el('div','catname',cat));
      const p=el('div','cattext'); p.appendChild(hl(txt,terms)); c.appendChild(p); box.appendChild(c);
    }
    row.appendChild(box); pane.appendChild(row);
  });
}

function paneSeq(pane,r){
  const ser=seriesOf(r);
  if(ser){
    pane.appendChild(hintBox(`「${r.subj} · ${r.a}」 영역은 학년군에 걸쳐 이어집니다. 아래는 같은 영역의 학년군별 성취기준으로, 앞뒤 학년의 배움을 확인할 때 씁니다.`));
    const tl=el('div','tl');
    BANDS.forEach((bn,bi)=>{
      const rows=ser.filter(x=>x.b===bi).sort((a,b)=>a.c<b.c?-1:1);
      if(!rows.length) return;
      const band=el('div','tlband'+(bi===r.b?' cur':''));
      band.appendChild(el('div','tlname',`${shortBand(bn)} — ${rows.length}개`));
      rows.forEach(o=>{
        const row=el('div','tlrow'+(o===r?' me':''));
        row.appendChild(el('span','code',o.c));
        row.appendChild(el('span',null,o.t));
        row.onclick=()=>goto(o); band.appendChild(row);
      });
      tl.appendChild(band);
    });
    pane.appendChild(tl);
  } else {
    pane.appendChild(hintBox(`${r.subj}는 학년군마다 영역(단원)이 달라 코드로 이어지는 위계가 없습니다. 대신 같은 교과의 다른 학년군에서 내용이 가까운 성취기준을 찾아 드립니다. 참고용 추정입니다.`));
    let any=false;
    BANDS.forEach((bn,bi)=>{
      if(bi===r.b) return;
      const g=seqGuess(r,bi); if(!g.length) return; any=true;
      pane.appendChild(el('div','catname',`${shortBand(bn)} — ${bi<r.b?'앞선 배움':'이어지는 배움'}`));
      g.forEach(({o,s})=>pane.appendChild(relCard(o,s,commonKw(r,o))));
    });
    if(!any) pane.appendChild(el('div','empty','다른 학년군에서 이어지는 성취기준을 찾지 못했습니다.'));
  }
}

  sims.forEach(({o,s})=>pane.appendChild(relCard(o,s,commonKw(r,o))));
}

/* ---------- 개념 지도 (온톨로지) ---------- */
function paneOnto(pane,r){
  const modes=[['bandCross','같은 학년군 · 다른 교과'],['band','같은 학년군 전체'],['subject','같은 교과'],['all','전체']];
  const m=el('div','dact'); m.style.marginBottom='9px';
  modes.forEach(([k,l])=>{ const b=el('button','btn'+(S.relMode===k?' on':''),l);
    b.onclick=()=>{ S.relMode=k; renderDetail(); }; m.appendChild(b); });
  pane.appendChild(m);
  pane.appendChild(hintBox('가운데가 지금 보는 성취기준, 가운데 동그라미는 이 성취기준이 다루는 개념, 오른쪽 네모는 같은 개념을 함께 다루는 성취기준입니다. 네모를 누르면 그 성취기준으로 옮겨 갑니다. 수학처럼 교과 고유 개념이 많으면 범위를 「같은 교과」로 바꿔 보세요.'));

  /* 좌 → 우 계층 배치: [학년군 위계] [중심 성취기준] [개념] [같은 개념을 다루는 성취기준] */
  const cons=conceptsOf(r,5);
  const pool=new Set(STD.filter(o=>o!==r && scopeFilter(r,o,S.relMode)));
  const used=new Set([r.c]);
  const groups=[];
  cons.forEach(t=>{
    const kids=(CONIDX.get(t)||[]).filter(o=>pool.has(o)&&!used.has(o.c))
      .map(o=>({o,s:cos(r._v,o._v)})).sort((a,b)=>b.s-a.s).slice(0,3);
    kids.forEach(k=>used.add(k.o.c));
    if(kids.length) groups.push({t,kids});
  });
  const ser=seriesOf(r), seq=[];
  if(ser) [[-1,'앞 학년군'],[1,'뒤 학년군']].forEach(([dir,lab])=>{
    const tb=r.b+dir; if(tb<0||tb>=BANDS.length) return;
    const c=ser.filter(o=>o.b===tb).map(o=>({o,s:cos(r._v,o._v)})).sort((a,b)=>b.s-a.s)[0];
    if(c) seq.push({o:c.o,lab,dir});
  });

  const ROW=56, X0=104, X1=330, X2=580, X3=812;
  const leaves=groups.reduce((n,g)=>n+g.kids.length,0);
  const W=930, H=Math.max(300, leaves*ROW+64), cy=H/2;
  const svg=svgEl('svg',{viewBox:`0 0 ${W} ${H}`,class:'onto'});
  svg.style.aspectRatio=`${W}/${H}`;
  const edges=[], nodes=[];

  let y=42;
  groups.forEach(g=>{
    const ys=[];
    g.kids.forEach(k=>{
      ys.push(y);
      nodes.push({t:'std',x:X3,y,label:k.o.c,sub:`${k.o.subj} · ${k.o.a}`,ref:k.o,full:k.o.t});
      y+=ROW;
    });
    const gy=(ys[0]+ys[ys.length-1])/2;
    nodes.push({t:'con',x:X2,y:gy,label:g.t});
    edges.push({a:[X1+112,cy],b:[X2-g.t.length*7-10,gy]});
    ys.forEach(yy=>edges.push({a:[X2+g.t.length*7+10,gy],b:[X3-88,yy]}));
  });
  seq.forEach(s=>{
    const sy=cy+s.dir*72;
    nodes.push({t:'std',x:X0,y:sy,label:s.o.c,sub:s.lab,ref:s.o,full:s.o.t,small:true});
    edges.push({a:[X0+72,sy],b:[X1-112,cy],cls:'edge seq'});
  });

  edges.forEach(e=>svg.appendChild(svgEl('path',{
    d:`M${e.a[0]},${e.a[1]} C${(e.a[0]+e.b[0])/2},${e.a[1]} ${(e.a[0]+e.b[0])/2},${e.b[1]} ${e.b[0]},${e.b[1]}`,
    class:e.cls||'edge'})));

  function addNode(n){
    const g=svgEl('g',{class:'nd'+(n.t==='con'?' concept':'')+(n.center?' center':'')});
    if(n.full){ const ti=svgEl('title'); ti.textContent=`${n.label} ${n.full}`; g.appendChild(ti); }
    if(n.t==='con'){
      const w=n.label.length*14+20;
      g.appendChild(svgEl('rect',{x:n.x-w/2,y:n.y-17,width:w,height:34,rx:17,class:'box'}));
      const t=svgEl('text',{x:n.x,y:n.y+5,'text-anchor':'middle','font-size':14,'font-weight':700});
      t.textContent=n.label; g.appendChild(t);
    } else {
      const w=n.center?224:176, h=n.center?60:44;
      g.appendChild(svgEl('rect',{x:n.x-w/2,y:n.y-h/2,width:w,height:h,rx:7,class:'box'}));
      const t1=svgEl('text',{x:n.x,y:n.y-(n.center?7:3),'text-anchor':'middle','font-size':n.center?15:13,
        'font-weight':800,'font-family':'Consolas,D2Coding,monospace'});
      t1.textContent=n.label; g.appendChild(t1);
      const t2=svgEl('text',{x:n.x,y:n.y+(n.center?16:14),'text-anchor':'middle','font-size':n.center?12:11,
        'font-weight':600,'opacity':.75});
      t2.textContent=(n.sub||'').slice(0,17); g.appendChild(t2);
      if(n.ref) g.onclick=()=>goto(n.ref);
    }
    svg.appendChild(g);
  }
  nodes.forEach(addNode);
  addNode({t:'std',center:true,x:X1,y:cy,label:r.c,sub:`${r.subj} · ${r.a}`});

  const wrap=el('div','ontowrap'); wrap.appendChild(svg); pane.appendChild(wrap);
  const lg=el('div','legend');
  [['b sq','네모 = 성취기준'],['b','동그라미 = 개념'],['i','선 = 같은 개념을 다룸'],['i d','점선 = 학년군 위계']]
    .forEach(([c,t])=>{ const s=el('span'); const m=el(c.startsWith('b')?'b':'i',c.slice(2)); s.appendChild(m);
      s.appendChild(document.createTextNode(t)); lg.appendChild(s); });
  pane.appendChild(lg);

  if(!groups.length) pane.appendChild(el('div','empty',
    '이 범위에서 개념을 함께 다루는 성취기준을 찾지 못했습니다. 「연관 성취기준」 탭에서 범위를 넓혀 보세요.'));
}

function saveCart(){ try{ localStorage.setItem('cart2022',JSON.stringify([...S.cart])); }catch(e){} updateCart(); }
function updateCart(){ $('#cart').hidden=S.cart.size===0; $('#cartN').textContent=S.cart.size+'개'; }
const cartRows=()=>STD.filter(r=>S.cart.has(r.c));
const csvEsc=v=>{ v=(v==null?'':String(v)); return /[",\n]/.test(v)? '"'+v.replace(/"/g,'""')+'"':v; };
function toCSV(rows){
  const head=['성취기준코드','학년군','교과','영역','성취기준','성취수준A','성취수준B','성취수준C','탐구 활동','범주 성향(추정)','원문쪽'];
  const body=rows.map(r=>[r.c,r.band,r.subj,r.a,r.t,r.A,r.B,r.C,(r.q||[]).join(' / '),mainCat(r),r.p].map(csvEsc).join(','));
  return '﻿'+[head.join(','),...body].join('\r\n');
}
function download(name,text){
  const b=new Blob([text],{type:'text/csv;charset=utf-8'}), u=URL.createObjectURL(b), a=document.createElement('a');
  a.href=u; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),1500);
}
function copy(text,btn){
  const done=()=>{ if(btn){ const t=btn.textContent; btn.textContent='복사했습니다'; setTimeout(()=>btn.textContent=t,1200); } };
  const fb=()=>{ const ta=document.createElement('textarea'); ta.value=text; ta.style.cssText='position:fixed;opacity:0';
    document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); done(); }catch(e){ alert('복사에 실패했습니다.'); } ta.remove(); };
  if(navigator.clipboard&&window.isSecureContext) navigator.clipboard.writeText(text).then(done,fb); else fb();
}
$('#btnCsv').onclick=()=>{ const rows=filtered(); download(`성취기준_검색결과_${rows.length}건.csv`,toCSV(rows)); };

};
