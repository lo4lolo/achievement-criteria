분류, 표, 그래프에 관심을 가지고, 자료를 정리하는 데 표와 ○, ×, / 등을 이용한 그래프가 활용됨을 안다."}},"p":42},{"b":0,"s":10,"a":"우리는 누구로 살아갈까","ak":"우리는누구로살아갈까","n":"우리는 누구로 살아갈까","L":{"A":{"지식·이해":"학교에서 지켜야 할 올바른 규칙과 올바른 학습 습관의 중요성 및 필요한 상황을 이해하고 올바른 생활 습관과 타인 존중, 배려, 나눔을 실천한다. 몸과 마음의 소중함과 우리 주변 동식물의 생태 습성, 생명 존중 및 자연보호를 이해한다.","과정·기능":"자기 할 일을 스스로 찾아서 완수하고 바르고 청결한 생활 습관을 지니고 있으며, 주변 사람들을 배려하고 나눔을 실천한다. 주변의 동식물에 대하여 관심을 갖고 탐색한다.","가치·태도":"학교 규칙을 이해하고 실천하며 안전한 생활 태도를 바탕으로, 자신감을 가지고 매사에 긍정적으로 행동하고 생활한다. 주변 사람들을 존중하고 감사하는 태도를 지니며 생태 환경의 중요성을 알아 자연 보호를 적극적으로 실천한다."},"B":{"지식·이해":"학교에서 지켜야 할 규칙을 알고, 올바른 생활 습관 및 타인 존중이 필요한 상황을 이해한다. 몸과 마음이 소중한 이유와 소중하게 생각해야 하는 상황을 알고 우리 주변의 동식물에 대한 생태 습성과 생명의 소중함을 이해한다.","과정·기능":"자기 할 일을 스스로 하고 청결한 생활 습관을 기르며, 주변 사람들과 나눔을 실천하고 주변의 동식물에게 관심을 가진다.","가치·태도":"학교 규칙을 실천하고 안전한 생활 태도를 기르며, 자신감을 가지고 긍정적으로 행동한다. 주변 사람들에게 감사하는 태도를 기르고 자연의 소중함을 알고 자연 보호를 실천한다."},"C":{"지식·이해":"학교에서 지켜야 할 규칙과 올바른 학습 습관의 필요성을 일부 이해하며, 타인을 존중해야 하는 상황을 구별하고 몸과 마음을 소중하게 여기는 사례를 파악하고 우리 주변의 동식물 보호에 대한 필요성을 이해한다.","과정·기능":"자기 할 일을 스스로 끝마치려 하고 잘못된 생활 습관을 고치며, 주변 사람들과 나눔을 실천하려고 하며 주변의 동식물에게 관심을 가진다.","가치·태도":"학교 규칙과 안전의 중요성을 깨닫고 긍정적 행동에 대하여 관심을 가지며, 자연 보호의 필요성을 느낀다."}},"p":61},{"b":0,"s":10,"a":"우리는 무엇을 하며 살아갈까","ak":"우리는무엇을하며살아갈까","n":"우리는 무엇을 하며 살아갈까","L":{"A":{"지식·이해":"생활에서 불편함을 겪는 사람이 있는 이유와 사례를 이해하고 개방적인 태도로 소통해야 하는 이유와 바람직한 소통 방법을 안다. 다른 사람과 협력하는 삶의 의미를 알고 협력하며 살아가야 하는 까닭을 안다. 올바른 생활 습관과 학습 습관의 의미와 자신의 습관을 점검해야 하는 이유를 안다.","과정·기능":"생활에서 지나치기 쉬운 불편한 사례를 탐색해 해결 방법을 고안하고, 개방적인 태도로 소통한다. 다른 사람과 협력해야 하는 상황을 스스로 발견해 협력하고, 생활 습관과 학습 습관 점검 방법을 익혀 스스로 점검한다.","가치·태도":"생활에서 불편함을 겪는 사람의 마음에 공감하고 문제를 적극적으로 해결하려 하며 다른 사람의 생각이나 의견을 개방적인 태도로 존중한다. 다른 사람과 협력해야 하는 상황을 포착해 자발적으로 협력하며 자신의 생활 습관과 학습 습관을 되돌아보고 개선하기 위한 계획을 세운다."},"B":{"지식·이해":"생활에서 불편함을 겪는 사람이 있는 이유와 사례를 알고 개방적인 태도로 소통해야 하는 이유와 다른 사람과 협력하는 삶의 의미를 안다. 생활 습관과 학습 습관을 점검할 필요가 있음을 파악한다.","과정·기능":"생활에서 지나치기 쉬운 불편한 사례를 보고 개선하기 위한 방법을 탐색하며 다른 사람과 바람직하게 소통하는 방법을 알고 실천한다. 여럿이 하는 활동에 협력할 줄 알아 이를 실행에 옮기고 생활 습관과 학습 습관을 점검하는 방법을 익혀 점검한다.","가치·태도":"생활에서 불편함을 겪는 사람의 마음에 공감하고 문제를 해결하려 노력하며 다른 사람의 생각이나 의견을 경청하려 노력한다. 여럿이 하는 활동에 자발적으로 협력하는 태도를 보이며 자신의 생활 습관과 학습 습관을 되돌아보고 반성한다."},"C":{"지식·이해":"생활에서 불편함을 겪는 사람이 존재하는 이유를 알고 상대의 의도가 나의 판단과 다를 수 있음을 이해한다. 다른 사람과 협력하는 삶과 경쟁적 삶의 방식을 구별할 수 있고 생활 습관과 학습 습관이 다양함을 안다.","과정·기능":"생활에서 지나치기 쉬운 불편한 사례를 구별할 수 있으며 다른 사람과 큰 무리 없이 소통한다. 여럿이 하는 활동에 협력하는 방법, 생활 습관과 학습 습관을 점검하는 방법을 알고 있다.","가치·태도":"생활에서 불편함을 겪는 사람들의 어려움에 관심을 갖고 다른 사람의 생각이나 의견을 바르게 들으려는 태도를 보인다. 여럿이 하는 활동에 협력하고 자신의 생활 습관과 학습 습관을 자신과 습관과 관련지어 생각한다."}},"p":64},{"b":0,"s":10,"a":"우리는 어디서 살아갈까","ak":"우리는어디서살아갈까","n":"우리는 어디서 살아갈까","L":{"A":{"지식·이해":"우리 집과 마을이 내가 속한 공동체임을 알고 공동체에서 할 수 있는 일을 이해한다. 우리나라 상징의 의미와 우리 문화의 필요성 및 다른 나라의 언어, 의상, 음식, 놀이 등 다양한 문화를 이해하고, 우리 주변의 다양한 공간을 열거하고 분석한다.","과정·기능":"공동으로 사용하는 시설 및 물건의 용도를 알고 소중히 다루어 바르게 사용하며, 나라를 위해 애쓰신 분들께 감사하는 마음을 표현한다. 여러 디지털 매체를 효과적으로 활용하여 다른 나라의 언어, 의상, 음식, 놀이 등을 스스로 조사할 수 있다.","가치·태도":"상대방을 배려하고 서로 돕고 나눔을 실천하며, 우리나라의 상징과 문화를 존중하고 나라를 사랑하는 태도를 기른다. 다른 나라의 문화를 이해하고 존중하며 공감하는 태도를 지니고, 새로운 일에 호기심을 가지고 적극적으로 시도하고 도전한다."},"B":{"지식·이해":"우리 집과 마을이 내가 속한 공동체임을 알고 공동체에서 할 수 있는 일을 구별한다. 우리나라의 상징과 문화에 대하여 이해하며, 다른 나라의 언어, 의상, 음식, 놀이의 종류를 탐색하고, 우리 주변의 다양한 공간의 종류를 구별한다.","과정·기능":"공동으로 사용하는 물건을 용도에 따라 바르게 사용하고, 나라의 소중함을 알고 감사의 마음을 표현한다. 디지털 매체 및 도구 사용법을 익혀 활용할 수 있고 다른 나라의 언어, 의상, 음식, 놀이 등을 조사할 수 있다.","가치·태도":"상대방을 배려하고 서로 돕고 함께 나누며, 나라를 사랑하는 마음을 가진다. 다른 나라의 문화를 존중하는 태도를 지니고 있으며, 새로운 일을 시도해 본다."},"C":{"지식·이해":"우리 집과 마을에서 할 수 있는 일을 알아보고, 우리나라의 상징을 파악한다. 다른 나라의 언어나 의상, 음식이나 놀이의 예를 들 수 있고, 우리 주변의 공간 활용에 대하여 이해한다.","과정·기능":"공동으로 사용하는 물건을 용도를 알고, 나라의 소중함과 감사함을 느낀다. 디지털 도구를 사용하는 방법을 익히고 다른 나라의 음식이나 놀이 등을 조사할 수 있다.","가치·태도":"서로 도우려는 마음을 갖고 나라를 사랑하는 마음을 가진다. 다른 나라의 문화를 존중하는 태도와 새로운 일에 관심을 가진다."}},"p":62},{"b":0,"s":10,"a":"우리는 지금 어떻게 살아갈까","ak":"우리는지금어떻게살아갈까","n":"우리는 지금 어떻게 살아갈까","L":{"A":{"지식·이해":"올바른 생활 습관의 의미와 중요성을 알고, 계절의 특성과 관련지어 계절의 특성에 따라 알맞은 생활 모습을 이해한다. 함께 사는 삶을 위해 노력한 인물을 찾아 그 인물의 훌륭한 점을 파악하며 자원을 절약하는 삶의 가치, 사례, 중요성을 안다.","과정·기능":"올바른 하루 생활 계획을 수립해 하루 생활을 관리하며 계절에 알맞은 생활 모습을 조사하고 실천한다. 함께 사는 삶을 위해 해야 할 일, 할 수 있는 일, 자원을 절약하는 방법을 탐색해 꾸준히 행동으로 옮긴다.","가치·태도":"하루를 소중히 여기고 자기가 세운 하루 생활 계획을 지키며 계절에 맞는 생활 모습 실천을 중요하게 여긴다. 함께 사는 삶을 위해 해야 할 일, 할 수 있는 일을 탐색해 실천하려는 의지와 자원을 절약하는 삶의 방식을 실천하려는 의지를 보인다."},"B":{"지식·이해":"생활 습관의 중요성을 알고, 계절에 따라 알맞은 생활 모습이 달라지는 이유를 안다. 함께 사는 삶을 위해 노력한 인물의 훌륭한 점을 알아보고 자원을 절약하는 삶의 중요성을 이해한다.","과정·기능":"올바른 하루 생활 계획 수립 방법을 파악하고 계절에 알맞은 생활 모습을 실천한다. 함께 사는 삶을 위해 우리가 할 수 있는 일과 자원절약 방법을 익혀 행동으로 옮긴다.","가치·태도":"하루를 소중히 여기면서 자기가 세운 하루 생활 계획을 실천하려 노력하며 계절에 맞는 생활 모습을 중요하게 여긴다. 함께 사는 삶을 위해 할 수 있는 일을 실천하려는 의지를 보이며 자원을 절약하는 삶의 방식을 중시한다."},"C":{"지식·이해":"생활 습관의 의미를 알고 계절에 따른 알맞은 생활 모습을 이해한다. 함께 사는 삶을 위해 노력한 인물이 누구인지 파악하고 자원을 절약하는 삶을 안다.","과정·기능":"하루 생활을 계획하고 계절에 따른 알맞은 생활 모습의 차이를 구분한다. 함께 사는 삶을 위해 노력한 인물의 훌륭한 점을 알아보고, 자원을 절약하는 삶의 방식을 구별한다.","가치·태도":"하루를 소중히 여기는 마음을 갖고 계절에 알맞은 생활 모습에 관심을 갖는다. 함께 사는 삶을 위해 해야 할 일을 실천하려 노력하고 자원을 절약하는 삶의 방식에 관심을 갖는다."}},"p":63},{"b":0,"s":11,"a":"우리는 누구로 살아갈까","ak":"우리는누구로살아갈까","n":"우리는 누구로 살아갈까","L":{"A":{"지식·이해":"학교 안팎의 다양한 시설과 사람들의 생활 모습 및 그 속에서의 안전한 생활 수칙을 안다. 내가 잘하고 좋아하는 것을 적극 파악하며, 나를 둘러싼 주변 사람들과 그 관계에 대해 이해하고, 인간은 동식물과 함께 살아가는 자연 생태의 일부임을 인식한다.","과정·기능":"학교 안팎에 있는 사람들의 생활 모습 및 안전 수칙을 조사하고, 내가 잘하고 좋아하는 것을 구체적으로 설명한다. 나를 둘러싼 많은 사람들이 어떻게 도우며 생활하는지 탐색하고, 사람과 자연이 어우러지는 생태를 탐구한다.","가치·태도":"일상에서 안전 수칙을 지켜 생활하고, 나를 존중하고 타인과 함께 더불어 살아가는 태도를 가진다."},"B":{"지식·이해":"학교 안팎의 주요 시설과 사람들의 생활 모습을 이해하고, 내가 잘하는 것과 좋아하는 것에 대해 탐색한다. 내 주변에 있는 다양한 사람들을 파악하고, 인간은 자연 속에서 살아감을 인식한다.","과정·기능":"학교 안팎의 모습과 사람들의 생활 모습을 관찰하고, ‘나’를 알아보는 탐색 활동에 참여하여 나에 대해 말할 수 있으며, 가족과 주변 사람들이 살아가는 모습과 자연의 모습을 조사한다.","가치·태도":"일상생활에서 안전하게 생활하는 태도를 기르고, 나를 이해하고 가족과 이웃에 관심을 가진다."},"C":{"지식·이해":"학교 안팎의 시설과 사람들의 생활 모습을 살펴보고, 내가 잘하거나 좋아하는 것을 파악한다. 나와 관계 있는 사람들을 알고, 인간은 자연 속에서 살아감을 인식한다.","과정·기능":"학교 안팎의 모습과 사람들의 생활 모습을 둘러보고, ‘나’를 탐색하여 나에 대해 간단히 설명하며, 우리 가족이 살아가는 모습과 주변의 동식물을 살펴본다.","가치·태도":"안전한 학교 생활의 중요성을 깨닫고 안전하게 생활하고자 노력하며, 나와 주변 사람에게 관심을 가진다."}},"p":74},{"b":0,"s":11,"a":"우리는 무엇을 하며 살아갈까","ak":"우리는무엇을하며살아갈까","n":"우리는 무엇을 하며 살아갈까","L":{"A":{"지식·이해":"생활에 필요한 다양한 도구와 그 모양과 기능, 쓰임새를 파악하고, 상상한 것을 표현할 수 있는 다양한 매체의 사용법과 재료의 특징을 터득하며, 여러 장소에서 경험한 내용과 다음 학년에서 배운 내용을 연결지어 이해한다.","과정·기능":"생활 도구의 다양한 모양과 기능을 탐색하여 새롭게 바꾸어보고, 상상한 내용을 다양한 매체와 재료로 구현한다. 관심 있는 주제를 정해 여러 가지 매체를 활용하여 조사하고, 이번 학년 생활과 연결해서 다음 학년 준비 자료를 만든다.","가치·태도":"생활 도구의 모양이나 기능에 대해 여러 가지 관점을 수용하고, 대상을 떠올릴 때 엉뚱하고 기발하게 상상하며, 이번 학년에서의 생활과 연결하여 다음 학년에서 배울 내용에 흥미와 관심을 가진다."},"B":{"지식·이해":"생활에 필요한 다양한 도구의 모양과 기능을 알고, 상상한 것을 표현할 수 있는 다양한 매체의 기초적인 사용법과 재료의 특징을 파악하며, 여러 장소에서 경험한 내용과 이번 학년에서 배운 내용을 안다.","과정·기능":"생활 도구의 모양과 기능을 탐색하여 새롭게 바꾸어보고, 상상한 내용을 다양한 매체와 재료로 구현한다. 관심 있는 주제를 정해 매체를 활용하여 조사하고, 다음 학년의 생활 모습을 이번 학년 생활과 연결하여 파악한다.","가치·태도":"생활 도구의 모양과 기능을 여러 가지 관점으로 보고, 대상을 떠올릴 때 엉뚱하고 기발하게 상상하며, 이번 학년에서 배운 내용을 바탕으로 다음 학년에서 배울 내용에 관심을 가진다."},"C":{"지식·이해":"생활에 필요한 도구가 있음을 알고, 상상한 것을 표현할 수 있는 매체나 재료가 있음을 확인하며, 여러 장소에서 경험한 내용과 이번 학년에서 배운 내용을 떠올린다.","과정·기능":"생활 도구의 다양한 모양이나 기능을 탐색하여 바꾸어보고, 상상한 내용을 매체나 재료로 구현한다. 관심 있는 주제를 정해 매체를 활용하여 조사하고, 다음 학년에서 배울 내용을 이번 학년 생활과 연결한다.","가치·태도":"생활 도구의 모양이나 기능을 다른 관점으로 바라보고, 대상을 떠올릴 때 엉뚱하거나 기발하게 상상하는 태도를 지니며, 다음 학년 생활에 관해 관심을 가진다."}},"p":77},{"b":0,"s":11,"a":"우리는 어디서 살아갈까","ak":"우리는어디서살아갈까","n":"우리는 어디서 살아갈까","L":{"A":{"지식·이해":"마을 사람들의 생활 모습과 마을에서 안전한 장소나 도움을 청할 수 있는 곳을 알고, 우리나라 및 내가 알고 싶은 나라의 모습과 문화를 이해하며, 우주나 바닷속 등 내가 궁금한 세계의 몇 가지 특징을 파악한다.","과정·기능":"마을의 모습과 마을 사람들의 생활 모습을 적극적으로 살펴보고, 우리나라 및 알고 싶은 나라의 모습과 문화를 주체적으로 조사·탐구하며, 알고 싶은 궁금한 세계를 다양한 매체를 활용하여 탐색한다.","가치·태도":"마을의 안전을 지켜주는 곳에 관심을 가지고, 우리나라에 대한 이해를 바탕으로 나라 사랑하는 마음을 기른다. 나라마다 가진 고유한 문화를 존중하고, 궁금한 세계에 호기심을 가지며 자유롭게 탐구하는 태도를 가진다."},"B":{"지식·이해":"마을 사람들이 하는 일과 마을의 안전한 곳을 알고, 우리나라 및 알고 싶은 나라의 문화를 이해하며, 우주나 바닷속 등 궁금한 세계의 특징 한 두 가지를 이해한다.","과정·기능":"마을의 모습과 마을 사람들의 생활 모습을 살펴보고, 우리나라 및 알고 싶은 나라의 문화를 탐구하며, 알고 싶은 세계에 대해 매체를 활용하여 탐색한다.","가치·태도":"마을의 안전한 곳에 관심을 가지고, 우리나라의 소중함을 깨달으며, 다른 나라의 문화를 존중하고, 궁금한 세계에 호기심을 가진다."},"C":{"지식·이해":"내가 사는 마을의 모습, 우리나라의 모습, 알고 싶은 나라의 모습을 알아보고, 우주나 바닷속 등 내가 궁금한 세계를 확인한다.","과정·기능":"마을의 모습을 살펴보고, 우리나라 및 알고 싶은 나라의 모습과 상징을 탐색하며, 매체를 활용하여 궁금한 세계에 대해 찾아본다.","가치·태도":"우리나라 및 다른 나라에 관심을 가지며, 궁금한 세계에 대해 상상한다."}},"p":75},{"b":0,"s":11,"a":"우리는 지금 어떻게 살아갈까","ak":"우리는지금어떻게살아갈까","n":"우리는 지금 어떻게 살아갈까","L":{"A":{"지식·이해":"하루의 변화 및 계절의 변화에 영향을 받는 사람들의 다양한 생활 모습을 이해하고, 내가 관심 있는 대상의 특징과 대상이 시간의 흐름에 따라 변화함을 인식하며, 지속가능성의 다양한 사례를 삶과 연관지어 파악한다.","과정·기능":"하루의 변화에 따른 사람들의 생활 모습과 나의 하루를 비교하고, 계절의 변화와 사람들의 생활 모습을 탐구한다. 관심있는 대상의 과거와 현재의 변화 모습을 살펴보고, 지속가능한 삶을 위해 내가 할 수 있는 여러 가지 일을 탐색한다.","가치·태도":"하루의 변화 모습을 생각하며 같은 시각 사람들은 무엇을 하고 있을지 예상하고, 과거와 현재의 모습을 바탕으로 관심 있는 대상의 미래를 상상하는 태도를 기른다."},"B":{"지식·이해":"하루의 변화 및 계절의 변화에 영향을 받는 사람들의 생활 모습을 알고, 내가 관심 있는 대상의 특징과 대상이 시간의 흐름에 따라 변화함을 알며, 우리 생활과 관련된 지속가능성의 사례를 파악한다.","과정·기능":"하루의 변화와 사람들의 생활 모습을 찾아보고, 계절의 변화와 사람들의 생활 모습을 탐구한다. 관심있는 대상의 과거와 현재의 변화 모습을 살펴보고 지속가능한 삶을 위해 내가 할 수 있는 일을 탐색한다.","가치·태도":"같은 시각 사람들은 무엇을 하고 있을지 예상하고, 과거와 현재의 모습을 바탕으로 관심 있는 대상의 미래를 상상하는 태도를 기른다."},"C":{"지식·이해":"하루와 계절의 변화에 따른 사람들의 생활 모습을 알고, 주어진 대상의 특징과 대상이 시간의 흐름에 따라 변화함을 알며, 우리 생활과 관련된 지속가능성의 사례를 확인한다.","과정·기능":"하루 및 계절별 변화 모습을 탐색하고, 주어진 대상의 과거와 현재의 모습을 살펴보며, 지속가능한 삶을 위해 내가 할 수 있는 일을 찾아본다.","가치·태도":"같은 시각 사람들은 무엇을 하고 있을지 관심을 가지고, 계절에 어울리는 모습을 예상하며, 미래를 떠올리는 태도를 기른다."}},"p":76},{"b":0,"s":12,"a":"우리는 누구로 살아갈까","ak":"우리는누구로살아갈까","n":"우리는 누구로 살아갈까","L":{"A":{"지식·이해":"놀이 장소의 안전 요소를 명확하게 파악하고 자신의 신체 움직임과 감각을 인식하며 주변 사람들에 대해 관심을 가지고 계절의 변화를 이해하면서 일상 속 자연의 아름다움을 지각한다.","과정·기능":"놀이에 적극적으로 참여하여 창의적으로 놀이 활동에 참여하고 서로 의견을 주고받으며 소통하는 가운데 일상 속 자연의 아름다움에 대한 느낌을 적극적으로 감상하고 표현한다.","가치·태도":"안전한 생활을 습관화하며 건강하고 즐겁게 생활한다."},"B":{"지식·이해":"놀이 장소의 안전 요소를 알고 자신의 신체와 감각을 인식하며 주변 사람들에 대해 호기심을 가지는 가운데 계절의 변화를 알고 일상 속 자연의 아름다움을 지각한다.","과정·기능":"놀이 규칙을 지키며 놀이 활동에 참여하고 서로 의견을 주고받으며 함께 활동하는 가운데 자연의 아름다움에 대한 감상을 표현한다.","가치·태도":"안전한 생활을 위해 노력하며 즐겁게 생활한다."},"C":{"지식·이해":"안전한 놀이 장소의 필요성을 인식하고 자신의 신체 변화와 몸의 움직임을 느끼며 주변 사람들과 계절의 변화를 인식한다.","과정·기능":"놀이를 통한 기본 움직임 활동에 참여하여 주변 사람들과 대화를 나누며 계절에 대한 자신의 느낌을 표현한다.","가치·태도":"안전 상황을 살피며 활동한다."}},"p":85},{"b":0,"s":12,"a":"우리는 무엇을 하며 살아갈까","ak":"우리는무엇을하며살아갈까","n":"우리는 무엇을 하며 살아갈까","L":{"A":{"지식·이해":"주제에 대한 생각과 느낌이 사람마다 다를 수 있다는 점과 시간의 연속성에 대해 이해한다.","과정·기능":"다양한 재료의 특징을 고려하여 창의적으로 놀잇감을 만들고, 맥락에 어울리는 창의적인 방식으로 놀이하며, 생각과 느낌을 살려 독창적인 전시나 공연을 준비하고 적극적으로 수행하며, 과거의 경험을 토대로 앞으로 하고 싶은 일을 떠올린다.","가치·태도":"제작의 즐거움을 느끼고, 자유롭게 상상하는 활동에 몰입하며, 과거의 경험에 의미를 부여하고 미래에 대한 기대감을 갖는다."},"B":{"지식·이해":"주제에 따라 생각과 느낌이 달라지는 것과 과거·현재·미래의 관계에 대해 이해한다.","과정·기능":"다양한 재료의 특징을 고려하여 놀잇감을 만들고, 맥락에 어울리는 방식으로 놀이하며, 생각과 느낌이 드러나도록 전시나 공연을 준비·수행하고, 과거의 일과 가까운 미래에 하고 싶은 일을 떠올린다.","가치·태도":"제작과 자유롭게 상상하는 활동에 관심을 보이고 참여하며, 과거의 경험에 감정을 느끼고 미래를 생각해 본다."},"C":{"지식·이해":"주제에 대한 자신의 생각이나 느낌과 시간을 나타내는 말을 안다.","과정·기능":"다양한 재료를 활용해 놀잇감을 만들고, 맥락에 따라 놀이를 하며, 전시나 공연을 준비하고 수행하는 과제에 소극적으로 참여하며, 과거의 일을 떠올린다.","가치·태도":"제작과 자유롭게 상상하는 활동에 참여하고, 과거의 경험에 대해 감정을 느낀다."}},"p":88},{"b":0,"s":12,"a":"우리는 어디서 살아갈까","ak":"우리는어디서살아갈까","n":"우리는 어디서 살아갈까","L":{"A":{"지식·이해":"자신이 참여 가능한 놀이, 표현, 감상 활동을 명확히 이해하고 다양한 세상의 영역을 자세하게 파악하며 우리나라와 다른 나라 문화예술의 특징에 대하여 이해한다.","과정·기능":"우리나라와 다른 나라 문화예술에 대하여 흥미와 호기심을 가지고 일상생활 속 문화 활동에 자발적으로 참여하며 창의적인 생각과 폭넓은 상상을 통해 자신의 생각을 적극적으로 표현한다.","가치·태도":"문화예술 활동에 참여하려는 적극적인 의지와 태도를 지녔으며 다른 나라의 문화적 다양성을 존중한다."},"B":{"지식·이해":"자신이 참여 가능한 놀이, 표현, 감상 활동이 무엇인지 알고 다양한 세상의 영역을 파악하며 우리나라와 다른 나라 문화예술의 특징에 대하여 살펴본다.","과정·기능":"우리나라와 다른 나라 문화예술에 대하여 관심을 가지고 일상생활 속 문화 활동에 참여하며 폭넓은 상상을 통해 자신의 생각을 표현한다.","가치·태도":"문화예술 활동에 관심을 가지고 참여하는 태도를 나타내며 문화적 다양성을 존중한다."},"C":{"지식·이해":"자신이 참여할 수 있는 놀이를 알고 다양한 세상의 영역을 접하며 우리나라 및 다른 나라의 문화예술을 경험한다.","과정·기능":"지역 축제 등에 참여하고 다른 나라의 놀이, 노래, 축제 등을 경험하며 창의적인 상상을 통해 느낌을 자유롭게 표현한다.","가치·태도":"문화예술 활동에 참여하고 문화적 다양성을 인식한다."}},"p":86},{"b":0,"s":12,"a":"우리는 지금 어떻게 살아갈까","ak":"우리는지금어떻게살아갈까","n":"우리는 지금 어떻게 살아갈까","L":{"A":{"지식·이해":"건강을 위해 자신이 실천할 수 있는 운동과 생활 습관을 알고, 날씨·계절의 변화에 따른 놀이의 차이를 이해하며, 아동 권리를 일상 장면에 적용한다.","과정·기능":"자연이 변화하는 특징을 살려 놀이하고, 전통문화를 창의적으로 해석하여 주제를 표현하며, 다양한 상황에서 아동 권리를 효과적으로 표현한다.","가치·태도":"건강하고 활기차게 생활하기 위한 다양한 습관을 형성하며, 전통문화를 소중히 여기고, 안전하고 안녕한 생활을 일상화한다."},"B":{"지식·이해":"건강에 도움이 되는 운동과 생활 습관을 알고, 날씨·계절에 따라 달라지는 놀이의 다양한 사례를 알며, 아동 권리를 보호하는 사례를 안다.","과정·기능":"자연의 특징을 살려 놀이하고, 전통문화를 반영하여 주제를 표현하며, 다양한 상황에서 아동 권리를 표현한다.","가치·태도":"건강하고 활기차게 생활하기 위한 습관을 형성하며, 전통문화의 중요성을 느끼고, 안전하고 안녕한 생활을 일상화하기 위해 노력한다."},"C":{"지식·이해":"건강이 운동과 생활습관에 영향을 받음을 알고, 날씨·계절에 따라 놀이가 달라진다는 것을 알며, 아동 권리의 의미를 안다.","과정·기능":"자연에 대한 놀이를 하고, 전통문화와 관련된 내용을 포함하여 표현하며, 단순한 맥락에서 아동 권리를 표현한다.","가치·태도":"건강하고 활기차게 생활하기 위한 습관을 기르기 위해 노력하고, 전통문화의 중요성을 느끼며, 안전하고 안녕한 생활을 하기 위해 노력한다."}},"p":87},{"b":1,"s":0,"a":"듣기·말하기","ak":"듣기말하기","n":"듣기·말하기","L":{"A":{"지식·이해":"대화, 발표, 토의와 같은 담화 유형을 충분히 이해하고, 상황 맥락을 고려하여 의사소통의 목적에 알맞게 듣고 말하는 방법을 알 수 있다.","과정·기능":"목적에 따라 중요한 내용과 주제를 정확하게 파악하며 듣고 핵심적인 내용을 중심으로 요약하며, 원인과 결과의 관계를 올바르게 고려하여 내용을 적극적으로 예측하며 듣고 원인과 결과가 분명하게 드러나게 말할 수 있다. 말할 내용 및 말하기 상황에 적절한 준언어·비언어적 표현을 효과적으로 활용하여 듣고 말하고, 담화 상황과 상대의 입장을 정확히 이해하고 대화 과정을 스스로 점검하여 예의를 지키며 대화할 수 있다. 듣는 이, 발표 상황, 발표 목적과 주제를 고려하여 자료를 체계적으로 정리하여 자신감 있는 태도로 발표하며, 주제에 대한 적절한 의견과 타당한 이유를 분명하게 제시하고 서로의 생각을 적극적으로 교환하면서 토의에 참여할 수 있다.","가치·태도":"다양한 담화 유형에 적극적으로 참여함으로써 화자와 청자로서 효능감을 가진다."},"B":{"지식·이해":"대화, 발표, 토의와 같은 담화 유형을 이해하고, 상황 맥락을 고려하여 듣고 말하는 방법을 알 수 있다.","과정·기능":"중요한 내용과 주제를 파악하며 듣고 중심 내용과 세부 내용을 구분하여 요약하며, 원인과 결과의 관계를 고려하여 내용을 예측하며 듣고 원인과 결과가 드러나게 말할 수 있다. 말하기 상황에 적절한 준언어·비언어적 표현을 활용하여 듣고 말하고, 담화 상황과 상대의 입장을 이해하고 예의를 지키며 대화할 수 있다. 발표 목적과 주제를 고려하여 자료를 정리하고 자신감 있게 발표하며, 주제에 대한 적절한 의견과 이유를 제시하고 서로의 생각에 대해 묻고 답하면서 토의에 참여할 수 있다.","가치·태도":"다양한 담화 유형에 참여함으로써 화자와 청자로서 효능감을 가진다."},"C":{"지식·이해":"대화, 발표, 토의와 같은 담화 유형을 제한적으로 이해하고 듣고 말하는 방법을 안다.","과정·기능":"중요한 내용과 주제의 일부를 파악하며 듣고 자신이 파악한 내용을 중심으로 요악하며, 원인과 결과의 관계를 알고 내용을 부분적으로 예측하며 듣고 원인과 결과가 일부 드러나게 말한다. 준언어·비언어적 표현을 일부 활용하여 듣고 말하고, 일부 담화 상황에서 예의를 지키며 대화한다. 발표 주제와 관련된 자료를 수집하고 이를 나열하는 수준에서 발표하며, 주제에 대한 의견과 이유를 일부 제시하고 서로의 생각을 제한적으로 묻고 답하며 토의에 참여한다.","가치·태도":"다양한 담화 유형에 참여하려는 태도를 지닌다."}},"p":28},{"b":1,"s":0,"a":"매체","ak":"매체","n":"매체","L":{"A":{"지식·이해":"인터넷 자료의 다양한 형태, 인터넷 자료의 활용 방법, 매체를 활용한 발표 자료 제작 방법, 매체 소통 윤리의 필요성과 구체적인 실천 원리를 이해한다.","과정·기능":"다양한 방식으로 인터넷 자료를 학습에 활용하고 발표에 필요한 매체 자료를 효과적으로 제작할 수 있다.","가치·태도":"학습의 다양한 목적에 매체와 매체 자료를 적극적으로 활용하려는 태도를 지니며, 매체 자료의 활용과 매체 자료의 제작 과정에 관여하는 매체 소통 윤리도 충실히 지키려는 태도를 지닌다."},"B":{"지식·이해":"인터넷에서 자료의 형태, 인터넷 자료의 활용 방법, 매체 자료의 기본적인 제작 방법, 매체 소통 윤리의 필요성을 이해한다.","과정·기능":"학습에 필요한 인터넷 자료를 활용하며 발표를 위한 매체 자료를 제작할 수 있다.","가치·태도":"매체와 매체 자료를 학습에 활용하려는 태도를 지니며, 매체 소통 윤리를 지키려는 태도를 지닌다."},"C":{"지식·이해":"인터넷 자료를 이용하는 방식이 책이나 도서관을 이용하는 방식과는 다르며 매체 소통에는 지켜야 할 예절이 있음을 안다.","과정·기능":"안내와 시범에 따라 학습에 필요한 인터넷 자료를 찾고 발표를 위해 기초적인 매체 자료를 제작한다.","가치·태도":"학습 상황에 매체와 매체 자료를 활용하는 데 관심을 보이며, 매체 소통의 기초적인 윤리를 지킨다."}},"p":33},{"b":1,"s":0,"a":"문법","ak":"문법","n":"문법","L":{"A":{"지식·이해":"단어의 의미, 단어 간의 의미 관계, 단어의 분류, 문장의 기본 구조, 높임 표현과 지시·접속 표현, 의사소통 및 관계 형성 수단으로서의 언어에 대해 종합적으로 알 수 있다.","과정·기능":"언어 단위를 분석하며 글과 담화에 적절한 표현을 효과적으로 사용하고 국어사전의 정보를 종합적으로 활용할 수 있다.","가치·태도":"국어를 소중히 여기는 태도를 내면화한다."},"B":{"지식·이해":"단어의 의미, 단어 간의 의미 관계, 단어의 분류, 문장의 기본 구조, 높임 표현과 지시·접속 표현, 의사소통 및 관계 형성 수단으로서의 언어에 대해 알 수 있다.","과정·기능":"언어 단위를 이해하며 글과 담화에 적절한 표현을 사용하고 국어사전의 정보를 활용할 수 있다.","가치·태도":"국어의 소중함을 인식하는 태도를 지닌다."},"C":{"지식·이해":"단어의 의미, 단어 간의 의미 관계, 단어의 분류, 문장의 기본 구조, 높임 표현과 지시·접속 표현, 의사소통 및 관계 형성 수단으로서의 언어에 대해 제한적으로 안다.","과정·기능":"언어 단위를 확인하고 글과 담화에 쓰인 표현과 국어사전의 정보를 일부 활용한다.","가치·태도":"국어의 소중함에 관심을 가진다."}},"p":31},{"b":1,"s":0,"a":"문학","ak":"문학","n":"문학","L":{"A":{"지식·이해":"시, 이야기, 극의 특성을 이해하고 문학 작품을 통한 소통에서 독자의 맥락을 고려해야 함을 안다.","과정·기능":"작품 속 세계와 현실 세계의 공통점이나 차이점을 구체적으로 비교하면서 작품을 듣거나 읽고, 작품이 마음에 든 이유를 구체적으로 밝히며, 인물과 이야기의 흐름, 감각적 표현의 특성을 적절하게 파악하며 작품을 감상하고, 감각적 표현을 적절하게 활용하여 자신의 생각이나 감정을 적극적으로 표현할 수 있다.","가치·태도":"재미나 감동을 느끼며 작품을 적극적으로 찾아 읽고 주체적으로 감상하는 태도를 지닌다."},"B":{"지식·이해":"시, 이야기, 극의 특성을 부분적으로 이해하고 문학 작품을 통한 소통에서 자신의 경험을 고려해야 함을 안다.","과정·기능":"작품 속 세계와 현실 세계의 공통점이나 차이점을 비교하면서 작품을 듣거나 읽고, 작품이 마음에 든 이유를 밝히며, 인물과 이야기의 흐름, 감각적 표현의 특성을 파악하며 작품을 감상하고, 감각적 표현을 활용하여 자신의 생각이나 감정을 표현할 수 있다.","가치·태도":"재미나 감동을 느끼며 작품을 찾아 읽고 감상하는 태도를 지닌다."},"C":{"지식·이해":"시, 이야기, 극의 특성을 부분적으로 이해한다.","과정·기능":"작품 속 세계와 현실 세계의 공통점이나 차이점을 부분적으로 비교하면서 작품을 듣거나 읽고 마음에 드는 부분을 찾으며, 인물과 이야기의 흐름, 감각적 표현의 특성을 부분적으로 파악하며 작품을 감상하고, 감각적 표현을 활용하여 자신의 생각이나 감정을 간단하게 표현한다.","가치·태도":"주어진 작품을 읽고 재미나 감동을 느끼는 태도를 지닌다."}},"p":32},{"b":1,"s":0,"a":"쓰기","ak":"쓰기","n":"쓰기","L":{"A":{"지식·이해":"쓰기에서 상황 맥락의 개념과 필요성을 인식하고 이에 대한 이해를 바탕으로, 절차와 결과를 보고하는 글, 이유를 들어 의견을 제시하는 글, 독자에게 마음을 전하는 글의 특성을 이해하고 이와 같은 유형의 글을 쓰는 방법을 알 수 있다.","과정·기능":"중심 문장과 뒷받침 문장을 갖추어 문단을 짜임새 있게 쓸 수 있다. 목적, 주제와 같은 쓰기의 상황 맥락을 전체적으로 고려하여 글의 내용을 생성하고, 절차와 결과, 의견과 이유에 따라 내용을 조직하며 사실에 기반한 내용을 간결하고 정확하게 표현할 수 있다. 자신의 쓰기 과정을 능동적으로 점검하고 문장과 문단 수준에서 글의 내용과 표현을 효과적으로 고쳐 쓸 수 있다.","가치·태도":"쓰기에 대해 긍정적으로 인식하며 다양한 유형의 글을 쓰면서 쓰기에 자신감을 지닌다."},"B":{"지식·이해":"쓰기에서 상황 맥락을 고려하는 것이 필요한 이유를 알고, 절차와 결과를 보고하는 글, 이유를 들어 의견을 제시하는 글, 독자에게 마음을 전하는 글의 특성을 알 수 있다.","과정·기능":"중심 문장과 뒷받침 문장을 갖추어 문단을 쓸 수 있다. 목적, 주제를 고려하여 글의 내용을 생성하고, 절차와 결과, 의견과 이유에 따라 내용을 조직하며 사실에 기반한 내용을 정확하게 표현할 수 있다. 자신의 쓰기 과정을 점검하고 문장과 문단 수준에서 글의 내용과 표현을 고쳐 쓸 수 있다.","가치·태도":"다양한 유형의 글을 쓰면서 쓰기에 자신감을 지닌다."},"C":{"지식·이해":"쓰기에서 상황 맥락이 있음을 알고, 절차와 결과를 보고하는 글, 이유를 들어 의견을 제시하는 글, 독자에게 마음을 전하는 글의 특성을 부분적으로 안다.","과정·기능":"중심 문장과 뒷받침 문장을 갖추어 문단을 쓴다. 목적, 주제를 부분적으로 고려하여 글의 내용을 생성하고, 절차와 결과 또는 의견과 이유에 따라 내용을 조직하며 표현한다. 자신의 쓰기 과정을 점검하고 일부 유형의 글을 쓸 때 문장 수준에서 글의 내용이나 표현을 고쳐 쓴다.","가치·태도":"일부 유형의 글을 쓰면서 쓰기에 자신감을 지닌다."}},"p":30},{"b":1,"s":0,"a":"읽기","ak":"읽기","n":"읽기","L":{"A":{"지식·이해":"상황 맥락을 고려하여 친숙한 화제의 글, 설명 대상과 주제가 명시적인 글, 주장과 이유, 근거가 명시적인 글, 생각이나 감정이 명시적으로 제시된 글의 특성을 정확하게 알 수 있다.","과정·기능":"글의 의미를 파악하며 정확하고 유창하게 글을 읽을 수 있고, 문단과 글에서 중심 생각을 파악하고 내용을 효과적으로 간추리며 질문을 활용하여 글을 예측할 수 있고, 자신의 읽기 과정을 점검하고, 글에서 사실과 의견을 구분하고 필자와 자신의 의견을 비교하며 글이나 자료의 출처가 믿을 만한지 적극적으로 판단하며 읽을 수 있다.","가치·태도":"바람직한 읽기 습관을 형성하고 읽기에 자신감을 지닌다."},"B":{"지식·이해":"상황 맥락을 고려하여 친숙한 화제의 글, 설명 대상과 주제가 명시적인 글, 주장과 이유, 근거가 명시적인 글, 생각이나 감정이 명시적으로 제시된 글을 이해할 수 있다.","과정·기능":"글의 의미를 파악하며 유창하게 글을 읽을 수 있고, 문단과 글에서 중심 생각을 파악하고 내용을 간추리며 질문을 활용하여 글을 예측할 수 있고, 읽기 과정을 점검하고, 글에서 사실과 의견을 구분하고 필자와 자신의 의견을 비교하며 글이나 자료의 출처를 판단하며 읽을 수 있다.","가치·태도":"바람직한 읽기 습관을 형성하고 읽기에 자신감을 지닌다."},"C":{"지식·이해":"친숙한 화제의 글, 설명 대상과 주제가 명시적인 글, 주장과 이유, 근거가 명시적인 글, 생각이나 감정이 명시적으로 제시된 글을 부분적으로 이해한다.","과정·기능":"글의 의미를 파악하며 글을 읽고, 부분적으로 문단과 글에서 중심 생각을 파악하고 내용을 간추리며 글을 예측하며 읽기 과정을 점검하고, 글에서 사실과 의견을 구분하고 자신의 의견을 비교하며 글이나 자료의 출처가 믿을 만한지 판단하며 읽는다.","가치·태도":"바람직한 읽기 습관과 읽기에 제한적인 자신감을 지닌다."}},"p":29},{"b":1,"s":1,"a":"경제활동과 지역 간 교류","ak":"경제활동과지역간교류","n":"경제활동과 지역 간 교류","L":{"A":{"지식·이해":"자원의 희소성, 경제활동에서의 합리적 선택 및 생산과 소비 활동 개념을 제시하고, 여러 인적·물적 교류의 사례를 통해 지역 및 사람들의 상호 의존 관계를 설명할 수 있다.","과정·기능":"경제활동에서 선택의 문제가 발생하는 사례를 조사하고, 생산과 소비 활동의 사례를 분석하며, 여러 인적·물적 교류의 사례를 조사함으로써 각 지역 및 사람들이 상호 의존 관계를 맺고 있음을 도출할 수 있다.","가치·태도":"경제활동에서 합리적 선택의 방법을 실천할 수 있다."},"B":{"지식·이해":"자원의 희소성, 경제활동에서 선택의 문제 및 생산과 소비 활동의 개념을 설명하고, 인적·물적 교류의 사례를 통해 각 지역 사람들이 상호 의존 관계에 있음을 제시할 수 있다.","과정·기능":"사례를 통해 생산과 소비 활동을 구분하며, 인적·물적 교류의 사례를 통해 각 지역 및 사람들이 상호 의존 관계에 있음을 탐색할 수 있다.","가치·태도":"경제활동에서 합리적 선택을 실천하고자 하는 태도를 가진다."},"C":{"지식·이해":"자원의 희소성으로 인해 경제활동에서 선택의 문제가 발생함을 제시하고, 생산과 소비 활동의 개념과 인적·물적 교류를 이해할 수 있다.","과정·기능":"생산과 소비 활동을 구분하고, 인적·물적 교류의 사례를 조사할 수 있다.","가치·태도":"경제활동에서 합리적 선택을 실천하는 데에 관심을 가진다."}},"p":48},{"b":1,"s":1,"a":"다양한 환경과 삶의 모습","ak":"다양한환경과삶의모습","n":"다양한 환경과 삶의 모습","L":{"A":{"지식·이해":"여러 지역의 환경 및 환경의 이용과 개발에 따른 변화를 설명하고, 도시 생활의 장점과 단점을 중심으로 도시에서의 삶의 모습을 설명할 수 있다.","과정·기능":"여러 지역의 자연환경과 인문환경을 분석하여 환경 특징을 도출하고, 우리나라 여러 도시의 사례를 조사하여 도시의 인구, 교통, 산업 등의 특징을 도출할 수 있다.","가치·태도":"환경 개발과 보전에 관해 균형 있는 관점을 가진다."},"B":{"지식·이해":"여러 지역의 환경 이용과 개발에 따른 변화를 설명하고, 도시 생활의 장점과 단점을 설명할 수 있다.","과정·기능":"여러 지역의 자연환경과 인문환경을 조사하여 우리 지역과의 유사점과 차이점을 발견하고, 우리나라 여러 도시의 인구, 교통, 산업의 특징을 조사할 수 있다.","가치·태도":"환경 개발과 보전에 관심을 가진다."},"C":{"지식·이해":"환경의 이용과 개발에 따른 변화와 도시의 특징, 도시에서의 생활 모습을 말할 수 있다.","과정·기능":"여러 지역의 자연환경과 인문환경 및 우리나라 여러 도시의 인구, 교통, 산업의 특징을 나타낸 자료를 살펴보고, 특징을 찾을 수 있다.","가치·태도":"환경 보전에 관심을 가진다."}},"p":50},{"b":1,"s":1,"a":"민주주의와 자치","ak":"민주주의와자치","n":"민주주의와 자치","L":{"A":{"지식·이해":"학교 자치 사례를 통해 민주주의의 의미를 설명하고, 지역에서 이루어지는 민주주의의 사례를 통해 주민 자치와 주민 참여의 중요성을 이해하며, 지역사회의 문제와 해결 방안을 설명할 수 있다.","과정·기능":"학교 자치 사례를 조사하여 민주주의의 의미를 도출하고, 지역에서 이루어지는 민주주의의 사례 및 지역사회의 문제가 무엇인지 조사할 수 있다.","가치·태도":"학교생활에서 민주주의를 실천하고, 지역사회 문제 해결에 관심을 갖고 참여한다."},"B":{"지식·이해":"학교 자치 사례를 통하여 민주주의의 의미를 제시하고, 주민 자치와 주민 참여의 중요성 및 지역사회의 문제와 해결 방안을 제시할 수 있다.","과정·기능":"학교 자치 사례를 통해 민주주의의 의미를 분석하고, 지역에서 이루어지는 민주주의 사례를 조사할 수 있다.","가치·태도":"학교생활에서 민주주의를 실천하고 지역사회 문제 해결에 관심을 가진다."},"C":{"지식·이해":"학교 자치 사례를 통해 민주주의의 의미를 제시하고, 주민 자치와 주민 참여 및 지역사회 문제 해결의 중요성을 말할 수 있다.","과정·기능":"학교 자치 사례를 통해 민주주의의 의미를 도출할 수 있다.","가치·태도":"학교생활에서 민주주의를 실천하고자 노력한다."}},"p":48},{"b":1,"s":1,"a":"사회 변화와 다양한 문화","ak":"사회변화와다양한문화","n":"사회 변화와 다양한 문화","L":{"A":{"지식·이해":"최근 사회 변화의 양상과 특징 및 그로 인한 생활 모습의 변화를 파악하고, 다양한 문화가 확산되며 나타나는 긍정적 변화와 부정적 변화를 설명할 수 있다.","과정·기능":"사례를 통해 최근 사회 변화의 양상과 특징 및 그로 인한 생활 모습의 변화를 분석하고, 다양한 문화의 확산 및 공유 과정에서 나타나는 긍정적 변화와 부정적 변화를 도출할 수 있다.","가치·태도":"나와 다른 사람이나 집단의 문화를 존중하는 태도를 가지고 이를 실천할 수 있다."},"B":{"지식·이해":"최근 사회 변화의 양상과 특징 및 그로 인해 변화한 생활 모습을 제시하고, 다양한 문화가 확산되며 나타나는 변화를 설명할 수 있다.","과정·기능":"최근 사회 변화의 양상과 특징 및 그로 인해 변화한 생활 모습을 분석하고, 다양한 문화가 확산되며 나타나는 변화를 조사할 수 있다.","가치·태도":"나와 다른 사람이나 집단의 문화에 관심을 가지고, 이를 존중하는 태도를 지닌다."},"C":{"지식·이해":"최근 사회 변화의 특징을 나열하고, 다양한 문화가 확산되며 나타나는 변화를 말할 수 있다.","과정·기능":"최근 사회 변화의 특징과 우리 사회에 다양한 문화가 확산되며 나타나는 긍정적 변화를 주변에서 찾을 수 있다.","가치·태도":"나와 다른 사람이나 집단의 문화를 존중하는 태도를 지닌다."}},"p":45},{"b":1,"s":1,"a":"옛날과 오늘날의 생활 모습","ak":"옛날과오늘날의생활모습","n":"옛날과 오늘날의 생활 모습","L":{"A":{"지식·이해":"옛날과 오늘날을 비교하며 옛날 풍습에 담긴 사람들의 생활과 생각을 이해하고, 시대에 따른 교통 및 통신 수단의 변화 과정을 통해 생활 모습이 바뀌고 생활 공간이 확대되었음을 설명할 수 있다.","과정·기능":"옛날과 오늘날의 모습을 비교하여 변화된 부분을 탐색할 수 있으며, 변화로 인해 달라진 사람들의 생활 모습을 일상생활의 경험과 관련지어 분석할 수 있다.","가치·태도":"시대에 따른 사람들의 다양한 생활 모습을 존중하고 변화된 모습에서 발전의 성과와 한계를 종합적으로 성찰할 수 있다."},"B":{"지식·이해":"옛날과 오늘날을 비교하며 풍습과 생활상이 변화했음을 알고, 시대에 따른 교통 및 통신 수단의 변화 과정을 파악하여 생활 모습이 달라졌음을 설명할 수 있다.","과정·기능":"옛날과 오늘날의 모습을 비교하여 변화된 부분 및 변화로 인해 달라진 사람들의 생활 모습을 찾을 수 있다.","가치·태도":"시대에 따른 사람들의 다양한 생활 모습을 존중하고 변화된 모습에서 발전의 성과와 한계를 이해하는 태도를 지닌다."},"C":{"지식·이해":"풍습의 종류를 알고 시대에 따른 교통 및 통신 수단의 변화 과정을 말할 수 있다.","과정·기능":"옛날과 오늘날의 모습을 비교할 수 있으며 변화로 인해 달라진 사람들의 생활 모습을 살펴볼 수 있다.","가치·태도":"시대에 따른 사람들의 다양한 생활 모습을 존중하는 태도를 지닌다."}},"p":46},{"b":1,"s":1,"a":"우리 지역의 문화유산","ak":"우리지역의문화유산","n":"우리 지역의 문화유산","L":{"A":{"지식·이해":"지역의 문화유산을 통해 문화유산의 의미와 특징을 알고 유형을 구별할 수 있으며, 지역의 역사적 사실을 습득하고 지역의 고유성을 설명할 수 있다.","과정·기능":"지역의 문화유산을 토대로 옛날 사람들의 생활 모습을 추론할 수 있으며 지역의 박물관, 기념관, 유적지 등을 체험하며 지역의 역사적 사실을 분석할 수 있다.","가치·태도":"지역의 문화유산과 역사에 담긴 가치를 소중히 여기며 지역의 문화유산과 역사를 보존하려는 태도를 가진다."},"B":{"지식·이해":"지역의 문화유산을 통해 문화유산의 의미를 알고 유형을 나눌 수 있으며 지역의 역사적 사실을 나열할 수 있다.","과정·기능":"지역의 문화유산을 토대로 옛날 사람들의 생활 모습을 설명할 수 있으며 지역의 박물관, 기념관, 유적지 등을 체험하여 지역의 역사적 사실을 탐색할 수 있다.","가치·태도":"지역의 문화유산과 역사에 대한 관심과 흥미를 토대로 지역의 문화유산과 역사를 지키려는 태도를 가진다."},"C":{"지식·이해":"지역의 문화유산을 통해 문화유산의 의미와 유형을 알고 지역의 역사적 사실을 파악할 수 있다.","과정·기능":"지역의 문화유산을 토대로 옛날 사람들의 생활 모습을 짐작하여 말할 수 있으며 지역의 박물관, 기념관, 유적지 등을 살펴볼 수 있다.","가치·태도":"지역의 문화유산과 역사에 대해 관심과 흥미를 가진다."}},"p":47},{"b":1,"s":1,"a":"우리가 사는 곳","ak":"우리가사는곳","n":"우리가 사는 곳","L":{"A":{"지식·이해":"주변의 여러 장소에 대한 장소감을 다양한 방식으로 표현하고, 살기 좋은 곳의 조건을 분석하여 우리가 사는 곳을 더 살기 좋은 곳으로 만드는 방법을 제안할 수 있다.","과정·기능":"자신의 장소감과 다른 사람의 장소감을 비교하고, 주변 여러 장소를 조사한 바를 토대로 살기 좋은 점과 불편한 점을 구분할 수 있다.","가치·태도":"서로 다른 장소감을 존중하며, 주변 환경에 대한 감수성을 지니고 살기 좋은 환경에 관심을 가진다."},"B":{"지식·이해":"주변 여러 장소에서의 경험과 느낌을 표현하고, 우리가 사는 곳을 더 살기 좋은 곳으로 만드는 방법을 제시할 수 있다.","과정·기능":"다른 사람의 장소감을 관찰하고, 주변 여러 장소를 조사하여 좋은 점과 불편한 점을 구분할 수 있다.","가치·태도":"서로 다른 장소감을 존중하는 태도를 지니고, 살기 좋은 환경에 관심을 가진다."},"C":{"지식·이해":"주변 여러 장소의 경험과 느낌을 표현하고, 우리가 사는 곳의 좋은 점과 불편한 점을 나열할 수 있다.","과정·기능":"다른 사람의 장소감을 관찰하고, 주변 여러 장소를 조사할 수 있다.","가치·태도":"서로 다른 장소감의 차이를 인정하고, 주변 여러 장소에 관심을 가진다."}},"p":44},{"b":1,"s":1,"a":"일상에서 만나는 과거","ak":"일상에서만나는과거","n":"일상에서 만나는 과거","L":{"A":{"지식·이해":"역사의 시간 개념을 알고 과거의 모습을 보여주는 자료는 역사적 증거로 활용된다는 점을 파악하며 시대에 따라 사람들의 생활 모습이 달라짐을 설명할 수 있다.","과정·기능":"시간의 흐름을 경험할 수 있는 사례를 일상에서 찾아 분석하고 과거의 삶이 반영된 물건이나 자료 등을 통해 과거의 모습을 추론하며 지역의 변화상과 사람들의 달라진 생활 모습을 찾을 수 있다.","가치·태도":"나와 가족의 삶이 역사의 일부임을 받아들이며 과거를 알려주는 자료의 역사적 가치를 알고, 이를 소중히 여기는 태도를 가진다."},"B":{"지식·이해":"역사의 시간 개념과 역사적 증거의 의미를 파악하고, 지역 사람들의 달라진 생활 모습을 설명할 수 있다.","과정·기능":"시간의 흐름을 경험할 수 있는 사례 및 과거의 삶이 반영된 물건을 일상에서 찾아보고, 지역 사람들의 달라진 생활 모습을 현재와 비교할 수 있다.","가치·태도":"나와 가족의 삶이 역사의 일부임을 받아들이고 과거를 알려주는 자료들이 역사적으로 가치가 있음을 안다."},"C":{"지식·이해":"시간의 흐름을 이해하고 오래된 물건이나 자료들이 과거의 모습을 담고 있음을 알며 지역 사람들의 달라진 생활 모습을 나열할 수 있다.","과정·기능":"시간의 흐름을 경험할 수 있는 사례, 과거의 모습을 담고 있는 물건, 지역의 변화상을 보여주는 역사 자료를 찾아볼 수 있다.","가치·태도":"나와 가족의 삶이 역사의 일부임을 알고 과거를 알려주는 자료들에 관심을 가진다."}},"p":44},{"b":1,"s":1,"a":"지도로 만나는 우리 지역","ak":"지도로만나는우리지역","n":"지도로 만나는 우리 지역","L":{"A":{"지식·이해":"지도에 나타난 요소의 의미와 쓰임을 설명하고, 우리 지역의 지리적 특징을 다른 지역과 비교하여 설명할 수 있다.","과정·기능":"우리 지역을 표현한 다양한 지도의 종류와 역할을 탐색하고 실생활에서 지도를 활용할 수 있으며, 지도를 통해 우리 지역의 위치 특성을 분석하고 우리 지역의 지리 정보를 조사할 수 있다.","가치·태도":"지역의 지리 정보에 관심과 흥미, 호기심을 가지고 지역을 탐구하려는 자세를 가진다."},"B":{"지식·이해":"지도에 나타난 요소가 의미하는 바를 설명하고, 우리 지역의 지리적 특징을 설명할 수 있다.","과정·기능":"우리 지역을 표현한 다양한 종류의 지도를 조사하고, 지도에서 우리 지역의 위치를 확인하며, 우리 지역의 지리 정보를 조사하여 우리 지역의 특징을 다른 지역과 비교할 수 있다.","가치·태도":"지역의 지리 정보에 관심과 호기심을 가지고 지역을 탐색하는 데 흥미를 느낀다."},"C":{"지식·이해":"지도에 나타난 요소를 식별하고, 우리 지역의 지리적 특징을 말할 수 있다.","과정·기능":"우리 지역을 표현한 다양한 종류의 지도를 보고 지도에서 우리 지역의 위치를 찾을 수 있으며, 우리 지역의 지리 정보를 조사할 수 있다.","가치·태도":"지역의 지리 정보에 관심을 가진다."}},"p":46},{"b":1,"s":1,"a":"지역문제를 해결하고 지역을 알리는 노력","ak":"지역문제를해결하고지역을알리는노력","n":"지역문제를 해결하고 지역을 알리는 노력","L":{"A":{"지식·이해":"생활 속 지역의 여러 가지 문제 및 문제 해결 과정과 방법을 설명하고, 지역의 자연환경, 역사, 문화, 생산물 등을 알리려는 지역사회의 여러 활동과 참여 방식을 파악할 수 있다.","과정·기능":"생활 속 지역의 여러 가지 문제와 해결 방법 및 지역의 자연환경, 역사, 문화, 생산물 등을 알리려는 지역사회의 여러 활동을 조사할 수 있다.","가치·태도":"생활 속 지역의 문제를 합리적으로 해결하기 위해 노력한다."},"B":{"지식·이해":"생활 속 지역의 여러 가지 문제 및 문제 해결 방법을 이해하고, 지역의 자연환경, 역사, 문화, 생산물 등을 알리려는 지역사회의 활동을 제시할 수 있다.","과정·기능":"생활 속 여러 가지 문제 및 지역의 자연환경, 역사, 문화, 생산물 등을 알리려는 지역사회의 활동을 조사할 수 있다.","가치·태도":"생활 속 지역의 문제와 문제의 해결에 지속적으로 관심을 가진다."},"C":{"지식·이해":"생활 속 여러 가지 문제와 지역의 자연환경, 역사, 문화, 생산물 등을 알리려는 노력을 제시할 수 있다.","과정·기능":"생활 속 여러 가지 문제를 탐색하고, 지역의 자연환경, 역사, 문화, 생산물 등을 알리려는 지역사회의 노력을 찾을 수 있다.","가치·태도":"생활 속 지역의 문제에 관심을 가진다."}},"p":49},{"b":1,"s":2,"a":"사회·공동체와의 관계","ak":"사회공동체와의관계","n":"사회·공동체와의 관계","L":{"A":{"지식·이해":"공정의 가치, 디지털 사회에서 발생하는 문제와 해결방안, 통일의 필요성에 대해 포괄적으로 이해한다.","과정·기능":"공정과 불공정의 사례, 디지털 사회에서 발생하는 문제와 해결방안, 바람직한 통일의 방향을 다양한 맥락에서 탐구한다.","가치·태도":"생활 전반에서 공정의 가치를 추구하며 사회 정의를 위해 정보통신 윤리 민감성 및 통일 감수성을 기른다."},"B":{"지식·이해":"공정의 가치, 디지털 사회에서 발생하는 문제와 해결방안, 통일의 필요성에 대해 이해한다.","과정·기능":"공정과 불공정의 사례, 디지털 사회에서 발생하는 문제와 해결방안, 바람직한 통일의 방향을 탐구한다.","가치·태도":"공정의 가치를 추구하며 사회 정의를 위해 정보통신 윤리 민감성 및 통일 감수성을 기른다."},"C":{"지식·이해":"공정의 가치, 디지털 사회에서 발생하는 문제와 해결방안, 통일의 필요성에 대해 부분적으로 이해한다.","과정·기능":"공정과 불공정의 사례, 디지털 사회에서 발생하는 문제와 해결방안, 바람직한 통일의 방향을 단순한 맥락에서 탐구한다.","가치·태도":"공정의 가치를 추구하며 사회 정의를 위해 정보통신 윤리 민감성 및 통일 감수성을 기르고자 노력한다."}},"p":59},{"b":1,"s":2,"a":"자신과의 관계","ak":"자신과의관계","n":"자신과의 관계","L":{"A":{"지식·이해":"도덕적 삶을 위한 자기존중, 정직, 성실, 도덕적 행동의 필요성을 포괄적으로 이해한다.","과정·기능":"다양한 상황에서 자기존중, 정직과 성실의 모범적 사례를 찾을 수 있고, 도덕적 행동과 관련된 문제를 다른 사람의 관점에서 평가한다.","가치·태도":"생활 전반에서 자기존중, 정직, 성실, 도덕적 행동을 적극적으로 실천하려는 자세와 태도를 보인다."},"B":{"지식·이해":"도덕적 삶을 위한 자기존중, 정직, 성실, 도덕적 행동의 필요성을 이해한다.","과정·기능":"자기존중, 정직과 성실의 모범적 사례를 찾을 수 있고, 도덕적 행동과 관련된 문제를 다른 사람의 관점에서 이해한다.","가치·태도":"자기존중, 정직, 성실, 도덕적 행동을 실천하려는 자세와 태도를 보인다."},"C":{"지식·이해":"도덕적 삶을 위한 자기존중, 정직, 성실, 도덕적 행동의 필요성을 부분적으로 이해한다.","과정·기능":"자기존중, 정직과 성실, 도덕적 행동과 관련된 문제를 인식한다.","가치·태도":"자기존중, 정직, 성실, 도덕적 행동을 실천하는 데 관심을 가진다."}},"p":58},{"b":1,"s":2,"a":"자연과의 관계","ak":"자연과의관계","n":"자연과의 관계","L":{"A":{"지식·이해":"자연에 대한 윤리적 책임으로서 생명 존중과 인간과 자연의 공존 이유를 포괄적으로 이해한다.","과정·기능":"다양한 맥락에서 생명 경시 사례를 조사할 수 있으며, 자연과 공생하기 위한 실천 방법을 제시한다.","가치·태도":"생활 전반에서 생명을 존중하는 태도와 생태 감수성을 함양한다."},"B":{"지식·이해":"자연에 대한 윤리적 책임으로서 생명 존중과 인간과 자연의 공존 이유를 이해한다.","과정·기능":"생명 경시 사례를 조사할 수 있으며, 자연과 공생하기 위한 실천 방법을 제시한다.","가치·태도":"생명을 존중하는 태도와 생태 감수성을 함양한다."},"C":{"지식·이해":"자연에 대한 윤리적 책임으로서 생명 존중과 인간과 자연의 공존 이유를 부분적으로 이해한다.","과정·기능":"생명 경시 및 자연과의 공생과 관련된 문제 해결 방법을 제시하려고 노력한다.","가치·태도":"생명을 존중하는 태도와 생태 감수성에 관심을 가진다."}},"p":60},{"b":1,"s":2,"a":"타인과의 관계","ak":"타인과의관계","n":"타인과의관계","L":{"A":{"지식·이해":"가족을 사랑하고 친구를 배려하며 타인에게 공감해야 하는 이유와 필요성에 대해 포괄적으로 이해한다.","과정·기능":"가족, 친구에 대한 배려와 존중을 기반으로 타인에게 공감하며 도덕적 관계 형성을 위한 방안을 다각도로 탐구하여 실천 계획을 세운다.","가치·태도":"가족을 사랑하고 친구를 배려하며 타인에게 공감하는 자세와 태도를 적극적으로 실천한다."},"B":{"지식·이해":"가족을 사랑하고 친구를 배려하며 타인에게 공감해야 하는 이유와 필요성에 대해 이해한다.","과정·기능":"가족, 친구에 대한 배려와 존중을 기반으로 타인에게 공감하며 도덕적 관계 형성을 위한 방안을 탐구하여 실천 계획을 세운다.","가치·태도":"가족을 사랑하고 친구를 배려하며 타인에게 공감하는 자세와 태도를 실천한다."},"C":{"지식·이해":"가족을 사랑하고 친구를 배려하며 타인에게 공감해야 하는 이유와 필요성에 대해 부분적으로 이해한다.","과정·기능":"가족, 친구에 대한 배려와 존중을 기반으로 타인에게 공감하며 도덕적 관계 형성을 위한 방안을 탐구한다.","가치·태도":"가족을 사랑하고 친구를 배려하며 타인에게 공감하는 자세와 태도에 관심을 가진다."}},"p":58},{"b":1,"s":3,"a":"도형과 측정","ak":"도형과측정","n":"도형과 측정","L":{"A":{"지식·이해":"직선, 선분, 반직선, 각, 직각, 예각, 둔각, 직선의 수직 관계와 평행 관계 등의 의미와 특징을 종합적으로 이해하고, 구체물이나 평면도형, 점의 이동에서 위치와 방향의 변화를 이해한다. 원과 그 구성 요소, 여러 가지 삼각형, 여러 가지 사각형, 다각형과 정다각형의 의미와 성질을 종합적으로 이해한다.시간, 길이, 들이, 무게, 각도의 단위와 단위들 사이의 관계를 종합적으로 이해하고, 이를 이용하여 양을 여러 가지 방법으로 표현할 수 있음을 안다. 시간, 들이, 무게의 덧셈과 뺄셈의 계산 원리를 종합적으로 이해한다.","과정·기능":"도형의 기초적인 구성 요소, 직선의 수직 관계와 평행 관계의 예를 제시하고 그 차이를 설명할 수 있으며, 구체물이나 평면도형, 점의 이동에서 위치와 방향의 변화를 여러 가지 방법으로 설명할 수 있다. 원의 구성 요소를 이용하여 원의 여러 가지 성질을 설명할 수 있고, 여러 가지 삼각형, 여러 가지 사각형, 다각형과 정다각형을 분류하여 각 도형의 의미와 성질을 설명할 수 있으며, 이를 이용하여 여러 가지 문제를 해결할 수 있다.시간, 길이, 들이, 무게, 각도의 단위와 단위들 사이의 관계에 대한 이해를 바탕으로 여러 가지 양을 측정하거나 어림하고, 그 방법을 설명할 수 있다. 시간, 들이, 무게의 덧셈과 뺄셈을 여러 가지 방법으로 계산하고, 그 방법을 설명할 수 있다.","가치·태도":"여러 가지 평면도형에 대한 흥미와 관심을 가지고, 이를 이용하여 다양한 모양을 만들거나 채우면서 수학의 아름다움을 느낀다. 시간, 길이, 들이, 무게, 각도에 대한 측정이나 어림을 통하여 수학의 유용성을 인식하고, 이를 실생활과 타 교과에 적극 활용한다. 도형과 측정 영역의 다양한 문제해결 과정에 적극적으로 참여하며, 다른 친구의 의견을 존중하며 경청한다."},"B":{"지식·이해":"직선, 선분, 반직선, 각, 직각, 예각, 둔각, 직선의 수직 관계와 평행 관계 등에서 각각의 의미와 특징을 이해하고, 구체물이나 평면도형, 점의 이동에서 변화를 이해한다. 원과 그 구성 요소, 여러 가지 삼각형, 여러 가지 사각형, 다각형과 정다각형의 의미와 기본적인 성질을 이해한다.시간, 길이, 들이, 무게, 각도의 단위와 단위들 사이의 관계를 이해하고, 시간, 들이, 무게의 덧셈과 뺄셈의 계산 원리를 이해한다.","과정·기능":"도형의 기초적인 구성 요소, 직선의 수직 관계와 평행 관계의 의미를 설명할 수 있고, 구체물이나 평면도형, 점을 이동해 보고 그 변화를 설명할 수 있다. 원의 구성 요소를 이용하여 원의 성질을 찾을 수 있으며, 주어진 도형에서 여러 가지 삼각형, 여러 가지 사각형, 다각형과 정다각형을 구분하고, 각 도형의 기본적인 성질을 말할 수 있다. 시간, 길이, 들이, 무게, 각도의 단위에 대한 이해를 바탕으로 주어진 양을 측정하거나 어림할 수 있다. 시간, 들이, 무게의 덧셈과 뺄셈을 할 수 있다.","가치·태도":"여러 가지 평면도형에 관심을 가지고 실생활에 활용되는 다양한 도형에서 수학의 아름다움을 느낀다. 시간, 길이, 들이, 무게, 각도의 필요성을 인식하고, 실생활이나 타 교과에서 활용됨을 안다. 도형과 측정 영역의 문제해결 과정에 참여하며, 다른 친구의 의견을 존중하고 경청한다."},"C":{"지식·이해":"안내된 절차나 구체적 조작 활동을 통하여 직선, 선분, 반직선, 각, 직각, 예각, 둔각, 직선의 수직 관계와 평행 관계 등의 의미를 이해하고, 구체물이나 평면도형, 점의 이동을 이해한다. 또 원과 그 구성 요소, 여러 가지 삼각형, 여러 가지 사각형, 다각형과 정다각형에 대한 기초적인 이해를 형성한다.시간, 길이, 들이, 무게, 각도의 단위를 알고, 안내된 절차에 따라 시간, 들이, 무게의 덧셈과 뺄셈의 기초적인 계산 원리를 이해한다.","과정·기능":"안내된 절차나 구체적 조작 활동을 통하여 도형의 기초적인 구성 요소, 직선의 수직 관계와 평행 관계를 구분하고, 구체물이나 평면도형을 이동하거나 평면에서 점을 이동할 수 있다. 안내된 절차나 구체적 조작 활동을 통하여 원의 구성 요소를 찾을 수 있고, 주어진 도형에서 여러 가지 삼각형, 여러 가지 사각형, 다각형과 정다각형을 찾을 수 있다. 안내된 절차에 따라 시간, 길이, 들이, 무게, 각도의 단위를 이용하여 양을 측정하고, 시간, 들이, 무게의 간단한 덧셈과 뺄셈을 할 수 있다.","가치·태도":"여러 가지 평면도형을 그리거나 만드는 구체적인 조작 활동을 통하여 평면도형에 관심을 가진다. 안내된 절차에 따라 시간, 길이, 들이, 무게, 각도를 측정하는 과정을 통하여 이들이 실생활이나 타 교과에 활용됨을 안다. 도형과 측정 영역의 문제해결 과정에 참여하려고 노력하고, 다른 친구의 의견을 경청하려는 태도를 갖는다."}},"p":78},{"b":1,"s":3,"a":"변화와 관계","ak":"변화와관계","n":"변화와 관계","L":{"A":{"지식·이해":"여러 가지 배열에서 다양한 변화 규칙을 찾아 수나 식으로 나타내는 방법을 종합적으로 이해한다. 등호의 의미에 대한 이해를 바탕으로 크기가 같은 두 양의 관계를 등호를 사용한 식으로 나타내는 방법을 이해하고, 이를 문제해결에 능숙하게 적용할 수 있다.","과정·기능":"여러 가지 배열에서 다양한 변화 규칙을 찾아 수나 식으로 나타내고, 그 방법을 설명할 수 있다. 계산식의 배열에서 계산 결과를 추측하고, 계산 결과가 옳은지 확인할 수 있다. 등호를 사용하여 크기가 같은 두 양의 관계를 식으로 나타내고, 등호가 사용된 식이 옳은지를 설명할 수 있다.","가치·태도":"규칙을 수나 식으로 나타내기, 등호와 동치 관계의 탐구에 흥미와 관심을 가지며, 규칙과 동치 관계가 실생활에 활용됨을 안다. 변화와 관계 영역의 다양한 문제해결 과정에 적극적으로 참여하며, 다른 친구의 의견을 존중하고 경청한다."},"B":{"지식·이해":"주어진 배열에서 변화 규칙을 찾아 수나 식으로 나타내는 방법을 이해한다. 등호의 의미를 알고, 크기가 같은 두 양의 관계를 등호를 사용하여 식으로 나타내는 방법을 이해한다.","과정·기능":"주어진 배열에서 변화 규칙을 찾아 수나 식으로 나타내고, 계산식의 배열에서 규칙을 찾아 이어질 계산 결과를 추측할 수 있다. 등호를 사용하여 크기가 같은 두 양의 관계를 식으로 나타낼 수 있다.","가치·태도":"규칙을 수나 식으로 나타내기, 규칙과 동치 관계의 탐구에 흥미와 관심을 가진다. 변화와 관계 영역의 문제해결 과정에 성실하게 참여하며, 다른 친구의 의견을 존중하고 경청한다."},"C":{"지식·이해":"안내된 절차에 따라 간단한 배열의 변화 규칙을 이해하고, 구체적 조작 활동에 따라 등호의 의미와 크기가 같은 두 양의 관계를 부분적으로 이해한다.","과정·기능":"안내된 절차에 따라 간단한 배열에서 변화 규칙을 찾을 수 있으며, 간단한 계산식의 배열에서 이어질 계산 결과를 추측할 수 있다. 구체물이나 그림 등을 이용하여 등호가 옳게 사용된 식을 찾을 수 있다.","가치·태도":"규칙을 수나 식으로 나타내기, 규칙과 동치 관계의 탐구에 관심을 가진다. 변화와 관계 영역의 문제해결 과정에 참여하려고 노력하고, 다른 친구의 의견을 경청하려는 태도를 갖는다."}},"p":77},{"b":1,"s":3,"a":"수와 연산","ak":"수와연산","n":"수와 연산","L":{"A":{"지식·이해":"다섯 자리 이상의 수, 여러 가지 분수, 소수를 종합적으로 이해한다. 나눗셈의 의미를 이해하고, 세 자리 수의 덧셈과 뺄셈, 곱하는 수가 한 자리 수 또는 두 자리 수인 곱셈, 나누는 수가 한 자리 수 또는 두 자리 수인 나눗셈, 분모가 같은 분수의 덧셈과 뺄셈, 소수의 덧셈과 뺄셈의 계산 원리를 종합적으로 이해하며, 이를 계산 과정에 능숙하게 적용할 수 있다.","과정·기능":"수 개념에 대한 이해를 바탕으로 다섯 자리 이상의 수, 여러 가지 분수, 소수를 능숙하게 읽고 쓰며, 수의 크기를 비교하고 그 방법을 설명할 수 있다. 세 자리 수의 덧셈과 뺄셈, 곱하는 수가 한 자리 수 또는 두 자리 수인 곱셈, 나누는 수가 한 자리 수 또는 두 자리 수인 나눗셈, 분모가 같은 분수의 덧셈과 뺄셈, 소수의 덧셈과 뺄셈을 능숙하게 계산하고, 각각의 계산 원리를 설명할 수 있으며, 이를 활용하는 실생활 문제를 능숙하게 해결할 수 있다.","가치·태도":"다섯 자리 이상의 수, 분수, 소수의 필요성을 인식하고, 분수와 소수 표현의 편리함을 인식한다. 실생활 문제를 해결할 때 자연수의 사칙계산, 분모가 같은 분수의 덧셈과 뺄셈, 소수의 덧셈과 뺄셈이 유용하게 활용됨을 안다. 수와 연산 영역의 다양한 문제해결 과정에 적극적으로 참여하며, 다른 친구의 의견을 존중하고 경청한다."},"B":{"지식·이해":"다섯 자리 이상의 수, 여러 가지 분수, 소수의 의미를 이해한다. 나눗셈의 의미를 이해하고, 세 자리 수의 덧셈과 뺄셈, 곱하는 수가 한 자리 수 또는 두 자리 수인 곱셈, 나누는 수가 한 자리 수 또는 두 자리 수인 나눗셈, 분모가 같은 분수의 덧셈과 뺄셈, 소수의 덧셈과 뺄셈의 계산 원리를 이해하고, 이를 계산 과정에 적용할 수 있다.","과정·기능":"다섯 자리 이상의 수, 여러 가지 분수, 소수를 읽고 쓰며, 두 수의 크기를 비교할 수 있다. 세 자리 수의 덧셈과 뺄셈, 곱하는 수가 한 자리 수 또는 두 자리 수인 곱셈, 나누는 수가 한 자리 수 또는 두 자리 수인 나눗셈, 분모가 같은 분수의 덧셈과 뺄셈, 소수의 덧셈과 뺄셈을 계산할 수 있고, 이를 활용하는 실생활 문제를 해결할 수 있다.","가치·태도":"다섯 자리 이상의 수, 분수, 소수의 필요성을 인식한다. 자연수의 사칙계산, 분모가 같은 분수의 덧셈과 뺄셈, 소수의 덧셈과 뺄셈에 흥미와 관심을 가지고, 실생활 문제를 해결하는 데 이러한 계산이 활용됨을 안다. 수와 연산 영역의 문제해결 과정에 성실하게 참여하며, 다른 친구의 의견을 존중하고 경청한다."},"C":{"지식·이해":"구체물이나 그림을 이용하여 다섯 자리 이상의 수, 여러 가지 분수, 소수의 기초적인 의미를 이해한다. 안내된 절차에 따라 세 자리 수의 덧셈과 뺄셈, 곱하는 수가 한 자리 수 또는 두 자리 수인 곱셈, 나누는 수가 한 자리 수 또는 두 자리 수인 나눗셈, 분모가 같은 분수의 덧셈과 뺄셈, 소수의 덧셈과 뺄셈의 기초적인 계산 원리를 이해한다.","과정·기능":"구체물이나 그림을 이용하여 간단한 다섯 자리 이상의 수, 여러 가지 분수, 소수를 읽고 쓰며, 두 수의 크기를 비교할 수 있다. 안내된 절차에 따라 세 자리 수의 덧셈과 뺄셈, 곱하는 수가 한 자리 수 또는 두 자리 수인 곱셈, 나누는 수가 한 자리 수 또는 두 자리 수인 나눗셈, 분모가 같은 분수의 덧셈과 뺄셈, 소수의 덧셈과 뺄셈의 간단한 계산을 할 수 있다.","가치·태도":"다섯 자리 이상의 수, 분수, 소수에 관심을 가진다. 자연수의 사칙계산, 분모가 같은 분수의 덧셈과 뺄셈, 소수의 덧셈과 뺄셈에 관심을 가지고, 실생활에서 이러한 계산이 활용됨을 안다. 수와 연산 영역의 문제해결 과정에 참여하려고 노력하고, 다른 친구의 의견을 경청하려는 태도를 갖는다."}},"p":76},{"b":1,"s":3,"a":"자료와 가능성","ak":"자료와가능성","n":"자료와 가능성","L":{"A":{"지식·이해":"실생활 자료를 수집하여 그림그래프, 막대그래프, 꺾은선그래프로 나타내고 해석하는 일련의 방법을 이해하고, 이를 탐구 문제를 해결하는 데 능숙하게 적용할 수 있다.","과정·기능":"실생활 자료를 수집하여 그림그래프, 막대그래프, 꺾은선그래프로 정확하게 나타내고, 그래프를 해석할 수 있다. 탐구 문제에 적절한 자료를 수집, 정리하여 막대그래프나 꺾은선그래프로 나타내고, 그래프를 해석할 수 있다.","가치·태도":"실생활에서 여러 가지 그래프의 필요성과 편리함을 인식하고, 자료를 이용한 통계적 문제해결 과정에 흥미와 관심을 가지고 참여한다. 자료와 가능성 영역의 다양한 문제해결 과정에 적극적으로 참여하며, 다른 친구의 의견을 존중하고 경청한다."},"B":{"지식·이해":"주어진 자료를 그림그래프, 막대그래프, 꺾은선그래프로 나타내고 그래프에서 여러 가지 사실을 찾는 방법을 이해하며, 이를 탐구 문제를 해결하는 데 적용할 수 있다.","과정·기능":"주어진 자료를 그림그래프, 막대그래프, 꺾은선그래프로 나타내고, 그래프에서 여러 가지 사실을 찾을 수 있다. 주어진 자료를 정리하여 막대그래프나 꺾은선그래프로 나타낼 수 있다.","가치·태도":"실생활에서 그림그래프, 막대그래프, 꺾은선그래프가 활용됨을 알고, 자료를 이용한 통계적 문제해결 과정에 관심을 가진다. 자료와 가능성 영역의 문제해결과정에 참여하며, 다른 친구의 의견을 존중하고 경청한다."},"C":{"지식·이해":"안내된 절차에 따라 일부가 제시된 그림그래프, 막대그래프, 꺾은선그래프를 완성하고 그래프에서 간단한 사실을 찾는 방법을 이해한다.","과정·기능":"안내된 절차에 따라 일부가 제시된 그림그래프, 막대그래프, 꺾은선그래프를 완성할 수 있으며, 그래프에서 간단한 사실을 찾을 수 있다. 주어진 자료의 특성에 맞는 적절한 그래프를 선택할 수 있다.","가치·태도":"실생활에서 그림그래프, 막대그래프, 꺾은선그래프가 활용됨을 알고, 여러 가지 그래프에 관심을 가진다. 자료와 가능성 영역의 문제해결 과정에 참여하려고 노력하고, 다른 친구의 의견을 경청하려는 태도를 갖는다."}},"p":80},{"b":1,"s":4,"a":"감염병과 건강한 생활","ak":"감염병과건강한생활","n":"감염병과 건강한 생활","L":{"A":{"지식·이해":"생활 속 감염병 사례, 다양한 질병과 그 위험성에 대해 말하고, 여러 감염 과정을 통해 생활 습관이 감염병 유행과 관련되어 있음을 설명하며, 건강한 생활을 위한 감염병 예방 수칙을 말할 수 있다.","과정·기능":"생활 속에서 경험할 수 있는 감염병의 사례를 조사하여 다양한 질병과 그 위험성에 대해 토의할 수 있다. 여러 감염 과정과 관련지어 감염 예방 방법을 탐구하여 생활 습관과 감염병 유행이 연관되어 있음을 설명할 수 있다. 건강한 생활을 위해 필요한 감염병 예방 수칙을 토의하고, 생활 속에서 감염병 예방 수칙을 공유할 수 있다.","가치·태도":"감염병으로부터 안전한 사회에 관심을 가지며, 생활 속에서 감염병 예방 수칙의 중요성을 인식하고 이를 실천한다."},"B":{"지식·이해":"생활 속 감염병 사례와 다양한 질병의 위험성에 대해 말하고, 여러 감염 과정을 통해 감염됨을 이해하고 감염 예방 습관과 감염병 예방 수칙을 말할 수 있다.","과정·기능":"생활 속 감염병 사례를 조사하여 질병의 위험성을 발표하고, 건강한 생활을 위한 감염병 예방 수칙을 공유할 수 있다.","가치·태도":"감염병에 관심을 가지며, 생활 속에서 감염병 예방 수칙의 실천 방법을 탐색한다."},"C":{"지식·이해":"생활 속 감염병 사례를 말하고, 감염 예방 생활 습관과 건강한 생활을 위한 감염병 예방 수칙을 말할 수 있다.","과정·기능":"생활 속 감염병 사례를 조사할 수 있다.","가치·태도":"감염병에 관심을 가진다."}},"p":130},{"b":1,"s":4,"a":"기후변화와 우리 생활","ak":"기후변화와우리생활","n":"기후변화와 우리 생활","L":{"A":{"지식·이해":"기후변화로 나타나는 현상을 이해하고, 기후변화가 인간의 활동과 관련되어 있어 우리 생활과 환경에 영향을 줄 수 있음을 설명하고, 대응 방법을 말할 수 있다.","과정·기능":"기후변화가 인간의 활동과 관련되어 있음을 증거에 기반하여 토의하고, 해수면 상승으로 인한 피해 모형실험을 통해 기후변화가 우리 생활에 영향을 줄 수 있음을 예측할 수 있다. 기후변화 대응 방법을 조사하고, 생활 속에서의 대응 방법을 토의할 수 있다.","가치·태도":"기후변화의 심각성을 인식하고, 지속가능한 사회에 관심을 가지며 생활 속에서 기후변화 대응 방법을 실천한다."},"B":{"지식·이해":"기후변화로 나타나는 현상과 기후변화와 인간의 활동 사이의 관계를 이해하고, 기후변화로 인해 해수면이 상승할 수 있음을 설명할 수 있다.","과정·기능":"기후변화와 인간의 활동 사이의 관계를 알아보기 위해 자료를 수집하고, 기후변화가 우리 생활과 환경에 주는 영향과 기후변화 대응 방법을 조사할 수 있다.","가치·태도":"기후변화의 심각성을 인식하고, 지속가능한 사회에 관심을 가진다."},"C":{"지식·이해":"기후변화에 따른 현상을 이해하고, 기후변화가 우리 생활에 영향을 줄 수 있음을 말할 수 있다.","과정·기능":"해수면 상승과 기후변화의 관계를 알기 위해 모형실험을 하고, 기후변화 대응 방법을 조사할 수 있다.","가치·태도":"기후변화 현상에 관심을 가진다."}},"p":138},{"b":1,"s":4,"a":"다양한 생물과 우리 생활","ak":"다양한생물과우리생활","n":"다양한 생물과 우리 생활","L":{"A":{"지식·이해":"균류·원생생물·세균 등 다양한 생물의 특징과 사는 곳을 말하고, 균류·원생생물·세균이 우리 생활에 미치는 긍정적인 영향과 부정적인 영향을 설명하며, 우리 생활에 생명과학이 이용되는 사례를 말할 수 있다.","과정·기능":"균류·원생생물·세균을 디지털현미경이나 실체현미경, 사진 자료 등을 활용하여 관찰할 수 있다. 균류·원생생물·세균이 우리 생활에 미치는 긍정적인 영향과 부정적인 영향을 조사하여 발표하고, 우리 생활에 생명과학이 이용되는 사례를 조사하고 소개하는 자료를 만들어 공유할 수 있다.","가치·태도":"우리 생활에 생명과학이 이용되는 사례를 소개하는 자료를 만들어 공유하는 과정에서 과학의 유용성을 인식한다."},"B":{"지식·이해":"균류·원생생물·세균을 관찰하여 특징을 말하고, 균류·원생생물·세균이 우리 생활에 미치는 영향과 우리 생활에 생명과학이 이용되는 사례를 말할 수 있다.","과정·기능":"균류·원생생물·세균을 디지털현미경이나 실체현미경, 사진 자료 등을 활용하여 관찰하고, 균류·원생생물·세균이 우리 생활에 미치는 영향을 조사할 수 있다. 우리 생활에 생명과학이 이용되는 사례를 조사하여 소개하는 자료를 만들 수 있다.","가치·태도":"우리 생활에 생명과학이 이용되는 사례를 소개하는 자료를 만들고, 이 과정에서 생명과학에 흥미와 호기심을 가진다."},"C":{"지식·이해":"균류·원생생물·세균의 종류와 그것이 우리 생활에 영향을 미친다는 것을 말하고, 우리 생활에 생명과학이 이용되는 사례를 말할 수 있다.","과정·기능":"우리 생활에 생명과학이 이용되는 사례를 조사할 수 있다.","가치·태도":"우리 생활에 생명과학이 이용되는 사례를 조사하면서 생명과학에 관심을 가진다."}},"p":134},{"b":1,"s":4,"a":"동물의 생활","ak":"동물의생활","n":"동물의 생활","L":{"A":{"지식·이해":"여러 가지 동물을 관찰하여 동물의 특징을 말하고, 다양한 환경에 서식하는 동물의 생김새와 생활 방식이 사는 환경과 어떻게 관련되어 있는지 설명할 수 있다. 동물의 특징을 이용하여 일상생활에서 활용할 수 있는 생활용품이 있음을 설명할 수 있다.","과정·기능":"여러 가지 동물을 관찰하면서 특징에 따라 분류 기준을 정하여 동물을 분류하고, 다양한 환경에 서식하는 동물을 조사할 수 있다. 동물의 특징을 이용하여 일상생활에서 활용할 수 있는 독창적인 아이디어로 생활용품을 설계하고, 협력적으로 소통할 수 있다.","가치·태도":"동물의 특징을 이용하여 일상생활에서 활용할 수 있는 생활용품을 독창적인 아이디어로 설계한다."},"B":{"지식·이해":"여러 가지 동물의 특징을 알고 다양한 환경에 서식하는 동물의 생김새와 생활 방식이 다름을 말하며, 동물의 특징을 이용하여 일상생활에서 활용하도록 만든 생활용품이 있음을 설명할 수 있다.","과정·기능":"여러 가지 동물을 관찰하면서 특징에 따라 동물을 분류하고, 다양한 환경에 따라 동물의 생김새와 생활 방식이 다름을 발표할 수 있다. 동물의 특징을 이용하여 일상생활에서 활용할 수 있는 생활용품을 설계하고 이를 발표할 수 있다.","가치·태도":"동물의 특징을 이용하여 일상생활에서 활용할 수 있는 생활용품을 설계하는 것에 관심을 가진다."},"C":{"지식·이해":"다양한 환경에 서식하는 동물의 생김새와 특징을 말하고, 동물의 특징을 이용한 생활용품이 있음을 말할 수 있다.","과정·기능":"여러 가지 동물을 관찰할 수 있다.","가치·태도":"동물의 특징을 이용하여 일상생활에서 활용할 수 있는 생활용품을 설계하는 활동에 참여한다."}},"p":124},{"b":1,"s":4,"a":"땅의 변화","ak":"땅의변화","n":"땅의 변화","L":{"A":{"지식·이해":"강 주변 지형의 특징을 흐르는 물의 작용으로 이해하고, 화산의 의미와 화산 분출물, 화성암의 특징을 설명할 수 있다. 화산 활동과 지진이 우리 생활에 미치는 영향을 설명할 수 있다.","과정·기능":"흐르는 물에 의해 흙이 깎이는 곳과 쌓이는 곳을 관찰하여 물의 작용을 탐구할 수 있다. 화산 분출물을 모형으로 나타내고, 현무암과 화강암을 관찰하여 특징에 따라 분류할 수 있으며, 화산 활동과 지진 활동의 피해 사례를 조사할 수 있다.","가치·태도":"화산 활동과 지진으로부터 안전하고 지속가능한 사회에 관심을 가지고, 화산 활동과 지진으로부터 피해를 줄이기 위한 대처 방법을 실천한다."},"B":{"지식·이해":"흐르는 물의 작용을 이해하고, 화산의 의미와 화산 분출물을 알며 현무암과 화강암의 특징, 지진 대처 방법을 설명할 수 있다.","과정·기능":"흐르는 물에 의해 흙이 깎이는 곳과 쌓이는 곳을 관찰할 수 있다. 화산 활동 모형에서 화산 활동으로 나오는 물질을 찾고, 현무암과 화강암을 관찰하여 알갱이의 크기로 분류할 수 있다.","가치·태도":"화산 활동과 지진으로부터 안전하고 지속가능한 사회에 관심을 가지고, 지진의 피해를 줄이기 위한 대처 방법을 실천한다."},"C":{"지식·이해":"흐르는 물에 의해 흙이 깎이거나 쌓일 수 있음을 알고, 화산의 의미, 현무암과 화강암의 차이를 말할 수 있다.","과정·기능":"흐르는 물에 의해 흙이 깎이는 곳과 쌓이는 곳을 관찰하고, 현무암과 화강암을 관찰하여 색을 비교할 수 있다.","가치·태도":"화산 활동과 지진에 관심을 가지고, 이들이 우리 생활에 미치는 영향에 대해 인식한다."}},"p":133},{"b":1,"s":4,"a":"물의 상태 변화","ak":"물의상태변화","n":"물의 상태 변화","L":{"A":{"지식·이해":"우리 주변에서의 물의 상태 변화 사례를 말하고, 물이 얼 때, 얼음이 녹을 때의 무게와 부피 변화, 수증기가 응결할 때의 변화를 설명할 수 있다.","과정·기능":"우리 주변에서의 물의 상태 변화 사례를 찾고, 실험을 통해 물이 얼 때와 얼음이 녹을 때, 물이 증발할 때와 끓을 때, 수증기가 응결할 때의 변화를 관찰할 수 있다. 상태 변화를 이용하여 물을 얻는 장치를 설계하고 제작할 수 있다.","가치·태도":"물 부족 문제의 심각성을 인식하고, 적극적인 자세로 문제 해결을 위해 노력한다."},"B":{"지식·이해":"물이 수증기나 얼음으로 변할 수 있음을 말하고, 물이 얼 때와 녹을 때, 물이 증발할 때와 끓을 때의 변화를 설명할 수 있다.","과정·기능":"실험을 통해 물이 얼 때와 녹을 때의 변화, 물이 증발할 때와 끓을 때, 수증기가 응결할 때의 변화를 관찰하고, 상태 변화를 이용하여 물을 얻는 장치를 설계할 수 있다.","가치·태도":"물 부족 문제에 관심을 가지고 해결을 위해 노력한다."},"C":{"지식·이해":"우리 주변에서 물의 세 가지 상태를 찾아 말하고, 물이 끓을 때와 수증기가 응결할 때의 변화를 설명할 수 있다.","과정·기능":"물이 얼 때와 얼음이 녹을 때의 변화를 관찰하여 말할 수 있다.","가치·태도":"물의 중요성을 인식하고 물 부족 문제에 관심을 가진다."}},"p":132},{"b":1,"s":4,"a":"물체와 물질","ak":"물체와물질","n":"물체와 물질","L":{"A":{"지식·이해":"물체를 이루는 물질이 다양함을 이해하고, 물질의 세 가지 상태인 고체, 액체, 기체의 성질을 설명할 수 있다. 물체의 쓰임새와 물질의 성질을 관련지어 말할 수 있다.","과정·기능":"물체를 물질의 종류에 따라 분류하고, 실험을 통해 고체, 액체, 기체가 가진 성질을 찾아 비교할 수 있다. 물체의 쓰임새에 적합한 물질을 이용하여 물체를 설계할 수 있다.","가치·태도":"물체를 이루는 물질과 물질의 상태에 대해 흥미를 가지고, 생활 속에서 물질의 성질을 적극적으로 이용한다."},"B":{"지식·이해":"물체는 여러 가지 물질로 이루어져 있음을 알고, 고체, 액체, 기체의 성질을 설명할 수 있다.","과정·기능":"실험을 통해 고체, 액체, 기체가 가진 성질을 관찰하여 비교하고, 물체를 설계할 때 물체의 쓰임새에 적합한 물질을 선택할 수 있다.","가치·태도":"일상생활에서 이용하는 물질의 성질과 물질의 상태에 흥미를 가진다."},"C":{"지식·이해":"물체를 이루는 물질이 다양함을 알고, 고체, 액체, 기체를 구분할 수 있다.","과정·기능":"실험을 통해 물질의 성질을 관찰하고, 물체의 쓰임새에 적합한 성질을 가진 물질을 선택할 수 있다.","가치·태도":"일상생활에서 이용하는 물질의 성질에 관심을 가진다."}},"p":127},{"b":1,"s":4,"a":"밤하늘 관찰","ak":"밤하늘관찰","n":"밤하늘 관찰","L":{"A":{"지식·이해":"달의 모양과 표면, 달의 모양이 주기적으로 바뀌는 현상에 대해 이해하고, 태양계 구성원을 알고 태양과 행성의 표면적 특징을 설명할 수 있다. 별의 의미를 행성과 비교하여 설명하고, 북극성 주변의 별자리를 말할 수 있다.","과정·기능":"달의 모양과 표면, 여러 날 동안 보이는 달의 모양을 관찰하고, 태양과 행성의 특징을 태양계 행성 모형으로 표현하며, 북극성 주변의 별자리를 관찰하여 이름을 말할 수 있다.","가치·태도":"밤하늘에서 볼 수 있는 달, 행성, 별, 별자리에 대해 신비로움을 느끼고, 밤하늘 관찰에 흥미와 즐거움을 가진다."},"B":{"지식·이해":"달의 모양과 표면의 특징을 이해하고, 태양과 행성의 표면적 특징, 별의 정의를 설명할 수 있다.","과정·기능":"달의 모양과 표면, 여러 날 동안 보이는 달의 모양을 관찰하고, 태양과 행성의 표면적 특징을 태양계 행성 모형에 표현하며, 북쪽 하늘의 별자리를 관찰할 수 있다.","가치·태도":"달에 관심을 가지고, 밤하늘 관찰에 흥미를 가진다."},"C":{"지식·이해":"여러 날 동안 달의 모양이 다르게 보인다는 것을 알고, 태양계를 구성하는 행성의 이름을 말하며 별이 행성과 다르다는 것을 알 수 있다.","과정·기능":"여러 날 동안 달의 모양을 관찰하고, 태양과 태양계 행성을 모형으로 나타낼 수 있다.","가치·태도":"달 관찰을 통해 밤하늘 천체에 관심을 가진다."}},"p":135},{"b":1,"s":4,"a":"생물과 환경","ak":"생물과환경","n":"생물과 환경","L":{"A":{"지식·이해":"생태계의 구성 요소인 생물 요소와 비생물 요소를 이해하고, 생물 요소가 양분을 얻는 방법에 따라 생산자, 소비자, 분해자로 구분되는 것을 설명할 수 있다. 생물 요소들의 먹고 먹히는 관계인 먹이사슬과 먹이그물을 통해 생물 요소가 서로 관련되어 있음을 설명하며, 인간 활동이 생태계에 미치는 영향과 생태계 보전의 중요성을 말할 수 있다.","과정·기능":"생태계의 구성 요소를 조사하여 생물 요소와 비생물 요소를 분류하고, 생물 요소들을 양분을 얻는 방법에 따라 분류할 수 있다. 생물 요소들의 먹고 먹히는 관계를 조사하고 먹이 관계 모형을 이해하여 먹이그물로 표현할 수 있다. 인간 활동이 생태계에 미치는 영향을 조사하여 문제를 인식하고 생태계 보전을 위해 우리가 할 수 있는 일을 토의할 수 있다.","가치·태도":"우리 주변의 생태계에 호기심과 관심을 가지고, 생태계 보전을 위해 우리가 할 수 있는 일을 토의하여 실천함으로써 생태계를 소중히 여기는 태도를 가진다."},"B":{"지식·이해":"생테계의 구성 요소인 생물 요소와 비생물 요소를 알고, 생물 요소가 양분을 얻는 방법이 다르다는 것을 말할 수 있다. 생물 요소들의 먹고 먹히는 관계인 먹이사슬을 설명하며, 인간 활동이 생태계에 미치는 영향을 말할 수 있다.","과정·기능":"생태계의 구성 요소를 조사하고, 생물 요소들의 먹고 먹히는 관계를 조사하여 이를 먹이사슬로 표현할 수 있다. 인간 활동이 생태계에 미치는 영향을 조사할 수 있다.","가치·태도":"생태계에 관심을 가지고, 생태계 보전의 중요성을 인식하며 실천 방법을 탐색할 수 있다."},"C":{"지식·이해":"생태계의 구성 요소를 알고 생물 요소의 먹고 먹히는 관계가 있음을 말하고, 인간 활동이 생태계에 영향을 미친다는 것을 말할 수 있다.","과정·기능":"생태계의 구성 요소를 조사하고, 생물 요소의 먹고 먹히는 관계의 한 예를 말이나 글로 표현할 수 있다.","가치·태도":"생태계에 관심을 가진다."}},"p":136},{"b":1,"s":4,"a":"생물의 한살이","ak":"생물의한살이","n":"생물의 한살이","L":{"A":{"지식·이해":"생물의 한살이를 이해하고 씨가 싹 트거나 식물이 자라는 데 필요한 조건과 결과를 설명하며, 생물에 따라 한살이 유형이 다양함을 말할 수 있다.","과정·기능":"동물을 직접 기르면서 동물의 한살이를 관찰하고, 관찰한 내용을 글과 그림으로 표현하여 관찰 보고서를 쓸 수 있다. 씨가 싹 트거나 식물이 자라는 데 필요한 조건을 찾는 실험을 설계하여 수행할 수 있다. 여러 가지 생물의 한살이 과정을 조사하여 생물에 따라 한살이 유형이 다양함을 이해하고, 이를 소개하는 자료를 만들어 공유할 수 있다.","가치·태도":"생물의 한살이를 관찰하면서 관심과 흥미를 가지고, 생명을 배려하며 생태적 가치를 존중한다."},"B":{"지식·이해":"곤충의 한살이를 이해하고 씨가 싹 트거나 식물이 자라는 데 필요한 조건을 말하며, 생물에 따라 한살이 유형이 다양함을 말할 수 있다.","과정·기능":"곤충의 한살이를 관찰하여 곤충의 모습이 달라짐을 말하고, 식물이 자라는 데 필요한 조건을 찾는 실험을 설계할 수 있다. 여러 가지 생물의 한살이 과정을 조사하고 생물에 따라 한살이 유형이 다양함을 말할 수 있다.","가치·태도":"곤충의 한살이를 관찰하면서 자연 현상에 흥미를 가진다."},"C":{"지식·이해":"여러 가지 생물의 한살이가 있음을 말하고, 식물이 자라는 데 필요한 조건을 말할 수 있다.","과정·기능":"곤충의 한살이를 관찰하고, 식물이 자라는 데 필요한 조건을 찾는 실험을 수행하고, 여러 가지 생물의 한살이 과정을 조사할 수 있다.","가치·태도":"곤충의 한살이에 관심을 가진다."}},"p":126},{"b":1,"s":4,"a":"소리의 성질","ak":"소리의성질","n":"소리의 성질","L":{"A":{"지식·이해":"소리가 나는 물체는 떨림이 있다는 사실을 이해하고, 소리를 큰 소리와 작은 소리, 높은 소리와 낮은 소리로 구분할 수 있다. 소리가 다양한 물질들을 통해 전달될 수 있음을 설명할 수 있다.","과정·기능":"소리굽쇠 등의 다양한 물체를 이용하여 소리를 낼 수 있으며, 물체의 길이 등을 달리하여 소리의 높낮이나 세기가 다른 소리를 낼 수 있다. 소리가 여러 가지 물질을 통해 전달되는 것을 관찰하고, 소음을 줄이는 방법을 조사할 수 있다.","가치·태도":"소리와 관련된 현상에 관심을 가지고, 소음을 줄이는 방법을 조사하여 일상생활에서 적극적으로 실천한다."},"B":{"지식·이해":"소리가 나는 소리굽쇠는 떨리고 있음을 관찰하고, 소리를 큰 소리와 작은 소리, 높은 소리와 낮은 소리로 구분할 수 있다. 물질을 통해 소리가 전달됨을 말할 수 있다.","과정·기능":"소리굽쇠를 이용하여 소리를 내고, 소리가 나는 소리굽쇠의 떨림을 관찰할 수 있으며, 소리가 물질을 통해 전달되는 것을 관찰하고, 일상생활에서 소음을 줄이는 방법을 찾을 수 있다.","가치·태도":"일상생활에서 소리와 관련된 현상과 소음을 줄이는 방법에 관심을 가진다."},"C":{"지식·이해":"소리가 나는 물체의 예를 들고, 물체에 따라 소리가 다르다는 것과 소리가 전달될 수 있음을 말할 수 있다.","과정·기능":"물체를 이용하여 다양한 소리를 내고, 일상생활에서 소음의 예를 조사할 수 있다.","가치·태도":"일상생활에서 소리와 관련된 현상과 소음으로 생기는 문제에 관심을 가진다."}},"p":129},{"b":1,"s":4,"a":"식물의 생활","ak":"식물의생활","n":"식물의 생활","L":{"A":{"지식·이해":"여러 가지 식물을 관찰하여 식물의 특징을 말하고, 다양한 환경에 서식하는 식물의 생김새와 생활 방식이 사는 환경과 어떻게 관련되어 있는지 설명할 수 있다. 식물의 특징을 이용하여 일상생활에서 활용할 수 있는 생활용품이 있음을 설명할 수 있다.","과정·기능":"여러 가지 식물을 관찰하면서 특징에 따라 분류 기준을 정하여 식물을 분류하고, 다양한 환경에 서식하는 식물을 조사할 수 있다. 식물의 특징을 이용하여 일상생활에서 활용할 수 있는 독창적인 아이디어로 생활용품을 설계하고, 협력적으로 소통할 수 있다.","가치·태도":"식물의 특징을 이용하여 일상생활에서 활용할 수 있는 생활용품을 독창적인 아이디어로 설계할 수 있다."},"B":{"지식·이해":"여러 가지 식물의 특징을 알고 다양한 환경에 서식하는 식물의 생김새와 생활 방식이 다름을 말할 수 있으며, 식물의 특징을 이용하여 일상생활에서 활용하도록 만든 생활용품이 있음을 설명할 수 있다.","과정·기능":"여러 가지 식물을 관찰하면서 특징에 따라 식물을 분류하고, 다양한 환경에 따라 식물의 생김새와 생활 방식이 다름을 발표할 수 있다. 식물의 특징을 이용하여 일상생활에서 활용할 수 있는 생활용품을 설계하고 이를 발표할 수 있다.","가치·태도":"식물의 특징을 이용하여 일상생활에서 활용할 수 있는 생활용품을 설계하는 것에 관심을 가진다."},"C":{"지식·이해":"다양한 환경에 서식하는 식물의 생김새와 특징을 말하고, 식물의 특징을 이용한 생활용품이 있음을 말할 수 있다.","과정·기능":"여러 가지 식물을 관찰할 수 있다.","가치·태도":"식물의 특징을 이용하여 일상생활에서 활용할 수 있는 생활용품을 설계하는 활동에 참여할 수 있다."}},"p":125},{"b":1,"s":4,"a":"여러 가지 기체","ak":"여러가지기체","n":"여러 가지 기체","L":{"A":{"지식·이해":"기체가 무게가 있다는 것과 기체의 부피가 온도나 압력에 따라 달라짐을 설명하고, 일상생활에 이용되는 기체의 종류와 성질 및 이용 사례를 말할 수 있다.","과정·기능":"실험을 통해 기체가 무게가 있고 기체의 부피가 온도나 압력에 따라 달라짐을 관찰할 수 있다. 일상생활에서 이용되는 기체의 종류와 성질 및 이용 사례를 조사하고, 기체의 성질을 이용하여 작동시킬 수 있는 장치를 설계하여 제작할 수 있다.","가치·태도":"여러 가지 기체에 흥미를 가지고 일상생활에서 이용되는 기체의 종류와 성질에 대해 조사하는 활동에 참여한다."},"B":{"지식·이해":"기체가 무게가 있고 기체의 부피가 온도나 압력에 따라 달라짐을 설명하며, 일상생활에 이용되는 기체의 종류를 말할 수 있다.","과정·기능":"실험을 통해 기체가 무게가 있고 기체의 부피가 온도나 압력에 따라 달라짐을 관찰하고, 기체의 성질을 이용하여 작동시킬 수 있는 장치를 설계할 수 있다.","가치·태도":"여러 가지 기체와 일상생활에서 이용되는 기체의 종류를 알아보는 활동에 흥미를 가진다."},"C":{"지식·이해":"기체가 무게가 있고 기체의 부피가 온도나 압력에 따라 달라짐을 설명하며, 일상생활에서 기체가 이용됨을 말할 수 있다.","과정·기능":"기체가 무게가 있고 기체의 부피가 온도나 압력에 따라 달라짐을 관찰하고, 기체의 성질을 이용하여 작동시킬 수 있는 장치를 조사할 수 있다.","가치·태도":"일상생활에 이용되는 기체에 관심을 가진다."}},"p":137},{"b":1,"s":4,"a":"자석의 이용","ak":"자석의이용","n":"자석의 이용","L":{"A":{"지식·이해":"자석과 자석에 붙는 물체 사이에 작용하는 힘의 특징을 알고, 자석과 자석, 자석과 나침반 사이에 작용하는 힘의 특징을 자석의 극과 관련지어 설명할 수 있다. 자석을 이용하여 일상생활을 편리하게 할 수 있는 장치를 말할 수 있다.","과정·기능":"자석과 물체, 자석과 자석 사이에 작용하는 힘의 특징을 탐구할 수 있으며, 자석의 성질을 이용하여 일상생활을 편리하게 하는 장치를 설계할 수 있다.","가치·태도":"자석의 성질을 이용하여 우리 생활을 편리하게 하는 장치를 설계하면서 과학의 유용성을 인식한다."},"B":{"지식·이해":"자석에 붙는 물체들의 공통점을 알고, 자석과 자석 사이에 미는 힘과 당기는 힘이 작용함을 말할 수 있다. 나침반 바늘이 자석이라는 것과 일상생활에서 자석을 사용한 예를 말할 수 있다.","과정·기능":"자석과 물체, 자석과 자석 사이에 힘이 작용함을 관찰하고, 자석의 성질을 이용한 장치를 설계할 수 있다.","가치·태도":"자석을 이용한 장치를 설계하면서 자석의 성질에 대해 흥미와 관심을 가진다."},"C":{"지식·이해":"자석에 붙는 물체가 있음을 알고, 자석과 자석 사이에 힘이 작용한다는 사실과 우리 주위에서 자석이 사용되고 있다는 사실을 말할 수 있다.","과정·기능":"자석에 물체나 다른 자석을 가까이했을 때 나타나는 현상을 관찰할 수 있다.","가치·태도":"자석을 이용한 장치를 조사하면서 자석에 관심을 가진다."}},"p":131},{"b":1,"s":4,"a":"지구와 바다","ak":"지구와바다","n":"지구와 바다","L":{"A":{"지식·이해":"지구가 대기로 둘러싸여 있음을 알고, 바다와 바닷물의 특징을 육지와 육지의 물과 비교하여 이해하며, 밀물과 썰물의 차이를 설명할 수 있다.","과정·기능":"육지와 바닷물의 면적을 비교하고, 육지의 물과 바닷물을 가열하여 남는 물질을 탐구할 수 있으며, 바닷가에서 볼 수 있는 다양한 지형 및 갯벌의 가치와 보전의 필요성을 조사할 수 있다.","가치·태도":"생태적 가치를 존중하는 태도를 바탕으로 갯벌의 가치와 보전의 필요성을 설득·홍보하는 활동에 참여한다."},"B":{"지식·이해":"지구가 대기로 둘러싸여 있음을 알고, 육지와 바다의 면적과 바닷물의 특징을 이해하며, 밀물과 썰물 현상을 구별할 수 있다.","과정·기능":"육지와 바다의 면적을 비교하고, 육지의 물과 바닷물을 가열하여 남는 물질을 탐구할 수 있으며, 갯벌을 조사할 수 있다.","가치·태도":"생태적 가치를 존중하는 태도를 바탕으로 갯벌의 가치와 보전의 필요성을 인식한다."},"C":{"지식·이해":"지구 표면에 대기, 육지, 바다가 있음을 알고, 밀물과 썰물 현상이 있음을 말할 수 있다.","과정·기능":"바다가 차지하는 면적을 육지와 비교하고, 육지의 물과 바닷물을 가열하여 남는 물질을 비교할 수 있다.","가치·태도":"갯벌의 가치에 관심을 가진다."}},"p":128},{"b":1,"s":4,"a":"힘과 우리 생활","ak":"힘과우리생활","n":"힘과 우리 생활","L":{"A":{"지식·이해":"물체를 밀거나 당길 때 나타나는 현상을 알고, 수평잡기 활동을 통해 물체의 무게를 비교하는 방법과 물체의 무게를 정확하게 비교하려면 저울이 필요함을 설명할 수 있다. 지레, 빗면과 같은 도구를 사용하면 작은 힘으로 물체를 들 수 있다는 것을 설명할 수 있다.","과정·기능":"물체를 밀거나 당길 때 나타나는 현상을 관찰하고, 수평잡기 활동을 통해 자료를 수집하고 분석하여 물체의 무게를 비교하며, 저울을 이용하여 물체의 무게를 정확히 비교할 수 있다. 지레와 빗면에 대한 탐구를 통해 자료를 수집하고 자료의 규칙성을 파악하여 결론을 도출하며, 도구에 대해 조사한 내용을 친구들에게 공유할 수 있다.","가치·태도":"힘과 관련된 일상생활의 현상에 흥미를 가지고, 저울을 이용하여 물체의 무게를 정확하게 비교함으로써 저울의 과학적 유용성을 인식한다."},"B":{"지식·이해":"물체를 밀거나 당길 때 나타나는 공통적인 현상을 인지하고, 수평잡기 활동과 저울로 물체의 무게를 비교할 수 있음을 알며, 지레, 빗면은 작은 힘으로 물체를 드는 도구임을 설명할 수 있다.","과정·기능":"물체에 힘을 주면 나타나는 현상을 관찰하고, 물체의 무게를 수평잡기 활동과 저울을 이용하여 비교할 수 있다. 지레와 빗면과 같은 도구들에 대해 조사할 수 있다.","가치·태도":"일상생활의 힘과 관련된 현상을 통해 자연과 과학에 관심을 가지고, 저울을 이용하여 물체의 무게를 비교하는 것에 흥미를 가진다."},"C":{"지식·이해":"물체를 밀거나 당기는 모습이 힘과 관련된 현상임을 알 수 있다. 수평잡기 활동과 저울로 물체의 무게를 비교하고, 도구를 이용하면 물체를 쉽게 들어 올릴 수 있음을 설명할 수 있다.","과정·기능":"물체에 미는 힘과 당기는 힘을 주어 물체가 움직이는 현상을 관찰하고, 저울을 이용하여 물체의 무게를 비교할 수 있다. 지레와 빗면의 쓰임새에 대해 조사할 수 있다.","가치·태도":"일상생활에서 힘과 관련된 현상에 대해 흥미를 가지고, 물체의 무게를 비교할 때 저울을 이용하는 것에 관심을 가진다."}},"p":123},{"b":1,"s":6,"a":"스포츠","ak":"스포츠","n":"스포츠","L":{"A":{"지식·이해":"스포츠의 의미와 유형 및 이동·비이동·조작 움직임 기술의 종류와 각각의 의미를 명확하게 알고, 기술형·전략형·생태형 스포츠 각각의 특성 및 다양한 스포츠에서 활용되는 여러 가지 기본 움직임 기술을 예를 들어 구체적으로 설명할 수 있다. 또한 신체·노력·공간·관계 요소를 전반적으로 고려한 여러 가지 기본 움직임 기술의 수행 방법 및 기본 움직임을 연결한 여러 가지 복합적인 움직임 기술과 기술형·전략형·생태형 스포츠에 적합한 여러 가지 기본 움직임 기술을 구체적으로 파악할 수 있다.","과정·기능":"신체·노력·공간·관계 요소를 전반적으로 고려한 기본 움직임 기술과 여러 가지 기본 움직임을 연결한 복합적인 움직임 기술을 다양한 게임 상황에서 시도할 수 있다. 또한 기술형·전략형·생태형 스포츠에 적합한 여러 가지 기본 움직임 기술을 다양한 게임 및 활동 상황에서 시도할 수 있다.","가치·태도":"움직임 기술 수행에 항상 자신감을 갖고 다양한 활동 상황에서 적극적으로 시도할 수 있다. 또한 다양한 게임 활동에서 최선을 다하고 합의된 규칙을 일관되게 지키며 게임 활동에 참여할 수 있다. 그리고 다양한 스포츠 환경에 개방적인 태도를 갖고 이를 적극적으로 실천할 수 있으며, 여러 가지 스포츠 활동에 안전하게 참여할 수 있다."},"B":{"지식·이해":"스포츠의 의미와 유형 및 이동·비이동·조작 움직임 기술의 종류와 각각의 의미를 대략적으로 알고, 기술형·전략형·생태형 스포츠 각각의 특성 및 스포츠에서 활용되는 기본 움직임 기술을 설명할 수 있다. 또한 신체·노력·공간·관계 요소를 전반적으로 고려한 기본 움직임 기술의 수행 방법 및 여러 가지 기본 움직임을 연결한 복합적인 움직임 기술과 기술형·전략형·생태형 스포츠에 적합한 기본 움직임 기술을 대략적으로 파악할 수 있다.","과정·기능":"신체·노력·공간·관계 요소를 전반적으로 고려한 기본 움직임 기술과 여러 가지 기본 움직임을 연결한 복합적인 움직임 기술을 게임 상황에서 시도할 수 있다. 또한 기술형·전략형·생태형 스포츠에 적합한 기본 움직임 기술을 게임 및 활동 상황에서 시도할 수 있다.","가치·태도":"움직임 기술 수행에 자신감을 갖고 활동 상황에서 시도할 수 있다. 또한 일부 게임 활동에서 최선을 다하고 합의된 규칙을 지키며 게임 활동에 참여할 수 있다. 그리고 일부 스포츠 환경에 개방적인 태도를 갖고 이를 실천할 수 있으며, 스포츠 활동에 안전하게 참여할 수 있다."},"C":{"지식·이해":"스포츠의 의미 및 이동·비이동·조작 움직임 기술의 종류를 대략적으로 알고, 기술형·전략형·생태형 스포츠의 종류를 구별할 수 있으며, 스포츠에서 활용되는 일부 기본 움직임 기술을 제시할 수 있다. 또한 신체·노력·공간·관계 중 일부 요소를 고려한 기본 움직임 기술의 수행 방법 및 기본 움직임을 연결한 일부 움직임 기술과 기술형·전략형·생태형 스포츠에 적합한 일부 기본 움직임 기술을 대략적으로 파악할 수 있다.","과정·기능":"신체·노력·공간·관계 중 일부 요소를 고려한 기본 움직임 기술과 기본 움직임을 연결한 움직임 기술을 게임 상황에서 부분적으로 시도할 수 있다. 또한 기술형·전략형·생태형 스포츠에 적합한 기본 움직임 기술을 게임 및 활동 상황에서 부분적으로 시도할 수 있다.","가치·태도":"움직임 기술 수행에 자신감을 갖고자 노력하며 활동 상황에서 부분적으로 시도할 수 있다. 또한 일부 게임 활동에 열심히 참여하고 합의된 규칙을 부분적으로 지킬 수 있다. 그리고 일부 스포츠 환경에 개방적인 태도를 갖고 이를 실천하기 위해 노력하며, 일부 스포츠 활동에 안전하게 참여할 수 있다."}},"p":146},{"b":1,"s":6,"a":"운동","ak":"운동","n":"운동","L":{"A":{"지식·이해":"운동이 신체 변화 및 체력 증진에 미치는 영향과 건강의 의미 및 운동이 건강을 유지·증진하는 데 미치는 영향을 명확하게 알고, 운동 전후의 다양한 신체 변화 및 체력 증진과 운동의 필요성을 다양한 사례를 들어 구체적으로 설명할 수 있다. 또한 건강한 생활 습관의 필요성과 실천 방법을 명확하게 알 수 있다.","과정·기능":"체력 증진을 위한 기본 운동 방법과 절차를 명확하게 알고 수행하며, 자신의 신체 특성과 체력 수준에 맞는 다양한 운동을 시도할 수 있다. 또한 건강한 생활 습관을 일상생활 전반에서 규칙적으로 실천할 수 있다.","가치·태도":"자신의 체격·체형·체력적 특징 전반을 긍정적으로 인식하고, 이를 종합적으로 고려한 운동 계획을 구체적으로 세워 안전하게 활동할 수 있다. 또한 운동과 건강한 생활 습관 형성에 꾸준히 관심을 갖고 일상생활 전반에서 적극적으로 실천할 수 있다."},"B":{"지식·이해":"운동이 신체 변화 및 체력 증진에 미치는 영향과 건강의 의미 및 운동이 건강을 유지·증진하는 데 미치는 영향을 대략적으로 알고, 운동 전후의 신체 변화 및 체력 증진 중 일부와 운동의 필요성 중 일부의 사례를 들어 설명할 수 있다. 또한 건강한 생활 습관의 필요성과 실천 방법을 대략적으로 알 수 있다.","과정·기능":"체력 증진을 위한 기본 운동 방법과 절차를 대략적으로 알고 수행하며, 자신의 신체 특성과 체력 수준에 맞는 운동을 시도할 수 있다. 또한 건강한 생활 습관을 일상생활에서 일부 규칙적으로 실천할 수 있다.","가치·태도":"자신의 체격·체형·체력적 특징 일부를 긍정적으로 인식하고, 이를 부분적으로 고려한 운동 계획을 세워 안전하게 활동할 수 있다. 또한 운동과 건강한 생활 습관 형성에 꾸준히 관심을 갖고 일상생활에서 일부 실천할 수 있다."},"C":{"지식·이해":"운동이 신체 변화나 체력 증진에 미치는 영향과 운동이 건강에 미치는 영향을 대략적으로 알고, 운동 전후의 체력 변화 중 일부와 운동의 필요성 중 일부를 제시할 수 있다. 또한 건강한 생활 습관의 필요성을 대략적으로 알 수 있다.","과정·기능":"체력 증진을 위한 기본 운동 방법을 대략적으로 알고 수행하며, 자신의 신체 특성이나 체력 수준에 맞는 운동을 부분적으로 시도할 수 있다. 또한 건강한 생활 습관을 일상생활에서 일부 실천할 수 있다.","가치·태도":"자신의 체격·체형·체력적 특징 중 일부를 인식하고, 이를 부분적으로 고려한 운동 계획에 따라 안전하게 활동할 수 있다. 또한 운동과 건강한 생활 습관 형성에 간헐적으로 관심을 갖고 일상생활에서 일부 실천할 수 있다."}},"p":145},{"b":1,"s":6,"a":"표현","ak":"표현","n":"표현","L":{"A":{"지식·이해":"표현 활동의 의미를 명확하게 알고, 표현과 기본 움직임 기술과의 관계를 예를 들어 구체적으로 설명할 수 있다. 또한 움직임 요소에 따른 기본 움직임 기술의 다양한 표현 방법을 명확하게 알 수 있다.","과정·기능":"움직임 요소에 따른 기본 움직임 기술의 다양한 표현 방법을 여러 가지 상황에서 아름답게 표현할 수 있다. 또한 모방 표현·추상 표현·리듬 표현·도구 표현을 할 때 다양한 기본 움직임 기술을 활용하여 아름답게 표현할 수 있다.","가치·태도":"다양한 기본 움직임 기술로 아름답게 표현하는 여러 가지 활동에 깊은 관심을 갖고 감수성을 적극적으로 나타낼 수 있다."},"B":{"지식·이해":"표현 활동의 의미를 대략적으로 알고, 표현과 기본 움직임 기술과의 관계를 예를 들어 설명할 수 있다. 또한 움직임 요소에 따른 기본 움직임 기술의 다양한 표현 방법을 대략적으로 알 수 있다.","과정·기능":"움직임 요소에 따른 기본 움직임 기술의 다양한 표현 방법을 여러 가지 상황에서 표현할 수 있다. 또한 모방 표현·추상 표현·리듬 표현·도구 표현을 할 때 일부 기본 움직임 기술을 활용하여 아름답게 표현할 수 있다.","가치·태도":"다양한 기본 움직임 기술로 아름답게 표현하는 일부 활동에 관심을 갖고 감수성을 나타낼 수 있다."},"C":{"지식·이해":"표현 활동의 의미를 대략적으로 알고, 표현과 기본 움직임 기술과의 관계를 일부 제시할 수 있다. 또한 움직임 요소에 따른 기본 움직임 기술의 표현 방법 일부를 대략적으로 알 수 있다.","과정·기능":"움직임 요소에 따른 기본 움직임 기술의 표현 방법 일부를 주어진 상황에서 부분적으로 표현할 수 있다. 또한 모방 표현·추상 표현·리듬 표현·도구 표현을 할 때 일부 기본 움직임 기술을 부분적으로 활용하여 표현할 수 있다.","가치·태도":"기본 움직임 기술로 아름답게 표현하는 일부 활동에 부분적으로 관심을 갖고 감수성을 나타낼 수 있다."}},"p":147},{"b":1,"s":7,"a":"감상","ak":"감상","n":"감상","L":{"A":{"지식·이해":"다양한 종류의 음악을 적극적으로 듣고 음악 속에 포함된 기초적인 음악 요소와 특징, 음악의 느낌, 분위기, 쓰임 및 우리 지역의 음악 문화유산에 대해 충분히 이해한다.","과정·기능":"다양한 음악을 듣고 음악에 대한 자신의 반응을 여러 가지 방법으로 자유롭게 표현하며 기초적인 음악 요소, 느낌, 분위기, 쓰임을 적극적으로 탐색하며 발견하고, 음악적 특징을 구체적으로 묘사하거나 이야기한다.","가치·태도":"생활 속에서 다양한 음악과 우리 지역의 음악 문화유산에 대한 호기심을 가지고 찾아 들으며, 소리와 음악을 적극적으로 즐기는 태도를 갖는다."},"B":{"지식·이해":"다양한 종류의 음악을 듣고 음악 속에 포함된 기초적인 음악 요소와 특징, 음악의 느낌, 분위기, 쓰임 및 우리 지역의 음악 문화유산에 대해 이해한다.","과정·기능":"다양한 음악을 듣고 음악에 대한 자신의 반응을 자유롭게 표현하며 기초적인 음악 요소, 느낌, 분위기, 쓰임을 탐색하며 발견하고, 음악적 특징을 묘사하거나 이야기한다.","가치·태도":"생활 속에서 음악과 우리 지역의 음악 문화유산에 대한 호기심을 가지고 들으며 소리와 음악을 즐기는 태도를 갖는다."},"C":{"지식·이해":"다양한 종류의 음악을 듣고 음악 속에 포함된 기초적인 음악 요소, 음악적 특징, 느낌, 분위기, 쓰임 및 우리 지역의 음악 문화유산에 대해 부분적으로 이해한다.","과정·기능":"다양한 음악을 듣고 음악에 대한 자신의 반응을 표현하고자 노력하며 기초적인 음악 요소, 느낌, 분위기, 쓰임을 탐색하며 발견하는 활동에 참여하며 음악적 특징을 일부 묘사하거나 이야기한다.","가치·태도":"생활 속에서 음악과 우리 지역의 음악 문화유산을 듣고 소리와 음악을 즐기려는 태도를 갖는다."}},"p":155},{"b":1,"s":7,"a":"연주","ak":"연주","n":"연주","L":{"A":{"지식·이해":"바른 자세와 주법, 기초적인 음악 요소와 여러 소리의 특성을 충분히 이해하여 노래 부르거나 연주하고, 그에 대한 느낌을 바탕으로 생활 속 다양한 음악에 대해 안다.","과정·기능":"자연스러운 노래나 악기 연주로 발표하고, 연주를 통해 알게 된 점과 연주에 대한 자신의 느낌을 이야기하며 악곡에 어울리는 신체 표현이나 놀이를 한다.","가치·태도":"연주 활동에 관심을 가지며 적극적인 태도로 연주를 즐긴다."},"B":{"지식·이해":"바른 자세와 주법, 기초적인 음악 요소와 여러 소리의 특성을 이해하여 노래 부르거나 연주하고, 그에 대한 느낌을 가지고 생활 속 음악에 대해 안다.","과정·기능":"노래나 악기 연주로 발표하고, 연주에 대한 자신의 느낌을 이야기하며 악곡에 어울리는 신체 표현이나 놀이를 한다.","가치·태도":"연주 활동에 관심을 가지고 연주를 즐긴다."},"C":{"지식·이해":"바른 자세와 주법, 기초적인 음악 요소와 여러 소리의 특성을 부분적으로 이해하여 노래 부르거나 연주하고, 그에 대한 느낌을 가지고 생활 속 음악에 대해 부분적으로 안다.","과정·기능":"노래나 악기 연주로 발표하고, 연주에 대한 자신의 느낌을 부분적으로 이야기하며 악곡에 어울리게 신체 표현이나 놀이를 하려고 노력한다.","가치·태도":"연주 활동에 관심을 가지며 즐기려고 노력한다."}},"p":155},{"b":1,"s":7,"a":"창작","ak":"창작","n":"창작","L":{"A":{"지식·이해":"생활 주변의 소리나 장면, 느낌, 상상을 소리나 음악으로 표현하기 위한 기초적인 음악 요소를 충분히 이해하고 음표, 기호, 숫자 등을 적절히 활용하는 간단한 악기 표현 방법을 잘 안다.","과정·기능":"표현하고자 하는 내용에 어울리게 소리나 음악을 즉흥적으로 표현한다. 기초적인 음악 요소의 특징이 잘 나타나도록 창의적으로 표현하고, 악곡의 특성에 맞게 악곡의 일부를 바꾸어 적절하게 간단한 악보로 나타내며 생활 주변의 소리나 장면의 특징을 살려 실감나게 모방한다.","가치·태도":"음악 표현 활동에 즐겁게 참여하며 음악에 대한 흥미를 갖고, 새로운 음악적 표현을 적극적으로 즐기는 태도를 갖는다."},"B":{"지식·이해":"생활 주변의 소리나 장면, 느낌, 상상을 소리나 음악으로 표현하기 위한 기초적인 음악 요소를 이해하고 음표, 기호, 숫자 등을 적절히 활용하는 간단한 악기 표현 방법을 안다.","과정·기능":"표현하고자 하는 내용을 소리나 음악으로 즉흥적으로 표현한다. 기초적인 음악 요소의 특징이 나타나도록 소리나 음악으로 표현하고, 악곡의 일부를 바꾸어 간단한 악보로 나타내며 생활 주변의 소리나 장면의 특징을 살려 모방한다.","가치·태도":"음악 표현 활동에 참여하며 음악에 대한 흥미를 갖고, 새로운 음악적 표현을 즐기는 태도를 가진다."},"C":{"지식·이해":"생활 주변의 소리나 장면, 느낌, 상상을 소리나 음악으로 표현하기 위한 기초적인 음악 요소를 부분적으로 이해하고 음표, 기호, 숫자 등을 적절히 활용하는 간단한 악기 표현 방법을 일부 안다.","과정·기능":"기초적인 음악 요소를 활용하여 표현하고자 하는 내용을 소리나 음악으로 표현하려고 노력한다. 악곡의 일부를 바꾸어 간단한 악보로 나타내려고 노력하며 생활 주변의 소리나 장면을 모방한다.","가치·태도":"음악 표현 활동에 참여하며 음악에 대한 흥미와 새로운 음악적 표현을 즐기는 태도를 가지려고 노력한다."}},"p":156},{"b":1,"s":8,"a":"감상","ak":"감상","n":"감상","L":{"A":{"지식·이해":"미술 작품과 미술가, 작품의 다양한 특징을 이해하고 구체적으로 설명할 수 있다.","과정·기능":"미술 작품을 자세히 보고 다양한 질문을 하며, 작품에 관한 자신의 느낌과 생각을 구체적으로 설명할 수 있으며 미술 전시 및 행사에 주도적으로 참여할 수 있다.","가치·태도":"자신의 감상 관점을 존중하는 태도를 내면화할 수 있으며 다양한 미술 문화에 관심을 가진다."},"B":{"지식·이해":"미술 작품과 미술가, 작품의 특징에 대하여 이해하고 설명할 수 있다.","과정·기능":"미술 작품을 자세히 보고 질문하며 작품에 관한 자신의 느낌과 생각을 설명할 수 있으며 미술 전시 및 행사에 참여할 수 있다.","가치·태도":"자신의 감상 관점을 존중할 수 있으며 미술 문화에 관심을 가진다."},"C":{"지식·이해":"미술 작품과 미술가, 작품의 특징에 대하여 부분적으로 설명할 수 있다.","과정·기능":"미술 작품을 보고 일부 질문을 시도하고 자신의 느낌과 생각을 부분적으로 설명하며, 미술 전시 및 행사에 제한적으로 참여할 수 있다.","가치·태도":"자신의 감상 관점을 가지려고 노력하며 미술 문화에 일부 관심을 가진다."}},"p":178},{"b":1,"s":8,"a":"미적 체험","ak":"미적체험","n":"미적 체험","L":{"A":{"지식·이해":"자연물과 인공물을 탐색하는 데 쓰이는 자신의 다양한 감각과 대상의 특징을 이해하고 설명할 수 있으며 생활 속 미술의 여러 사례를 조사할 수 있다.","과정·기능":"자신의 다양한 감각을 적극적으로 활용하여 대상의 특징을 탐색하고, 떠오른 느낌과 생각을 구체적이고 다양한 방법으로 나타낼 수 있으며, 생활 속 미술의 사례에서 미술의 특징과 역할을 다양하게 발견할 수 있다.","가치·태도":"미적 탐색에 호기심을 갖고 적극적으로 참여하며 생활 속에서 활용되는 미술에 지속적인 관심을 가진다."},"B":{"지식·이해":"자연물과 인공물을 탐색하는 데 쓰이는 자신의 다양한 감각을 발견하고 대상의 특징을 이해하며 생활 속 미술의 사례를 찾을 수 있다.","과정·기능":"자신의 다양한 감각을 활용하여 대상의 특징을 탐색하고, 떠오른 느낌과 생각을 다양한 방법으로 나타낼 수 있으며, 생활 속 미술의 사례에서 미술의 특징과 역할을 발견할 수 있다.","가치·태도":"미적 탐색에 호기심을 갖고 참여하며 생활 속에서 활용되는 미술에 관심을 가진다."},"C":{"지식·이해":"자신의 감각으로 대상의 특징을 부분적으로 이해할 수 있다.","과정·기능":"자신의 감각을 제한적으로 활용하여 대상을 체험하고 떠오른 느낌과 생각을 부분적으로 나타낼 수 있으며, 생활 속 미술의 특징과 역할을 발견하고자 노력한다.","가치·태도":"미적 탐색과 생활 속에서 활용되는 미술을 찾는 활동에 관심을 보인다."}},"p":176},{"b":1,"s":8,"a":"표현","ak":"표현","n":"표현","L":{"A":{"지식·이해":"기본적인 표현 재료와 용구의 특성과 조형 요소의 다양한 특징을 이해하고 설명할 수 있다.","과정·기능":"관찰과 상상으로 다양한 아이디어를 떠올려 표현 주제를 구체화하고 기본적인 표현 재료와 용구의 적절한 사용 방법을 익힐 수 있으며, 주제 표현에 적합한 조형 요소를 찾아 알맞게 활용할 수 있다. 분명한 표현 의도를 가지고 주도적으로 작품을 제작하며 다양한 탐색을 통해 미술과 타 교과를 관련지어 주제를 표현할 수 있다.","가치·태도":"자기 작품을 소중히 여기는 태도를 실천하며 미술과 타 교과를 관련지어 주제를 표현하는 데 지속적으로 흥미를 가진다."},"B":{"지식·이해":"기본적인 표현 재료와 용구의 특성과 조형 요소의 특징을 이해할 수 있다.","과정·기능":"관찰과 상상으로 아이디어를 떠올려 표현 주제를 구체화하고 기본적인 표현 재료와 용구의 사용 방법을 익힐 수 있으며, 조형 요소의 특징을 주제 표현에 알맞게 활용할 수 있다. 표현 의도를 가지고 작품을 제작하며 미술과 타 교과를 관련지어 주제를 표현할 수 있다.","가치·태도":"자기 작품을 소중히 여기는 태도를 가지고 미술과 타 교과를 관련지어 주제를 표현하는 데 흥미를 가진다."},"C":{"지식·이해":"기본적인 표현 재료와 용구의 특성을 부분적으로 이해할 수 있다.","과정·기능":"관찰과 상상으로 아이디어를 떠올려 표현 주제를 나타내고 기본적인 표현 재료와 용구의 사용 방법을 익히고자 노력하며, 조형 요소의 일부 특징을 주제 표현에 활용하려고 시도할 수 있다. 표현 의도를 작품 제작에 반영하고자 시도하며 미술과 타 교과를 관련지을 수 있다.","가치·태도":"자기 작품을 소중히 여기는 태도를 가지려고 노력하며 미술과 타 교과를 관련지어 주제를 표현하는 데 흥미를 가지려고 노력한다."}},"p":177},{"b":1,"s":9,"a":"이해","ak":"이해","n":"이해","L":{"A":{"지식·이해":"간단한 의사소통 상황과 목적, 다양한 문화권에 속한 사람들 간의 비언어적 의사소통 맥락을 파악하여 자기 주변의 주제와 관련된 간단한 단어, 어구, 문장 및 다양한 유형의 간단한 담화와 글을 정확하게 이해할 수 있다.","과정·기능":"알파벳 대소 문자와 강세, 리듬, 억양을 정확하게 식별하고, 소리와 철자의 관계를 이해하며 쉽고 간단한 단어, 어구, 문장을 정확하게 소리 내어 읽고 이해할 수 있으며, 자기 주변 주제에 관하여 다양한 매체로 표현한 담화나 문장의 주요 정보 등을 적절한 전략을 활용하여 정확하게 파악할 수 있다.","가치·태도":"자기 주변 주제에 관한 쉽고 간단한 담화나 문장을 듣거나 읽을 때 높은 흥미를 가지며, 상대방의 감정을 느끼고 적극적으로 공감하며 다양한 문화와 의견을 적극적으로 존중하는 태도를 보인다."},"B":{"지식·이해":"간단한 의사소통 상황과 목적, 다양한 문화권에 속한 사람들 간의 비언어적 의사소통 맥락을 파악하여 자기 주변의 주제와 관련된 간단한 단어, 어구, 문장 및 다양한 유형의 간단한 담화와 글을 대체로 이해할 수 있다.","과정·기능":"알파벳 대소 문자와 강세, 리듬, 억양을 대체로 식별하고 소리와 철자의 관계를 이해하며 쉽고 간단한 단어, 어구, 문장을 대체로 소리 내어 읽고 이해할 수 있으며, 자기 주변 주제에 관하여 다양한 매체로 표현한 담화나 문장의 주요 정보 등을 적절한 전략을 일부 활용하여 대체로 파악할 수 있다.","가치·태도":"자기 주변 주제에 관한 쉽고 간단한 담화나 문장을 듣거나 읽을 때 대체로 흥미를 가지며, 상대방의 감정을 느끼고 공감하며 다양한 문화와 의견을 존중하는 태도를 보인다."},"C":{"지식·이해":"간단한 의사소통 상황과 목적, 다양한 문화권에 속한 사람들 간의 비언어적 의사소통 맥락을 파악하여 자기 주변의 주제와 관련된 간단한 단어, 어구, 문장 및 다양한 유형의 간단한 담화와 글을 반복적으로 듣거나 읽고 부분적으로 이해할 수 있다.","과정·기능":"알파벳 대소 문자와 강세, 리듬, 억양을 식별하고 소리와 철자의 관계를 이해하며 매우 쉽고 간단한 단어, 어구, 문장을 부분적으로 소리 내어 읽고 이해할 수 있으며, 다양한 매체로 표현된 자기 주변 주제에 관한 담화나 문장의 주요 정보 등을 예시를 참고하고 적절한 전략을 일부 활용하여 부분적으로 파악할 수 있다.","가치·태도":"자기 주변 주제에 관한 매우 쉽고 간단한 담화나 문장을 듣거나 읽을 때 흥미를 가지려고 노력하며, 상대방의 감정을 느끼고 공감하며 다양한 문화와 의견을 존중하는 태도를 가지려고 노력한다."}},"p":197},{"b":1,"s":9,"a":"표현","ak":"표현","n":"표현","L":{"A":{"지식·이해":"자기 주변 주제에 관한 간단한 의사소통 상황 및 다양한 문화권에 속한 사람들의 비언어적 의사소통 맥락에서 쉽고 간단한 단어, 어구, 문장, 다양한 유형의 담화 및 글을 정확하게 표현할 수 있다.","과정·기능":"자기 주변 주제에 관한 의사소통 상황에서 강세, 리듬, 억양에 맞게 따라 말하기, 알파벳 대소 문자 쓰기, 소리와 철자의 관계를 바탕으로 쉽고 간단한 단어 쓰기, 실물, 그림, 동작 등을 보고 말하거나 단어나 어구로 쓰기, 감정 표현, 소개‧묘사, 행동 지시, 담화 주요 정보 등을 적절한 단어와 언어 형식에 맞게 말하거나 제시된 문장을 정확하게 보고 쓰기를 하면서 적절한 매체와 전략을 다양하게 활용하여 창의적으로 의미를 표현할 수 있다.","가치·태도":"자기 주변 주제에 관한 의사소통 활동에 높은 흥미와 자신감을 가지고 대화 예절을 지키며 적극적으로 참여한다."},"B":{"지식·이해":"자기 주변 주제에 관한 간단한 의사소통 상황 및 다양한 문화권에 속한 사람들의 비언어적 의사소통 맥락에서 쉽고 간단한 단어, 어구, 문장, 다양한 유형의 담화 및 글을 대체적으로 표현할 수 있다.","과정·기능":"자기 주변 주제에 관한 의사소통 상황에서 강세, 리듬, 억양에 맞게 따라 말하기, 알파벳 대소 문자 쓰기, 소리와 철자의 관계를 바탕으로 쉽고 간단한 단어 쓰기, 실물, 그림, 동작 등을 보고 말하거나 단어나 어구로 쓰기, 감정 표현, 소개‧묘사, 행동 지시, 담화 주요 정보 등을 적절한 단어를 사용하여 대체로 말하거나 제시된 문장을 대체로 보고 쓰기를 하면서 적절한 매체나 전략을 일부 활용하여 창의적으로 의미를 표현할 수 있다.","가치·태도":"자기 주변 주제에 관한 의사소통 활동에 대체로 흥미와 자신감을 가지고 대화 예절을 지키며 참여하는 태도를 보인다."},"C":{"지식·이해":"자자기 주변 주제에 관한 간단한 의사소통 상황 및 다양한 문화권에 속한 사람들의 비언어적 의사소통 맥락에서 매우 쉽고 간단한 단어, 어구, 문장, 다양한 유형의 담화 및 글을 부분적으로 표현할 수 있다.","과정·기능":"자기 주변 주제에 관한 의사소통 상황에서 강세, 리듬, 억양에 맞게 따라 말하기, 알파벳 대소 문자 쓰기, 소리와 철자의 관계를 바탕으로 쉽고 간단한 단어 쓰기, 실물, 그림, 동작 등을 보고 말하거나 단어나 어구로 쓰기, 감정 표현, 소개‧묘사, 행동 지시, 담화 주요 정보 등을 주어진 도움 자료를 받아 말하거나 제시된 문장을 보고 부분적으로 쓰기를 하면서 예시를 참고하여 적절한 매체나 전략을 일부 활용하여 창의적으로 의미를 표현할 수 있다.","가치·태도":"자기 주변 주제에 관한 의사소통 활동에 일부 흥미와 자신감을 가지고 대화 예절을 지키며 참여하려고 노력한다."}},"p":197},{"b":2,"s":0,"a":"듣기·말하기","ak":"듣기말하기","n":"듣기·말하기","L":{"A":{"지식·이해":"대화, 면담, 발표, 토의, 토론과 같은 다양한 담화 유형을 충분히 이해하고, 상황 맥락과 사화·문화적 맥락을 고려하여 의사소통의 목적을 달성하며 듣고 말하는 방법을 알 수 있다.","과정·기능":"대화에서 정보와 맥락을 적극적으로 활용하여 드러나지 않거나 생략된 내용을 적절하게 추론하며 듣고, 상대의 주장, 이유, 근거를 정확하게 파악하고 이유나 근거가 주장을 타당하게 뒷받침하는지 적극적으로 평가하며 들을 수 있다. 듣기 목적에 맞게 주제와 관련하여 궁금한 내용에 대해 분명한 표현으로 질문하며, 적극적으로 듣고 말할 수 있다. 면담의 절차를 이해하여 상황에 맞게 적절하게 적용하고, 상대와 매체를 고려하여 효과적으로 면담을 수행하고, 말하기 목적과 주제를 고려하여 선별한 자료에서 핵심 정보를 중심으로 내용을 효과적으로 구성하고 적합한 매체를 활용하여 발표할 수 있다. 토의에 협력적으로 참여하여 자신의 의견을 타당하게 제시하고 열린 자세로 여러 사람의 의견을 수용하며 서로의 의견을 검토하고 비교 조정하며 토의를 수행하고, 토론의 절차와 규칙을 정확하게 지키고 주장에 대한 타당한 이유와 근거로 토론의 내용을 구성하고 내용의 타당성을 평가하며 토론에 적극적으로 참여할 수 있다.","가치·태도":"다양한 담화 유형에 적극적으로 참여하며 예의 바르게 듣고 말하는 태도를 지닌다."},"B":{"지식·이해":"대화, 면담, 발표, 토의, 토론과 같은 다양한 담화 유형을 이해하고, 상황 맥락과 사화·문화적 맥락을 고려하여 듣고 말하는 방법을 알 수 있다.","과정·기능":"대화에서 정보와 맥락을 활용하여 드러나지 않거나 생략된 내용을 추론하며 듣고, 상대의 주장, 이유, 근거를 파악하고 이유나 근거가 주장을 타당하게 뒷받침하는지 평가하면서 들으며, 듣기 목적에 맞게 주제와 관련한 궁금한 내용에 대해 질문하며 적극적으로 듣고 말할 수 있다. 면담의 절차를 이해하여 상대와 매체를 고려하며 면담을 수행하고, 선별한 자료에서 핵심 정보를 중심으로 내용을 구성하고 적절한 매체를 활용하여 발표할 수 있다. 토의에서 자신의 의견을 제시하고 상대의 의견을 들으며 서로의 의견을 검토하고 비교 조정하며 토의를 수행하고, 절차와 규칙을 지키고 주장에 대한 타당한 이유와 근거를 제시하며 토론에 참여할 수 있다.","가치·태도":"다양한 담화 유형에 참여하여 예의를 갖춰 듣고 말하는 태도를 지닌다."},"C":{"지식·이해":"대화, 면담, 발표, 토의, 토론과 같은 담화 유형을 부분적으로 이해하고, 상황 맥락과 사화·문화적 맥락을 고려하여 듣고 말하는 방법을 제한적으로 안다.","과정·기능":"대화에서 드러나지 않거나 생략된 내용을 대강 짐작하고, 상대의 주장을 부분적으로 파악하고 이유나 근거를 제한적으로 평가하면서 듣고, 주제와 관련한 궁금한 내용에 대해 질문하며 듣고 말한다. 면담의 절차를 부분적으로 이해하고 상대를 고려하여 면담하고, 자료를 바탕으로 발표 내용을 구성하고 매체를 활용하여 발표한다. 토의에 자신의 의견을 제한적으로 제시하고 서로의 의견을 비교하고 조정하는 데 일부 참여하며, 절차와 규칙에 따라 주장에 대한 이유나 근거를 일부 제시하며 토론에 참여한다.","가치·태도":"다양한 담화 유형에 참여하려는 태도를 지닌다."}},"p":28},{"b":2,"s":0,"a":"매체","ak":"매체","n":"매체","L":{"A":{"지식·이해":"매체 소통의 맥락에 대한 이해를 바탕으로 매체 자료에 대한 검색, 신뢰성 평가의 필요성과 방법을 이해할 수 있다.","과정·기능":"목적에 맞는 매체 자료를 다양한 방식으로 검색하고 매체 자료의 신뢰성을 다면적으로 평가할 수 있으며, 다양한 표현 양식을 활용하고 수용자 반응을 고려하여 복합양식 매체 자료를 제작하고 다양한 매체 소통 공간에 공유할 수 있다.","가치·태도":"매체 이용 양상에 대한 성찰의 필요성을 인식하고 자신의 매체 이용 양상을 지속적으로 성찰하며 적극적으로 개선해 나가려는 태도를 지닌다."},"B":{"지식·이해":"매체 소통의 맥락에 대한 기본적인 이해를 바탕으로 매체 자료를 검색하거나 매체 자료의 신뢰성을 평가해야 할 필요성을 이해할 수 있다.","과정·기능":"목적에 맞는 매체 자료를 검색하고 매체 자료의 신뢰성을 평가할 수 있으며, 표현 양식과 수용자 반응을 고려하여 기본적인 형태의 복합양식 매체 자료를 제작하고 친숙한 매체 소통 공간을 통해 공유할 수 있다.","가치·태도":"자신의 매체 이용 양상을 점검해야 할 필요성을 인지하고 스스로 개선해 나가려는 태도를 지닌다."},"C":{"지식·이해":"매체 소통 맥락과 전통적인 소통 맥락의 다른 점을 안다.","과정·기능":"익숙한 매체 소통 공간을 중심으로 매체 자료를 검색하고, 한두 가지 근거를 들어 매체 자료의 신뢰성을 평가하며 기초적인 형태의 복합양식 텍스트를 제작하고 주변의 지인들에게 제작한 매체 자료를 공유한다.","가치·태도":"안내된 방법에 따라 자신의 매체 이용 양상을 점검하여 개선하려고 시도한다."}},"p":34},{"b":2,"s":0,"a":"문법","ak":"문법","n":"문법","L":{"A":{"지식·이해":"음성 언어 및 문자 언어의 특성과 표현 효과, 표준어 및 방언의 기능, 고유어와 관용 표현, 문장 성분, 시간 표현, 단어 및 문장과 띄어쓰기의 정확한 표기를 종합적으로 알 수 있다.","과정·기능":"언어 단위와 표현의 특성을 분석하여 글과 담화에 적절한 표현을 효과적으로 활용하고 언어 표현의 효과를 종합적으로 평가할 수 있으며, 국어생활을 점검하여 국어를 바르게 사용할 수 있다.","가치·태도":"국어생활에서 국어를 민감하게 살펴 바르게 고치는 태도를 내면화한다."},"B":{"지식·이해":"음성 언어 및 문자 언어의 특성과 표현 효과, 표준어 및 방언의 기능, 고유어와 관용 표현, 문장 성분, 시간 표현, 단어 및 문장과 띄어쓰기의 정확한 표기를 알 수 있다.","과정·기능":"언어 단위와 표현의 특성을 이해하여 글과 담화에 적절하게 활용하고 언어 표현의 효과를 분석할 수 있으며, 국어생활을 점검하여 국어를 바르게 사용할 수 있다.","가치·태도":"국어를 바르게 고치는 태도를 지닌다."},"C":{"지식·이해":"음성 언어 및 문자 언어의 특성과 표현 효과, 표준어 및 방언의 기능, 고유어와 관용 표현, 문장 성분, 시간 표현, 단어 및 문장과 띄어쓰기의 정확한 표기를 제한적으로 안다.","과정·기능":"언어 단위와 표현의 특성을 확인하여 글과 담화에 제한적으로 활용하고 언어 표현의 효과를 제한적으로 이해할 수 있으며, 국어생활을 제한적으로 점검하여 국어의 일부를 바르게 사용한다.","가치·태도":"국어를 바르게 고치는 것에 관심을 가진다."}},"p":32},{"b":2,"s":0,"a":"문학","ak":"문학","n":"문학","L":{"A":{"지식·이해":"시, 소설, 극, 수필의 특성을 이해하고 문학 작품을 통한 소통에서 작가 맥락과 독자 맥락을 고려해야 함을 안다.","과정·기능":"작품에서 인물, 사건, 배경을 적절하게 정리하고, 비유적 표현의 특성과 효과에 유의하면서 작가의 의도를 적절하게 생각하며, 작품에서 인상적인 부분을 찾아 인상적인 이유를 작품과 연결지어 구체적으로 설명할 수 있고, 일상생활에서의 경험을 시, 소설, 극, 수필 등의 적절한 갈래로 창의적으로 표현할 수 있다.","가치·태도":"작품을 읽고 자신의 삶을 작품과 적절하게 연관 지어 탐색하고 적극적으로 성찰하는 태도를 지닌다."},"B":{"지식·이해":"시, 소설, 극, 수필의 특성을 부분적으로 이해하고 문학 작품을 통한 소통에서 작가 맥락과 독자 맥락을 고려해야 함을 안다.","과정·기능":"작품에서 인물, 사건, 배경을 찾고, 비유적 표현의 효과에 유의하면서 작가의 의도를 생각하며, 작품에서 인상적인 부분을 찾아 인상적인 이유를 다른 사람과 나눌 수 있고, 일상생활에서의 경험을 시, 소설, 극, 수필 등의 갈래로 표현할 수 있다.","가치·태도":"작품을 읽고 자신의 삶을 작품과 연관 지어 탐색하고 성찰하는 태도를 지닌다."},"C":{"지식·이해":"시, 소설, 극, 수필의 특성을 부분적으로 이해한다.","과정·기능":"작품을 읽고 인물, 사건, 배경이 있음을 알고, 비유적 표현을 찾으며 작가의 의도를 부분적으로 생각하며, 작품에서 인상적인 부분을 찾아 자신의 의견을 말하고, 일상생활에서의 경험을 시, 소설, 극, 수필 등의 갈래로 간단하게 표현한다.","가치·태도":"작품을 읽고 연관된 자신의 경험을 떠올리는 태도를 지닌다."}},"p":33},{"b":2,"s":0,"a":"쓰기","ak":"쓰기","n":"쓰기","L":{"A":{"지식·이해":"쓰기에서 상황 맥락과 사회·문화적 맥락의 개념과 필요성을 인식하고 이에 대한 이해를 바탕으로, 대상의 특성이 나타나게 설명하는 글, 적절한 근거를 들어 주장하는 글, 체험에 대한 감상을 나타내는 글의 특성을 이해하고 이와 같은 유형의 글을 쓰는 방법을 알 수 있다.","과정·기능":"쓰기의 상황 맥락을 전체적으로 고려하여 글의 내용을 생성하고, 통일성을 갖추어 내용을 조직하며 독자를 고려하여 효과적으로 표현할 수 있다. 자신의 쓰기 과정을 능동적으로 점검·조정하고 다양한 유형의 글에 대해 글 전체의 내용과 표현을 통일성 있게 효과적으로 고쳐 쓸 수 있으며 자신의 글을 다양한 독자와 공유할 수 있다.","가치·태도":"쓰기 윤리를 가치 있게 인식하고 이를 준수하며, 쓰기에 적극적이고 주도적으로 참여하는 태도를 지닌다."},"B":{"지식·이해":"쓰기의 상황 맥락과 사회·문화적 맥락을 고려하는 것이 필요한 이유를 알고, 대상의 특성이 나타나게 설명하는 글, 적절한 근거를 들어 주장하는 글, 체험에 대한 감상을 나타내는 글의 특성을 알 수 있다.","과정·기능":"쓰기의 상황 맥락을 고려하여 글의 내용을 생성하고, 통일성을 갖추어 내용을 조직하며 독자를 고려하여 표현할 수 있다. 자신의 쓰기 과정을 점검·조정하고 글 전체의 내용과 표현을 통일성 있게 고쳐 쓸 수 있으며 자신의 글을 독자와 공유할 수 있다.","가치·태도":"쓰기 윤리를 준수하며 쓰기에 적극적으로 참여하는 태도를 지닌다."},"C":{"지식·이해":"쓰기의 상황 맥락과 사회·문화적 맥락이 있음을 알고, 대상의 특성이 나타나게 설명하는 글, 적절한 근거를 들어 주장하는 글, 체험에 대한 감상을 나타내는 글의 특성을 부분적으로 안다.","과정·기능":"쓰기의 상황 맥락을 부분적으로 고려하여 글의 내용을 생성하고, 일부 유형의 글에 대해 통일성을 갖추어 내용을 조직하거나 독자를 고려하여 표현한다. 자신의 쓰기 과정을 점검하고 일부 유형의 글에 대해 글 전체의 내용이나 표현을 통일성 있게 고쳐 쓴다.","가치·태도":"쓰기 윤리를 인식하며 쓰기에 참여하는 태도를 지닌다."}},"p":31},{"b":2,"s":0,"a":"읽기","ak":"읽기","n":"읽기","L":{"A":{"지식·이해":"상황 맥락, 사회·문화적 맥락을 바탕으로 일상적 화제나 사회·문화적 화제의 글, 다양한 설명 방법을 활용하여 주제를 제시한 글, 주장이 명시적이고 다양한 이유나 근거가 제시된 글, 생각이나 감정이 함축적으로 제시된 글의 특징을 알고, 정확하게 이해할 수 있다.","과정·기능":"글의 구조를 고려하여 주제나 주장을 정확하게 파악하고 글의 내용을 요약할 수 있고, 글에서 생략된 내용이나 함축적 표현을 문맥을 고려하여 추론하며 글이나 자료를 읽고 내용의 타당성과 표현의 적절성을 평가하며 문제 상황과 관련된 다양한 관점의 글을 읽고, 이를 문제 해결에 창의적으로 활용할 수 있다.","가치·태도":"자신의 읽기 활동을 되돌아보고 능동적으로 읽기에 참여하는지 확인하며 긍정적인 읽기 동기를 형성하고 적극적으로 읽기에 참여하는 태도를 지닌다."},"B":{"지식·이해":"상황 맥락, 사회·문화적 맥락을 바탕으로 일상적 화제나 사회·문화적 화제의 글, 다양한 설명 방법을 활용하여 주제를 제시한 글, 주장이 명시적이고 다양한 이유나 근거가 제시된 글, 생각이나 감정이 함축적으로 제시된 글을 이해할 수 있다.","과정·기능":"글의 구조를 고려하여 주제나 주장을 파악하고 글 내용을 요약할 수 있고, 생략된 내용이나 함축적 표현을 문맥을 고려하여 추론하며 글이나 자료를 읽고 내용의 타당성과 표현의 적절성을 평가하며 다양한 관점의 글을 읽고, 이를 문제 해결에 활용할 수 있다.","가치·태도":"긍정적인 읽기 동기를 형성하고 읽기에 참여하는 태도를 지닌다."},"C":{"지식·이해":"상황 맥락이나 사회·문화적 맥락을 바탕으로 일상적 화제나 사회·문화적 화제의 글, 다양한 설명 방법을 활용하여 주제를 제시한 글을 알고, 상황 맥락이나 사회·문화적 맥락을 바탕으로 제한적으로 이해한다.","과정·기능":"글의 구조를 고려하여 기초적인 수준에서 글의 중심 내용을 파악하고 글의 내용을 요약하며 예시 자료를 참고하여 글에서 생략된 내용을 추론하고 글이나 자료를 읽고 내용의 타당성과 표현의 적절성을 평가한다.","가치·태도":"긍정적인 읽기 동기를 부분적으로 형성하고 소극적으로 읽기에 참여하는 태도를 지닌다."}},"p":30},{"b":2,"s":1,"a":"달라지는 시대, 변화하는 생활 모습","ak":"달라지는시대변화하는생활모습","n":"달라지는 시대, 변화하는 생활 모습","L":{"A":{"지식·이해":"유교 문화가 조선 시대 사람들의 생각과 생활에 미친 영향을 여러 분야에서 파악하고, 조선 후기 사회·문화적 변화와 개항기 근대 문물 수용 과정에서 새로운 주체로 등장한 사람들의 활동 및 당시 사람들의 달라진 생활 모습을 설명할 수 있다.","과정·기능":"유교 문화, 조선 후기 사회·문화적 변화 및 개항기 근대 문물 수용 과정이 당시 사람들의 생각과 생활에 미친 영향을 분석할 수 있다.","가치·태도":"시대에 따라 사람들이 추구하는 가치가 다름을 알고 시대적 맥락 속에서 당시 사람들의 생각과 생활 모습을 존중하는 태도를 지닌다."},"B":{"지식·이해":"유교 문화가 조선 시대 사람들의 생각과 생활에 미친 영향을 파악하고 조선 후기 사회·문화적 변화와 개항기 근대 문물 수용 과정에서 달라진 생활 모습을 설명할 수 있다.","과정·기능":"유교 문화, 조선 후기 사회·문화적 변화 및 개항기 근대 문물 수용 과정과 관련 있는 내용을 조사할 수 있다.","가치·태도":"시대에 따라 사람들이 추구하는 가치가 다름을 알고 당시 사람들의 생각과 생활 모습을 이해하는 태도를 지닌다."},"C":{"지식·이해":"유교 문화와 조선 후기 사회·문화적 변화로 인해 사람들의 생활 모습이 달라졌음을 인식할 수 있다.","과정·기능":"유교 문화, 조선 후기 사회·문화적 변화 및 개항기 근대 문물 수용 과정과 관련 있는 내용을 찾아볼 수 있다.","가치·태도":"시대에 따라 사람들이 추구하는 가치가 다름을 안다."}},"p":47},{"b":2,"s":1,"a":"민주주의와 시민 참여","ak":"민주주의와시민참여","n":"민주주의와 시민 참여","L":{"A":{"지식·이해":"민주주의에서 선거의 의미와 역할과 국회, 행정부, 법원이 하는 일, 국가기관의 권력을 분립하는 이유를 설명하고, 민주주의에서 미디어의 의미와 역할을 설명할 수 있다.","과정·기능":"사례를 통해 민주주의에서 선거의 의미와 역할을 도출하고 국회, 행정부, 법원이 하는 일에 대해 분석함으로써 각 국가기관의 권력을 분립하는 이유를 도출할 수 있으며, 여러 가지 사례 속 미디어의 내용을 비판적으로 분석할 수 있다.","가치·태도":"선거에 관심을 갖고 선거 과정에 참여하는 태도를 가지며, 미디어를 올바르게 이용하는 태도를 바탕으로 이를 실천할 수 있다."},"B":{"지식·이해":"선거의 의미와 역할, 민주 국가에서 국회, 행정부, 법원이 하는 일을 제시하고, 각 국가기관의 권력을 분립하는 이유와 민주주의에서 미디어의 의미와 역할을 설명할 수 있다.","과정·기능":"우리나라에서 국회, 행정부, 법원이 하는 일에 대해 조사하고, 여러 가지 사례 속 미디어의 내용을 비판적으로 분석할 수 있다.","가치·태도":"선거 과정에 참여하기 위해 노력하며, 미디어를 올바르게 이용하는 태도를 바탕으로 이를 실천하기 위해 노력한다."},"C":{"지식·이해":"선거의 의미와 중요성 및 국회, 행정부, 법원이 하는 일을 이해하고, 각 국가기관의 권력을 분립해야 함을 파악하며, 미디어의 의미와 역할을 제시할 수 있다.","과정·기능":"국회, 행정부, 법원이 하는 일에 대해 제시하고, 각 국가기관의 권력을 분립하는 이유와 관련지을 수 있으며, 미디어의 의미와 역할을 찾아볼 수 있다.","가치·태도":"선거 과정에 관심을 가지며, 미디어를 올바르게 이용하는 태도를 지닌다."}},"p":49},{"b":2,"s":1,"a":"법과 인권의 보장","ak":"법과인권의보장","n":"법과 인권의 보장","L":{"A":{"지식·이해":"일상생활에서의 사례를 통해 법의 의미와 역할을 설명하고, 일상생활에서의 인권 침해 사례를 분석하여 해결 방안을 제안할 수 있다.","과정·기능":"헌법에 규정된 인권이 일상생활에서 구현되는 사례를 탐색하고, 인권이 침해되는 사례를 조사하여 그 해결 방안을 제시하며, 인권을 보호하는 활동에 참여할 수 있다.","가치·태도":"헌법에 규정된 인권이 일상생활에서 보장되는 사례를 살펴보며 인권 존중을 실천할 수 있고, 인권 보호 활동에 관심을 가진다."},"B":{"지식·이해":"일상생활의 사례와 관련지어 법의 의미와 역할을 제시하고, 일상생활에서 인권이 침해된 사례를 찾아 해결 방안을 설명할 수 있다.","과정·기능":"헌법에 규정된 인권이 일상생활에서 구현되는 사례 및 일상생활에서 인권이 침해되는 사례를 조사하여 해결 방안을 제안하며, 인권 보호 활동에 참여할 수 있다.","가치·태도":"헌법에 규정된 인권 보장이 일상생활에서 구현된 사례를 통해 인권을 존중하는 마음을 가진다."},"C":{"지식·이해":"일상생활에서 법의 의미와 역할을 살펴보고, 인권이 침해된 사례에 대해 적절한 해결 방안을 제시할 수 있다.","과정·기능":"헌법에 규정된 인권 보장이 일상생활에서 구현된 사례를 살펴보고, 인권이 침해된 사례에 대해 적절한 해결 방안을 제시할 수 있다.","가치·태도":"인권 보호 활동에 관심을 가진다."}},"p":46},{"b":2,"s":1,"a":"세계의 자연환경","ak":"세계의자연환경","n":"세계의 자연환경","L":{"A":{"지식·이해":"세계 여러 지역에서 나타나는 다양한 삶의 모습 및 기후 환경과 인간생활 간의 관계를 탐구할 수 있다.","과정·기능":"세계 여러 지역의 지형 경관과 다양한 기후의 특징을 분석할 수 있다.","가치·태도":"세계 여러 지역의 자연환경에 관심과 호기심을 가지고, 이를 탐구하려는 자세를 가진다."},"B":{"지식·이해":"세계 여러 지역에서 나타나는 다양한 삶의 모습 및 기후 환경과 인간생활 간의 관계를 설명할 수 있다.","과정·기능":"세계 여러 지역의 지형 경관과 다양한 기후를 조사할 수 있다.","가치·태도":"세계 여러 지역의 자연환경에 관심과 호기심을 가지고, 이를 탐색하는 데 흥미를 느낀다."},"C":{"지식·이해":"세계 여러 지역의 경관과 기후가 다양함을 인식하고 기후 환경이 인간생활과 관계가 있음을 말할 수 있다.","과정·기능":"세계 여러 지역의 지형 경관과 다양한 기후를 나타낸 자료를 살펴볼 수 있다.","가치·태도":"세계 여러 지역의 자연환경에 관심을 가진다."}},"p":51},{"b":2,"s":1,"a":"시장경제와 국가 간 거래","ak":"시장경제와국가간거래","n":"시장경제와 국가 간 거래","L":{"A":{"지식·이해":"시장경제에서 가계와 기업의 역할, 근로자의 권리와 기업의 자유 및 책임을 설명할 수 있고, 경제성장이 우리 생활에 미치는 영향 및 무역의 의미와 중요성, 국가 간 무역이 발생하는 이유를 제시할 수 있다.","과정·기능":"사례를 중심으로 근로자의 권리와 기업의 자유 및 책임을 분석하고, 경제성장이 우리 생활에 미치는 영향과 빠른 경제성장으로 인해 발생한 문제의 해결 방안 및 국가 간 무역이 발생하는 이유를 분석할 수 있다.","가치·태도":"합리적 소비를 실천하고, 경제활동의 자유를 존중한다."},"B":{"지식·이해":"시장경제에서 가계와 기업의 역할, 근로자의 권리와 기업의 자유 및 책임을 제시하고, 경제성장이 우리 생활에 미치는 영향 및 무역의 의미를 설명할 수 있다.","과정·기능":"근로자의 권리와 기업의 자유 및 책임, 경제성장이 우리 생활에 미치는 영향을 조사할 수 있으며, 경제성장으로 인해 발생한 문제의 해결 방안 및 국가 간 무역이 발생하는 이유를 탐색할 수 있다.","가치·태도":"합리적 소비를 실천하기 위해 노력한다."},"C":{"지식·이해":"시장경제에서 가계와 기업의 역할 및 경제성장이 우리 생활에 미치는 영향을 이해하고, 무역의 의미와 국가 간 무역이 발생하는 이유를 파악할 수 있다.","과정·기능":"경제성장이 우리 생활에 미치는 영향과 빠른 경제 성장으로 인해 발생한 문제를 조사하고, 무역의 사례를 탐색할 수 있다.","가치·태도":"합리적 소비의 가치를 존중한다."}},"p":51},{"b":2,"s":1,"a":"식민 통치와 저항, 전쟁이 바꾼 사회와 생활","ak":"식민통치와저항전쟁이바꾼사회와생활","n":"식민 통치와 저항, 전쟁이 바꾼 사회와 생활","L":{"A":{"지식·이해":"다양한 사례를 통해 일제 식민 통치 및 이에 대한 저항과 8·15 광복, 6·25 전쟁이 사회와 사람들의 생활에 미친 영향을 설명할 수 있다.","과정·기능":"당시 사회와 사람들의 생활 모습을 깊이 이해하는데 상징성이 있는 주제를 골라 적절한 사진이나 영상, 기록 등을 선정하여 분석할 수 있다.","가치·태도":"오늘날까지 영향을 미치고 있는 역사적 문제에 관심을 가지고 이를 해결하기 위한 참여 의지를 다지며 역사에 성찰적으로 접근하는 태도를 지닌다."},"B":{"지식·이해":"일제 식민 통치 및 이에 대한 저항과 8·15 광복, 6·25 전쟁이 사회와 사람들의 생활에 미친 영향을 설명할 수 있다.","과정·기능":"당시 사회와 사람들의 생활 모습을 보여주는 사진과 영상, 기록 등을 조사할 수 있다.","가치·태도":"오늘날까지 영향을 미치고 있는 역사적 문제에 관심을 가지고 이를 해결하기 위해 노력한다."},"C":{"지식·이해":"일제 식민 통치 및 이에 대한 저항과 8·15 광복, 6·25 전쟁으로 인해 사람들의 생활 모습이 달라졌음을 인식할 수 있다.","과정·기능":"당시 사회와 사람들의 생활 모습을 보여주는 사진과 영상, 기록 등을 찾아볼 수 있다.","가치·태도":"오늘날까지 영향을 미치고 있는 역사적 문제에 관심을 가진다."}},"p":48},{"b":2,"s":1,"a":"우리나라 국토 여행","ak":"우리나라국토여행","n":"우리나라 국토 여행","L":{"A":{"지식·이해":"우리나라 지형의 분포 특징을 분석하고, 국토로서의 독도의 중요성과 가치를 설명할 수 있다.","과정·기능":"우리나라 산지, 하천, 해안 지형의 위치를 다양한 자료를 이용하여 조사하고, 독도의 지리적 특성을 분석하며 주요 역사 기록을 탐구할 수 있다.","가치·태도":"우리나라 자연환경의 아름다움을 느끼고, 삶의 터전으로서 국토의 영역에 관심과 호기심을 갖고 이를 탐구하려는 자세를 지닌다."},"B":{"지식·이해":"우리나라 지형의 분포 특징과 독도의 중요성을 설명할 수 있다.","과정·기능":"우리나라 산지, 하천, 해안 지형의 위치를 지도에서 찾고, 독도의 지리적 특성과 독도에 대한 역사 기록을 조사할 수 있다.","가치·태도":"우리나라 자연환경과 국토의 영역에 관심과 호기심을 갖고 이를 탐색하는 데 흥미를 느낀다."},"C":{"지식·이해":"우리나라 지형 분포의 특징을 말할 수 있고, 독도의 중요성을 인식할 수 있다.","과정·기능":"우리나라 산지, 하천, 해안 지형의 위치를 지도에서 찾고, 독도의 지리적 특성과 독도에 대한 역사 기록을 확인할 수 있다.","가치·태도":"우리나라 자연환경과 국토의 영역에 관심을 가진다."}},"p":45},{"b":2,"s":1,"a":"우리나라 지리 탐구","ak":"우리나라지리탐구","n":"우리나라 지리 탐구","L":{"A":{"지식·이해":"기후변화로 인해 나타나는 자연재해의 심각성을 인지하고 기후 행동을 모색할 수 있으며, 우리나라 지역별 인구 분포의 특징을 분석하고 문제점과 해결 방안을 사례를 중심으로 설명할 수 있다.","과정·기능":"자료를 바탕으로 우리나라의 계절별 기후 특징을 분석하고, 우리나라 인구 분포 특징과 이에 따른 문제점과 해결 방안을 조사할 수 있다.","가치·태도":"기후변화에 관심을 가지고, 기후변화에 대응하기 위한 행동에 참여할 수 있다."},"B":{"지식·이해":"기후변화로 인해 나타나는 자연재해의 심각성과 우리나라 지역별 인구 분포의 특징을 설명하며, 문제점과 해결 방안을 제시할 수 있다.","과정·기능":"자료를 바탕으로 우리나라의 계절별 기후 특징을 조사하고, 우리나라 인구 분포 특징에 따른 문제점을 찾아 해결 방안을 제안할 수 있다.","가치·태도":"기후변화와 기후변화에 대응하기 위한 행동에 관심을 가진다."},"C":{"지식·이해":"기후변화로 인해 나타난 자연재해를 제시할 수 있으며, 우리나라 지역별 인구 분포의 특징을 나열하고 이에 따른 문제점을 말할 수 있다.","과정·기능":"자료를 바탕으로 우리나라의 계절별 기후 특징과 우리나라 인구 분포를 탐색할 수 있다.","가치·태도":"기후변화에 관심을 가진다."}},"p":45},{"b":2,"s":1,"a":"유적과 유물로 살펴본 옛 사람들의 생활","ak":"유적과유물로살펴본옛사람들의생활","n":"유적과 유물로 살펴본 옛 사람들의 생활","L":{"A":{"지식·이해":"선사시대, 고조선, 고대, 고려 시대 사람들의 생각과 생활 모습을 시대적 맥락에 맞게 파악하고 당시 사회의 여러 면모를 설명할 수 있다.","과정·기능":"역사 증거로서 유적과 유물, 역사 기록 등을 분석하여 당시 사람들의 생각이나 생활 모습, 사회 모습을 추론할 수 있다.","가치·태도":"타인의 역사적 해석을 존중하는 태도를 지니며 역사에 대한 관심과 흥미를 표현한다."},"B":{"지식·이해":"선사시대, 고조선, 고대, 고려 시대 사람들의 생각과 생활 모습을 시대적 맥락에 맞게 파악할 수 있다.","과정·기능":"역사 증거로서 유적과 유물, 역사 기록 등을 조사하여 당시 사람들의 생각이나 생활 모습, 사회 모습을 설명할 수 있다.","가치·태도":"타인의 역사적 해석을 존중하며, 역사에 대한 관심과 흥미를 가진다."},"C":{"지식·이해":"선사시대, 고조선, 고대, 고려 시대 사람들의 생활 모습을 말할 수 있다.","과정·기능":"시대별 유적과 유물
