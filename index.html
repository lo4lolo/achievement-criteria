되어 있는지 설명할 수 있다.","B":"다양한 환경에 따라 식물의 생김새와 생활 방식이 다름을 발표할 수 있다.","C":"다양한 환경에 서식하는 식물의 생김새를 말할 수 있다.","p":109},{"c":"[4과03-03]","b":1,"s":4,"a":"식물의 생활","ak":"식물의생활","t":"식물의 특징을 이용하여 일상생활에서 활용할 수 있는 생활용품을 설계하여 협력적으로 소통할 수 있다.","A":"식물의 특징을 이용하여 일상생활에서 활용할 수 있는 생활용품을 독창적인 아이디어로 설계하고 협력적으로 소통할 수 있다.","B":"식물의 특징을 이용하여 일상생활에서 활용할 수 있는 생활용품을 설계하고 발표할 수 있다.","C":"식물의 특징을 이용하여 설계한 생활용품을 말할 수 있다.","p":109,"note":"내용 체계표의 가치·태도 요소를 포함하여 성취수준 개발"},{"c":"[4과04-01]","b":1,"s":4,"a":"생물의 한살이","ak":"생물의한살이","t":"동물의 한살이를 직접 관찰하고, 관찰한 내용을 글과 그림으로 표현할 수 있다.","A":"동물을 직접 기르면서 동물의 한살이를 관찰하고, 관찰한 내용을 글과 그림으로 표현하여 관찰 보고서를 쓸 수 있다.","B":"곤충의 한살이를 관찰하여 곤충의 모습이 달라짐을 말할 수 있다.","C":"곤충의 한살이를 관찰할 수 있다.","p":110,"q":["곤충의 한살이 관찰하기"]},{"c":"[4과04-02]","b":1,"s":4,"a":"생물의 한살이","ak":"생물의한살이","t":"식물이 자라는 데 필요한 조건을 찾는 실험을 설계하여 수행할 수 있다.","A":"씨가 싹 트거나 식물이 자라는 데 필요한 조건을 찾는 실험을 설계하여 수행하고, 그 결과를 설명할 수 있다.","B":"식물이 자라는 데 필요한 조건을 찾는 실험을 설계할 수 있다.","C":"식물이 자라는 데 필요한 조건을 말할 수 있다.","p":110},{"c":"[4과04-03]","b":1,"s":4,"a":"생물의 한살이","ak":"생물의한살이","t":"생물의 한살이 과정을 조사하여 생물에 따라 한살이의 유형이 다양함을 소개하는 자료를 만들어 공유할 수 있다.","A":"여러 가지 생물의 한살이 과정을 조사하여 생물에 따라 한살이 유형이 다양함을 이해하고, 이를 소개하는 자료를 만들어 공유할 수 있다.","B":"여러 가지 생물의 한살이 과정을 조사하여 생물에 따라 한살이 유형이 다양함을 말할 수 있다.","C":"여러 가지 생물의 한살이 과정을 조사할 수 있다.","p":110},{"c":"[4과05-01]","b":1,"s":4,"a":"물체와 물질","ak":"물체와물질","t":"물체를 이루는 여러 가지 물질의 성질을 비교하고, 물질의 종류에 따라 물체를 분류할 수 있다.","A":"물체를 이루는 여러 가지 물질의 성질을 비교하여 설명하고, 물질의 종류에 따라 물체를 분류할 수 있다.","B":"물체를 이루는 여러 가지 물질의 성질을 관찰하여 비교할 수 있다.","C":"물체를 이루는 물질이 여러 가지임을 말할 수 있다.","p":111},{"c":"[4과05-02]","b":1,"s":4,"a":"물체와 물질","ak":"물체와물질","t":"물질의 세 가지 상태인 고체, 액체, 기체의 성질을 관찰하여 비교할 수 있다.","A":"실험을 통해 물질의 세 가지 상태인 고체, 액체, 기체가 가진 성질을 관찰하고, 물질의 세 가지 상태의 성질을 비교하여 설명할 수 있다.","B":"실험을 통해 물질의 세 가지 상태인 고체, 액체, 기체의 성질을 관찰하여 말할 수 있다.","C":"우리 주변에 물질의 세 가지 상태인 고체, 액체, 기체가 있다는 것을 말할 수 있다.","p":111,"q":["용기에 따른 고체와 액체의 모양과 부피 변화 관찰하기","기체가 공간을 차지하고 있음을 알아보는 실험하기"]},{"c":"[4과05-03]","b":1,"s":4,"a":"물체와 물질","ak":"물체와물질","t":"다양한 물질의 성질을 이용하여 쓰임새 있는 물체를 설계할 수 있다.","A":"물체의 쓰임새에 적합한 성질을 가진 물질을 이용하여 물체를 설계하고, 물체의 쓰임새와 물질의 성질을 관련지어 설명할 수 있다.","B":"물체의 쓰임새에 적합한 물질을 선택하여 물체를 설계할 수 있다.","C":"다양한 물질의 성질을 이용하여 만들어진 물체를 찾아 말할 수 있다.","p":111},{"c":"[4과06-01]","b":1,"s":4,"a":"지구와 바다","ak":"지구와바다","t":"지구가 대기로 둘러싸여 있음을 알고, 지구 표면을 구성하는 육지와 바다의 특징을 비교할 수 있다.","A":"지구가 대기로 둘러싸여 있음을 알고, 지구 표면을 구성하는 육지와 바다의 면적과 특징을 비교할 수 있다.","B":"지구가 대기로 둘러싸여 있음을 알고, 지구 표면을 구성하는 육지와 바다의 면적을 비교할 수 있다.","C":"지구에 대기, 육지, 바다가 있다는 것을 말할 수 있다.","p":112,"q":["지구의 육지와 바다 면적 비교하기"]},{"c":"[4과06-02]","b":1,"s":4,"a":"지구와 바다","ak":"지구와바다","t":"바닷물의 특징을 육지의 물과 비교하고, 바닷가에서 볼 수 있는 다양한 지형을 조사할 수 있다.","A":"육지의 물과 바닷물을 가열하여 남는 물질을 탐구하는 활동을 통해 바닷물의 특징을 육지의 물과 비교하고, 바닷가에서 볼 수 있는 다양한 지형을 조사하여 발표할 수 있다.","B":"육지의 물과 바닷물을 가열하여 남는 물질을 비교하고, 바닷가에서 볼 수 있는 다양한 지형을 조사할 수 있다.","C":"육지의 물과 바닷물을 가열하여 남는 물질을 관찰할 수 있다.","p":112,"q":["육지의 물과 바닷물을 가열하여 남는 물질 탐구하기"]},{"c":"[4과06-03]","b":1,"s":4,"a":"지구와 바다","ak":"지구와바다","t":"밀물과 썰물의 차이를 알고, 갯벌의 가치와 보전의 필요성을 설득·홍보할 수 있다.","A":"밀물과 썰물의 차이를 설명하고, 갯벌의 가치와 보전의 필요성을 설득·홍보할 수 있는 홍보물을 제작할 수 있다.","B":"밀물과 썰물 현상을 구별하고, 갯벌의 가치와 보전의 필요성을 말할 수 있다.","C":"밀물과 썰물 현상이 있음을 알고, 갯벌의 소중함에 관심을 가진다.","p":112},{"c":"[4과07-01]","b":1,"s":4,"a":"소리의 성질","ak":"소리의성질","t":"여러 가지 물체를 이용하여 소리를 내보고, 소리가 나는 물체는 떨림이 있음을 설명할 수 있다.","A":"여러 가지 물체를 이용하여 소리를 내보고, 소리가 나는 현상을 관찰하여 소리가 나는 물체는 떨림이 있음을 설명할 수 있다.","B":"소리굽쇠를 관찰하여 소리가 나는 소리굽쇠는 떨림이 있음을 설명할 수 있다.","C":"소리가 나는 물체의 예를 들고, 물체를 이용하여 소리를 낼 수 있다.","p":113,"q":["소리가 나는 소리굽쇠의 떨림 관찰하기"]},{"c":"[4과07-02]","b":1,"s":4,"a":"소리의 성질","ak":"소리의성질","t":"큰 소리와 작은 소리, 높은 소리와 낮은 소리를 구분하고, 세기와 높낮이가 다른 소리를 낼 수 있다.","A":"물체의 길이에 따른 소리의 높낮이를 비교하고, 큰 소리와 작은 소리, 높은 소리와 낮은 소리를 내는 방법을 알고 소리를 낼 수 있다.","B":"다양한 소리를 듣고, 큰 소리와 작은 소리, 높은 소리와 낮은 소리로 구분할 수 있다.","C":"물체에 따라 다양한 소리가 나는 것을 말할 수 있다.","p":113,"q":["물체의 길이에 따른 소리의 높낮이 비교하기"]},{"c":"[4과07-03]","b":1,"s":4,"a":"소리의 성질","ak":"소리의성질","t":"여러 가지 물질을 통하여 소리가 전달되는 것을 관찰하고, 소음을 줄이는 방법을 찾아 일상생활에서 실천할 수 있다.","A":"소리가 여러 가지 물질을 통하여 전달되는 것을 이해하고, 일상생활에서 소음을 줄이는 방법을 조사하여 실천할 수 있다.","B":"여러 가지 물질을 통하여 소리가 전달되는 것을 관찰하고, 일상생활에서 소음을 줄이는 방법을 조사할 수 있다.","C":"소리가 전달되고 있음을 알고, 일상생활에서 소음과 관련된 예를 들 수 있다.","p":113,"note":"내용 체계표의 가치·태도 요소를 포함하여 성취수준 개발"},{"c":"[4과08-01]","b":1,"s":4,"a":"감염병과 건강한 생활","ak":"감염병과건강한생활","t":"생활 속 감염병의 사례를 알고, 다양한 질병과 그 위험성에 대해 토의할 수 있다.","A":"생활 속 감염병의 사례를 조사하여 다양한 질병과 그 위험성에 대해 토의할 수 있다.","B":"생활 속 감염병 사례를 조사하여 질병의 위험성을 발표할 수 있다.","C":"생활 속 감염병 사례를 조사하여 말할 수 있다.","p":114},{"c":"[4과08-02]","b":1,"s":4,"a":"감염병과 건강한 생활","ak":"감염병과건강한생활","t":"감염병으로부터 안전한 사회에 관심을 가지고, 여러 감염 과정을 통해 생활 습관과 감염병 유행과의 연관성을 설명할 수 있다.","A":"감염병으로부터 안전한 사회에 관심을 가지고, 여러 감염 과정과 관련지어 감염 예방 방법을 탐구하여 생활 습관과 감염병 유행이 연관되어 있음을 설명할 수 있다.","B":"감염병에 대해 인식하고, 여러 감염 과정을 통해 감염병에 걸릴 수 있음을 이해하고, 감염을 예방하는 생활 습관에 대해 말할 수 있다.","C":"감염병에 걸릴 수 있음을 알고, 이를 예방하는 생활 습관에 대해 말할 수 있다.","p":114,"q":["감염 과정과 감염병 예방 방법 탐구하기"]},{"c":"[4과08-03]","b":1,"s":4,"a":"감염병과 건강한 생활","ak":"감염병과건강한생활","t":"건강한 생활을 위해 필요한 감염병 예방 수칙을 공유하고, 생활 속에서 실천할 수 있다.","A":"건강한 생활을 위해 필요한 감염병 예방 수칙을 토의하여 공유하고, 생활 속에서 감염병 예방 수칙의 중요성을 인식하고 이를 실천할 수 있다.","B":"건강한 생활을 위해 감염병 예방 수칙을 알고 공유할 수 있다.","C":"건강한 생활을 위해 감염병 예방 수칙이 필요함을 말할 수 있다.","p":114},{"c":"[4과09-01]","b":1,"s":4,"a":"자석의 이용","ak":"자석의이용","t":"자석과 여러 가지 물체를 가까이했을 때 나타나는 현상을 관찰하고, 자석과 자석에 붙는 물체 사이에 작용하는 힘의 특징을 말할 수 있다.","A":"자석과 여러 가지 물체를 가까이했을 때 나타나는 다양한 현상을 통해 자석과 자석에 붙는 물체 사이에 작용하는 힘의 특징을 설명할 수 있다.","B":"자석과 여러 가지 물체를 가까이했을 때 나타나는 현상을 관찰하여 자석에 붙는 물체들의 공통점을 찾을 수 있다.","C":"자석과 여러 가지 물체를 가까이했을 때 나타나는 현상을 관찰하여 자석에 붙는 물체와 자석에 붙지 않는 물체를 분류할 수 있다.","p":115},{"c":"[4과09-02]","b":1,"s":4,"a":"자석의 이용","ak":"자석의이용","t":"자석과 자석을 가까이했을 때 나타나는 현상을 관찰하여 그 특징을 자석의 극과 관련지어 설명할 수 있다.","A":"자석과 자석을 가까이했을 때 나타나는 현상을 관찰하여 같은 극과 다른 극 사이에서 나타나는 힘을 구분하여 이해하고, 이를 활용해 나침반과 자석 사이에 나타나는 현상을 설명할 수 있다.","B":"자석에 두 극이 있음을 알고, 자석과 자석 사이에서 밀거나 당기는 힘이 작용함을 말할 수 있다.","C":"자석과 자석을 가까이했을 때 나타나는 현상을 관찰할 수 있다.","p":115,"q":["자석의 극을 찾고 서로 같은 극과 다른 극을 가까이했을 때의 특징 비교하기","나침반과 자석을 가까이했을 때 나타나는 현상 관찰하기"]},{"c":"[4과09-03]","b":1,"s":4,"a":"자석의 이용","ak":"자석의이용","t":"자석을 이용하여 일상생활을 편리하게 하는 장치를 설계할 수 있다.","A":"자석의 성질을 이용하여 일상생활에 편리한 장치를 설계할 수 있고, 이 과정에서 과학의 유용성을 인식한다.","B":"자석의 성질을 이용한 장치를 설계할 수 있다.","C":"일상생활에서 자석을 이용한 장치를 보고 자석의 성질과 관련된 부분을 말할 수 있다.","p":115,"note":"내용 체계표의 가치·태도 요소를 포함하여 성취수준 개발"},{"c":"[4과10-01]","b":1,"s":4,"a":"물의 상태 변화","ak":"물의상태변화","t":"물이 세 가지 상태로 변할 수 있음을 알고, 우리 주변에서 예를 찾을 수 있다.","A":"물이 수증기나 얼음으로 변할 수 있음을 말하고, 그 사례를 우리 주변에서 찾아 설명할 수 있다.","B":"물의 세 가지 상태를 우리 주변에서 찾고 물이 수증기나 얼음으로 변할 수 있음을 말할 수 있다.","C":"물의 세 가지 상태를 우리 주변에서 찾아 말할 수 있다.","p":116},{"c":"[4과10-02]","b":1,"s":4,"a":"물의 상태 변화","ak":"물의상태변화","t":"물이 얼 때, 얼음이 녹을 때, 물이 증발할 때와 끓을 때, 수증기가 응결할 때의 변화를 관찰할 수 있다.","A":"실험을 통해 물이 얼 때와 얼음이 녹을 때, 물이 증발할 때와 끓을 때, 수증기가 응결할 때의 변화를 관찰하여 설명할 수 있다.","B":"실험을 통해 물이 얼 때와 얼음이 녹을 때, 물이 증발할 때와 끓을 때의 변화를 관찰하여 설명할 수 있다.","C":"실험을 통해 물이 얼 때와 얼음이 녹을 때의 변화를 관찰하여 말할 수 있다.","p":116,"q":["물이 얼 때와 얼음이 녹을 때의 무게와 부피 변화 관찰하기","물이 증발할 때와 끓을 때의 특징 관찰하기","얼음이 든 비커의 바깥 면 관찰하기"]},{"c":"[4과10-03]","b":1,"s":4,"a":"물의 상태 변화","ak":"물의상태변화","t":"물의 상태 변화를 이용하여 물을 얻을 수 있는 장치를 설계하고 만들 수 있다.","A":"물 부족의 심각성을 공감하고, 물의 상태 변화를 이용하여 물을 얻는 장치를 설계하고 제작할 수 있다.","B":"물의 중요성을 인식하고, 물의 상태 변화를 이용하여 물을 얻는 장치를 설계할 수 있다.","C":"물을 얻는 장치를 설계하는 과정에 참여하고, 물의 중요성을 말할 수 있다.","p":116,"note":"내용 체계표의 가치·태도 요소를 포함하여 성취수준 개발"},{"c":"[4과11-01]","b":1,"s":4,"a":"땅의 변화","ak":"땅의변화","t":"흐르는 물의 작용과 강 주변 지형의 특징을 관련지을 수 있다.","A":"흙 언덕을 만들고 물을 흘려보낸 후, 흙이 깎이는 곳과 쌓이는 곳을 관찰하여 흐르는 물의 침식, 운반, 퇴적 작용을 이해하고, 강 주변 지형의 특징을 물의 작용과 관련지어 설명할 수 있다.","B":"흙 언덕을 만들고 물을 흘려보낸 후, 흙이 깎이는 곳과 쌓이는 곳을 관찰하여 흐르는 물의 침식, 운반, 퇴적 작용을 설명할 수 있다.","C":"흙 언덕을 만들고 물을 흘려보낸 후, 흙이 깎이는 곳과 쌓이는 곳을 찾아 말할 수 있다.","p":117,"q":["흙 언덕을 만들고 물을 흘려보낸 후, 깎이는 곳과 쌓이는 곳 관찰하기"]},{"c":"[4과11-02]","b":1,"s":4,"a":"땅의 변화","ak":"땅의변화","t":"화산의 의미와 화산 활동으로 나오는 물질을 알고, 화산 활동을 모형으로 표현할 수 있다.","A":"화산의 의미와 화산 활동으로 나오는 물질을 알고, 화산 활동을 모형으로 표현하여 설명할 수 있다.","B":"화산의 의미를 알고, 화산 활동 모형에서 화산 활동으로 나오는 물질을 찾을 수 있다.","C":"화산의 의미를 알고, 화산 활동 모형 만들기 활동에 참여할 수 있다.","p":117},{"c":"[4과11-03]","b":1,"s":4,"a":"땅의 변화","ak":"땅의변화","t":"화성암을 관찰하고 분류할 수 있다.","A":"화성암이 화산 활동과 관련되어 있음을 알고, 현무암과 화강암을 관찰하여 특징에 따라 분류할 수 있다.","B":"현무암과 화강암을 관찰하고, 알갱이의 크기에 따라 분류할 수 있다.","C":"현무암과 화강암을 관찰하고, 색을 비교할 수 있다.","p":117},{"c":"[4과11-04]","b":1,"s":4,"a":"땅의 변화","ak":"땅의변화","t":"화산 활동과 지진이 우리 생활에 미치는 영향을 조사하여, 대처 방법을 실천할 수 있다.","A":"화산 활동과 지진이 우리 생활에 미치는 영향을 조사하고, 화산 활동과 지진에 안전하게 대처하는 방법을 찾아 실천할 수 있다.","B":"화산 활동과 지진으로부터 안전한 사회에 관심을 가지고, 지진의 피해를 줄이기 위한 대처 방법을 찾아 실천할 수 있다.","C":"지진의 피해를 줄이기 위한 대처 방법을 말할 수 있다.","p":117,"q":["지진의 피해 사례를 조사하고 대처 방법 탐구하기"],"note":"내용 체계표의 가치·태도 요소를 포함하여 성취수준 개발"},{"c":"[4과12-01]","b":1,"s":4,"a":"다양한 생물과 우리 생활","ak":"다양한생물과우리생활","t":"균류·원생생물·세균을 관찰하여 특징과 사는 곳을 설명할 수 있다.","A":"균류·원생생물·세균을 디지털현미경이나 실체현미경, 사진 자료 등을 활용하여 관찰하고, 생물의 특징과 사는 곳을 설명할 수 있다.","B":"균류·원생생물·세균을 관찰하고, 그 특징을 말할 수 있다.","C":"균류·원생생물·세균의 종류를 말할 수 있다.","p":118,"q":["버섯과 곰팡이 관찰하기","해캄과 짚신벌레 관찰하기"]},{"c":"[4과12-02]","b":1,"s":4,"a":"다양한 생물과 우리 생활","ak":"다양한생물과우리생활","t":"균류·원생생물·세균이 우리 생활에 미치는 영향을 조사하여 발표할 수 있다.","A":"균류·원생생물·세균이 우리 생활에 미치는 긍정적인 영향과 부정적인 영향을 조사하여 발표할 수 있다.","B":"균류·원생생물·세균이 우리 생활에 미치는 영향을 조사할 수 있다.","C":"균류·원생생물·세균이 우리 생활에 영향을 미친다는 것을 말할 수 있다.","p":118},{"c":"[4과12-03]","b":1,"s":4,"a":"다양한 생물과 우리 생활","ak":"다양한생물과우리생활","t":"우리 생활에 생명과학이 이용되는 사례를 소개하는 자료를 만들어 공유할 수 있다.","A":"우리 생활에 생명과학이 이용되는 사례를 조사하여 소개하는 자료를 만들어 공유하고, 이 과정에서 과학의 유용성을 인식할 수 있다.","B":"우리 생활에 생명과학이 이용되는 사례를 조사하여 소개하는 자료를 만들고, 이 과정에서 생명과학에 흥미와 호기심을 가진다.","C":"우리 생활에 생명과학이 이용되는 사례를 조사하고, 이 과정에서 생명과학에 관심을 가진다.","p":118,"note":"내용 체계표의 가치·태도 요소를 포함하여 성취수준 개발"},{"c":"[4과13-01]","b":1,"s":4,"a":"밤하늘 관찰","ak":"밤하늘관찰","t":"달의 모양과 표면, 달의 위상변화를 관찰하여 밤하늘 관찰에 흥미를 가질 수 있다.","A":"달의 모양과 표면, 여러 날 동안 보이는 달의 위상 변화를 관찰하여 달의 모양이 주기적으로 바뀌는 것을 알고, 밤하늘 관찰에 흥미를 가진다.","B":"여러 날 동안 보이는 달의 모양을 관찰하고, 밤하늘 관찰에 흥미를 가진다.","C":"달을 관찰하고 밤하늘 관찰에 관심을 가진다.","p":119,"q":["여러 날 동안 보이는 달의 모양 관찰하기"]},{"c":"[4과13-02]","b":1,"s":4,"a":"밤하늘 관찰","ak":"밤하늘관찰","t":"태양계 구성원을 알고, 태양과 행성을 조사할 수 있다.","A":"태양계 구성원을 알고, 태양과 행성의 표면적 특징을 조사하여 태양계 행성 모형을 만들 수 있다.","B":"태양계 구성원을 알고, 태양계 행성의 특징을 말할 수 있다.","C":"태양계 구성원을 조사할 수 있다.","p":119,"q":["태양계 행성 모형 만들기"]},{"c":"[4과13-03]","b":1,"s":4,"a":"밤하늘 관찰","ak":"밤하늘관찰","t":"별의 정의를 알고, 북극성 주변의 별자리를 관찰할 수 있다.","A":"별의 정의를 행성과 비교하여 설명하고, 북극성 주변의 별자리를 관찰하여 별자리 이름을 말할 수 있다.","B":"별의 정의를 설명하고, 북극성 주변의 별자리 이름을 말할 수 있다.","C":"별이 행성과 다르다는 것을 말할 수 있다.","p":119},{"c":"[4과14-01]","b":1,"s":4,"a":"생물과 환경","ak":"생물과환경","t":"생태계의 구성 요소를 조사하여 생물 요소와 비생물 요소로 분류할 수 있다.","A":"생태계의 구성 요소를 조사하여 생물 요소와 비생물 요소로 분류하고, 양분을 얻는 방법에 따라 생물 요소를 분류하여 설명할 수 있다.","B":"생태계의 구성 요소를 조사하여 생물 요소와 비생물 요소가 있음을 알고, 생물 요소가 양분을 얻는 방법이 다르다는 것을 말할 수 있다.","C":"생태계의 구성 요소를 조사하여 이를 말할 수 있다.","p":120,"q":["양분을 얻는 방법에 따라 생물 요소 분류하기"]},{"c":"[4과14-02]","b":1,"s":4,"a":"생물과 환경","ak":"생물과환경","t":"생물 요소들의 먹고 먹히는 관계를 조사하여 먹이그물로 표현할 수 있다.","A":"생물 요소들의 먹고 먹히는 관계를 조사하여 먹이 관계 모형의 특징을 이해하고, 이를 먹이그물로 표현할 수 있다.","B":"생물 요소들의 먹고 먹히는 관계를 조사하여, 이를 먹이사슬로 표현할 수 있다.","C":"생물 요소의 먹고 먹히는 관계가 있음을 알고, 먹고 먹히는 관계의 한 예를 말이나 글로 표현할 수 있다.","p":120,"q":["먹이 관계 모형 만들기"]},{"c":"[4과14-03]","b":1,"s":4,"a":"생물과 환경","ak":"생물과환경","t":"인간 활동이 생태계에 미치는 영향을 조사하고, 생태계 보전을 위해 우리가 할 수 있는 일을 토의하여 실천할 수 있다.","A":"인간 활동이 생태계에 미치는 영향을 조사하고, 생태계 보전을 위해 우리가 할 수 있는 일을 토의하여 실천함으로써 생태계 보전의 중요성을 알고 생태계를 소중히 여기는 태도를 가진다.","B":"인간 활동이 생태계에 미치는 영향을 조사하고, 생태계 보전을 위한 실천 방법을 탐색할 수 있다.","C":"인간 활동이 생태계에 영향을 미친다는 것을 말할 수 있다.","p":120,"note":"내용 체계표의 가치·태도 요소를 포함하여 성취수준 개발"},{"c":"[4과15-01]","b":1,"s":4,"a":"여러 가지 기체","ak":"여러가지기체","t":"실험을 통해 기체가 무게가 있음을 설명할 수 있다.","A":"기체가 무게가 있음을 알아보는 실험을 수행하고, 실험 결과를 바탕으로 기체는 무게가 있음을 설명할 수 있다.","B":"기체가 무게가 있음을 알아보는 실험을 수행할 수 있다.","C":"기체가 무게가 있음을 말할 수 있다.","p":121,"q":["공기를 넣거나 뺄 때의 무게 변화 관찰하기"]},{"c":"[4과15-02]","b":1,"s":4,"a":"여러 가지 기체","ak":"여러가지기체","t":"온도나 압력에 따라 기체의 부피가 달라지는 현상을 관찰하고, 우리 주변에서 예를 찾을 수 있다.","A":"온도나 압력에 따라 기체의 부피가 달라지는 현상을 관찰하고, 우리 주변에서 관련된 사례를 찾아 설명할 수 있다.","B":"온도나 압력에 따라 기체의 부피가 달라지는 현상을 관찰하고 설명할 수 있다.","C":"온도나 압력에 따라 기체의 부피가 달라짐을 말할 수 있다.","p":121,"q":["온도나 압력에 따른 기체의 부피 변화 관찰하기"]},{"c":"[4과15-03]","b":1,"s":4,"a":"여러 가지 기체","ak":"여러가지기체","t":"일상생활에서 이용되는 기체의 종류와 성질을 조사하고, 여러 가지 기체에 대해 흥미를 느낄 수 있다.","A":"일상생활에서 이용하는 기체의 종류와 성질을 조사하여 설명하고, 여러 가지 기체에 흥미를 가진다.","B":"일상생활에서 이용하는 기체의 종류를 조사하고, 여러 가지 기체에 흥미를 가진다.","C":"일상생활에서 여러 가지 기체가 이용되고 있음을 말할 수 있다.","p":121},{"c":"[4과15-04]","b":1,"s":4,"a":"여러 가지 기체","ak":"여러가지기체","t":"기체의 성질을 이용하여 작동시킬 수 있는 장치를 설계하고 만들 수 있다.","A":"기체의 성질을 이해하고, 이를 이용하여 작동시킬 수 있는 장치를 설계하고 만들 수 있다.","B":"기체의 성질을 이해하고, 이를 이용하여 작동시킬 수 있는 장치를 설계할 수 있다.","C":"기체의 성질을 이용하여 작동시킬 수 있는 장치를 통해 기체의 성질을 말할 수 있다.","p":121},{"c":"[4과16-01]","b":1,"s":4,"a":"기후변화와 우리 생활","ak":"기후변화와우리생활","t":"기후변화 현상의 예를 알고, 기후변화가 인간의 활동과 관련되어 있음을 토의할 수 있다.","A":"다양한 기후변화 현상의 예를 알고, 기후변화에 영향을 주는 인간의 활동을 찾아 증거에 기반하여 토의할 수 있다.","B":"기후변화 현상의 예를 알고, 기후변화와 인간의 활동 사이의 관계를 조사할 수 있다.","C":"기후변화에 따른 현상을 찾아 말할 수 있다.","p":122},{"c":"[4과16-02]","b":1,"s":4,"a":"기후변화와 우리 생활","ak":"기후변화와우리생활","t":"기후변화의 심각성에 관심을 가지고, 기후변화가 우리 생활과 환경에 미치는 영향을 설명할 수 있다.","A":"기후변화의 심각성에 관심을 가지고, 해수면 상승으로 인한 피해 모형실험을 통해 기후변화가 우리 생활과 환경에 미치는 영향을 설명할 수 있다.","B":"기후변화에 관심을 가지고, 기후변화가 우리 생활과 환경에 미치는 영향을 해수면 상승과 관련지어 말할 수 있다.","C":"해수면 상승이 기후변화와 관련이 있다는 것을 말할 수 있다.","p":122,"q":["해수면 상승으로 인한 피해 모형실험하기"]},{"c":"[4과16-03]","b":1,"s":4,"a":"기후변화와 우리 생활","ak":"기후변화와우리생활","t":"기후변화 대응 방법을 조사하고, 생활 속에서 기후변화 대응 방법을 실천할 수 있다.","A":"지속가능한 사회에 관심을 가지고, 기후변화 대응 방법을 조사하여 생활 속에서 대응 방법을 실천한다.","B":"지속가능한 사회에 관심을 가지고, 생활 속에서 실천할 수 있는 기후변화 대응 방법을 조사할 수 있다.","C":"생활 속에서 실천할 수 있는 기후변화 대응 방법을 조사할 수 있다.","p":122,"note":"내용 체계표의 가치·태도 요소를 포함하여 성취수준 개발"},{"c":"[4체01-01]","b":1,"s":6,"a":"운동","ak":"운동","t":"운동과 체력의 의미를 이해하고 관계를 파악한다.","A":"운동이 신체 변화와 체력 증진에 미치는 영향을 명확하게 알고, 운동 전후의 다양한 신체 변화 및 체력 증진의 사례를 들어 구체적으로 설명할 수 있다.","B":"운동이 신체 변화와 체력 증진에 미치는 영향을 대략적으로 알고, 운동 전후의 신체 변화 및 체력 증진 중 일부를 사례를 들어 설명할 수 있다.","C":"운동이 신체 변화나 체력 증진에 미치는 영향을 대략적으로 알고, 운동 전후의 체력 변화 중 일부를 제시할 수 있다.","p":139,"sr":"6-01"},{"c":"[4체01-02]","b":1,"s":6,"a":"운동","ak":"운동","t":"기본 체력 운동의 방법과 절차를 익히며 자신의 수준에 맞는 운동을 시도한다.","A":"체력 증진을 위한 기본 운동 방법과 절차를 명확하게 알고 수행하며, 자신의 신체 특성과 체력 수준에 맞는 다양한 운동을 시도할 수 있다.","B":"체력 증진을 위한 기본 운동 방법과 절차를 대략적으로 알고 수행하고, 자신의 신체 특성과 체력 수준에 맞는 운동을 시도할 수 있다.","C":"체력 증진을 위한 기본 운동 방법을 대략적으로 알고 수행하고, 자신의 신체 특성이나 체력 수준에 맞는 운동을 부분적으로 시도할 수 있다.","p":139,"sr":"6-01"},{"c":"[4체01-03]","b":1,"s":6,"a":"운동","ak":"운동","t":"운동과 건강의 의미를 이해하고 관계를 파악한다.","A":"건강의 의미와 운동이 건강을 유지·증진하는 데 미치는 영향을 명확하게 알고, 운동의 필요성을 다양한 사례를 들어 구체적으로 설명할 수 있다.","B":"건강의 의미와 운동이 건강을 유지·증진하는 데 미치는 영향을 대략적으로 알고, 운동의 필요성 중 일부를 사례를 들어 설명할 수 있다.","C":"운동이 건강에 미치는 영향을 대략적으로 알고, 운동의 필요성 중 일부를 제시할 수 있다.","p":139,"sr":"6-01"},{"c":"[4체01-04]","b":1,"s":6,"a":"운동","ak":"운동","t":"건강을 위한 바른 생활 습관을 이해하고 생활 속에서 규칙적으로 실천한다.","A":"건강한 생활 습관의 필요성과 실천 방법을 명확하게 알고, 일상생활 전반에서 규칙적으로 실천할 수 있다.","B":"건강한 생활 습관의 필요성과 실천 방법을 대략적으로 알고, 일상생활에서 일부 규칙적으로 실천할 수 있다.","C":"건강한 생활 습관의 필요성을 대략적으로 알고, 일상생활에서 일부 실천할 수 있다.","p":139,"sr":"6-01"},{"c":"[4체01-05]","b":1,"s":6,"a":"운동","ak":"운동","t":"자신의 신체적 특징을 긍정적으로 인식하고 운동 계획을 세워 안전하게 활동한다.","A":"자신의 체격·체형·체력적 특징 전반을 긍정적으로 인식하고, 이를 종합적으로 고려한 운동 계획을 구체적으로 세워 안전하게 활동할 수 있다.","B":"자신의 체격·체형·체력적 특징 중 일부를 긍정적으로 인식하고, 이를 부분적으로 고려한 운동 계획을 세워 안전하게 활동할 수 있다.","C":"자신의 체격·체형·체력적 특징 중 일부를 인식하고, 이를 부분적으로 고려한 운동 계획에 따라 안전하게 활동할 수 있다.","p":139,"sr":"6-01"},{"c":"[4체01-06]","b":1,"s":6,"a":"운동","ak":"운동","t":"운동과 건강한 생활 습관 형성에 관심을 갖고 적극적으로 실천한다.","A":"운동과 건강한 생활 습관 형성에 꾸준히 관심을 갖고 일상생활 전반에서 적극적으로 실천할 수 있다.","B":"운동과 건강한 생활 습관 형성에 꾸준히 관심을 갖고 일상생활에서 일부 실천할 수 있다.","C":"운동과 건강한 생활 습관 형성에 간헐적으로 관심을 갖고 일상생활에서 일부 실천할 수 있다.","p":140,"sr":"6-01"},{"c":"[4체02-01]","b":1,"s":6,"a":"스포츠","ak":"스포츠","t":"스포츠의 의미와 유형을 파악한다.","A":"스포츠의 의미와 유형을 명확하게 알고, 기술형·전략형·생태형 스포츠의 특성을 예를 들어 구체적으로 설명할 수 있다.","B":"스포츠의 의미와 유형을 대략적으로 알고, 기술형·전략형·생태형 스포츠의 특성을 설명할 수 있다.","C":"스포츠의 의미를 대략적으로 알고, 기술형·전략형·생태형 스포츠의 종류를 구별할 수 있다.","p":140,"sr":"6-02"},{"c":"[4체02-02]","b":1,"s":6,"a":"스포츠","ak":"스포츠","t":"기본 움직임 기술의 의미와 종류를 이해하고 스포츠와의 관계를 파악한다.","A":"이동·비이동·조작 움직임 기술의 종류와 각각의 의미를 명확하게 알고, 다양한 스포츠에서 활용되는 여러 가지 기본 움직임 기술을 예를 들어 구체적으로 설명할 수 있다.","B":"이동·비이동·조작 움직임 기술의 종류와 각각의 의미를 대략적으로 알고, 스포츠에서 활용되는 기본 움직임 기술을 설명할 수 있다.","C":"이동·비이동·조작 움직임 기술의 종류를 대략적으로 알고, 스포츠에서 활용되는 일부 기본 움직임 기술을 제시할  지키며 참여하려고 노력한다.","p":196,"sr":"9-02"},{"c":"[6국01-01]","b":2,"s":0,"a":"듣기·말하기","ak":"듣기말하기","t":"대화에서 생략된 내용을 추론하며 듣는다.","A":"대화에서 들은 내용에 담긴 정보와 맥락을 적극적으로 활용하여 드러나지 않거나 생략된 내용을 적절하게 추론하며 들을 수 있다.","B":"대화에서 들은 내용에 담긴 정보와 맥락을 활용하여 드러나지 않거나 생략된 내용을 추론하며 들을 수 있다.","C":"대화에서 들은 내용에 담긴 정보와 맥락을 제한적으로 활용하여 드러나지 않거나 생략된 내용을 부분적으로 추론하며 듣는다.","p":21,"sr":"0-01"},{"c":"[6국01-02]","b":2,"s":0,"a":"듣기·말하기","ak":"듣기말하기","t":"주장을 파악하고 이유나 근거가 타당한지 평가하며 듣는다.","A":"상대의 주장, 이유, 근거를 정확하게 파악하고, 이유나 근거가 주장을 타당하게 뒷받침하는지 적극적으로 평가하며 들을 수 있다.","B":"상대의 주장, 이유, 근거를 파악하고, 이유나 근거가 주장을 타당하게 뒷받침하는지 평가하며 들을 수 있다.","C":"상대의 주장, 이유, 근거를 제한적으로 파악하고, 이유나 근거를 부분적으로 평가하며 듣는다.","p":21,"sr":"0-01"},{"c":"[6국01-03]","b":2,"s":0,"a":"듣기·말하기","ak":"듣기말하기","t":"주제와 관련하여 궁금한 내용을 질문하며 적극적으로 듣고 말한다.","A":"듣기 목적에 맞게 주제와 관련하여 궁금한 내용에 대해 분명한 표현으로 질문하며, 적극적으로 듣고 말할 수 있다.","B":"듣기 목적에 맞게 주제와 관련하여 궁금한 내용에 대해 질문하며, 적극적으로 듣고 말할 수 있다.","C":"주제와 관련하여 궁금한 내용에 대해 제한적으로 질문하며 듣고 말한다.","p":21,"sr":"0-01"},{"c":"[6국01-04]","b":2,"s":0,"a":"듣기·말하기","ak":"듣기말하기","t":"면담의 절차를 이해하고 상대와 매체를 고려하여 면담한다.","A":"면담의 절차를 이해하여 상황에 맞게 적절하게 적용하고, 상대와 매체를 고려하여 효과적으로 면담할 수 있다.","B":"면담의 절차를 이해하여 단계적으로 수행하고, 상대와 매체를 고려하여 면담할 수 있다.","C":"면담의 절차를 부분적으로 이해하고 상대와 매체를 일부 고려하여 면담한다.","p":21,"sr":"0-01"},{"c":"[6국01-05]","b":2,"s":0,"a":"듣기·말하기","ak":"듣기말하기","t":"자료를 선별하여 핵심 정보를 중심으로 내용을 구성하고 매체를 활용하여 발표한다.","A":"말하기 목적과 주제를 고려하여 선별한 자료에서 핵심 정보를 중심으로 내용을 효과적으로 구성하고, 말하기 상황과 내용에 적합한 매체를 활용하여 발표할 수 있다.","B":"선별한 자료에서 핵심 정보를 중심으로 내용을 구성하고, 말하기 상황과 내용에 적절한 매체를 활용하여 발표할 수 있다.","C":"수집한 자료에서 발표 내용을 제한적으로 구성하고, 매체를 부분적으로 활용하여 발표한다.","p":22,"sr":"0-01"},{"c":"[6국01-06]","b":2,"s":0,"a":"듣기·말하기","ak":"듣기말하기","t":"토의에 협력적으로 참여하며 서로의 의견을 비교하고 조정한다.","A":"다른 사람의 의견을 경청하고 자신의 의견을 타당하게 제시하며 토의 활동에 협력적으로 참여하고, 서로의 의견을 종합적으로 검토하고 비교하여 조정할 수 있다.","B":"다른 사람의 의견을 경청하고 자신의 의견을 제시하며 토의 활동에 협력적으로 참여하고, 서로의 의견을 검토하고 비교하여 조정할 수 있다.","C":"토의에 제한적으로 참여하며 서로의 의견을 부분적으로 비교한다.","p":22,"sr":"0-01"},{"c":"[6국01-07]","b":2,"s":0,"a":"듣기·말하기","ak":"듣기말하기","t":"절차와 규칙을 지키고 타당한 이유와 근거를 제시하며 토론한다.","A":"토론의 절차와 규칙을 정확하게 지키며, 주장에 대한 타당한 이유와 근거를 명확하게 제시하며 토론할 수 있다.","B":"토론의 절차와 규칙을 지키며, 주장에 대한 타당한 이유와 근거를 제시하며 토론할 수 있다.","C":"토론의 절차와 규칙을 제한적으로 따르며, 주장에 대한 이유나 근거를 일부 제시하며 토론에 참여한다.","p":22,"sr":"0-01"},{"c":"[6국02-01]","b":2,"s":0,"a":"읽기","ak":"읽기","t":"글의 구조를 고려하며 주제나 주장을 파악하고 글 내용을 요약한다.","A":"글의 구조를 고려하며 주제나 주장을 정확하게 파악하고 글의 내용을 자신의 언어로 중심 내용이 잘 드러나게 요약할 수 있다.","B":"글의 구조를 고려하며 주제나 주장을 파악하고 글의 내용을 자신의 언어로 요약할 수 있다.","C":"글의 구조를 고려하며 글의 내용을 부분적으로 파악하고 이를 요약한다.","p":23,"sr":"0-02"},{"c":"[6국02-02]","b":2,"s":0,"a":"읽기","ak":"읽기","t":"글에서 생략된 내용이나 함축된 표현을 문맥을 고려하여 추론한다.","A":"글의 문맥을 고려하여 의미를 이해할 수 있으며 생략된 내용이나 이어질 내용, 함축된 표현을 정확하게 추론할 수 있다.","B":"글의 문맥을 고려하여 생략된 내용이나 함축된 표현을 추론할 수 있다.","C":"글의 문맥을 일부 고려하며 글에서 생략된 내용과 함축된 표현을 제한적으로 추론한다.","p":23,"sr":"0-02"},{"c":"[6국02-03]","b":2,"s":0,"a":"읽기","ak":"읽기","t":"글이나 자료를 읽고 내용의 타당성과 표현의 적절성을 평가한다.","A":"글이나 자료를 읽고 평가 근거를 토대로 내용의 타당성과 표현의 적절성을 종합적으로 평가할 수 있다.","B":"글이나 자료를 읽고 평가 근거를 토대로 내용의 타당성과 표현의 적절성을 평가할 수 있다.","C":"글이나 자료를 읽고 내용의 타당성이나 표현의 적절성을 부분적으로 평가한다.","p":23,"sr":"0-02"},{"c":"[6국02-04]","b":2,"s":0,"a":"읽기","ak":"읽기","t":"문제 상황과 관련된 다양한 관점의 글을 읽고 이를 문제 해결에 활용한다.","A":"문제 상황과 관련된 다양한 관점의 글을 읽고, 내용의 타당성과 유용성을 평가하여 문제 해결 방안을 마련하는 데 이를 활용할 수 있다.","B":"문제 상황과 관련된 다양한 관점의 글을 읽고 문제 해결 방안을 마련하는 데 이를 활용할 수 있다.","C":"문제 상황과 관련된 다양한 관점의 글을 읽고 문제 해결 방안을 마련하는 데 이를 제한적으로 활용한다.","p":23,"sr":"0-02"},{"c":"[6국02-05]","b":2,"s":0,"a":"읽기","ak":"읽기","t":"긍정적인 읽기 동기를 형성하고 적극적으로 읽기에 참여하는 태도를 기른다.","A":"읽기의 중요성과 가치를 인식하고, 긍정적인 읽기 동기를 형성하며 읽기 활동에 적극적이고 주도적으로 참여하는 태도를 지닌다.","B":"긍정적인 읽기 동기를 형성하며 읽기 활동에 적극적으로 참여하는 태도를 지닌다.","C":"긍정적인 읽기 동기 형성과 읽기 활동에 대한 참여가 제한적이다.","p":23,"sr":"0-02"},{"c":"[6국03-01]","b":2,"s":0,"a":"쓰기","ak":"쓰기","t":"알맞은 내용을 선정하여 대상의 특성이 나타나게 설명하는 글을 쓴다.","A":"설명 대상의 특성을 드러내는 알맞은 내용을 선정하고, 이를 효과적으로 나타낼 수 있는 적절한 설명 방법을 활용하여 독자가 이해하기 쉽게 설명하는 글을 쓸 수 있다.","B":"설명 대상의 특성을 드러내는 알맞은 내용을 선정하고 이를 나타낼 수 있는 설명 방법을 활용하여 설명하는 글을 쓸 수 있다.","C":"설명 대상의 특성을 드러내는 내용을 일부 선정하고 이와 관련된 설명 방법을 부분적으로 활용하여 설명하는 글을 쓴다.","p":24,"sr":"0-03"},{"c":"[6국03-02]","b":2,"s":0,"a":"쓰기","ak":"쓰기","t":"적절한 근거를 사용하고 인용의 출처를 밝히며 주장하는 글을 쓴다.","A":"주장을 뒷받침하는 이유와 적절한 근거를 들고 인용의 출처를 정확하게 밝히며 자신의 주장을 설득력 있게 제시하는 주장하는 글을 쓸 수 있다.","B":"주장과 관련한 적절한 근거를 들고 인용의 출처를 밝히며 자신의 주장을 명확하게 제시하는 주장하는 글을 쓸 수 있다.","C":"주장과 관련한 근거를 들고 인용의 출처를 부분적으로 밝히며 주장하는 글을 쓴다.","p":24,"sr":"0-03"},{"c":"[6국03-03]","b":2,"s":0,"a":"쓰기","ak":"쓰기","t":"체험한 일에 대한 감상을 나타내는 글을 쓴다.","A":"체험한 일과 이에 대한 감상을 풍부하게 나타내는 글을 쓸 수 있다.","B":"체험한 일에 대한 감상을 나타내는 글을 쓸 수 있다.","C":"일상의 체험에 대한 감상을 일부 나타내는 글을 쓴다.","p":24,"sr":"0-03"},{"c":"[6국03-04]","b":2,"s":0,"a":"쓰기","ak":"쓰기","t":"독자와 매체를 고려하여 내용을 생성하고 표현하며 글을 쓴다.","A":"독자와 매체와 같은 쓰기의 상황 맥락을 전체적으로 고려하여 적절한 내용을 생성하고 효과적으로 표현하며 글을 쓸 수 있다.","B":"독자와 매체와 같은 쓰기의 상황 맥락을 고려하여 내용을 생성하고 표현하며 글을 쓸 수 있다.","C":"독자 또는 매체를 고려하여 내용을 일부 생성하고 표현하며 글을 쓴다.","p":24,"sr":"0-03"},{"c":"[6국03-05]","b":2,"s":0,"a":"쓰기","ak":"쓰기","t":"쓰기 과정을 점검·조정하며 글을 쓰고, 글 전체를 대상으로 통일성 있게 고쳐 쓴다.","A":"쓰기 과정을 능동적으로 점검‧조정하며 글을 쓸 수 있고, 다양한 유형의 글에 대해 글 전체의 내용과 표현을 통일성 있게 효과적으로 고쳐 쓸 수 있다.","B":"쓰기 과정을 점검‧조정하며 글을 쓸 수 있고, 글 전체의 내용과 표현을 통일성 있게 고쳐 쓸 수 있다.","C":"쓰기 과정을 부분적으로 점검하면서 글을 쓰고, 일부 유형의 글에 대해 글 전체의 내용이나 표현을 통일성 있게 고쳐 쓴다.","p":24,"sr":"0-03"},{"c":"[6국03-06]","b":2,"s":0,"a":"쓰기","ak":"쓰기","t":"쓰기에 적극적으로 참여하며 자신의 글을 독자와 공유하는 태도를 지닌다.","A":"쓰기 맥락을 고려하여 쓰기에 적극적이고 주도적으로 참여하며 자신의 글을 다양한 독자와 공유하는 태도를 지닌다.","B":"쓰기 맥락을 고려하여 쓰기에 적극적으로 참여하며 자신의 글을 독자와 공유하는 태도를 지닌다.","C":"쓰기에 참여하며 자신의 글을 독자와 공유하려는 태도를 지닌다.","p":24,"sr":"0-03"},{"c":"[6국04-01]","b":2,"s":0,"a":"문법","ak":"문법","t":"음성 언어 및 문자 언어의 특성을 이해하고 다양한 매체 자료에서 표현 효과를 평가한다.","A":"음성 언어 및 문자 언어의 특성을 분석하고 다양한 매체 자료에서 표현 효과를 종합적으로 평가할 수 있다.","B":"음성 언어 및 문자 언어의 특성을 이해하고 매체 자료에서 표현 효과를 분석할 수 있다.","C":"음성 언어와 문자 언어의 특성을 확인하고 매체 자료에서 표현 효과를 제한적으로 이해한다.","p":25,"sr":"0-04"},{"c":"[6국04-02]","b":2,"s":0,"a":"문법","ak":"문법","t":"표준어와 방언의 기능을 파악하고 언어 공동체와 국어생활과의 관계를 이해한다.","A":"표준어와 방언의 다양한 기능을 분석하고 언어 공동체와 국어생활과의 관계를 종합적으로 이해할 수 있다.","B":"표준어와 방언의 기능을 이해하고 언어 공동체와 국어생활과의 관계를 이해할 수 있다.","C":"표준어와 방언의 기능을 확인하고 언어 공동체와 국어생활과의 관계를 제한적으로 이해한다.","p":25,"sr":"0-04"},{"c":"[6국04-03]","b":2,"s":0,"a":"문법","ak":"문법","t":"고유어와 관용 표현의 쓰임과 가치를 이해하고 상황에 맞게 표현한다.","A":"고유어와 관용 표현의 다양한 쓰임과 가치를 분석하고 적절한 표현을 상황에 따라 효과적으로 활용할 수 있다.","B":"고유어와 관용 표현의 쓰임과 가치를 이해하고 이를 상황에 따라 표현할 수 있다.","C":"고유어와 관용 표현의 쓰임과 가치를 확인하고 일부를 상황에 따라 제한적으로 표현한다.","p":25,"sr":"0-04"},{"c":"[6국04-04]","b":2,"s":0,"a":"문법","ak":"문법","t":"문장 성분을 이해하고 호응 관계가 올바른 문장을 구성한다.","A":"문장 성분을 분석하고 국어생활에서 호응 관계가 올바른 다양한 문장을 구성할 수 있다.","B":"문장 성분을 이해하고 문장 성분이 호응 관계를 이루는 문장을 구성할 수 있다.","C":"문장 성분을 확인하고 문장 성분이 호응 관계를 이루는 문장을 제한적으로 구성한다.","p":25,"sr":"0-04"},{"c":"[6국04-05]","b":2,"s":0,"a":"문법","ak":"문법","t":"글과 담화에 쓰인 시간 표현을 이해하고 상황에 맞게 표현한다.","A":"글과 담화에 쓰인 다양한 시간 표현을 분석하고 적절한 표현을 상황에 따라 효과적으로 활용할 수 있다.","B":"글과 담화에 쓰인 시간 표현을 이해하고 이를 상황에 따라 표현할 수 있다.","C":"글과 담화에 쓰인 시간 표현을 확인하고 일부를 상황에 따라 제한적으로 표현한다.","p":25,"sr":"0-04"},{"c":"[6국04-06]","b":2,"s":0,"a":"문법","ak":"문법","t":"글과 담화에 쓰인 단어 및 문장, 띄어쓰기를 민감하게 살펴 바르게 고치는 태도를 지닌다.","A":"국어생활에서 글과 담화에 쓰인 단어 및 문장, 띄어쓰기를 민감하게 점검하여 바르게 고치는 태도를 내면화한다.","B":"글과 담화에 쓰인 단어 및 문장, 띄어쓰기를 점검하여 바르게 고치는 태도를 지닌다.","C":"글과 담화에 쓰인 단어 및 문장, 띄어쓰기를 제한적으로 점검하고 바르게 고치는 것에 관심을 가진다.","p":25,"sr":"0-04"},{"c":"[6국05-01]","b":2,"s":0,"a":"문학","ak":"문학","t":"작가의 의도를 생각하며 작품을 읽는다.","A":"작가의 의도를 적절하게 생각하며 작품을 깊이 있게 읽을 수 있다.","B":"작가의 의도를 생각하며 작품을 읽을 수 있다.","C":"작가의 의도를 부분적으로 생각하며 작품을 읽는다.","p":26,"sr":"0-05"},{"c":"[6국05-02]","b":2,"s":0,"a":"문학","ak":"문학","t":"비유적 표현의 효과에 유의하여 작품을 감상한다.","A":"비유적 표현의 특성과 효과에 유의하여 작품을 즐겨 감상할 수 있다.","B":"비유적 표현의 효과에 유의하여 작품을 감상할 수 있다.","C":"비유에 대한 부분적인 이해를 바탕으로 비유적 표현을 찾으며 작품을 읽는다.","p":26,"sr":"0-05"},{"c":"[6국05-03]","b":2,"s":0,"a":"문학","ak":"문학","t":"소설이나 극을 읽고 인물, 사건, 배경을 파악한다.","A":"인물, 사건, 배경에 대한 이해를 바탕으로 소설이나 극을 읽고 인물, 사건, 배경을 적절하게 정리할 수 있다.","B":"인물, 사건, 배경에 대한 이해를 바탕으로 소설이나 극을 읽고 인물, 사건, 배경을 찾을 수 있다.","C":"소설이나 극을 읽고 인물, 사건, 배경이 있음을 안다.","p":26,"sr":"0-05"},{"c":"[6국05-04]","b":2,"s":0,"a":"문학","ak":"문학","t":"인상적인 부분을 중심으로 작품에 대한 의견을 나눈다.","A":"작품에서 인상적인 부분을 찾아 그 이유를 작품과 연결 지어 구체적으로 설명하고 다른 사람과 의견을 즐겨 나눌 수 있다.","B":"작품에서 인상적인 부분을 찾아 그 이유를 말하면서 다른 사람과 의견을 나눌 수 있다.","C":"작품에서 인상적인 부분을 찾아 자신의 의견을 말한다.","p":26,"sr":"0-05"},{"c":"[6국05-05]","b":2,"s":0,"a":"문학","ak":"문학","t":"자신의 경험을 시, 소설, 극, 수필 등 적절한 갈래로 표현한다.","A":"일상생활에서의 경험을 시, 소설, 극, 수필 등의 적절한 갈래로 창의적으로 표현할 수 있다.","B":"일상생활에서의 경험을 시, 소설, 극, 수필 등의 갈래로 표현할 수 있다.","C":"일상생활에서의 경험을 시, 소설, 극, 수필 등의 갈래로 간단하게 표현한다.","p":26,"sr":"0-05"},{"c":"[6국05-06]","b":2,"s":0,"a":"문학","ak":"문학","t":"작품을 읽고 자신의 삶과 연관 지어 성찰하는 태도를 지닌다.","A":"작품을 읽고 자신의 삶을 작품과 적절하게 연관 지어 탐색하고 적극적으로 성찰하는 태도를 지닌다.","B":"작품을 읽고 자신의 삶을 작품과 연관 지어 탐색하고 성찰하는 태도를 지닌다.","C":"작품을 읽고 연관된 자신의 경험을 떠올리는 태도를 지닌다.","p":26,"sr":"0-05"},{"c":"[6국06-01]","b":2,"s":0,"a":"매체","ak":"매체","t":"정보 검색 도구를 활용하여 자신의 목적에 맞는 매체 자료를 찾는다.","A":"정보 검색 도구의 기능과 특성을 이해하고 적절한 정보 검색 전략을 활용하여 목적에 맞는 다양한 매체 자료를 찾고 활용할 수 있다.","B":"정보 검색 도구의 기능이나 특성을 이해하고 정보 검색 도구를 활용하여 목적에 맞는 매체 자료를 찾을 수 있다.","C":"정보 검색 도구를 활용하여 매체 자료를 찾는다.","p":27,"sr":"0-06"},{"c":"[6국06-02]","b":2,"s":0,"a":"매체","ak":"매체","t":"뉴스 및 각종 정보 매체 자료의 신뢰성을 평가한다.","A":"정보 매체 자료의 신뢰성 평가 기준을 다각적으로 고려하여 뉴스 및 각종 정보 매체 자료의 신뢰성을 종합적으로 평가할 수 있다.","B":"정보 매체 자료의 신뢰성 평가 기준에 따라 뉴스 및 각종 정보 매체 자료의 신뢰성을 평가할 수 있다.","C":"뉴스나 정보 매체 자료의 신뢰성을 제한적으로 평가한다.","p":27,"sr":"0-06"},{"c":"[6국06-03]","b":2,"s":0,"a":"매체","ak":"매체","t":"적합한 양식과 수용자의 반응을 고려하여 복합양식 매체 자료를 제작하고 공유한다.","A":"다양한 매체 및 매체 자료의 양식적 특성과 수용자의 반응을 적극적으로 고려하여 효과적인 복합양식 매체 자료를 제작하고 공유할 수 있다.","B":"다양한 매체 및 매체 자료의 양식적 특성과 수용자의 반응을 고려하여 복합양식 매체 자료를 제작하고 공유할 수 있다.","C":"다양한 매체 및 매체 자료의 양식적 특성을 제한적으로 고려하여 복합양식 매체 자료의 일부를 제작하고 공유한다.","p":27,"sr":"0-06"},{"c":"[6국06-04]","b":2,"s":0,"a":"매체","ak":"매체","t":"자신의 매체 이용 양상에 대해 성찰한다.","A":"자신의 매체 이용 양상을 다양한 측면에서 성찰하고 바람직한 매체 이용 방법을 능동적으로 탐색할 수 있다.","B":"자신의 매체 이용 양상을 성찰하고 바람직한 매체 이용 방법을 탐색할 수 있다.","C":"자신의 매체 이용 양상을 떠올리고 바람직한 매체 이용 방법을 제한적으로 탐색한다.","p":27,"sr":"0-06"},{"c":"[6사01-01]","b":2,"s":1,"a":"우리나라 국토 여행","ak":"우리나라국토여행","t":"우리나라 산지, 하천, 해안 지형의 위치를 확인하고 지형의 분포 특징을 탐구한다.","A":"우리나라 산지, 하천, 해안 지형의 위치를 다양한 자료를 이용하여 조사하고, 우리나라 지형 분포의 특징을 분석할 수 있다.","B":"우리나라 산지, 하천, 해안 지형의 위치를 지도에서 찾고, 우리나라 지형 분포의 특징을 설명할 수 있다.","C":"우리나라 산지, 하천, 해안 지형을 지도에서 찾고 우리나라 지형 분포의 특징을 말할 수 있다.","p":39},{"c":"[6사01-02]","b":2,"s":1,"a":"우리나라 국토 여행","ak":"우리나라국토여행","t":"독도의 지리적 특성과 독도에 대한 역사 기록을 바탕으로 영토로서 독도의 중요성을 이해한다.","A":"독도의 지리적 특성을 분석하고, 주요 역사 기록을 탐구하여 영토로서 독도의 중요성과 가치를 설명할 수 있다.","B":"독도의 지리적 특성과 독도에 대한 역사 기록을 조사하고, 독도의 중요성을 설명할 수 있다.","C":"독도의 지리적 특성을 파악하고 독도에 대한 역사 기록을 제시하며, 독도의 중요성을 인식할 수 있다.","p":39},{"c":"[6사02-01]","b":2,"s":1,"a":"우리나라 지리 탐구","ak":"우리나라지리탐구","t":"우리나라의 계절별 기후 특징을 자료에서 탐구하고, 기후변화로 인한 자연재해의 심각성을 이해한다.","A":"자료를 바탕으로 우리나라의 계절별 기후 특징을 분석하고, 기후변화로 인해 나타나는 자연재해의 심각성을 설명하며 기후변화에 대응하기 위한 행동에 참여할 수 있다.","B":"자료를 바탕으로 우리나라의 계절별 기후 특징을 조사하고, 기후변화로 인해 나타나는 자연재해의 심각성을 설명할 수 있다.","C":"자료를 바탕으로 우리나라의 계절별 기후 특징을 인식하고, 기후변화로 인해 나타난 자연재해를 제시할 수 있다.","p":39},{"c":"[6사02-02]","b":2,"s":1,"a":"우리나라 지리 탐구","ak":"우리나라지리탐구","t":"우리나라의 지역별 인구 분포의 특징을 알아보고, 이에 따른 문제점과 해결 방안을 탐색한다.","A":"우리나라 지역별 인구 분포의 특징을 분석하고, 이에 따른 문제점을 찾아 해결 방안을 조사하고 이와 관련된 사례를 설명할 수 있다.","B":"우리나라 지역별 인구 분포의 특징을 설명하고, 이에 따른 문제점을 찾아 해결 방안을 조사할 수 있다.","C":"우리나라 지역별 인구 분포의 특징을 나열하고, 이에 따른 문제점을 말할 수 있다.","p":39,"note":"내용 체계표의 가치·태도 요소를 포함하여 성취수준 개발"},{"c":"[6사03-01]","b":2,"s":1,"a":"법과 인권의 보장","ak":"법과인권의보장","t":"일상 사례에서 법의 의미와 역할을 이해하고, 헌법에 규정된 인권이 일상생활에서 구현되는 사례를 조사하여 인권 친화적 태도를 기른다.","A":"일상생활의 사례를 통해 법의 의미와 역할을 설명하고, 헌법에 규정된 인권이 일상생활에서 구현되는 사례를 조사하며 인권 존중을 실천할 수 있다.","B":"일상생활의 사례와 관련지어 법의 의미와 역할을 이해하고, 헌법에 규정된 인권이 일상생활에서 구현되는 사례를 통해 인권을 존중하는 태도를 가진다.","C":"일상의 사례에서 법의 의미와 역할을 살펴보고, 헌법에 규정된 인권이 일상생활에서 구현되는 사례를 말할 수 있다.","p":40},{"c":"[6사03-02]","b":2,"s":1,"a":"법과 인권의 보장","ak":"법과인권의보장","t":"일상생활에서 인권이 침해되는 사례를 찾아 그 해결 방안을 탐색하고, 인권을 보호하는 활동에 참여한다.","A":"일상생활에서 인권이 침해되는 사례를 분석하여 그 해결 방안을 제안하고, 인권을 보호하는 활동에 관심을 갖고 참여할 수 있다.","B":"일상생활에서 인권이 침해되는 사례를 조사하여 그 해결 방안을 설명하고, 인권을 보호하는 활동에 참여할 수 있다.","C":"인권이 침해된 사례에 대한 적절한 해결 방안을 제시하고, 인권을 보호하는 활동에 관심을 가진다.","p":40},{"c":"[6사04-01]","b":2,"s":1,"a":"유적과 유물로 살펴본 옛 사람들의 생활","ak": 지 사례 속 미디어의 내용을 비판적으로 파악하여 미디어를 올바르게 이용하고자 노력한다.","C":"민주주의에서 미디어의 의미와 역할을 제시하고, 미디어를 올바르게 이용하는 태도를 가진다.","p":42},{"c":"[6사09-01]","b":2,"s":1,"a":"지구, 대륙 그리고 국가들","ak":"지구대륙그리고국가들","t":"세계를 표현하는 다양한 공간 자료의 특징을 이해하고, 지구본과 세계지도에서 위치를 표현하는 방법을 익힌다.","A":"세계를 표현하는 다양한 공간자료의 특징을 분석하고, 지구본과 세계지도에서 경도와 위도를 이용하여 위치를 표현할 수 있다.","B":"세계를 표현하는 다양한 공간자료의 특징을 제시하고, 지구본과 세계지도에서 경도와 위도의 의미를 설명할 수 있다.","C":"세계를 표현하는 다양한 공간자료를 찾아보고, 지구본과 세계지도에서 경도와 위도를 구분할 수 있다.","p":43},{"c":"[6사09-02]","b":2,"s":1,"a":"지구, 대륙 그리고 국가들","ak":"지구대륙그리고국가들","t":"세계 주요 대륙과 대양을 파악하고, 우리나라 및 세계 여러 국가의 위치와 영토의 특징을 이해한다.","A":"세계 주요 대륙과 대양의 위치를 설명하고, 우리나라 및 세계 여러 국가의 위치와 영토의 특징을 분석할 수 있다.","B":"세계 주요 대륙과 대양의 위치를 찾고, 우리나라 및 세계 여러 국가의 위치와 영토의 특징을 설명할 수 있다.","C":"세계 주요 대륙과 대양의 위치를 알아보고, 여러 국가의 위치와 영토의 특징을 말할 수 있다.","p":43},{"c":"[6사10-01]","b":2,"s":1,"a":"세계의 자연환경","ak":"세계의자연환경","t":"세계 여러 지역의 지형 경관을 살펴보고, 이를 통해 다양한 삶의 모습을 이해한다.","A":"세계 여러 지역의 지형 경관의 특징을 분석하고, 세계 여러 지역에서 나타나는 다양한 삶의 모습을 탐구할 수 있다.","B":"세계 여러 지역의 지형 경관을 조사하고, 다양한 삶의 모습을 설명할 수 있다.","C":"세계 여러 지역의 지형 경관의 특징을 제시하고, 삶의 모습이 다양함을 말할 수 있다.","p":43},{"c":"[6사10-02]","b":2,"s":1,"a":"세계의 자연환경","ak":"세계의자연환경","t":"세계의 다양한 기후를 알아보고 기후 환경과 인간생활 간의 관계를 탐구한다.","A":"세계의 다양한 기후의 특징을 분석하고, 기후 환경과 인간생활 간의 관계를 탐구할 수 있다.","B":"세계의 다양한 기후를 조사하고, 기후 환경과 인간생활 간의 관계를 설명할 수 있다.","C":"세계의 다양한 기후를 제시하고 기후 환경이 인간생활과 관련이 있음을 말할 수 있다.","p":43},{"c":"[6사11-01]","b":2,"s":1,"a":"시장경제와 국가 간 거래","ak":"시장경제와국가간거래","t":"시장경제에서 가계와 기업의 역할을 이해하고, 근로자의 권리와 기업의 자유 및 책임을 탐색한다.","A":"시장경제에서 가계와 기업의 역할을 설명하고, 사례를 중심으로 근로자의 권리와 기업의 자유 및 책임을 분석할 수 있다.","B":"시장경제에서 가계와 기업의 역할을 제시하고, 근로자의 권리와 기업의 자유 및 책임을 탐색할 수 있다.","C":"시장경제에서 가계와 기업의 역할을 제시할 수 있다.","p":44},{"c":"[6사11-02]","b":2,"s":1,"a":"시장경제와 국가 간 거래","ak":"시장경제와국가간거래","t":"경제성장이 우리 생활에 미치는 영향을 파악하고, 빠른 경제성장으로 발생한 문제의 해결 방안을 탐색한다.","A":"자료를 통해 경제성장이 우리 생활에 미치는 영향을 분석하고, 빠른 경제성장으로 인해 발생한 문제와 해결 방안을 도출할 수 있다.","B":"경제성장이 우리 생활에 미치는 영향을 설명하고, 빠른 경제성장으로 인해 발생한 문제의 해결 방안을 탐색할 수 있다.","C":"경제성장이 우리 생활에 미치는 영향과 빠른 경제성장으로 인해 발생한 문제를 제시할 수 있 이후 사회의 여러 가지 상황을 부분적으로 예상하고 바람직한 통일과정과 통일 국가의 사회상에 관심을 가진다.","p":58,"sr":"2-03"},{"c":"[6도03-04]","b":2,"s":2,"a":"사회·공동체과의 관계","ak":"사회공동체과의관계","t":"다른 나라 사람들이 처한 여러 가지 상황을 종합적으로 이해하고 해결 방안을 탐구하며 인류애를 기른다.","A":"다른 나라 사람들이 처한 여러 가지 상황을 종합적으로 이해하고 해결 방안을 다각도로 탐구하며 인류애를 가진다.","B":"다른 나라 사람들이 처한 여러 가지 상황을 이해하고 해결 방안을 탐구하며 인류애를 기른다.","C":"다른 나라 사람들이 처한 상황을 부분적으로 이해하고 해결 방안을 탐구하려고 노력하며 인류애에 관심을 가진다.","p":59,"sr":"2-03"},{"c":"[6도04-01]","b":2,"s":2,"a":"자연과의 관계","ak":"자연과의관계","t":"지구의 환경 위기 상황을 이해하고, 이를 극복하기 위한 다양한 방법을 찾아 자신의 일상에서 실천하고자 노력한다.","A":"지구의 환경 위기 상황을 전반적으로 이해하고 이를 극복하기 위한 다양한 방법을 찾아 자신의 일상에서 실천하고자 노력한다.","B":"지구의 환경 위기 상황을 이해하고 이를 극복하기 위한 방법을 찾아 자신의 일상에서 실천하고자 노력한다.","C":"지구의 환경 위기 상황을 부분적으로 이해하고 이를 극복하기 위한 방법을 찾으려고 노력하며 자신의 일상에서 실천에 관심을 가진다.","p":59,"sr":"2-04"},{"c":"[6도04-02]","b":2,"s":2,"a":"자연과의 관계","ak":"자연과의관계","t":"지속가능한 삶의 의미를 탐구하고 미래 세대에 대한 책임을 강화하여 자연의 다양성을 존중하고 생산성을 유지할 수 있는 미래를 위한 실천 방안을 찾는다.","A":"지속가능한 삶의 의미를 포괄적으로 이해하고 미래 세대에 대한 높은 책임감을 바탕으로 자연의 다양성을 존중하고 생산성을 유지할 수 있는 미래를 위한 실천 방안을 다각도로 찾는다.","B":"지속가능한 삶의 의미를 이해하고 미래 세대에 대한 책임감을 바탕으로 자연의 다양성을 존중하고 생산성을 유지할 수 있는 미래를 위한 실천 방안을 찾는다.","C":"지속가능한 삶의 의미를 단편적으로 이해하고 미래 세대에 대한 책임감을 바탕으로 자연의 다양성을 존중하고 생산성을 유지할 수 있는 미래를 위한 실천 방안에 관심을 가진다.","p":59,"sr":"2-04"},{"c":"[6수01-01]","b":2,"s":3,"a":"수와 연산","ak":"수와연산","t":"덧셈, 뺄셈, 곱셈, 나눗셈의 혼합 계산에서 계산하는 순서를 알고, 혼합 계산을 할 수 있다.","A":"덧셈, 뺄셈, 곱셈, 나눗셈의 혼합 계산을 하고, 계산하는 순서를 설명할 수 있다.","B":"덧셈, 뺄셈, 곱셈, 나눗셈의 혼합 계산에서 계산하는 순서를 알고, 그 계산을 할 수 있다.","C":"안내된 절차에 따라 덧셈, 뺄셈, 곱셈, 나눗셈 중 일부가 섞여 있는 간단한 혼합 계산에서 계산하는 순서를 알고, 그 계산을 할 수 있다.","p":69,"sr":"3-01"},{"c":"[6수01-02]","b":2,"s":3,"a":"수와 연산","ak":"수와연산","t":"실생활과 연결하여 이상, 이하, 초과, 미만의 의미와 쓰임을 알고, 이를 활용하여 수의 범위를 나타낼 수 있다.","A":"이상, 이하, 초과, 미만의 의미와 쓰임을 알고, 수의 범위를 활용하여 실생활 문제를 해결할 수 있다.","B":"실생활 상황에서 이상, 이하, 초과, 미만을 사용하여 수의 범위를 나타낼 수 있다.","C":"안내된 절차에 따라 이상, 이하, 초과, 미만을 사용하여 간단한 수의 범위를 나타낼 수 있다.","p":69,"sr":"3-01"},{"c":"[6수01-03]","b":2,"s":3,"a":"수와 연산","ak":"수와연산","t":"어림값을 구하기 위한 방법으로 올림, 버림, 반올림의 의미와 필요성을 알고, 이를 실생활에 활용함으로써 수학의 유용성을 인식할 수 있다.","A":"올림, 버림, 반올림의 의미와 필요성을 알고, 이를 활용하여 실생활 문제를 해결하며, 이 과정에서 수학의 유용성을 설명할 수 있다.","B":"올림, 버림, 반올림을 사용하여 실생활의 여러 가지 수를 어림값으로 나타내고, 이 과정에서 수학의 유용성을 인식한다.","C":"안내된 절차에 따라 올림, 버림, 반올림을 사용하여 수를 어림값으로 나타낼 수 있다.","p":69,"sr":"3-01"},{"c":"[6수01-04]","b":2,"s":3,"a":"수와 연산","ak":"수와연산","t":"약수, 공약수, 최대공약수를 이해하고 구할 수 있다.","A":"약수, 공약수, 최대공약수를 구하고, 그 방법과 그들 사이의 관계를 설명할 수 있다.","B":"약수, 공약수, 최대공약수를 이해하고, 주어진 수의 약수, 공약수, 최대공약수를 구할 수 있다.","C":"안내된 절차에 따라 주어진 수의 약수, 공약수, 최대공약수를 구할 수 있다.","p":70,"sr":"3-01"},{"c":"[6수01-05]","b":2,"s":3,"a":"수와 연산","ak":"수와연산","t":"배수, 공배수, 최소공배수를 이해하고 구할 수 있다.","A":"배수, 공배수, 최소공배수를 구하고, 그 방법과 그들 사이의 관계를 설명할 수 있다.","B":"배수, 공배수, 최소공배수를 이해하고, 주어진 수의 배수, 공배수, 최소공배수를 구할 수 있다.","C":"안내된 절차에 따라 주어진 수의 배수, 공배수, 최소공배수를 구할 수 있다.","p":70,"sr":"3-01"},{"c":"[6수01-06]","b":2,"s":3,"a":"수와 연산","ak":"수와연산","t":"크기가 같은 분수를 만드는 방법을 이해하고, 분수를 약분, 통분할 수 있다.","A":"크기가 같은 분수에 대한 이해를 바탕으로 분수를 약분, 통분하고, 그 방법을 설명할 수 있다.","B":"크기가 같은 분수에 대한 이해를 바탕으로 주어진 분수와 크기가 같은 분수를 만들고, 분수를 약분, 통분할 수 있다.","C":"안내된 절차에 따라 주어진 분수와 크기가 같은 분수를 찾고, 간단한 분수를 약분, 통분할 수 있다.","p":70,"sr":"3-01"},{"c":"[6수01-07]","b":2,"s":3,"a":"수와 연산","ak":"수와연산","t":"분모가 다른 분수의 크기를 비교하고 그 방법을 설명할 수 있다.","A":"분모가 다른 분수의 크기를 여러 가지 방법으로 비교하고, 그 방법을 설명할 수 있다.","B":"분모가 다른 분수를 통분하여 크기를 비교할 수 있다.","C":"안내된 절차에 따라 분모가 다른 분수의 크기를 비교할 수 있다.","p":70,"sr":"3-01"},{"c":"[6수01-08]","b":2,"s":3,"a":"수와 연산","ak":"수와연산","t":"분모가 다른 분수의 덧셈과 뺄셈의 계산 원리를 탐구하고 그 계산을 할 수 있다.","A":"분모가 다른 분수의 덧셈과 뺄셈을 계산하고, 그 계산 원리를 설명할 수 있다.","B":"분모가 다른 분수의 덧셈과 뺄셈의 계산 원리를 탐구하고, 그 계산을 할 수 있다.","C":"안내된 절차에 따라 분모가 다른 간단한 분수의 덧셈과 뺄셈을 할 수 있다.","p":70,"sr":"3-01"},{"c":"[6수01-09]","b":2,"s":3,"a":"수와 연산","ak":"수와연산","t":"분수의 곱셈의 계산 원리를 탐구하고 그 계산을 할 수 있다.","A":"‘(분수)×(자연수)’, ‘(자연수)×(분수)’, ‘(분수)×(분수)’를 계산하고, 그 계산 원리를 설명할 수 있다.","B":"‘(분수)×(자연수)’, ‘(자연수)×(분수)’, ‘(분수)×(분수)’의 계산 원리를 탐구하고, 그 계산을 할 수 있다.","C":"안내된 절차에 따라 간단한 ‘(분수)×(자연수)’, ‘(자연수)×(분수)’, ‘(분수)×(분수)’의 계산을 할 수 있다.","p":71,"sr":"3-01"},{"c":"[6수01-10]","b":2,"s":3,"a":"수와 연산","ak":"수와연산","t":"÷ ‘(자연수)(자연수)’에서 나눗셈의 몫을 분수로 나타낼 수 있다.","A":"‘(자연수)÷(자연수)’의 몫을 분수로 나타내고, 그 방법을 설명할 수 있다.","B":"‘(자연수)÷(자연수)’의 몫을 분수로 나타낼 수 있다.","C":"안내된 절차에 따라 ‘(자연수)÷(자연수)’의 몫을 분수로 나타낼 수 있다.","p":71,"sr":"3-01"},{"c":"[6수01-11]","b":2,"s":3,"a":"수와 연산","ak":"수와연산","t":"분수의 나눗셈의 계산 원리를 탐구하고 그 계산을 할 수 있다.","A":"‘(분수)÷(자연수)’, ‘(자연수)÷(분수)’, ‘(분수)÷(분수)’를 계산하고, 그 계산 원리를 설명할 수 있다.","B":"‘(분수)÷(자연수)’, ‘(자연수)÷(분수)’, ‘(분수)÷(분수)’의 계산 원리를 탐구하고, 그 계산을 할 수 있다.","C":"안내된 절차에 따라 간단한 ‘(분수)÷(자연수)’, ‘(자연수)÷(분수)’, ‘(분수)÷(분수)’의 계산을 할 수 있다.","p":71,"sr":"3-01"},{"c":"[6수01-12]","b":2,"s":3,"a":"수와 연산","ak":"수와연산","t":"분수와 소수의 관계를 이해하고 크기를 비교하며 그 방법을 설명할 수 있다.","A":"분수와 소수의 관계에 대한 이해를 바탕으로 여러 가지 방법으로 분수와 소수의 크기를 비교하고, 그 방법을 설명할 수 있다.","B":"분수를 소수로, 소수를 분수로 나타내고, 분수와 소수의 크기를 비교할 수 있다.","C":"안내된 절차에 따라 분수를 소수로, 소수를 분수로 나타내고, 간단한 분수와 소수의 크기를 비교할 수 있다.","p":71,"sr":"3-01"},{"c":"[6수01-13]","b":2,"s":3,"a":"수와 연산","ak":"수와연산","t":"소수의 곱셈의 계산 원리를 탐구하고 그 계산을 할 수 있다.","A":"‘(소수)×(자연수)’, ‘(자연수)×(소수)’, ‘(소수)×(소수)’를 계산하고, 계산 결과가 타당한지를 어림을 이용하여 설명할 수 있다.","B":"‘(소수)×(자연수)’, ‘(자연수)×(소수)’, ‘(소수)×(소수)’의 계산 원리를 탐구하고, 그 계산을 할 수 있다.","C":"안내된 절차에 따라 간단한 ‘(소수)×(자연수)’, ‘(자연수)×(소수)’, ‘(소수)×(소수)’의 계산을 할 수 있다.","p":72,"sr":"3-01"},{"c":"[6수01-14]","b":2,"s":3,"a":"수와 연산","ak":"수와연산","t":"‘(자연수)÷(자연수)’에서 나눗셈의 몫을 소수로 나타낼 수 있다.","A":"‘(자연수)÷(자연수)’에서 나눗셈의 몫을 소수로 나타내고, 그 방법을 설명할 수 있다.","B":"‘(자연수)÷(자연수)’에서 나눗셈의 몫을 소수로 나타낼 수 있다.","C":"안내된 절차에 따라 간단한 ‘(자연수)÷(자연수)’에서 나눗셈의 몫을 소수로 나타낼 수 있다.","p":72,"sr":"3-01"},{"c":"[6수01-15]","b":2,"s":3,"a":"수와 연산","ak":"수와연산","t":"소수의 나눗셈의 계산 원리를 탐구하고 그 계산을 할 수 있다.","A":"‘(소수)÷(자연수), ‘(자연수)÷(소수)’, ‘(소수)÷(소수)’를 계산하고, 계산 결과가 타당한지를 어림을 이용하여 설명할 수 있다.","B":"‘(소수)÷(자연수)’, ‘(자연수)÷(소수)’, ‘(소수)÷(소수)’의 계산 원리를 탐구하고, 그 계산을 할 수 있다.","C":"안내된 절차에 따라 간단한 ‘(소수)÷(자연수)’, ‘(자연수)÷(소수)’, ‘(소수)÷(소수)’를 계산할 수 있다.","p":72,"sr":"3-01"},{"c":"[6수02-01]","b":2,"s":3,"a":"변화와 관계","ak":"변화와관계","t":"한 양이 변할 때 다른 양이 그에 종속하여 변하는 대응 관계를 나타낸 표에서 규칙을 찾아 설명하고, □, △ 등을 사용하여 식으로 나타낼 수 있다.","A":"대응 관계를 나타낸 표에서 규칙을 찾아 □, △ 등을 사용하여 식으로 나타내고, 그 방법과 수학적 표현의 편리함을 설명할 수 있다.","B":"대응 관계를 나타낸 표에서 규칙을 찾아 □, △ 등을 사용한 식으로 나타내고, 그 과정에서 수학적 표현의 편리함을 안다.","C":"안내된 절차에 따라 대응 관계를 나타낸 표에서 규칙을 찾고, □, △ 등을 사용한 식을 완성할 수 있다.","p":72,"sr":"3-02"},{"c":"[6수02-02]","b":2,"s":3,"a":"변화와 관계","ak":"변화와관계","t":"두 양의 크기를 비교하는 상황을 통해 비의 개념을 이해하고, 두 양의 관계를 비로 나타낼 수 있다.","A":"비가 적용되는 간단한 상황에서 두 양의 크기를 비교하여 비로 나타내고, 그 과정에서 수학의 유용성을 인식한다.","B":"비의 개념을 이해하고, 두 양의 크기를 비교하여 비로 나타낼 수 있다.","C":"안내된 절차에 따라 두 양의 크기를 비교하여 비로 나타낼 수 있다.","p":73,"sr":"3-02"},{"c":"[6수02-03]","b":2,"s":3,"a":"변화와 관계","ak":"변화와관계","t":"비율을 이해하고, 비율을 분수, 소수, 백분율로 나타낼 수 있다.","A":"비가 적용되는 간단한 상황에서 비율을 분수, 소수, 백분율로 나타내고, 그 과정에서 수학의 유용성을 인식한다.","B":"비율의 의미를 이해하고, 비율을 분수, 소수, 백분율로 나타낼 수 있다.","C":"안내된 절차에 따라 간단한 비율을 분수, 소수, 백분율로 나타낼 수 있다.","p":73,"sr":"3-02"},{"c":"[6수02-04]","b":2,"s":3,"a":"변화와 관계","ak":"변화와관계","t":"비례식을 알고, 그 성질을 이해하며, 이를 활용하여 간단한 비례식을 풀 수 있다.","A":"비례식의 성질에 대한 이해를 바탕으로 비례식을 풀고, 그 방법을 설명할 수 있다.","B":"비례식의 성질에 대한 이해를 바탕으로 간단한 비례식을 풀 수 있다.","C":"비례식을 알고, 안내된 절차에 따라 간단한 비례식을 풀 수 있다.","p":73,"sr":"3-02"},{"c":"[6수02-05]","b":2,"s":3,"a":"변화와 관계","ak":"변화와관계","t":"비례배분을 알고, 주어진 양을 비례배분 할 수 있다.","A":"비례배분에 대한 이해를 바탕으로 실생활 상황에서 주어진 양을 비례배분하고, 그 방법을 설명할 수 있다.","B":"비례배분을 알고, 주어진 양을 비례배분 할 수 있다.","C":"비례배분을 알고, 안내된 절차에 따라 간단한 비례배분을 할 수 있다.","p":73,"sr":"3-02"},{"c":"[6수03-01]","b":2,"s":3,"a":"도형과 측정","ak":"도형과측정","t":"도형의 합동을 이해하고, 합동인 도형의 성질을 탐구하고 설명할 수 있다.","A":"도형의 합동의 의미와 합동인 도형의 성질을 설명하고, 실생활에서 찾은 합동인 도형의 예에서 수학의 아름다움을 느낀다.","B":"도형의 합동을 이해하고, 합동인 도형의 성질을 탐구하며, 그 과정에서 수학의 아름다움을 느낀다.","C":"합동인 도형을 찾고, 직접 포개어 보는 활동을 통하여 합동인 도형에서 대응점, 대응변, 대응각을 찾을 수 있다.","p":74,"sr":"3-03"},{"c":"[6수03-02]","b":2,"s":3,"a":"도형과 측정","ak":"도형과측정","t":"실생활과 연결하여 선대칭도형과 점대칭도형을 이해하고 그릴 수 있다.","A":"선대칭도형과 점대칭도형을 그리고 그 방법을 설명하며, 실생활에서 찾은 선대칭도형과 점대칭도형의 예에서 수학의 아름다움을 느낀다.","B":"선대칭도형과 점대칭도형을 이해하고 그리며, 그 과정에서 수학의 아름다움을 느낀다.","C":"구체적 조작 활동을 통하여 선대칭도형과 점대칭도형을 찾거나 그릴 수 있다.","p":74,"sr":"3-03"},{"c":"[6수03-03]","b":2,"s":3,"a":"도형과 측정","ak":"도형과측정","t":"직육면체와 정육면체를 이해하고, 구성 요소와 성질을 탐구하고 설명할 수 있다.","A":"실생활에서 직육면체와 정육면체를 찾고, 구성 요소와 여러 가지 성질을 탐구하고 설명할 수 있다.","B":"직육면체와 정육면체에서 면, 모서리, 꼭짓점을 찾고, 성질을 설명할 수 있다.","C":"구체적 조작 활동을 통하여 직육면체와 정육면체에서 면, 모서리, 꼭짓점을 찾을 수 있다.","p":74,"sr":"3-03"},{"c":"[6수03-04]","b":2,"s":3,"a":"도형과 측정","ak":"도형과측정","t":"직육면체와 정육면체의 겨냥도와 전개도를 그릴 수 있다.","A":"직육면체와 정육면체의 겨냥도와 전개도를 그리고, 구성 요소와 성질을 이용하여 그 방법을 설명할 수 있다.","B":"직육면체와 정육면체의 겨냥도와 전개도를 그리고, 구체적 조작 활동을 통하여 전개도가 될 수 있는 것과 될 수 없는 것을 구별할 수 있다.","C":"일부가 주어진 직육면체와 정육면체의 겨냥도와 전개도를 완성할 수 있다.","p":74,"sr":"3-03"},{"c":"[6수03-05]","b":2,"s":3,"a":"도형과 측정","ak":"도형과측정","t":"각기둥과 각뿔을 이해하고, 구성 요소와 성질을 탐구하고 설명할 수 있다.","A":"실생활에서 각기둥과 각뿔을 찾고, 구성 요소와 여러 가지 성질을 탐구하고 설명할 수 있다.","B":"각기둥과 각뿔에서 면, 모서리, 꼭짓점을 찾고, 성질을 설명할 수 있다.","C":"구체적 조작 활동을 통하여 각기둥과 각뿔에서 면, 모서리, 꼭짓점을 찾을 수 있다.","p":75,"sr":"3-03"},{"c":"[6수03-06]","b":2,"s":3,"a":"도형과 측정","ak":"도형과측정","t":"각기둥의 전개도를 그릴 수 있다.","A":"각기둥의 전개도를 그리고, 구성 요소와 성질을 이용하여 그 방법을 설명할 수 있다.","B":"각기둥의 전개도를 그리고, 전개도가 될 수 있는 것과 될 수 없는 것을 구별할 수 있다.","C":"일부가 주어진 각기둥의 전개도를 완성할 수 있다.","p":75,"sr":"3-03"},{"c":"[6수03-07]","b":2,"s":3,"a":"도형과 측정","ak":"도형과측정","t":"원기둥, 원뿔, 구를 이해하고, 구성 요소와 성질을 탐구하고 설명할 수 있다.","A":"실생활에서 원기둥, 원뿔, 구를 찾고, 구성 요소와 여러 가지 성질을 탐구하고 설명할 수 있다.","B":"원기둥, 원뿔, 구에서 구성 요소를 찾고, 성질을 설명할 수 있다.","C":"구체적 조작 활동을 통하여 원기둥, 원뿔, 구에서 구성 요소를 찾을 수 있다.","p":75,"sr":"3-03"},{"c":"[6수03-08]","b":2,"s":3,"a":"도형과 측정","ak":"도형과측정","t":"원기둥의 전개도를 그릴 수 있다.","A":"원기둥의 전개도를 그리고, 그 방법을 설명할 수 있다.","B":"원기둥의 전개도를 그리고, 전개도가 될 수 있는 것과 될 수 없는 것을 구별할 수 있다.","C":"일부가 주어진 원기둥의 전개도를 완성할 수 있다.","p":75,"sr":"3-03"},{"c":"[6수03-09]","b":2,"s":3,"a":"도형과 측정","ak":"도형과측정","t":"쌓기나무로 만든 입체도형을 보고 사용된 쌓기나무의 개수를 구할 수 있다.","A":"쌓기나무로 만든 입체도형을 보고, 사용된 쌓기나무의 개수를 여러 가지 방법으로 구하고, 그 방법을 설명할 수 있다.","B":"쌓기나무로 만든 입체도형을 보고, 사용된 쌓기나무의 개수를 구할 수 있다.","C":"안내된 절차에 따라 쌓기나무로 만든 간단한 입체도형을 보고, 사용된 쌓기나무의 개수를 구할 수 있다.","p":76,"sr":"3-03"},{"c":"[6수03-10]","b":2,"s":3,"a":"도형과 측정","ak":"도형과측정","t":"쌓기나무로 만든 입체도형의 위, 앞, 옆에서 본 모양을 표현할 수 있고, 이러한 표현을 보고 입체도형의 모양을 추측할 수 있다.","A":"쌓기나무로 만든 입체도형의 위, 앞, 옆에서 본 모양을 표현하고, 이러한 표현을 보고 입체도형의 모양을 추론하며, 그 추론 과정을 설명할 수 있다.","B":"쌓기나무로 만든 입체도형의 위, 앞, 옆에서 본 모양을 표현하고, 이러한 표현을 보고 입체도형의 모양을 추론할 수 있다.","C":"안내된 절차에 따라 쌓기나무로 만든 간단한 입체도형의 위, 앞, 옆에서 본 모양을 표현하고, 이러한 표현을 보고 간단한 입체도형의 모양을 추측할 수 있다.","p":76,"sr":"3-03"},{"c":"[6수03-11]","b":2,"s":3,"a":"도형과 측정","ak":"도형과측정","t":"평면도형의 둘레를 이해하고, 기본적인 평면도형의 둘레를 구할 수 있다.","A":"여러 가지 평면도형의 둘레를 구하고, 그 방법을 설명할 수 있다.","B":"평면도형의 둘레를 알고, 기본적인 평면도형의 둘레를 구할 수 있다.","C":"안내된 절차에 따라 기본적인 평면도형의 둘레를 구할 수 있다.","p":76,"sr":"3-03"},{"c":"[6수03-12]","b":2,"s":3,"a":"도형과 측정","ak":"도형과측정","t":"넓이 단위 1cm², 1m², 1km²를 알며, 그 관계를 이해한다.","A":"1cm²와 1m², 1m²와 1km²사이의 관계를 설명하고, 실생활 상황에서 적절한 넓이 단위를 사용할 수 있다.","B":"넓이 단위 1cm², 1m², 1km²를 알고, 1cm²와 1m², 1m²와 1km²사이의 관계를 설명할 수 있다.","C":"넓이 단위 1cm², 1m², 1km²를 알고, 1m²가 몇 cm²인지, 1km²가 몇 m²인지를 안다.","p":76,"sr":"3-03"},{"c":"[6수03-13]","b":2,"s":3,"a":"도형과 측정","ak":"도형과측정","t":"직사각형과 정사각형의 넓이를 구하는 방법을 이해하고, 이를 구할 수 있다.","A":"직사각형과 정사각형의 넓이를 구하는 방법을 설명하고, 이를 이용하여 직사각형과 정사각형의 넓이를 구할 수 있다.","B":"직사각형과 정사각형의 넓이를 구하는 방법을 이해하고, 이를 이용하여 직사각형과 정사각형의 넓이를 구할 수 있다.","C":"안내된 절차에 따라 직사각형과 정사각형의 넓이를 구할 수 있다.","p":76,"sr":"3-03"},{"c":"[6수03-14]","b":2,"s":3,"a":"도형과 측정","ak":"도형과측정","t":"평행사변형, 삼각형, 사다리꼴, 마름모의 넓이를 구하는 방법을 다양하게 추론하고, 이와 관련된 문제를 해결할 수 있다.","A":"평행사변형, 삼각형, 사다리꼴, 마름모의 넓이를 구하는 여러 가지 방법을 추론하고, 그 추론 과정을 설명하며, 이를 이용하여 넓이를 구할 수 있다.","B":"평행사변형, 삼각형, 사다리꼴, 마름모의 넓이를 구하는 방법을 이해하고, 이를 이용하여 넓이를 구할 수 있다.","C":"안내된 절차에 따라 평행사변형, 삼각형, 사다리꼴, 마름모의 넓이를 구할 수 있다.","p":77,"sr":"3-03"},{"c":"[6수03-15]","b":2,"s":3,"a":"도형과 측정","ak":"도형과측정","t":"여러 가지 원 모양 물체의 원주와 지름을 측정하는 활동을 통하여, 원주율이 일정한 값임을 알고 그 근삿값을 사용할 수 있다.","A":"여러 가지 원 모양 물체의 원주와 지름을 측정하는 활동을 통하여 원주율의 의미를 설명하고, 원주율을 근삿값으로 나타내어 사용할 수 있다.","B":"여러 가지 원 모양 물체의 원주와 지름을 측정하는 활동을 통하여 원주율이 일정한 값임을 알고, 원주율의 근삿값을 사용할 수 있다.","C":"안내된 절차에 따라 원 모양 물체의 원주와 지름을 측정하는 활동을 통하여 원주율이 일정한 값임을 안다.","p":77,"sr":"3-03"},{"c":"[6수03-16]","b":2,"s":3,"a":"도형과 측정","ak":"도형과측정","t":"원주와 원의 넓이를 구하는 방법을 이해하고, 이를 구할 수 있다.","A":"원주와 원의 넓이를 구하는 방법을 설명하고, 이를 이용하여 원주와 원의 넓이를 구할 수 있다.","B":"원주와 원의 넓이를 구하는 방법을 이해하고, 이를 이용하여 원주와 원의 넓이를 구할 수 있다.","C":"안내된 절차에 따라 원주와 원의 넓이를 구할 수 있다.","p":77,"sr":"3-03"},{"c":"[6수03-17]","b":2,"s":3,"a":"도형과 측정","ak":"도형과측정","t":"직육면체와 정육면체의 겉넓이를 구하는 방법을 이해하고, 이를 구할 수 있다.","A":"직육면체와 정육면체의 겉넓이를 구하는 여러 가지 방법을 추론하고, 그 추론 과정을 설명하며, 이를 이용하여 직육면체와 정육면체의 겉넓이를 구할 수 있다.","B":"직육면체와 정육면체의 겉넓이를 구하는 방법을 이해하고, 이를 이용하여 직육면체와 정육면체의 겉넓이를 구할 수 있다.","C":"안내된 절차에 따라 직육면체와 정육면체의 겉넓이를 구할 수 있다.","p":77,"sr":"3-03"},{"c":"[6수03-18]","b":2,"s":3,"a":"도형과 측정","ak":"도형과측정","t":"부피 단위 1cm³, 1m³를 알며, 그 관계를 이해한다.","A":"1cm³와 1m³ 사이의 관계를 설명하고, 실생활 상황에서 적절한 부피 단위를 사용할 수 있다.","B":"부피 단위 1cm³, 1m³를 알고, 1cm³와 1m³ 사이의 관계를 설명할 수 있다.","C":"부피 단위 1cm³, 1m³를 알고, 1m³가 몇 cm³인지를 안다.","p":77,"sr":"3-03"},{"c":"[6수03-19]","b":2,"s":3,"a":"도형과 측정","ak":"도형과측정","t":"직육면체와 정육면체의 부피를 구하는 방법을 이해하고, 이를 구할 수 있다.","A":"직육면체와 정육면체의 부피를 구하는 방법을 추론하고, 그 추론 과정을 설명하며, 이를 이용하여 부피를 구할 수 있다.","B":"직육면체와 정육면체의 부피를 구하는 방법을 이해하고, 이를 이용하여 직육면체와 정육면체의 부피를 구할 수 있다.","C":"안내된 절차에 따라 직육면체와 정육면체의 부피를 구할 수 있다.","p":78,"sr":"3-03"},{"c":"[6수04-01]","b":2,"s":3,"a":"자료와 가능성","ak":"자료와가능성","t":"평균의 의미를 알고, 자료를 수집하여 평균을 구하고 해석할 수 있다.","A":"평균의 의미와 유용성을 인식하고, 여러 집단의 자료를 수집하여 평균을 구하고 해석할 수 있다.","B":"평균의 의미를 알고, 주어진 자료의 평균을 구하고 해석할 수 있다.","C":"간단한 자료의 평균을 구할 수 있다.","p":78,"sr":"3-04"},{"c":"[6수04-02]","b":2,"s":3,"a":"자료와 가능성","ak":"자료와가능성","t":"자료를 수집하여 띠그래프나 원그래프로 나타내고 해석할 수 있다.","A":"자료를 수집하여 띠그래프나 원그래프로 나타내고, 그래프를 해석하며, 그 과정에서 비율그래프의 필요성을 안다.","B":"주어진 자료를 띠그래프나 원그래프로 나타내고, 그래프를 해석할 수 있다.","C":"안내된 절차에 따라 자료를 띠그래프나 원그래프로 나타내고, 그래프에서 간단한 사실을 찾을 수 있다.","p":78,"sr":"3-04"},{"c":"[6수04-03]","b":2,"s":3,"a":"자료와 가능성","ak":"자료와가능성","t":"탐구 문제를 설정하고, 그에 맞는 자료를 수집, 정리하여 적절한 그래프로 나타내고 해석할 수 있다.","A":"탐구 문제를 설정하고, 그에 맞는 자료를 수집, 정리하여 적절한 그래프로 나타내며, 그래프를 해석할 수 있다.","B":"탐구 문제에 맞는 자료를 수집, 정리하여 적절한 그래프로 나타내고, 그래프를 해석할 수 있다.","C":"안내된 절차에 따라 자료를 적절한 그래프로 나타내고, 그래프에서 간단한 사실을 찾을 수 있다.","p":78,"sr":"3-04"},{"c":"[6수04-04]","b":2,"s":3,"a":"자료와 가능성","ak":"자료와가능성","t":"사건이 일어날 가능성을 말로 표현하고 비교할 수 있다.","A":"실생활에서 여러 가지 사건이 일어날 가능성을 말로 표현하고, 가능성을 비교하여 설명할 수 있다.","B":"주어진 사건이 일어날 가능성을 말로 표현하고, 가능성을 비교할 수 있다.","C":"안내된 절차에 따라 주어진 사건이 일어날 가능성을 말로 표현할 수 있다.","p":79,"sr":"3-04"},{"c":"[6수04-05]","b":2,"s":3,"a":"자료와 가능성","ak":"자료와가능성","t":"사건이 일어날 가능성을 수로 나타낼 수 있다.","A":"실생활의 간단한 사건에 대하여 사건이 일어날 가능성을 수로 표현하고, 그 이유를 설명할 수 있다.","B":"실생활의 간단한 사건에 대하여 사건이 일어날 가능성을 수로 표현할 수 있다.","C":"안내된 절차에 따라 간단한 사건에 대하여 사건이 일어날 가능성을 0, , 1로 구분할 수 있다.","p":79,"sr":"3-04"},{"c":"[6수04-06]","b":2,"s":3,"a":"자료와 가능성","ak":"자료와가능성","t":"자료를 이용하여 가능성을 예상하고, 가능성에 근거하여 적절한 판단을 내릴 수 있다.","A":"간단한 실험 결과를 나타낸 자료를 보고 가능성을 예상하고, 가능성에 근거하여 적절한 판단을 내릴 수 있다.","B":"간단한 실험 결과를 나타낸 자료를 보고 가능성을 예상할 수 있다.","C":"안내된 절차에 따라 간단한 실험 결과를 나타낸 자료를 보고 가능성을 예상할 수 있다.","p":79,"sr":"3-04"},{"c":"[6과01-01]","b":2,"s":4,"a":"지층과 화석","ak":"지층과화석","t":"지층의 특징을 알고, 지층의 형성 과정을 모형으로 표현할 수 있다.","A":"여러 지층을 관찰하여 지층의 공통적인 특징을 알고, 지층의 형성 과정을 모형으로 표현하여 설명할 수 있다.","B":"지층을 관찰하여 특징을 말하고, 지층을 모형으로 표현할 수 있다.","C":"지층을 관찰하여 지층의 두께나 색이 서로 다름을 말할 수 있다.","p":114},{"c":"[6과01-02]","b":2,"s":4,"a":"지층과 화석","ak":"지층과화석","t":"지층이 퇴적암으로 이루어짐을 알고, 퇴적암을 알갱이의 크기에 따라 분류할 수 있다.","A":"지층이 퇴적암으로 이루어짐을 알고, 이암, 사암, 역암을 관찰하여 알갱이의 크기에 따라 퇴적암을 분류할 수 있다.","B":"이암, 사암, 역암이 퇴적암이라는 것을 알고, 이를 관찰하여 알갱이의 크기를 비교할 수 있다.","C":"이암, 사암, 역암을 관찰하고, 알갱이의 크기가 다르다는 것을 말할 수 있다.","p":114,"q":["이암, 사암, 역암 관찰하기"]},{"c":"[6과01-03]","b":2,"s":4,"a":"지층과 화석","ak":"지층과화석","t":"화석의 생성 과정을 모형으로 설명하고, 지구의 과거 생물과 환경을 추리하는 활동을 통해 화석의 가치를 인식할 수 있다.","A":"화석을 관찰하고 화석의 생성 과정을 모형으로 표현하며, 지구의 과거 생물과 환경을 추리하는 활동을 통해 화석의 가치를 인식한다.","B":"화석의 생성 과정을 모형으로 설명하고, 화석을 관찰하여 지구의 과거 생물의 모습을 추리할 수 있다.","C":"여러 가지 화석을 관찰하고 화석에 관심을 가진다.","p":114,"q":["화석을 관찰하고 화석 모형 만들기"]},{"c":"[6과02-01]","b":2,"s":4,"a":"빛의 성질","ak":"빛의성질","t":"물체를 보기 위해서 빛이 있어야 함을 알고, 빛의 성질에 대해 흥미를 느낄 수 있다.","A":"어둠상자 속 물체 관찰하기를 통해 물체를 보기 위해서는 빛이 필요하다는 결론을 도출하고, 빛의 성질을 탐구하는 활동에 적극적으로 참여한다.","B":"어둠상자 속 물체 관찰하기를 통해 물체는 빛이 있어야 볼 수 있음을 말할 수 있다.","C":"빛에 의한 현상에 대해 흥미를 가진다.","p":115,"q":["어둠상자 속의 물체 관찰하기"]},{"c":"[6과02-02]","b":2,"s":4,"a":"빛의 성질","ak":"빛의성질","t":"빛이 나아가는 현상을 관찰하여 빛이 직진, 반사, 굴절하는 성질이 있음을 말할 수 있다.","A":"빛이 나아가는 다양한 현상으로부터 빛이 직진, 반사, 굴절하는 성질이 있음을 추리할 수 있다.","B":"빛이 공기 중이나 평면거울, 렌즈를 통해 나아가는 모습을 관찰하고, 이를 빛의 직진, 반사, 굴절과 관련지을 수 있다.","C":"직진하던 빛이 물체를 만나면 빛의 경로가 바뀜을 말할 수 있다.","p":115,"q":["평면거울에서 빛의 반사 실험하기","렌즈를 이용하여 빛의 굴절 실험하기"]},{"c":"[6과02-03]","b":2,"s":4,"a":"빛의 성질","ak":"빛의성질","t":"거울과 렌즈의 쓰임새를 조사하고 거울이나 렌즈를 이용한 장치를 창의적으로 만들 수 있다.","A":"일상생활에서의 거울과 렌즈의 쓰임새를 조사하여 빛의 성질과 관련지어 설명하고, 거울이나 렌즈를 이용한 창의적인 장치를 만들 수 있다.","B":"일상생활에서의 거울과 렌즈의 쓰임새를 조사하고, 빛의 성질과 관련지을 수 있다.","C":"일상생활에서 거울과 렌즈의 쓰임새를 조사하여 찾을 수 있다.","p":115},{"c":"[6과03-01]","b":2,"s":4,"a":"용해와 용액","ak":"용해와용액","t":"용해 현상의 의미를 알고, 용질의 종류와 물의 온도에 따라 물에 녹는 용질의 양이 달라짐을 비교할 수 있다.","A":"용해 현상의 의미를 이해하고, 용질의 종류와 물의 온도에 따라 물에 녹는 용질의 양이 달라짐을 비교하여 물에 녹는 용질의 양에 영향을 주는 요인을 찾을 수 있다.","B":"용해 현상의 의미를 말하고, 용질의 종류 또는 물의 온도에 따라 물에 녹는 용질의 양이 달라짐을 비교할 수 있다.","C":"물에 녹는 물질이 있음을 이해하고, 용해 전과 후의 무게 변화를 설명할 수 있다.","p":116,"q":["용해 전과 후의 무게 측정하기","물에 녹는 용질의 양에 영향을 미치는 요인 탐구하기"]},{"c":"[6과03-02]","b":2,"s":4,"a":"용해와 용액","ak":"용해와용액","t":"용질이나 용매의 양에 따라 용액의 진하기가 달라짐을 관찰하고, 용액의 상대적인 진하기를 비교할 수 있다.","A":"용질이나 용매의 양에 따라 용액의 진하기가 달라짐을 이해하고, 용액의 진하기를 상대적으로 비교할 수 있다.","B":"용질이나 용매의 양에 따라 용액의 진하기가 달라짐을 알고, 물체의 뜨는 정도로 용액의 진하기를 비교할 수 있다.","C":"용질이나 용매의 양에 따라 용액의 진하기가 달라짐을 말할 수 있다.","p":116,"q":["진하기가 다른 용액에서 물체의 뜨는 정도 비교하기"]},{"c":"[6과03-03]","b":2,"s":4,"a":"용해와 용액","ak":"용해와용액","t":"일상생활에서 용액이 쓰이는 사례를 조사하여 용액의 필요성을 알리는 자료를 만들고 공유할 수 있다.","A":"일상생활에서 용액이 쓰이는 사례를 조사하고, 용액의 필요성을 알리는 자료를 만들어 공유할 수 있다.","B":"일상생활에서 용액이 쓰이는 사례를 찾아보고, 용액의 필요성을 알리는 자료를 만들 수 있다.","C":"일상생활에서 용액이 다양하게 쓰이고 있는 사례를 찾아 말할 수 있다.","p":116},{"c":"[6과04-01]","b":2,"s":4,"a":"우리 몸의 구조와 기능","ak":"우리몸의구조와기능","t":"뼈와 근육의 생김새를 관찰하고 모형을 만들어 몸이 움직이는 원리를 설명할 수 있다.","A":"뼈와 근육의 생김새를 관찰하고 모형을 만들어 몸이 움직이는 원리를 설명하며, 운동할 때 우리 몸에서 일어나는 변화를 관찰하여 설명할 수 있다.","B":"뼈와 근육이 움직이는 것을 관찰하고, 모형을 만들어 몸이 움직이는 것을 설명할 수 있다.","C":"뼈와 근육의 생김새를 관찰하고 모형을 만들 수 있다.","p":117,"q":["운동할 때 몸에서 일어나는 변화 관찰하기"]},{"c":"[6과04-02]","b":2,"s":4,"a":"우리 몸의 구조와 기능","ak":"우리몸의구조와기능","t":"소화, 순환, 호흡, 배설 기관의 구조와 기능을 알아보고, 우리 몸의 여러 기관이 서로 관련되어 있음을 설명할 수 있다.","A":"소화, 순환, 호흡, 배설 기관의 종류, 위치, 생김새, 기능을 알고, 우리 몸의 여러 기관이 서로 관련되어 있음을 설명할 수 있다.","B":"소화, 순환, 호흡, 배설 기관의 구조와 기능을 설명할 수 있다.","C":"소화, 순환, 호흡, 배설 기관의 종류를 말할 수 있다.","p":117},{"c":"[6과04-03]","b":2,"s":4,"a":"우리 몸의 구조와 기능","ak":"우리몸의구조와기능","t":"우리 몸의 여러 기관과 관련된 질병을 조사하고, 건강을 유지하기 위한 생활 방식을 실천할 수 있다.","A":"우리 몸의 여러 기관과 관련된 질병을 조사하고, 생활 속에서 과학이 건강에 활용됨을 인식하여 건강을 유지하기 위한 생활 방식을 실천할 수 있다.","B":"우리 몸의 여러 기관과 관련된 질병을 조사하고, 건강에 관심을 가지며, 건강을 유지하기 위한 생활 방식을 발표할 수 있다.","C":"우리 몸의 여러 기관과 관련된 질병을 조사할 수 있다.","p":117,"note":"내용 체계표의 가치·태도 요소를 포함하여 성취수준 개발"},{"c":"[6과05-01]","b":2,"s":4,"a":"혼합물의 분리","ak":"혼합물의분리","t":"알갱이의 크기가 다른 고체 혼합물과 골고루 섞이지 않는 액체 혼합물을 분리할 수 있다.","A":"혼합물의 의미를 이해하고, 알갱이의 크기가 다른 고체 혼합물과 골고루 섞이지 않는 액체 혼합물을 분리할 수 있다.","B":"알갱이의 크기가 다른 고체 혼합물을 분리하고, 액체 혼합물의 사례와 혼합물의 의미를 설명할 수 있다.","C":"알갱이의 크기가 다른 고체 혼합물, 골고루 섞이지 않는 액체 혼합물의 분리 과정을 말할 수 있다.","p":118,"q":["모래와 자갈의 혼합물 분리하기","물과 기름의 혼합물 분리하기"]},{"c":"[6과05-02]","b":2,"s":4,"a":"혼합물의 분리","ak":"혼합물의분리","t":"물에 용해되는 성질을 이용하여 고체 혼합물을 분리하고, 물을 증발시켜 물에 용해된 고체 물질을 분리할 수 있다.","A":"물에 용해되는 성질과 물이 증발하는 성질을 알고, 이를 이용하여 혼합물을 분리할 수 있다.","B":"물에 용해되는 성질과 물이 증발하는 성질을 이용하여 혼합물 일부를 분리할 수 있다.","C":"물에 용해되는 성질과 물이 증발하는 성질을 이용하여 혼합물을 분리할 수 있음을 말할 수 있다.","p":118,"q":["소금과 모래의 혼합물 분리하기"]},{"c":"[6과05-03]","b":2,"s":4,"a":"혼합물의 분리","ak":"혼합물의분리","t":"지속가능한 삶을 위한 과학기술 사례 중 혼합물의 분리를 이용한 장치를 조사하여 공유할 수 있다.","A":"지속가능한 삶을 위한 과학기술 사례 중 혼합물의 분리를 이용한 장치를 조사하고, 이러한 장치가 인간의 삶에 어떻게 기여하는지 공유할 수 있다.","B":"지속가능한 삶을 위한 과학기술 사례를 조사하고, 혼합물의 분리를 이용한 장치를 구분할 수 있다.","C":"일상생활에서 혼합물을 분리하는 사례를 말할 수 있다.","p":118},{"c":"[6과06-01]","b":2,"s":4,"a":"날씨와 우리 생활","ak":"날씨와우리생활","t":"기상 요소를 조사하고, 날씨가 우리 생활에 주는 영향을 인식할 수 있다.","A":"기온, 바람, 습도, 구름의 양, 강수량 등의 기상 요소를 조사하여, 날씨가 우리 생활에 주는 영향을 예를 들어 설명할 수 있다.","B":"기온, 바람, 습도, 구름의 양, 강수량 등의 기상 요소가 우리 생활에 주는 영향을 조사할 수 있다.","C":"날씨가 우리 생활에 주는 영향을 말할 수 있다.","p":119},{"c":"[6과06-02]","b":2,"s":4,"a":"날씨와 우리 생활","ak":"날씨와우리생활","t":"이슬, 안개, 구름을 관찰하고, 공통점과 차이점을 찾을 수 있다.","A":"이슬, 안개, 구름을 관찰하고, 이슬과 안개 발생 실험을 통해 이슬과 안개의 공통점과 차이점을 설명할 수 있다.","B":"이슬, 안개, 구름의 공통점과 차이점을 찾을 수 있다.","C":"이슬, 안개, 구름을 구별할 수 있다.","p":119,"q":["이슬, 안개 발생 실험하기"]},{"c":"[6과06-03]","b":2,"s":4,"a":"날씨와 우리 생활","ak":"날씨와우리생활","t":"고기압과 저기압의 분포에 따른 날씨의 특징을 기상 요소로 표현할 수 있다.","A":"바람 발생 모형실험을 통해 고기압에서 저기압으로 부는 바람의 방향을 설명하고, 고기압과 저기압의 분포에 따른 날씨의 특징을 기상 요소로 표현할 수 있다.","B":"바람 발생 모형실험을 통해 고기압에서 저기압으로 부는 바람의 방향을 설명할 수 있다.","C":"고기압과 저기압의 의미를 말할 수 있다.","p":119,"q":["바람 발생에 대한 모형실험하기"]},{"c":"[6과07-01]","b":2,"s":4,"a":"열과 우리 생활","ak":"열과우리생활","t":"물체의 따뜻하고 차가운 정도를 온도로 표현함을 알고, 온도계를 이용하여 온도를 측정할 수 있다.","A":"물체의 따뜻하고 차가운 정도를 온도로 표현함을 이해하고, 온도계의 올바른 사용법을 익혀 여러 가지 물체나 장소의 온도를 측정할 수 있다.","B":"물체의 따뜻하고 차가운 정도를 온도로 표현하고, 온도계의 사용법을 말할 수 있다.","C":"온도가 물체의 따뜻하고 차가운 정도를 나타냄을 알고, 온도계가 온도를 측정하는 도구임을 말할 수 있다.","p":120},{"c":"[6과07-02]","b":2,"s":4,"a":"열과 우리 생활","ak":"열과우리생활","t":"온도가 다른 두 물체가 접촉했을 때 두 물체의 온도 변화를 관찰하고 그 원인을 추리할 수 있다.","A":"온도가 다른 두 물체가 접촉했을 때 두 물체의 온도 변화를 관찰하고, 두 물체의 온도 변화를 두 물체 사이의 열 이동으로 추리하여 설명할 수 있다.","B":"온도가 다른 두 물체가 접촉했을 때 두 물체의 온도를 관찰하고, 두 물체의 시간에 따른 온도 변화의 특징을 설명할 수 있다.","C":"온도가 다른 두 물체가 접촉했을 때 두 물체의 온도가 변한다는 사실을 말할 수 있다.","p":120,"q":["온도가 다른 두 물체가 접촉할 때 두 물체의 온도 변화 측정하기"]},{"c":"[6과07-03]","b":2,"s":4,"a":"열과 우리 생활","ak":"열과우리생활","t":"주위에서 열의 이동으로 나타나는 현상을 관찰하여 열의 이동 방식이 다양함을 설명할 수 있다.","A":"주위에서 열의 이동으로 나타나는 다양한 현상을 관찰하여 열의 이동 방식에 따라 분류하고, 열이 이동하는 여러 방식의 특징을 비교할 수 있다.","B":"열의 이동으로 나타나는 현상을 관찰하여 열의 이동 방식이 다양함을 설명할 수 있다.","C":"주위에서 열의 이동으로 나타나는 현상들을 찾을 수 있다.","p":120,"q":["열이 이동하는 여러 방식의 특징 비교하기"]},{"c":"[6과07-04]","b":2,"s":4,"a":"열과 우리 생활","ak":"열과우리생활","t":"일상생활에서 단열을 이용하는 사례를 조사하고, 온도를 오랫동안 일정하게 유지할 수 있는 장치를 창의적으로 만들 수 있다.","A":"일상생활에서 단열을 이용하는 사례를 조사하여 열의 이동 방식과 관련지어 설명하고, 열의 이동 방식을 고려하여 온도를 오랫동안 일정하게 유지할 수 있는 장치를 만들 수 있다.","B":"일상생활에서 단열이 이용되는 예를 조사하고, 온도를 일정하게 유지할 수 있는 장치를 만들 수 있다.","C":"일상생활에서 온도를 일정하게 유지할 수 있는 장치의 예를 찾아 필요성을 말할 수 있다.","p":120},{"c":"[6과08-01]","b":2,"s":4,"a":"자원과 에너지","ak":"자원과에너지","t":"우리가 생활에서 이용하는 다양한 자원을 조사하고, 자원의 유한함을 설명할 수 있다.","A":"일상생활에서 이용하는 다양한 자원을 조사하고, 자원의 유한함과 효율적 사용을 관련지어 설명할 수 있다.","B":"주위에서 이용하는 자원을 조사하고, 자원이 유한하다는 것을 말할 수 있다.","C":"주위에서 이용하고 있는 자원의 예를 말할 수 있다.","p":121},{"c":"[6과08-02]","b":2,"s":4,"a":"자원과 에너지","ak":"자원과에너지","t":"재생에너지의 종류를 조사하고, 에너지를 지속가능하게 이용하는 방법에 관심을 갖는다.","A":"주위에서 활용되는 재생에너지의 종류를 조사하고, 에너지의 지속가능한 이용 방법에 관심을 가진다.","B":"재생에너지의 종류와 활용되는 예를 조사하여 말할 수 있다.","C":"재생에너지의 의미를 말할 수 있다.","p":121},{"c":"[6과08-03]","b":2,"s":4,"a":"자원과 에너지","ak":"자원과에너지","t":"자원과 에너지의 효율적인 이용 방법에 대해 탐색하고, 생활 속에서 실천할 수 있는 다양한 사례를 공유할 수 있다.","A":"자원과 에너지를 효율적으로 이용하는 다양한 방법을 탐색하고, 생활 속 다양한 실천 사례를 공유할 수 있다.","B":"자원과 에너지를 효율적으로 이용하는 방법을 조사하고, 자원과 에너지를 아끼기 위한 실천 사례를 말할 수 있다.","C":"자원과 에너지의 소중함과 효율적 활용의 필요성을 말할 수 있다.","p":121,"q":["효율적으로 에너지를 이용하는 집 모형의 효과 탐구하기"],"note":"내용 체계표의 가치·태도 요소를 포함하여 성취수준 개발"},{"c":"[6과09-01]","b":2,"s":4,"a":"산과 염기","ak":"산과염기","t":"여러 가지 용액에 지시약을 넣었을 때의 변화를 관찰하여 용액을 산성 용액과 염기성 용액으로 분류할 수 있다.","A":"여러 가지 용액에 지시약을 넣었을 때 나타나는 색깔 변화를 관찰하여 산성 용액과 염기성 용액으로 분류할 수 있다.","B":"용액에 지시약을 넣었을 때 나타나는 색깔 변화를 관찰하여 같은 성질을 지닌 용액끼리 모을 수 있다.","C":"용액에 지시약을 넣었을 때 나타나는 색깔 변화를 관찰할 수 있다.","p":122,"q":["지시약을 이용하여 용액 분류하기"]},{"c":"[6과09-02]","b":2,"s":4,"a":"산과 염기","ak":"산과염기","t":"산성 용액과 염기성 용액의 성질을 관찰하고, 산성 용액과 염기성 용액을 섞을 때 용액의 성질 변화를 실험을 통해 추론할 수 있다.","A":"산성 용액과 염기성 용액을 관찰하여 성질을 설명하고, 산성 용액과 염기성 용액을 섞었을 때 나타나는 지시약의 색깔 변화로 용액의 성질 변화를 설명할 수 있다.","B":"산성 용액과 염기성 용액의 성질을 관찰하여 설명하고, 지시약을 이용하여 산성 용액과 염기성 용액을 섞었을 때 나타나는 용액의 색깔 변화를 기술할 수 있다.","C":"산성 용액과 염기성 용액의 성질을 관찰하여 설명할 수 있다.","p":122,"q":["묽은 염산과 묽은 수산화 나트륨 용액을 섞을 때 용액의 색깔 변화 관찰하기"]},{"c":"[6과09-03]","b":2,"s":4,"a":"산과 염기","ak":"산과염기","t":"우리 주변에서 산성 용액과 염기성 용액을 이용하는 예를 찾아서 설명할 수 있다.","A":"우리 주변에서 산성 용액과 염기성 용액을 이용하는 사례를 조사하여 설명할 수 있다.","B":"우리 주변에서 산성 용액이나 염기성 용액을 이용하는 사례를 조사하여 말할 수 있다.","C":"산성 용액이나 염기성 용액을 이용하는 사례를 말할 수 있다.","p":122},{"c":"[6과09-04]","b":2,"s":4,"a":"산과 염기","ak":"산과염기","t":"산성화로 인한 환경의 피해 사례를 소개하는 자료를 만들고 공유할 수 있다.","A":"산성화로 인한 환경 피해의 심각성을 인식하고, 문제 해결을 위해 관련 사례를 소개하는 자료를 만들어 공유할 수 있다.","B":"산성화로 인한 환경 피해 사례를 조사하고, 산성화로 인한 환경 문제에 관심을 가진다.","C":"산성화로 인해 환경에 피해가 생길 수 있음을 말할 수 있다.","p":122,"note":"내용 체계표의 가치·태도 요소를 포함하여 성취수준 개발"},{"c":"[6과10-01]","b":2,"s":4,"a":"물체의 운동","ak":"물체의운동","t":"운동하는 물체는 시간에 따라 위치가 변화함을 알고 그 변화를 표현할 수 있다.","A":"운동하는 물체의 사례를 관찰하여 운동하는 물체는 시간에 따라 위치가 변한다는 특징을 이해하고, 그 변화를 표현할 수 있다.","B":"운동하는 물체의 사례를 관찰하여 운동하는 물체는 시간에 따라 위치가 변함을 말할 수 있다.","C":"운동하는 물체의 위치가 변함을 말할 수 있다.","p":123,"q":["운동하는 물체의 공통된 특징 탐구하기"]},{"c":"[6과10-02]","b":2,"s":4,"a":"물체의 운동","ak":"물체의운동","t":"물체의 이동 거리와 걸린 시간을 측정하여 속력을 구하고 빠르기를 비교할 수 있다.","A":"여러 가지 물체들의 이동 거리와 걸린 시간을 측정하여 물체들의 속력을 비교하고, 단위와 함께 표현할 수 있다.","B":"같은 시간 동안 물체가 이동한 거리를 측정하여 운동하는 물체의 빠르기를 비교할 수 있다.","C":"운동하는 물체의 이동 거리와 걸린 시간을 측정할 수 있다.","p":123,"q":["같은 시간 동안에 물체가 이동한 거리 비교하기"]},{"c":"[6과10-03]","b":2,"s":4,"a":"물체의 운동","ak":"물체의운동","t":"속력과 관련된 안전 수칙과 안전장치를 조사한 결과를 공유하고 일상생활에서 교통안전을 실천할 수 있다.","A":"속력과 관련된 안전 수칙과 안전장치를 조사하여 공유하고, 조사한 내용을 바탕으로 일상생활에서 교통안전을 실천한다.","B":"속력과 관련된 안전 수칙과 안전장치를 조사하고, 교통안전을 위해 실천할 수 있는 행동을 말할 수 있다.","C":"일상생활에서 속력과 관련된 안전 수칙과 안전장치를 찾을 수 있다.","p":123},{"c":"[6과11-01]","b":2,"s":4,"a":"식물의 구조와 기능","ak":"식물의구조와기능","t":"생물을 이루고 있는 기본 단위인 세포를 현미경으로 관찰할 수 있다.","A":"생물을 이루고 있는 기본 단위가 세포임을 이해하고 세포 영구 표본을 이용하여 현미경으로 세포의 핵, 세포벽 등을 관찰할 수 있다.","B":"식물 세포 영구 표본을 이용하여 현미경으로 세포의 핵을 찾을 수 있다.","C":"현미경 관찰을 통해 생물을 이루고 있는 기본 단위가 세포임을 말할 수 있다.","p":124},{"c":"[6과11-02]","b":2,"s":4,"a":"식물의 구조와 기능","ak":"식물의구조와기능","t":"식물의 각 기관의 구조를 관찰하고, 기능을 알아보는 실험을 수행하여 식물 각 기관의 구조와 기능을 설명할 수 있다.","A":"식물의 각 기관의 구조를 관찰하고 줄기에서의 물의 이동, 증산 작용 실험, 광합성 산물을 확인하는 실험을 통해 뿌리, 줄기, 잎, 꽃의 기능을 이해하여 각각의 기관이 연결되어 있음을 설명할 수 있다.","B":"식물의 각 기관의 구조를 관찰하고 기능을 알아보는 실험을 통해 식물의 뿌리, 줄기, 잎, 꽃의 구조와 각각의 기능을 말할 수 있다.","C":"식물을 관찰하여 뿌리, 줄기, 잎, 꽃으로 구분할 수 있다.","p":124,"q":["줄기에서 물의 이동 실험하기","광합성 산물 확인 실험하기","증산 작용 확인 실험하기"]},{"c":"[6과11-03]","b":2,"s":4,"a":"식물의 구조와 기능","ak":"식물의구조와기능","t":"여러 가지 식물의 특징을 설명하는 자료를 만들어 공유할 수 있다.","A":"여러 가지 식물의 구조와 기능을 관찰하거나 조사하고, 이를 설명하는 자료를 만들어 발표하고 공유할 수 있다.","B":"여러 가지 식물의 특징을 설명하는 자료를 만들 수 있다.","C":"여러 가지 식물의 특징을 말할 수 있다.","p":124},{"c":"[6과12-01]","b":2,"s":4,"a":"지구의 운동","ak":"지구의운동","t":"하루 동안 태양과 별을 관찰하여 위치 변화의 규칙성을 찾을 수 있다.","A":"남쪽 하늘을 바라보는 관측자 관점에서 하루 동안 태양과 별을 관찰하여 기록하고, 위치 변화의 규칙성을 찾아 설명할 수 있다.","B":"남쪽 하늘을 바라보는 관측자 관점에서 하루 동안 태양과 별을 관찰하고 기록하여, 하루 동안 천체의 위치가 달라짐을 설명할 수 있다.","C":"하루 동안 태양과 별의 위치가 달라짐을 말할 수 있다.","p":125},{"c":"[6과12-02]","b":2,"s":4,"a":"지구의 운동","ak":"지구의운동","t":"지구의 자전을 알고, 낮과 밤이 생기는 이유를 설명할 수 있다.","A":"지구가 자전축을 중심으로 하루에 한 바퀴 도는 것을 알고, 낮과 밤이 생기는 이유를 모형실험을 통해 지구의 자전으로 설명할 수 있다.","B":"모형실험을 통해 낮과 밤이 생기는 이유를 지구의 자전으로 설명할 수 있다.","C":"지구의 자전에 따라 낮과 밤이 생기는 현상을 관찰할 수 있다.","p":125,"q":["낮과 밤이 생기는 이유 모형실험하기"]},{"c":"[6과12-03]","b":2,"s":4,"a":"지구의 운동","ak":"지구의운동","t":"지구의 공전을 알고, 계절에 따라 달라지는 별자리를 관찰할 수 있다.","A":"지구의 공전을 알고, 천체 관측 프로그램을 이용하여 계절에 따라 달라지는 별자리를 관찰하고 설명할 수 있다.","B":"천체 관측 프로그램을 이용하여 계절에 따라 달라지는 별자리를 관찰할 수 있다.","C":"계절에 따라 별자리가 달라진다는 것을 말할 수 있다.","p":125,"q":["천체 관측 프로그램을 이용하여 계절별 대표적인 별자리 관찰하기"]},{"c":"[6과13-01]","b":2,"s":4,"a":"계절의 변화","ak":"계절의변화","t":"태양 고도 측정기로 하루 동안 태양 고도, 그림자 길이, 기온을 측정하여 이들의 관계를 찾을 수 있다.","A":"하루 동안 태양 고도, 그림자 길이, 기온을 측정하고, 이들의 관계를 찾아 설명할 수 있다.","B":"하루 동안 태양 고도를 측정하고, 태양 고도의 변화를 설명할 수 있다.","C":"태양 고도의 의미를 이해하고, 태양 고도를 측정할 수 있다.","p":126,"q":["태양 고도 측정기 만들기"]},{"c":"[6과13-02]","b":2,"s":4,"a":"계절의 변화","ak":"계절의변화","t":"계절에 따른 태양의 남중 고도와 낮의 길이 사이의 관계를 자료에 근거하여 추론할 수 있다.","A":"디지털 자료를 활용하여 계절별 태양의 남중 고도, 낮의 길이를 조사하고, 자료에 근거하여 이들 사이의 관계를 추론할 수 있다.","B":"디지털 자료를 활용하여 계절별 태양의 남중 고도, 낮의 길이를 조사하고, 태양의 남중 고도에 따라 낮의 길이가 달라진다는 것을 설명할 수 있다.","C":"디지털 자료를 활용하여 계절별 태양의 남중 고도, 낮의 길이를 조사할 수 있다.","p":126,"q":["디지털 자료를 활용하여 계절별 태양의 남중 고도, 낮의 길이 관계 탐구하기"]},{"c":"[6과13-03]","b":2,"s":4,"a":"계절의 변화","ak":"계절의변화","t":"계절 변화의 원인을 지구의 자전축이 기울어진 채 공전하는 것으로 설명할 수 있다.","A":"계절 변화의 원인을 지구 자전축의 기울기와 지구의 공전에 따른 태양의 남중 고도 변화로 설명할 수 있다.","B":"계절의 변화가 지구의 자전축이 기울어진 채 공전하는 것과 관련이 있음을 말할 수 있다.","C":"계절 변화가 지구의 자전축 기울기와 관련 있다는 것을 말할 수 있다.","p":126},{"c":"[6과14-01]","b":2,"s":4,"a":"물질의 연소","ak":"물질의연소","t":"물질의 성질이 달라지는 변화와 달라지지 않는 변화를 관찰하여 비교할 수 있다.","A":"서로 다른 물질을 섞기 전과 후의 성질을 비교하여 물질의 성질이 달라지는 변화와 달라지지 않는 변화가 있음을 추론할 수 있다.","B":"서로 다른 물질을 섞은 후 나타나는 변화를 관찰하여 물질의 성질이 달라질 수 있음을 설명할 수 있다.","C":"서로 다른 물질을 섞었을 때 물질의 성질이 달라질 수 있음을 말할 수 있다.","p":127,"q":["서로 다른 물질을 섞었을 때 물질의 성질 변화 관찰하기"]},{"c":"[6과14-02]","b":2,"s":4,"a":"물질의 연소","ak":"물질의연소","t":"물질이 연소할 때 나타나는 공통적인 현상을 관찰하고, 연소의 조건을 찾을 수 있다.","A":"여러 연소 사례를 통해 물질이 탈 때 나타나는 공통적인 현상을 관찰하고, 연소에 필요한 조건을 설명할 수 있다.","B":"물질이 타는 여러 사례를 관찰하고, 공통적인 현상을 찾아 말할 수 있다.","C":"물질이 탈 때 나타나는 현상을 관찰하여 말할 수 있다.","p":127,"q":["양초와 알코올이 탈 때 나타나는 공통적인 현상 관찰하기"]},{"c":"[6과14-03]","b":2,"s":4,"a":"물질의 연소","ak":"물질의연소","t":"연소 전과 후의 물질을 비교하여 연소 과정에서 물질의 성질이 달라짐을 설명할 수 있다.","A":"연소 생성물을 확인하는 실험에서 연소 전과 후의 물질을 비교함으로써, 연소 과정에서 물질의 성질이 달라짐을 말할 수 있다.","B":"연소 생성물을 확인하는 실험에서 연소 전과 후의 물질을 비교할 수 있다.","C":"연소 후 생성되는 물질이 있음을 말할 수 있다.","p":127,"q":["연소 후 생성되는 물질 확인하는 실험하기"]},{"c":"[6과14-04]","b":2,"s":4,"a":"물질의 연소","ak":"물질의연소","t":"연소 과정에서 생성되는 물질로 인한 생태계의 피해 사례를 수집하고 분석하여 해결책을 제안하고 공유할 수 있다.","A":"연소 과정에서 생성된 물질로 인한 생태계의 피해 사례를 수집하여 분석하고, 해결책을 찾아 공유할 수 있다.","B":"연소 과정에서 생성되는 물질로 인한 생태계의 피해 사례를 수집하고 분석할 수 있다.","C":"연소 생성물로 인한 생태계 피해 사례가 있음을 말할 수 있다.","p":127},{"c":"[6과15-01]","b":2,"s":4,"a":"전기의 이용","ak":"전기의이용","t":"전지와 전구, 전선을 연결하여 전구에 불을 켜보고, 불이 켜지는 전기 회로의 특징을 말할 수 있다.","A":"전구에 불이 켜지는 전기 회로에서 전지, 전구, 전선의 연결 특징을 설명할 수 있다.","B":"전구에 불이 켜지는 전기 회로와 전구에 불이 켜지지 않는 전기 회로를 비교하여 차이점을 찾을 수 있다.","C":"전지, 전구, 전선을 연결하여 전구에 불을 켤 수 있다.","p":128,"q":["전구에 불이 켜지는 전기 회로와 불이 켜지지 않는 전기 회로 비교하기"]},{"c":"[6과15-02]","b":2,"s":4,"a":"전기의 이용","ak":"전기의이용","t":"전지 한 개를 연결한 전기 회로와 전지 두 개를 직렬연결한 전기 회로의 특징을 비교할 수 있다.","A":"전지 한 개를 연결한 전기 회로와 전지 두 개를 직렬연결한 전기 회로에 전구나 전동기 등의 전기 부품을 연결하여 보고, 전지를 직렬연결한 개수에 따른 회로의 특징을 서로 비교하여 설명할 수 있다.","B":"전지 한 개를 연결한 전기 회로와 전지 두 개를 직렬연결한 전기 회로에서 전구의 밝기를 비교할 수 있다.","C":"전지 한 개를 연결한 전기 회로와 전지 두 개를 직렬연결한 전기 회로를 만들 수 있다.","p":128,"q":["전지 한 개를 연결한 전기 회로와 전지 두 개를 직렬연결한 전기 회로에서 전구의 밝기 비교하기"]},{"c":"[6과15-03]","b":2,"s":4,"a":"전기의 이용","ak":"전기의이용","t":"전자석을 만들어 전자석의 성질을 탐색하고 전자석이 사용되는 예를 조사할 수 있다.","A":"전자석의 성질을 영구 자석과 비교하여 탐색하고, 일상생활에서 전자석이 사용되는 사례를 전자석의 성질과 관련지어 설명할 수 있다.","B":"실험을 통해 전자석의 세기와 방향을 바꾸는 방법을 찾고, 일상생활에서 전자석이 사용되는 예를 조사할 수 있다.","C":"전자석을 만들어 전기가 흐르면 자석의 성질을 갖는 것을 관찰할 수 있다.","p":128,"q":["전자석의 성질을 영구 자석과 비교하여 탐색하기"]},{"c":"[6과15-04]","b":2,"s":4,"a":"전기의 이용","ak":"전기의이용","t":"전기를 효율적이고 안전하게 사용하는 방법을 조사하여 실천 계획을 세우고 일상생활에서 실천할 수 있다.","A":"일상생활에서 효율적이고 안전한 전기 사용 방법에 관한 적절한 계획을 세워 실천할 수 있다.","B":"효율적이고 안전한 전기 사용 방법을 조사할 수 있다.","C":"효율적이고 안전한 전기 사용의 중요성을 인식한다.","p":128},{"c":"[6과16-01]","b":2,"s":4,"a":"과학과 나의 진로","ak":"과학과나의진로","t":"미래 사회에 일어날 수 있는 문제를 조사하고, 문제를 해결하는 데 과학이 기여할 수 있는 방법을 토의할 수 있다.","A":"미래 사회에 일어날 수 있는 문제를 조사하여 분석하고, 미래 사회 문제를 해결하는 데 과학이 기여하는 방법을 토의할 수 있다.","B":"미래 사회에 일어날 수 있는 문제를 해결하는 데 과학이 기여할 수 있는 방법을 말할 수 있다.","C":"미래 사회에 일어날 수 있는 문제를 해결하는 데 과학이 필요함을 말할 수 있다.","p":129},{"c":"[6과16-02]","b":2,"s":4,"a":"과학과 나의 진로","ak":"과학과나의진로","t":"다양한 진로가 과학과 관련됨을 알고, 자신의 진로를 과학과 관련지어 설명할 수 있다.","A":"다양한 진로와 과학과의 관련성을 조사하고, 나의 진로와 과학과의 관련성을 설명할 수 있다.","B":"다양한 진로와 과학과의 관련성을 조사하여 설명할 수 있다.","C":"다양한 진로와 과학의 관련성을 말할 수 있다.","p":129,"q":["우리의 진로에 영향을 미치는 과학적 요소 탐구하기"]},{"c":"[6실01-01]","b":2,"s":5,"a":"인간 발달과 주도적 삶","ak":"인간발달과주도적삶","t":"아동기의 발달 특징을 이해하고 성장발달에 필요한 조건과 방법을 탐색한다.","A":"아동기 발달 특징을 이해하고 성장발달에 필요한 조건과 방법을 탐색하며, 발달에는 개인차가 있음을 알아 자신과 타인의 발달에 대해 존중하는 태도를 갖는다.","B":"아동기 발달 특징을 이해하고 성장발달에 필요한 조건과 방법을 탐색하며, 자신과 타인의 발달을 긍정적으로 수용하는 태도를 갖는다.","C":"아동기 발달의 특징을 이해하여 성장발달에 필요한 조건을 확인한다.","p":160},{"c":"[6실01-02]","b":2,"s":5,"a":"인간 발달과 주도적 삶","ak":"인간발달과주도적삶","t":"건강한 발달을 위한 자기 관리 방법을 탐색하고, 일상생활 속에서 올바른 생활습관과 태도를 갖도록 계획하여 실천한다.","A":"건강한 발달을 위한 조건과 이를 위해 자기 관리가 필요함을 이해하고, 일상생활 속에서 올바른 생활습관과 태도를 갖도록 자기관리 방법을 계획하여 실천한다.","B":"건강한 발달을 위한 조건과 자기 관리 필요성을 이해하고, 일상생활 속에서 올바른 생활습관과 태도를 갖도록 자기 관리 방법을 계획한다.","C":"건강한 발달을 위한 조건을 이해하고 일상생활 속 자기 관리 방법을 탐색한다.","p":160},{"c":"[6실01-03]","b":2,"s":5,"a":"인간 발달과 주도적 삶","ak":"인간발달과주도적삶","t":"건강한 가정생활을 위해 가족원 모두에게 다양한 요구가 있음을 이해하여 서로에 대한 배려와 돌봄을 실천한다.","A":"건강한 가정생활을 위해서는 가족원 모두에게 있는 다양한 요구에 대해 배려와 돌봄이 필요함을 이해하고, 이를 실천한다.","B":"건강한 가정생활을 위해서는 가족원 모두에게 있는 다양한 요구에 대해 배려와 돌봄이 필요함을 이해한다.","C":"가족에게는 가정생활 속에서 모두 다양한 요구가 있음을 이해한다.","p":160},{"c":"[6실01-04]","b":2,"s":5,"a":"인간 발달과 주도적 삶","ak":"인간발달과주도적삶","t":"균형 잡힌 식사의 중요성과 조건을 탐색하여 자신의 식습관을 검토해 보고 건강한 식습관 형성에 적용한다.","A":"균형 잡힌 식사의 중요성과 조건을 이해하고 자신의 식습관이 이에 해당되는지 검토, 평가하여 건강한 식습관이 형성될 수 있도록 실천하는 태도를 갖는다.","B":"균형 잡힌 식사의 중요성과 조건을 이해하고 자신의 식습관이 이에 해당되는지 검토하며 건강한 식습관 형성을 위해 관심을 가진다.","C":"균형 잡힌 식사의 중요성을 이해하고 자신의 식습관을 확인한다.","p":161},{"c":"[6실01-05]","b":2,"s":5,"a":"인간 발달과 주도적 삶","ak":"인간발달과주도적삶","t":"옷의 기능을 이해하여 평소 자신의 옷차림을 살펴보고 건강하고 적절한 옷 입기를 실천한다.","A":"옷의 기능을 이해하고 이를 중심으로 평소 자신의 옷차림을 검토, 평가할 수 있으며, 이에 따라 건강하고 적절한 옷차림을 주도적으로 실천하려는 태도를 갖는다.","B":"옷의 기능을 이해하고 이를 중심으로 평소 자신의 옷차림에 대해 검토, 평가한다.","C":"옷의 기능을 이해하고 평소 자신의 옷차림에 대해 검토한다.","p":161},{"c":"[6실01-06]","b":2,"s":5,"a":"인간 발달과 주도적 삶","ak":"인간발달과주도적삶","t":"가정일을 수행하는 과정에서 일의 가치와 중요성을 이해하고, 가정생활을 유지하는 데 필요한 가정일의 종류를 탐색한다.","A":"가정일의 가치와 중요성, 가정생활에 미치는 영향을 이해하고 가정생활을 유지하는데 필요한 가정일의 종류를 분석하여 실제 가정일 수행에 참여하는 태도를 갖는다.","B":"가정일의 가치와 중요성을 이해하고 가정생활을 유지하는데 필요한 가정일의 종류를 탐색한다.","C":"가정일의 중요성과 가치를 이해한다.","p":161},{"c":"[6실01-07]","b":2,"s":5,"a":"인간 발달과 주도적 삶","ak":"인간발달과주도적삶","t":"직업의 필요성을 이해하고 적성, 흥미, 성격에 따라 진로 발달 계획을 세우고 주도적으로 탐색한다.","A":"직업과 진로 발달 계획이 필요성을 이해하고 자신의 특성을 스스로 탐색한 후, 이에 따른 자신의 진로 발달계획을 세울 수 있다.","B":"직업과 진로 발달 계획의 필요성을 이해하여 진로 발달계획을 세울 수 있다.","C":"직업의 필요성과 진로 발달 계획이 필요함을 이해한다.","p":161},{"c":"[6실02-01]","b":2,"s":5,"a":"생활환경과 지속가능한 선택","ak":"생활환경과지속가능한선택","t":"시간이나 용돈과 같은 생활자원이 제한되어 있음을 이해하고, 생활자원의 사용가치를 높이는 방법을 탐색한다.","A":"시간이나 용돈과 같은 생활자원의 중요성과 제한성을 깊이 이해하고, 그에 따라 사용가치를 높이는 방법을 탐색하며 생활자원을 소중하게 여기는 태도를 갖는다.","B":"시간이나 용돈과 같은 생활자원의 중요성과 제한성을 이해하여 생활자원의 사용가치를 높이는 방법을 탐색한다.","C":"시간이나 용돈과 같은 생활자원의 제한성을 알고 생활자원의 사용가치를 확인한다.","p":162},{"c":"[6실02-02]","b":2,"s":5,"a":"생활환경과 지속가능한 선택","ak":"생활환경과지속가능한선택","t":"생활자원 관리의 필요성을 인식하고, 합리적인 생활자원의 보관과 활용방법을 익힌다.","A":"생활자원 관리의 필요성과 보관 및 활용의 중요성을 이해하여 합리적인 방법으로 생활자원을 보관하고 활용하며 소중하게 여기는 태도를 갖는다.","B":"생활자원 관리의 필요성과 보관 및 활용의 중요성을 이해하여 합리적인 방법으로 생활자원을 보관하고 활용한다.","C":"생활자원 관리의 필요성을 이해하고, 생활자원의 보관과 활용방법을 확인한다.","p":162},{"c":"[6실02-03]","b":2,"s":5,"a":"생활환경과 지속가능한 선택","ak":"생활환경과지속가능한선택","t":"생활자원의 올바른 사용이 가정과 환경에 도움이 됨을 이해하고 재활용, 재사용 등 환경을 고려한 관리 방법을 실천한다.","A":"생활자원의 올바른 사용이 가정과 환경에 미치는 영향을 이해하고, 자신의 선택이 공동체의 삶과 환경에 미치는 영향을 고려하여 관리 방법을 실천하며 지속가능한 삶의 태도를 갖는다.","B":"생활자원의 올바른 사용이 가정과 환경에 도움이 되는 것을 이해하고 환경을 고려한 관리 방법을 적용하며 생활자원을 소중하게 여기는 태도를 갖는다.","C":"생활자원의 올바른 사용이 가정과 환경에 도움이 됨을 이해하고 환경을 고려한 관리 방법을 확인한다.","p":162},{"c":"[6실02-04]","b":2,"s":5,"a":"생활환경과 지속가능한 선택","ak":"생활환경과지속가능한선택","t":"식재료 생산과 선택의 중요성을 인식하고 여러 식재료의 고유하고 다양한 맛을 경험하여 자신의 식사에 적용한다.","A":"식재료의 생산과 선택의 중요성을 이해하고 여러 식재료의 고유하고 다양한 특징을 경험하여 자신의 식사에 적용할 수 있으며, 친환경적인 식생활의 의미를 알고 지속가능한 식생활을 실천하려는 태도를 갖는다.","B":"식재료의 생산과 선택의 중요성을 이해하고 식재료의 다양하고 고유한 맛을 경험하여 자신의 식사에 적용한다.","C":"식재료의 생산과 선택의 중요성을 이해하여 여러 식재료의 다양한 맛을 경험한다.","p":162},{"c":"[6실02-05]","b":2,"s":5,"a":"생활환경과 지속가능한 선택","ak":"생활환경과지속가능한선택","t":"음식의 조리과정을 체험하여 자신의 간식이나 식사를 스스로 마련하는 식생활을 실천한다.","A":"식재료가 조리를 통해 음식이 되는 과정을 이해하고 자신의 간식이나 식사를 간단한 조리를 통해 만들 수 있으며 이후 스스로 조리를 통해 음식을 마련하려는 실천의 태도를 갖는다.","B":"식재료가 조리를 통해 음식이 되는 과정을 이해하고 자신의 간식이나 식사를 간단한 조리를 통해 만들 수 있다.","C":"식재료가 조리를 통해 음식이 되는 과정을 체험을 통해 이해한다.","p":163},{"c":"[6실02-06]","b":2,"s":5,"a":"생활환경과 지속가능한 선택","ak":"생활환경과지속가능한선택","t":"우리나라 밥상차림을 이해하고, 함께 식사하는 즐거움을 경험하면서 이 과정에서 식사 예절을 실천한다.","A":"우리나라의 밥상차림의 특징을 이해하고, 함께 식사할 때의 즐거움을 경험하며 이 과정에서 식사 예절이 필요함을 인식하고 이를 실천하는 태도를 갖는다.","B":"우리나라 밥상차림의 특징을 이해하고, 함께 식사할 때의 즐거움을 느끼고 식사 예절이 필요함을 인식한다.","C":"우리나라 밥상차림의 특징을 이해하며 함께 식사하는 즐거움을 경험한다.","p":163},{"c":"[6실02-07]","b":2,"s":5,"a":"생활환경과 지속가능한 선택","ak":"생활환경과지속가능한선택","t":"의생활 용품이 만들어지는 과정을 탐색하여 옷이나 생활용품이 어떻게 구성되는지를 설명한다.","A":"일상생활에서 사용하는 의생활 용품이 어떻게 구성되어 만들어 진 것인지 탐색하고 구성의 원리와 제작의 절차를 이해하여 설명한다.","B":"일상생활에서 사용하는 의생활 용품이 만들어지는 과정을 탐색하여 옷이나 생활용품의 구성의 원리를 이해한다.","C":"일상생활의 의생활 용품이 어떤 과정을 통해 만들어지는지 이해한다.","p":163},{"c":"[6실02-08]","b":2,"s":5,"a":"생활환경과 지속가능한 선택","ak":"생활환경 느끼고 공감하는 태도를 보인다.","C":"시, 노래, 이야기를 듣거나 읽으면서 화자나 필자의 기쁨, 슬픔 등의 감정을 느끼고 공감하는 태도를 가지려고 노력한다.","p":241,"sr":"9-01"},{"c":"[6영01-10]","b":2,"s":9,"a":"이해","ak":"이해","t":"일상생활 주제나 문화에 관한 담화나 글을 포용의 태도로 듣거나 읽는다.","A":"일상생활 주제나 문화에 관한 간단한 담화나 글을 듣거나 읽을 때 다양한 생각이나 의견을 포용하는 적극적인 태도를 보인다.","B":"일상생활 주제나 문화에 관한 간단한 담화나 글을 듣거나 읽을 때 다양한 생각이나 의견을 포용하는 태도를 보인다.","C":"일상생활 주제나 문화에 관한 간단한 담화나 글을 듣거나 읽으면서 다양한 사람의 생각이나 의견을 포용하는 태도를 가지려고 노력한다.","p":241,"sr":"9-01"},{"c":"[6영02-01]","b":2,"s":9,"a":"표현","ak":"표현","t":"간단한 단어, 어구, 문장을 강세, 리듬, 억양에 맞게 말한다.","A":"간단한 단어, 어구, 문장을 강세, 리듬, 억양에 맞게 정확하게 말할 수 있다.","B":"간단한 단어, 어구, 문장을 강세, 리듬, 억양에 맞게 대체로 말할 수 있다.","C":"간단하고 짧은 단어, 어구, 문장을 시범을 참고하거나 반복 연습을 통해 강세, 리듬, 억양에 맞게 부분적으로 말할 수 있다.","p":242,"sr":"9-02"},{"c":"[6영02-02]","b":2,"s":9,"a":"표현","ak":"표현","t":"실물, 그림, 동작 등을 보고 간단한 단어, 어구, 문장으로 말하거나 쓴다.","A":"실물, 그림, 동작 등을 보고 간단한 단어를 정확하게 말하거나 쓸 수 있으며, 적절한 단어와 언어 형식을 사용하여 간단한 어구나 문장으로 정확하게 말하거나 쓸 수 있다.","B":"실물, 그림, 동작 등을 보고 간단한 단어를 대체로 말하거나 쓸 수 있으며, 적절한 단어를 사용하여 간단한 어구나 문장으로 대체로 말하거나 쓸 수 있다.","C":"실물, 그림, 동작 등을 보고 간단한 단어를 일부 말하거나 쓸 수 있으며, 주어진 단어를 참고하여 간단하고 짧은 어구나 문장으로 부분적으로 말하거나 쓸 수 있다.","p":242,"sr":"9-02"},{"c":"[6영02-03]","b":2,"s":9,"a":"표현","ak":"표현","t":"알파벳 대소 문자와 문장 부호를 문장에서 바르게 사용한다.","A":"알파벳 대소 문자와 문장 부호를 단어와 문장의 유형에 맞게 문장에서 정확하고 바르게 사용할 수 있다.","B":"알파벳 대소 문자와 문장 부호를 문장의 유형에 맞게 문장에서 대체로 바르게 사용할 수 있다.","C":"알파벳 대소 문자와 문장 부호를 예시 문장을 참고하여 문장에서 부분적으로 바르게 사용할 수 있다.","p":242,"sr":"9-02"},{"c":"[6영02-04]","b":2,"s":9,"a":"표현","ak":"표현","t":"주변 사람이나 사물을 간단한 문장으로 소개하거나 묘사한다.","A":"주변 사람이나 사물의 이름과 주요 특징을 적절한 단어와 언어 형식을 사용하여 간단한 문장으로 정확하게 소개하거나 묘사할 수 있다.","B":"주변 사람이나 사물의 이름과 주요 특징을 적절한 단어를 사용하여 간단한 문장으로 대체로 소개하거나 묘사할 수 있다.","C":"주변 사람이나 사물의 이름과 주요 특징을 주어진 도움 자료를 참고하여 간단하고 짧은 문장으로 부분적으로 소개하거나 묘사할 수 있다.","p":242,"sr":"9-02"},{"c":"[6영02-05]","b":2,"s":9,"a":"표현","ak":"표현","t":"주변 장소나 위치, 행동 순서나 방법을 간단한 문장으로 설명한다.","A":"주변 장소의 위치나 찾아가는 방법, 일상생활 행동의 순서나 방법을 적절한 단어와 언어 형식을 사용하여 간단한 문장으로 정확하게 말하거나 쓸 수 있다.","B":"주변 장소의 위치나 찾아가는 방법, 일상생활 행동의 순서나 방법을 적절한 단어를 사용하여 간단한 문장으로 대체로 말하거나 쓸 수 있다.","C":"주변 장소의 위치나 찾아가는 방법, 일상생활의 반복적인 행동의 순서나 방법을 주어진 도움 자료를 참고하여 간단하고 짧은 문장으로 부분적으로 말하거나 쓸 수 있다.","p":242,"sr":"9-02"},{"c":"[6영02-06]","b":2,"s":9,"a":"표현","ak":"표현","t":"자신의 감정이나 의견, 경험이나 계획을 간단한 문장으로 표현한다.","A":"일상생활에서의 자신의 감정이나 의견, 경험이나 계획을 적절한 단어와 언어 형식을 사용하여 간단한 문장으로 정확하게 말하거나 쓸 수 있다.","B":"일상생활에서의 자신의 감정이나 의견, 경험이나 계획을 적절한 단어를 사용하여 간단한 문장으로 대체로 말하거나 쓸 수 있다.","C":"일상생활에서의 자신의 감정이나 의견, 경험이나 계획을 주어진 도움 자료를 참고하여 간단하고 짧은 문장으로 부분적으로 말하거나 쓸 수 있다.","p":243,"sr":"9-02"},{"c":"[6영02-07]","b":2,"s":9,"a":"표현","ak":"표현","t":"일상생활 주제에 관한 담화나 글의 세부 정보를 간단한 문장으로 묻거나 답한다.","A":"일상생활 주제에 관한 다양한 유형의 간단한 담화나 글의 세부 정보를 적절한 단어와 언어 형식을 사용하여 정확하게 묻거나 답할 수 있다.","B":"일상생활 주제에 관한 간단한 담화나 글의 세부 정보를 적절한 단어를 사용하여 대체로 묻거나 답할 수 있다.","C":"일상생활 주제에 관한 간단하고 짧은 담화나 글의 세부 정보를 주어진 도움 자료를 참고하여 부분적으로 묻거나 답할 수 있다.","p":243,"sr":"9-02"},{"c":"[6영02-08]","b":2,"s":9,"a":"표현","ak":"표현","t":"예시문을 참고하여 목적에 맞는 간단한 글을 쓴다.","A":"예시문을 참고하여 일상생활 목적에 맞는 간단한 글을 적절한 단어와 언어 형식으로 정확하게 쓸 수 있다.","B":"예시문을 참고하여 일상생활 목적에 맞는 간단한 글을 적절한 단어로 대체로 쓸 수 있다.","C":"예시문과 주어진 단어 목록을 참고하여 일상생활 목적에 맞는 간단하고 짧은 글을 부분적으로 쓸 수 있다.","p":243,"sr":"9-02"},{"c":"[6영02-09]","b":2,"s":9,"a":"표현","ak":"표현","t":"적절한 매체와 전략을 활용하여 창의적으로 의미를 생성하고 표현한다.","A":"적절한 매체와 전략을 다양하게 활용하여 창의적으로 의미를 생성하고 표현할 수 있다.","B":"적절한 매체와 전략을 활용하여 창의적으로 의미를 생성하고 표현할 수 있다.","C":"예시를 참고하여 적절한 매체와 전략을 일부 활용하여 창의적으로 의미를 표현할 수 있다.","p":243,"sr":"9-02"},{"c":"[6영02-10]","b":2,"s":9,"a":"표현","ak":"표현","t":"의사소통 활동에 흥미와 자신감을 가지고 참여하여 협력적으로 수행한다.","A":"의사소통 활동에 높은 흥미와 자신감을 가지고 참여하며, 동료들과 적극적으로 협력하여 활동을 수행한다.","B":"의사소통 활동에 흥미와 자신감을 가지고 참여하려는 태도를 보이며, 동료들과 대체로 협력하여 활동을 수행한다.","C":"의사소통 활동에 일부 흥미와 자신감을 가지고 참여하고자 노력하며, 동료들과 부분적으로 협력하여 활동을 수행한다.","p":243,"sr":"9-02"}],"area":[{"b":0,"s":0,"a":"듣기·말하기","ak":"듣기말하기","n":"듣기·말하기","L":{"A":{"지식·이해":"대화, 발표와 같은 담화 유형을 충분히 이해하고, 상황 맥락을 고려하여 의사소통의 목적에 알맞게 듣고 말하는 방법을 알 수 있다.","과정·기능":"중요한 내용이나 일이 일어난 순서를 정확하게 파악하며 듣고 중요한 내용이나 일이 일어난 순서가 명확하게 드러나도록 말할 수 있다. 서로의 감정을 적극적으로 공유하고 바르고 고운 말을 사용하며, 상대의 말에 집중하여 정확하게 듣고 말차례를 지키며 적극적으로 대화할 수 있다. 다양한 상황에서 자신의 경험이나 생각을 바른 자세로 자신 있게 발표할 수 있다.","가치·태도":"듣기·말하기의 중요성을 정확히 인식하고, 듣기·말하기에 적극적으로 참여하며 관심과 흥미를 가진다."},"B":{"지식·이해":"대화, 발표와 같은 담화 유형을 이해하고, 상황 맥락을 고려하여 듣고 말하는 방법을 알 수 있다.","과정·기능":"중요한 내용이나 일이 일어난 순서를 파악하며 듣고 일이 일어난 순서가 드러나도록 말할 수 있다. 서로의 감정을 대체로 공유하고 바르고 고운 말을 사용하며, 상대의 말에 주의를 집중하여 듣고 말차례를 지키며 대화할 수 있다. 자신의 경험이나 생각을 바른 자세로 발표할 수 있다.","가치·태도":"듣기·말하기의 중요성을 인식하고, 듣기·말하기에 관심과 흥미를 가진다."},"C":{"지식·이해":"대화, 발표와 같은 담화 유형을 제한적으로 이해하고 듣고 말하는 방법을 안다.","과정·기능":"중요한 내용이나 일이 일어난 순서를 부분적으로 파악하며 듣고 일이 일어난 순서가 일부 드러나도록 말한다. 서로의 감정을 일부 공유하고 바르고 고운 말을 사용하며, 상대의 말을 듣고 말차례를 부분적으로 지키며 대화한다. 자신의 경험이나 생각을 다른 사람 앞에서 말한다.","가치·태도":"듣기·말하기에 관심과 흥미를 일부 가진다."}},"p":25},{"b":0,"s":0,"a":"매체","ak":"매체","n":"매체","L":{"A":{"지식·이해":"일상의 삶 속에서 다양한 매체와 매체 자료가 이용된다는 것과 글과 그림의 상호작용을 통해 의미를 효과적으로 구성할 수 있음을 이해한다.","과정·기능":"일상의 삶에서 다양한 매체 및 매체 자료를 활용하고 글과 그림을 중심으로 의미를 효과적으로 표현할 수 있다.","가치·태도":"일상의 다양한 매체와 매체 자료에 흥미와 관심을 가지며, 글과 그림을 활용하여 다양한 의미를 표현해 보려는 태도를 지닌다."},"B":{"지식·이해":"일상의 삶 속에 매체와 매체 자료가 이용된다는 것과 글과 그림을 활용하여 의미를 구성할 수 있음을 이해한다.","과정·기능":"친숙한 매체 및 매체 자료를 활용하고 글과 그림을 중심으로 의미를 표현할 수 있다.","가치·태도":"친숙한 매체 및 매체 자료에 관심을 가지고 글과 그림을 활용하여 의미를 표현해 보려는 태도를 지닌다."},"C":{"지식·이해":"주변에 다양한 매체와 매체 자료가 있다는 것과 글과 그림으로 의미를 표현할 수 있음을 안다.","과정·기능":"일부 유형의 매체 및 매체 자료를 활용하고 글 또는 그림으로 기초적인 의미를 표현한다.","가치·태도":"일부 매체 및 매체 자료에 관심을 가지며 글이나 그림으로 기초적인 의미를 표현해 보려고 시도한다."}},"p":28},{"b":0,"s":0,"a":"문법","ak":"문법","n":"문법","L":{"A":{"지식·이해":"한글 자모의 이름과 소릿값, 단어의 소리와 표기, 문장과 문장 부호에 대해 정확하게 알 수 있다.","과정·기능":"한글 자모의 이름과 소릿값, 단어의 소리와 표기, 문장과 문장 부호에 대해 아는 것을 국어생활에서 정확하고 적절하게 사용할 수 있다.","가치·태도":"한글에 지속적인 관심과 호기심을 가진다."},"B":{"지식·이해":"한글 자모의 이름과 소릿값, 단어의 소리와 표기, 문장과 문장 부호에 대해 알 수 있다.","과정·기능":"한글 자모의 이름과 소릿값, 단어의 소리와 표기, 문장과 문장 부호에 대해 아는 것을 적절하게 사용할 수 있다.","가치·태도":"한글에 호기심을 가진다."},"C":{"지식·이해":"한글 자모의 이름과 소릿값, 단어의 소리와 표기, 문장과 문장 부호에 대해 제한적으로 안다.","과정·기능":"한글 자모의 이름과 소릿값, 단어의 소리와 표기, 문장과 문장 부호에 대해 아는 것을 제한적으로 사용한다.","가치·태도":"한글에 관심을 가진다."}},"p":27},{"b":0,"s":0,"a":"문학","ak":"문학","n":"문학","L":{"A":{"지식·이해":"시, 노래, 이야기, 그림책의 특성을 이해한다.","과정·기능":"말놀이에 적극적으로 참여하거나 분위기를 살려 작품을 낭송하며 말의 재미와 즐거움을 느끼고, 작품을 듣거나 읽고 느끼거나 생각한 감상을 다른 사람과 즐겨 나누며, 작품 속 인물을 구체적으로 상상하며 시, 노래, 이야기, 그림 등으로 창의적으로 표현할 수 있다.","가치·태도":"다양한 시나 노래, 이야기를 스스로 찾아 감상하며 흥미를 가진다."},"B":{"지식·이해":"시, 노래, 이야기, 그림책의 특성을 부분적으로 이해한다.","과정·기능":"말놀이에 참여하고 작품을 낭송하며 말의 재미와 즐거움을 느끼고, 작품을 듣거나 읽고 느끼거나 생각한 감상을 다른 사람과 나누며, 작품 속 인물을 상상하며 시, 노래, 이야기, 그림 등으로 표현할 수 있다.","가치·태도":"다양한 시나 노래, 이야기를 감상하는 데 흥미를 가진다."},"C":{"지식·이해":"작품이 시, 노래, 이야기, 그림책이라는 갈래로 나뉠 수 있음을 안다.","과정·기능":"간단한 유형의 말놀이나 작품 낭송을 통해 말의 재미를 느끼고, 작품을 듣거나 읽으면서 느끼거나 생각한 점을 간단하게 말하며, 일부 상상한 작품 속 인물을 간단하게 표현한다.","가치·태도":"시나 노래, 이야기를 듣거나 읽는 데 관심을 가진다."}},"p":28},{"b":0,"s":0,"a":"쓰기","ak":"쓰기","n":"쓰기","L":{"A":{"지식·이해":"주변 소재에 대해 소개하는 글과 겪은 일을 표현하는 글의 특성을 이해하고 이와 같은 유형의 글을 쓰는 방법을 알 수 있다.","과정·기능":"바른 자세로 글자와 단어를 바르고 정확하게 쓰고, 자신의 생각과 느낌을 다양한 문장으로 다채롭게 쓸 수 있다. 일상을 소재로 다양하게 생성한 내용을 자유롭게 표현하며, 자신과 다른 사람이 쓴 글을 함께 읽고 서로의 생각과 느낌을 적극적으로 나눌 수 있다.","가치·태도":"다양한 쓰기 경험을 토대로 쓰기에 대한 흥미를 가진다."},"B":{"지식·이해":"주변 소재에 대해 소개하는 글과 겪은 일을 표현하는 글의 특성을 알 수 있다.","과정·기능":"글자와 단어를 바르고 정확하게 쓰고, 자신의 생각이나 느낌을 다양한 문장으로 쓸 수 있다. 일상을 소재로 생성한 내용을 자유롭게 표현하며, 자신과 다른 사람이 쓴 글을 함께 읽고 서로의 생각과 느낌을 나눌 수 있다.","가치·태도":"쓰기에 흥미를 가진다."},"C":{"지식·이해":"자신이 관심 있는 소재에 대해 소개하는 글과 겪은 일을 표현하는 글의 특성을 부분적으로 안다.","과정·기능":"글자와 간단한 단어를 쓰고, 자신의 생각이나 느낌의 일부를 문장으로 쓴다. 일상을 소재로 내용을 생성하거나 표현하며, 다른 사람이 쓴 글을 읽고 자신의 생각이나 느낌을 제한적으로 표현한다.","가치·태도":"쓰기에 일부 흥미를 가진다."}},"p":27},{"b":0,"s":0,"a":"읽기","ak":"읽기","n":"읽기","L":{"A":{"지식·이해":"친숙한 화제의 글, 설명 대상과 주제가 명시적인 글, 생각이나 감정이 명시적으로 제시된 글의 특성을 정확히 이해할 수 있다.","과정·기능":"글자, 단어, 문장, 짧은 글을 정확하게 소리 내어 읽을 수 있고, 의미가 잘 드러나도록 글을 알맞게 띄어 읽으며, 글을 읽고 중심 내용을 정확하게 확인하고, 인물의 마음이나 생각을 짐작하며 이를 자신의 경험이나 생각과 비교하면서 글을 적극적으로 읽을 수 있다.","가치·태도":"읽기에 흥미를 가지고 적극적으로 즐겨 읽는 태도를 지닌다."},"B":{"지식·이해":"친숙한 화제의 글, 설명 대상과 주제가 명시적인 글, 생각이나 감정이 명시적으로 제시된 글을 이해할 수 있다.","과정·기능":"글자, 단어, 문장, 짧은 글을 정확하게 소리 내어 읽을 수 있고, 의미가 잘 드러나도록 글을 알맞게 띄어 읽으며, 글을 읽고 중심 내용을 확인하고, 인물의 마음이나 생각을 짐작하며 이를 자신의 경험이나 생각과 비교하면서 글을 읽을 수 있다.","가치·태도":"읽기에 흥미를 가지고 즐겨 읽는 태도를 지닌다."},"C":{"지식·이해":"친숙한 화제의 글, 설명 대상과 주제가 명시적인 글을 이해한다.","과정·기능":"글자, 단어, 문장, 짧은 글을 소리 내어 읽을 수 있고, 의미가 잘 드러나도록 글을 띄어 읽으며, 글을 읽고 중심 내용을 확인하고, 인물의 마음이나 생각을 짐작하며 이를 부분적으로 비교하며 읽는다.","가치·태도":"읽기에 일부 흥미를 지닌다."}},"p":26},{"b":0,"s":3,"a":"도형과 측정","ak":"도형과측정","n":"도형과 측정","L":{"A":{"지식·이해":"직육면체, 원기둥, 구의 모양을 종합적으로 이해하고, 쌓기나무를 이용하여 만든 입체도형의 모양을 설명할 때 위치와 방향의 필요성을 알고 활용할 수 있다. 또 삼각형, 사각형, 원의 모양을 종합적으로 이해하고, 각 도형이 고유한 성질을 가지고 있음을 안다.길이, 들이, 무게, 넓이의 속성을 알고 이를 비교하는 방법을 이해한다. 길이와 시각에서 측정 단위, 그들 사이의 관계, 측정 단위를 사용하여 측정하는 방법 등을 종합적으로 이해하고, 길이의 덧셈과 뺄셈의 계산 원리를 알며, 이를 문제해결에 능숙하게 적용할 수 있다.","과정·기능":"주변 물건을 관찰하여 직육면체, 원기둥, 구의 모양으로 분류하고, 그 특징을 말하며, 여러 가지 모양을 만들 수 있다. 그리고 쌓기나무로 만든 입체도형의 모양을 위치나 방향을 이용하여 다양하게 설명할 수 있다. 또 주변 물건을 삼각형, 사각형, 원의 모양으로 분류하고, 그 특징을 말하며, 여러 가지 모양을 만들거나 그릴 수 있다. 그리고 삼각형과 사각형에서 각각의 여러 가지 공통점을 찾아 말하고, 이를 활용할 수 있다.길이, 들이, 무게, 넓이의 속성과 이를 비교하는 방법에 대한 이해를 바탕으로 실생활에서 양을 능숙하게 비교하고, 그 방법을 말할 수 있다. 또 길이와 시각의 단위를 이용하여 다양한 양을 측정하거나 어림할 수 있고, 실생활 상황에서 길이의 덧셈과 뺄셈을 능숙하게 계산하고 그 방법을 설명할 수 있다.","가치·태도":"입체도형의 모양, 평면도형의 모양과 구성 요소에 흥미와 관심을 가지고, 입체도형, 쌓기나무, 평면도형을 이용하여 여러 가지 모양을 만드는 데 적극 참여한다.양의 비교, 시각과 시간, 길이의 측정과 어림에 적극적으로 참여하고, 여러 가지 측정 단위의 필요성을 인식하며, 실생활에 길이의 덧셈과 뺄셈이 활용됨을 안다. 도형과 측정 영역에서 문제해결에 적극적으로 참여한다."},"B":{"지식·이해":"직육면체, 원기둥, 구의 모양을 이해하고, 쌓기나무를 이용하여 만든 입체도형의 모양을 설명할 때 위치와 방향이 필요함을 안다. 또 여러 가지 삼각형, 사각형, 원의 모양을 이해하고, 이들 도형에서 각각의 공통점을 안다.길이, 들이, 무게, 넓이를 비교하는 방법을 안다. 길이와 시각에서 측정 단위, 그들 사이의 관계, 측정 단위를 사용하여 측정하는 방법 등을 이해하고, 길이의 덧셈과 뺄셈을 계산하는 방법을 안다.","과정·기능":"주변 물건을 관찰하여 직육면체, 원기둥, 구의 모양을 찾고, 그 모양을 이용하여 여러 가지 모양을 만들 수 있다. 그리고 쌓기나무로 만든 입체도형의 모양을 위치나 방향을 이용하여 설명할 수 있다. 또 주변 물건을 관찰하여 삼각형, 사각형, 원의 모양을 찾고, 그 모양들을 이용하여 여러 가지 모양을 만들거나 그릴 수 있다. 그리고 삼각형과 사각형에서 각각의 여러 가지 공통점을 찾아 말할 수 있다.실생활에서 길이, 들이, 무게, 넓이를 구별하여 양을 비교할 수 있고, 길이와 시각의 여러 단위를 이용하여 양을 측정하거나 어림할 수 있다. 실생활 장면에서 길이의 덧셈과 뺄셈을 할 수 있다.","가치·태도":"입체도형의 모양, 평면도형의 모양과 그 구성 요소에 흥미와 관심을 가지고, 입체도형, 쌓기나무, 평면도형을 이용한 여러 가지 모양 만들기에 참여한다.양의 비교, 시각과 시간, 길이의 측정과 어림에 흥미와 관심을 가지고, 실생활에 길이의 덧셈과 뺄셈이 활용됨을 안다. 도형과 측정 영역에서 문제해결에 참여한다."},"C":{"지식·이해":"직육면체, 원기둥, 구의 모양을 부분적으로 이해하고, 쌓기나무를 이용하여 만든 입체도형의 모양을 설명할 때 위치와 방향이 사용됨을 안다. 또 삼각형, 사각형, 원의 모양을 부분적으로 이해하고 간단한 특징을 안다.안내된 절차에 따라 길이, 들이, 무게, 넓이를 비교하는 방법을 알고, 길이와 시각에서 측정 단위와 이를 이용하여 측정하는 방법을 부분적으로 이해하며, 간단한 길이의 덧셈과 뺄셈을 계산하는 방법을 안다.","과정·기능":"주어진 직육면체, 원기둥, 구의 모양을 보고 주변 물건에서 같은 모양을 찾고, 이를 이용하여 간단한 모양을 만들 수 있다. 그리고 안내된 절차에 따라 쌓기나무로 만든 입체도형의 모양을 위치나 방향을 이용하여 설명할 수 있다. 또 주어진 삼각형, 사각형, 원의 모양을 보고 주변 물건에서 같은 모양을 찾고, 이를 이용하여 간단한 모양을 만들거나 그릴 수 있다. 그리고 삼각형의 공통점 또는 사각형의 공통점을 가진 도형을 찾을 수 있다.안내된 절차에 따라 길이, 들이, 무게, 넓이를 비교할 수 있고, 길이와 시각의 단위를 이용하여 간단한 양을 측정하거나 어림할 수 있다. 안내된 절차에 따라 간단한 길이의 덧셈과 뺄셈을 할 수 있다.","가치·태도":"입체도형의 모양, 평면도형의 모양과 그 구성 요소에 관심을 가지고, 입체도형,쌓기나무, 평면도형을 이용한 간단한 모양 만들기에 흥미를 갖고 참여한다.양의 비교, 시각과 시간, 길이 측정에 관심을 가지고, 실생활에 길이의 덧셈과 뺄셈이 활용됨을 안다. 도형과 측정 영역에서 문제해결에 참여하려고 노력한다."}},"p":40},{"b":0,"s":3,"a":"변화와 관계","ak":"변화와관계","n":"변화와 관계","L":{"A":{"지식·이해":"물체, 무늬, 수 등의 배열에서 여러 가지 규칙을 이해한다.","과정·기능":"물체, 무늬, 수 등의 배열에서 규칙을 찾아 여러 가지 방법으로 나타내고, 자신이 정한 여러 가지 규칙에 따라 물체, 무늬, 수 등을 배열할 수 있다.","가치·태도":"실생활에서 접할 수 있는 여러 가지 규칙에서 수학의 아름다움을 느끼고, 규칙이 실생활에 활용됨을 안다. 변화와 관계 영역에서 문제해결에 적극적으로 참여한다."},"B":{"지식·이해":"물체, 무늬, 수 등의 배열에서 규칙을 이해한다.","과정·기능":"물체, 무늬, 수 등의 배열에서 규칙을 찾아 나타내고, 주어진 규칙에 따라 물체, 무늬, 수 등을 배열할 수 있다.","가치·태도":"물체, 무늬, 수 등에서 규칙을 찾는 과정에서 수학에 대한 흥미와 관심을 갖고, 규칙이 실생활에 활용됨을 안다. 변화와 관계 영역의 문제해결에 참여한다."},"C":{"지식·이해":"물체, 무늬, 수 등의 간단한 배열에서 규칙을 이해한다.","과정·기능":"물체, 무늬, 수 등의 간단한 배열에서 규칙을 찾고, 간단한 규칙에 따라 물체, 무늬, 수 등을 배열할 수 있다.","가치·태도":"물체, 무늬, 수 등의 배열에서 규칙을 찾는 과정에서 수학에 대한 관심을 가진다. 변화와 관계 영역의 문제해결에 참여하려고 노력한다."}},"p":40},{"b":0,"s":3,"a":"수와 연산","ak":"수와연산","n":"수와 연산","L":{"A":{"지식·이해":"위치적 기수법에 대한 이해를 바탕으로 네 자리 이하의 수에서 수 개념과 자릿값의 원리를 종합적으로 이해한다. 또 두 자리 수 범위의 덧셈과 뺄셈, 한 자리 수의 곱셈에서 연산의 의미와 계산 원리, 덧셈, 뺄셈, 곱셈 사이의 관계 등을 종합적으로 이해하고, 이를 계산 과정에 능숙하게 적용할 수 있다.","과정·기능":"네 자리 이하의 수에서 수 개념과 자릿값의 원리에 대한 이해를 바탕으로 수를 능숙하게 읽고 쓰며, 수의 크기를 비교하고 그 방법을 설명할 수 있다. 두 자리 수 범위의 덧셈과 뺄셈을 능숙하게 계산하고 그 방법을 설명하며, 실생활 상황에 적용하여 문제를 해결할 수 있다. 곱셈이 적용된 실생활 상황을 곱셈식으로 나타내고, 곱셈구구를 유창하게 말하며, 한 자리 수의 곱셈에 활용할 수 있다.","가치·태도":"네 자리 이하의 수의 필요성과 표현의 편리함을 인식한다. 실생활 문제를 해결하는 과정에 두 자리 수 범위의 덧셈과 뺄셈, 한 자리 수의 곱셈, 곱셈구구가 유용하게 활용됨을 안다. 수와 연산 영역의 문제해결에 적극적으로 참여한다."},"B":{"지식·이해":"위치적 기수법에 대한 이해를 바탕으로 네 자리 이하의 수에서 수 개념과 자릿값의 원리를 이해한다. 또 두 자리 수 범위의 덧셈과 뺄셈, 한 자리 수의 곱셈에서 연산의 의미와 계산 원리, 덧셈과 뺄셈의 관계를 이해하고, 이를 계산 과정에 적용할 수 있다.","과정·기능":"네 자리 이하의 수에서 수 개념과 자릿값의 원리에 대한 이해를 바탕으로 수를 읽고 쓰며, 수의 크기를 비교할 수 있다. 두 자리 수 범위의 덧셈과 뺄셈을 계산하고, 실생활 상황에 적용하여 문제를 해결할 수 있다. 곱셈이 적용된 실생활 상황을 곱셈식으로 나타내고, 곱셈구구를 말하며, 한 자리 수의 곱셈을 할 수 있다.","가치·태도":"네 자리 이하의 수, 두 자리 수 범위의 덧셈과 뺄셈, 한 자리 수의 곱셈에 흥미와 관심을 가지고, 실생활 문제를 해결하는 데 두 자리 수 범위의 덧셈과 뺄셈, 한 자리 수의 곱셈, 곱셈구구가 활용됨을 안다. 수와 연산 영역의 문제해결에 참여한다."},"C":{"지식·이해":"네 자리 이하의 수에서 기초적인 수 개념을 이해한다. 안내된 절차에 따라 두 자리 수 범위의 덧셈과 뺄셈, 한 자리 수의 곱셈에 대한 기초적인 계산 원리를 이해한다.","과정·기능":"구체물을 세어 보는 활동을 통하여 네 자리 이하의 수를 읽고 쓸 수 있으며, 안내된 절차에 따라 수의 크기를 비교할 수 있다. 구체적인 조작 활동이나 안내된 절차에 따라 두 자리 수 범위의 간단한 덧셈과 뺄셈을 할 수 있으며 곱셈구구를 말할 수 있다.","가치·태도":"네 자리 이하의 수, 두 자리 수 범위의 덧셈과 뺄셈, 한 자리 수의 곱셈에 관심을 가지고, 실생활에서 두 자리 수 범위의 덧셈과 뺄셈, 한 자리 수의 곱셈, 곱셈구구가 유용함을 안다. 수와 연산 영역의 문제해결에 참여하려고 노력한다."}},"p":39},{"b":0,"s":3,"a":"자료와 가능성","ak":"자료와가능성","n":"자료와 가능성","L":{"A":{"지식·이해":"여러 가지 분류 기준을 알고, 분류 기준에 따라 분류한 결과가 달라질 수 있음을 종합적으로 이해한다. 자료를 정리한 표와 ○, ×, / 등을 이용한 그래프, 표와 그래프로 나타내는 방법을 종합적으로 이해한다.","과정·기능":"사물을 정해진 기준 또는 알맞은 기준을 정하여 능숙하게 분류하고, 개수를 정확하게 세어 그 결과를 말할 수 있다. 자료의 크기를 수로 정리하여 표와 ○, ×, / 등을 이용한 그래프로 나타내고, 표와 그래프에서 알게 된 여러 가지 사실을 말할 수 있다.","가치·태도":"자료의 분류, 표, 그래프에 흥미와 관심을 가지고, 정확한 분류를 위해 분명한 기준이 필요함을 인식한다. 표와 ○, ×, / 등을 이용한 그래프의 편리함을 알고 적극 활용한다."},"B":{"지식·이해":"분류 기준에 따라 분류한 결과가 달라질 수 있음을 이해한다. 자료를 정리한 표와 ○, ×, / 등을 이용한 그래프, 표와 그래프로 나타내는 방법을 이해한다.","과정·기능":"사물을 정해진 기준 또는 알맞은 기준을 정하여 분류하고, 개수를 세어 그 결과를 말할 수 있다. 자료의 크기를 수로 정리하여 표와 ○, ×, / 등을 이용한 그래프로 나타내고, 표와 그래프에서 알게 된 사실을 말할 수 있다.","가치·태도":"자료의 분류, 표, 그래프에 흥미와 관심을 가지고, 표와 ○, ×, / 등을 이용한 그래프의 편리함을 인식한다."},"C":{"지식·이해":"기준에 따라 분류하는 방법을 알고, 자료를 표와 ○, ×, / 등을 이용한 그래프로 나타내는 방법을 부분적으로 이해한다.","과정·기능":"안내된 절차에 따라 주어진 사물을 간단한 기준으로 분류하고, 개수를 셀 수 있다. 간단한 표를 보고 ○, ×, / 등을 이용한 그래프로 나타낼 수 있다.","가치·태도":"자료의
