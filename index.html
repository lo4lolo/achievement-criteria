<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2022 개정 교육과정 초등 수업 설계 도우미</title>
<style>
:root{
  --bg:#fff; --panel:#fff; --sunk:#fafafa; --sunk2:#f4f4f4;
  --ink:#111; --dim:#666; --faint:#949494;
  --line:#e4e4e4; --line2:#c8c8c8; --mark:#ececec;
  --r:8px;
}
html[data-theme="dark"]{
  --bg:#0e0e0f; --panel:#161617; --sunk:#1b1b1d; --sunk2:#202022;
  --ink:#f0f0f0; --dim:#a0a0a0; --faint:#767676;
  --line:#2a2a2c; --line2:#3d3d40; --mark:#3a3a3d;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Pretendard","Malgun Gothic",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  font-size:15px;line-height:1.62;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
a{color:var(--ink)}

/* ---------- 헤더 ---------- */
header{position:sticky;top:0;z-index:30;background:var(--panel);border-bottom:1px solid var(--line2);padding:9px 15px 0}
.hrow{display:flex;align-items:center;gap:11px;flex-wrap:wrap}
.brand{font-weight:800;font-size:16px;letter-spacing:-.02em;white-space:nowrap;line-height:1.24}
.brand small{display:block;font-weight:500;font-size:11px;color:var(--dim);margin-top:1px}
.btn{border:1px solid var(--line2);border-radius:7px;padding:5px 10px;font-size:12.5px;font-weight:600;color:var(--dim);background:var(--panel)}
.btn:hover{border-color:var(--ink);color:var(--ink)}
.btn.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.sm{padding:3px 8px;font-size:11.5px}
.searchwrap{position:relative;flex:1;min-width:220px}
.searchwrap input{width:100%;padding:10px 70px 10px 32px;border:1.5px solid var(--line2);border-radius:8px;background:var(--bg);outline:none}
.searchwrap input:focus{border-color:var(--ink)}
.searchwrap .ico{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--faint);font-size:14px}
.searchwrap .clr{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:1px solid var(--line);border-radius:6px;padding:2px 7px;font-size:11px;color:var(--dim)}
.filters{padding:8px 0 9px;display:flex;flex-direction:column;gap:5px}
.frow{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.flabel{font-size:10.5px;color:var(--faint);font-weight:800;letter-spacing:.03em;min-width:32px}
.chip{border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:600;color:var(--dim);background:var(--panel);white-space:nowrap}
.chip:hover{border-color:var(--ink);color:var(--ink)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .hi{font-size:9.5px;opacity:.7;margin-left:4px;font-weight:700}
.fnote{font-size:11px;color:var(--faint)}

/* ---------- 레이아웃 ---------- */
main{display:grid;grid-template-columns:minmax(300px,375px) 1fr;gap:12px;padding:12px 15px 92px;align-items:start}
.col{background:var(--panel);border:1px solid var(--line2);border-radius:var(--r)}
.listhead{display:flex;align-items:center;gap:6px;padding:8px 11px;border-bottom:1px solid var(--line);font-size:12px;color:var(--dim);flex-wrap:wrap}
.listhead b{color:var(--ink);font-size:13.5px}
.list{max-height:calc(100vh - 262px);overflow:auto;overscroll-behavior:contain}
.grouphead{position:sticky;top:0;background:var(--sunk);border-top:1px solid var(--line);border-bottom:1px solid var(--line);
  padding:5px 11px;font-size:11px;font-weight:800;color:var(--dim);z-index:2;display:flex;gap:6px;align-items:center}
.grouphead .n{margin-left:auto;font-weight:600;color:var(--faint)}
.item{display:flex;gap:8px;padding:9px 11px;border-bottom:1px solid var(--line);cursor:pointer;align-items:flex-start}
.item:hover{background:var(--sunk)}
.item.sel{background:var(--sunk2);box-shadow:inset 3px 0 0 var(--ink)}
.item input[type=checkbox]{margin-top:4px;width:14px;height:14px;accent-color:#111;flex:none}
.itemmain{min-width:0;flex:1}
.code{font-family:"Consolas","D2Coding",ui-monospace,monospace;font-size:11.5px;font-weight:700}
.meta{font-size:11px;color:var(--dim);margin-left:5px}
.badge{font-size:9.5px;font-weight:700;color:var(--dim);border:1px solid var(--line2);border-radius:4px;padding:0 5px;margin-left:4px;white-space:nowrap}
.itemtext{font-size:13px;margin-top:1px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.empty{padding:34px 18px;text-align:center;color:var(--dim);font-size:13px}
.relaxnote{padding:7px 11px;background:var(--sunk);color:var(--dim);font-size:11.5px;border-bottom:1px solid var(--line)}

/* ---------- 상세 ---------- */
.dhead{padding:14px 18px 11px;border-bottom:1px solid var(--line)}
.dcode{font-family:"Consolas","D2Coding",ui-monospace,monospace;font-size:14.5px;font-weight:800}
.dtags{display:flex;gap:4px;flex-wrap:wrap;margin:6px 0 8px}
.tag{border:1px solid var(--line);border-radius:5px;padding:2px 7px;font-size:11px;font-weight:600;color:var(--dim)}
.tag.solid{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.dtext{font-size:16.5px;font-weight:600;line-height:1.55;letter-spacing:-.01em}
.dact{display:flex;gap:5px;flex-wrap:wrap;margin-top:11px}
.tabs{display:flex;padding:0 11px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{border-bottom:2.5px solid transparent;padding:9px 10px;font-size:12.5px;font-weight:700;color:var(--faint);white-space:nowrap}
.tab.on{color:var(--ink);border-bottom-color:var(--ink)}
.pane{padding:14px 18px 22px}

/* ---------- 공통 블록 ---------- */
h4.sec{margin:18px 0 7px;font-size:12px;font-weight:800;color:var(--dim);letter-spacing:.02em;display:flex;align-items:center;gap:6px}
h4.sec:first-child{margin-top:0}
h4.sec .src{font-weight:600;color:var(--faint);font-size:10.5px;border:1px solid var(--line);border-radius:4px;padding:0 5px}
.card{border:1px solid var(--line);border-radius:7px;padding:11px 13px;background:var(--sunk);font-size:13.5px;margin-bottom:8px}
.card.plain{background:var(--panel)}
.spotlight{border:2px solid var(--ink);border-radius:9px;padding:12px 14px;background:var(--sunk);margin-bottom:10px}
.spotlight .lbl{font-size:10.5px;font-weight:800;letter-spacing:.03em;background:var(--ink);color:var(--bg);
  border-radius:4px;padding:2px 7px;display:inline-block;margin-bottom:6px}
.spotlight .big{font-size:16px;font-weight:700;line-height:1.5}
.spotlight .sub{font-size:11.5px;color:var(--dim);margin-top:6px}
.hint{font-size:12px;color:var(--dim);background:var(--sunk);border:1px solid var(--line);border-radius:7px;padding:8px 11px;margin-bottom:12px}
.warn{font-size:12px;color:var(--ink);background:var(--sunk);border:1.5px dashed var(--line2);border-radius:7px;padding:9px 12px;margin-bottom:12px}
ul.tight{margin:4px 0;padding-left:17px}
ul.tight li{margin:2px 0}
.lv{display:grid;grid-template-columns:28px 1fr;gap:10px;margin-bottom:10px;align-items:start}
.lvb{width:28px;height:28px;border-radius:6px;display:grid;place-items:center;font-weight:800;font-size:13px;border:1.5px solid var(--ink)}
.lv-A .lvb{background:var(--ink);color:var(--bg)}
.lv-B .lvb{background:var(--dim);color:var(--bg);border-color:var(--dim)}
.lv-C .lvb{background:transparent}
.lvt{padding-top:2px;font-size:14px}
.catname{font-size:10.5px;font-weight:800;color:var(--faint);letter-spacing:.03em;margin-bottom:2px}
.pill{display:inline-block;border:1px solid var(--line2);border-radius:999px;padding:2px 9px;font-size:11.5px;font-weight:700;color:var(--dim);margin:2px 3px 2px 0}
.pill.solid{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:640px){.grid3{grid-template-columns:1fr}}
mark{background:var(--mark);font-weight:700;border-radius:2px;padding:0 1px}

/* ---------- 연관 / 위계 ---------- */
.rel{border:1px solid var(--line);border-radius:7px;padding:9px 11px;margin-bottom:7px;cursor:pointer;background:var(--panel)}
.rel:hover{border-color:var(--ink);background:var(--sunk)}
.relhead{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.score{margin-left:auto;font-size:10px;font-weight:800;color:var(--dim);border:1px solid var(--line2);border-radius:999px;padding:1px 6px}
.kw{border:1px solid var(--line2);border-radius:4px;padding:1px 6px;font-size:10.5px;font-weight:700;color:var(--dim);margin:4px 3px 0 0;display:inline-block}
.tl{position:relative;padding-left:15px}
.tl:before{content:"";position:absolute;left:4px;top:6px;bottom:6px;width:1.5px;background:var(--line2)}
.tlband{position:relative;margin-bottom:14px}
.tlband:before{content:"";position:absolute;left:-15px;top:7px;width:9px;height:9px;border-radius:50%;background:var(--bg);border:2px solid var(--ink)}
.tlband.cur:before{background:var(--ink)}
.tlname{font-size:11.5px;font-weight:800;color:var(--dim);margin-bottom:5px}
.tlrow{display:flex;gap:8px;padding:5px 8px;border:1px solid var(--line);border-radius:6px;margin-bottom:4px;cursor:pointer;font-size:12.5px;align-items:flex-start}
.tlrow:hover{border-color:var(--ink);background:var(--sunk)}
.tlrow.me{border-color:var(--ink);background:var(--sunk2);font-weight:600}
.tlrow .code{white-space:nowrap;flex:none}

/* ---------- 개념 지도 ---------- */
.mapwrap{position:relative;border:1px solid var(--line);border-radius:7px;background:var(--sunk);overflow:hidden}
.mapbar{display:flex;gap:5px;flex-wrap:wrap;padding:7px 9px;border-bottom:1px solid var(--line);background:var(--panel);align-items:center}
svg.map{display:block;width:100%;height:560px;cursor:grab;touch-action:none}
svg.map.drag{cursor:grabbing}
.map .edge{stroke:var(--line2);fill:none}
.map .edge.seq{stroke-dasharray:5 3}
.map .edge.hot{stroke:var(--ink);stroke-width:1.8}
.map .nd{cursor:pointer}
.map .nd .box{fill:var(--panel);stroke:var(--line2);stroke-width:1.2}
.map .nd.center .box{fill:var(--ink);stroke:var(--ink)}
.map .nd.center text{fill:var(--bg)}
.map .nd.concept .box{fill:var(--sunk2)}
.map .nd.dom .box{stroke:var(--ink);stroke-dasharray:3 2}
.map .nd:hover .box{stroke:var(--ink);stroke-width:2}
.map text{fill:var(--ink);pointer-events:none;font-family:inherit}
.legend{display:flex;gap:11px;flex-wrap:wrap;font-size:11px;color:var(--dim);margin-top:8px}
.legend span{display:flex;align-items:center;gap:4px}
.legend i{width:15px;height:0;border-top:1.5px solid var(--line2);display:inline-block}
.legend i.d{border-top-style:dashed}
.legend b{width:10px;height:10px;border:1.5px solid var(--line2);background:var(--sunk2);border-radius:50%;display:inline-block}
.legend b.sq{border-radius:3px;background:var(--panel)}

/* ---------- 담기 바 / 푸터 / 모달 ---------- */
.cart{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--panel);border-top:1px solid var(--line2);
  padding:8px 15px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.cart[hidden]{display:none}
footer{padding:15px;text-align:center;font-size:11px;color:var(--faint);border-top:1px solid var(--line);line-height:1.7}
footer a{color:var(--faint);text-decoration:none}
dialog{border:1px solid var(--line2);border-radius:12px;padding:0;max-width:min(780px,94vw);width:100%;background:var(--panel);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.5)}
.mhead{display:flex;align-items:center;padding:13px 18px;border-bottom:1px solid var(--line);font-weight:800;font-size:15px}
.mbody{padding:16px 20px 20px;max-height:72vh;overflow:auto;font-size:13.5px}
.mbody h4{margin:14px 0 5px;font-size:13px}
.mbody ul{margin:5px 0;padding-left:17px}
.mbody code{background:var(--sunk2);border-radius:3px;padding:1px 5px;font-family:"Consolas",monospace;font-size:12px}
.x{margin-left:auto;border:1px solid var(--line);border-radius:6px;width:28px;height:28px;font-size:15px;color:var(--dim)}
#loading{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);z-index:99;font-size:13px;color:var(--dim)}

@media (max-width:920px){
  main{grid-template-columns:1fr}
  .col.detailcol{position:fixed;inset:0;z-index:50;border-radius:0;overflow:auto;display:none}
  .col.detailcol.open{display:block}
  .list{max-height:none}
  .backbtn{display:inline-block!important}
}
.backbtn{display:none}
@media print{
  header,.cart,.tabs,.dact,.col.listcol,.btn,.backbtn,footer,.mapwrap{display:none!important}
  body{background:#fff}main{display:block;padding:0}.col{border:0}
  .printarea{display:block!important}
}
.printarea{display:none}

.step{margin:6px 0}
.stephd{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:4px}
.stept{font-weight:700}
.pill.mark{background:#111;color:#fff;border-color:#111}
.sub2{font-size:12.5px;color:var(--dim);margin:2px 0 8px}
.rub{display:flex;gap:7px;align-items:flex-start;margin:4px 0;line-height:1.55}
.rub .pill{flex:none;margin-top:2px}
.lenswhy{font-size:12px;color:var(--dim);margin-top:3px}
.card.hit{border-color:#111;border-width:2px}
blockquote.quote{margin:8px 0;padding:10px 14px;border-left:3px solid #111;background:var(--soft,#f6f6f6);border-radius:0 6px 6px 0;line-height:1.65}
.src{font-size:11.5px;color:var(--dim);margin-top:6px}
.mapwrap{position:relative}
.peek{position:absolute;right:10px;top:52px;width:min(340px,calc(100% - 24px));
  background:var(--bg,#fff);border:1px solid var(--line,#ddd);border-radius:10px;
  box-shadow:0 6px 24px rgba(0,0,0,.14);padding:12px 14px 10px;z-index:5;max-height:calc(100% - 70px);overflow:auto}
.peekx{position:absolute;right:8px;top:6px;border:0;background:none;cursor:pointer;font-size:14px;color:var(--dim)}
.peekcode{font-weight:700;margin:4px 0 2px}
.peektext{line-height:1.6}
.peekhae{font-size:12.5px;color:var(--dim);margin-top:6px;line-height:1.55}
.peek .dact{margin-top:10px;display:flex;gap:6px;flex-wrap:wrap}
.backbtn+.backbtn{margin-left:6px}
</style>
</head>
<body>
<div id="loading">자료를 불러오는 중…</div>

<header>
  <div class="hrow">
    <div class="brand">2022 개정 교육과정 초등 수업 설계 도우미<small>성취기준 · 성취수준 · 내용 체계 · 개념 기반 탐구</small></div>
    <div class="searchwrap">
      <span class="ico">🔎</span>
      <input id="q" type="search" placeholder="낱말 일부만 넣어도 찾습니다 — 생태, 자료분석, 2국01, ㅅㅌㅎㄱ" autocomplete="off" spellcheck="false">
      <button class="clr" id="clr" hidden>지우기</button>
    </div>
    <div style="flex:1"></div>
    <button class="btn" id="btnGuide">교과 살펴보기</button>
    <button class="btn" id="btnHelp">도움말</button>
    <button class="btn" id="btnTheme">야간</button>
  </div>
  <div class="filters">
    <div class="frow"><span class="flabel">학년군</span><span id="fBand" style="display:contents"></span></div>
    <div class="frow"><span class="flabel">교과</span><span id="fSubj" style="display:contents"></span></div>
    <div class="frow" id="areaRow"><span class="flabel">영역</span><span id="fArea" style="display:contents"></span></div>
  </div>
</header>

<main>
  <section class="col listcol">
    <div class="listhead">
      <b id="cnt">0건</b><span id="scope"></span>
      <span style="flex:1"></span>
      <button class="btn sm" id="btnSort" hidden>관련도 순</button>
      <button class="btn sm" id="btnAll">전체 담기</button>
    </div>
    <div class="list" id="list"></div>
  </section>
  <section class="col detailcol" id="detailcol"><div id="detail"></div></section>
</main>

<div class="cart" id="cart" hidden>
  <b id="cartN">0개</b><span style="color:var(--dim);font-size:12px">수업 바구니</span>
  <span style="flex:1"></span>
  <button class="btn" id="cartView">목록</button>
  <button class="btn" id="cartCopy">표로 복사</button>
  <button class="btn" id="cartCsv">CSV</button>
  <button class="btn" id="cartPlan">평가계획 CSV</button>
  <button class="btn" id="cartDoc">Word 문서</button>
  <button class="btn on" id="cartMd">MD 내려받기</button>
  <button class="btn" id="cartPrint">인쇄/PDF</button>
  <button class="btn" id="cartClear">비우기</button>
</div>

<footer>
  제작: 하는교사(<a href="mailto:4lolo@naver.com">4lolo@naver.com</a>)<br>
  <span id="srcline"></span>
</footer>

<dialog id="dlg"><div class="mhead"><span id="dlgTitle"></span><button class="x" onclick="dlg.close()">✕</button></div><div class="mbody" id="dlgBody"></div></dialog>
<div class="printarea" id="printarea"></div>

<script>
/* ============================================================
   2022 개정 교육과정 초등 수업 설계 도우미 — 핵심 로직
   ============================================================ */
const $ = s => document.querySelector(s);
const el = (t,c,x) => { const n=document.createElement(t); if(c) n.className=c; if(x!=null) n.textContent=x; return n; };
const svgEl = (t,a) => { const n=document.createElementNS('http://www.w3.org/2000/svg',t);
  for(const k in (a||{})) n.setAttribute(k,a[k]); return n; };

let BANDS, SUBJ, STD, AREA, DOM, GUIDE, SMETA;
const CATS = ['지식·이해','과정·기능','가치·태도'];
const shortBand = b => (b||'').replace('초등 ','');

/* ---------- 정규화 / 초성 ---------- */
const CHO=['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
const norm = s => (s||'').toLowerCase().replace(/[･ㆍ・•⋅]/g,'·').replace(/[‘’'"“”]/g,'').replace(/\s+/g,'');
function chosung(s){ let o=''; for(const ch of (s||'')){ const c=ch.charCodeAt(0);
  if(c>=0xAC00&&c<=0xD7A3) o+=CHO[Math.floor((c-0xAC00)/588)]; else if(c>=0x3131&&c<=0x314E) o+=ch; } return o; }
const isChoQuery = s => /^[ㄱ-ㅎ]{2,}$/.test(s.replace(/\s+/g,''));

/* ---------- 형태 정리 / 토큰 ---------- */
const JOSA=/(으로써|으로서|이라는|라는|에서의|에게서|으로|에서|에게|부터|까지|보다|처럼|과의|와의|의|을|를|이|가|은|는|에|와|과|로|도|만|나|며|고)$/;
const EOMI=/(하였다|하였고|합니다|한다|하는|하여|하고|하며|하기|할|함|됨|되는|되어|되고|된|있다|있는|이다|으면서|면서|인|적인|적으로|적|들)$/;
const STOP=new Set(('수 등 및 것 그 이 저 때 더 잘 또 통해 위해 위한 위하여 대해 관해 다양 다양한 여러 여러가지 '+
 '가지 자신 우리 서로 무엇 어떻 있다 있음 한다 하기 대한 관한 알맞 알맞은 적절 적절한 정확 정확하게 부분 부분적 '+
 '일부 적극 적극적 다소 대체 대체로 능숙 간단 간단한 안내 절차 주어진 제시 따라 찾아 구체 다른 기본 바탕 통하여 '+
 '대략 가진다 갖는다 지닌다 성취 기준 수준 학생 학습 평가 영역 학년 학년군 초등학교 중학교').split(' '));
function tokens(text){
  const out=[];
  for(let w of (text||'').replace(/[^가-힣A-Za-z0-9\s]/g,' ').split(/\s+/)){
    if(!w) continue;
    if(/^[A-Za-z0-9]+$/.test(w)){ if(w.length>1) out.push(w.toLowerCase()); continue; }
    let t=w;
    for(let k=0;k<2;k++){ const b=t; t=t.replace(EOMI,''); t=t.replace(JOSA,''); if(t===b) break; }
    if(t.length>=2&&t.length<=9&&!STOP.has(t)) out.push(t);
    if(t.length>=6){ const h=t.slice(0,4); if(!STOP.has(h)) out.push(h); }
  }
  return out;
}

/* ---------- 색인 ---------- */
const AREAIDX=new Map(), DOMIDX=new Map();
let DF=new Map(), N=0, ALLTEXT=null;

function buildIndex(){
  AREA.forEach(a=>AREAIDX.set(a.b+'|'+a.s+'|'+a.ak, a));
  for(const subj in DOM) DOM[subj].forEach(d=>DOMIDX.set(subj+'|'+d.name, d));
  STD.forEach((r,i)=>{
    r.i=i; r.band=BANDS[r.b]; r.subj=SUBJ[r.s];
    r._head=norm(r.c+r.t+r.a+r.subj+r.band);
    r._body=norm(r.A+r.B+r.C+(r.hae||''));
    r._cho=chosung(r.t+' '+r.a);
  });
  N=STD.length;
  STD.forEach(r=>{
    const tf=new Map();
    tokens(r.t).forEach(t=>tf.set(t,(tf.get(t)||0)+3));
    tokens(r.A+' '+r.B+' '+r.C).forEach(t=>tf.set(t,(tf.get(t)||0)+1));
    (r.q||[]).forEach(x=>tokens(x).forEach(t=>tf.set(t,(tf.get(t)||0)+1)));
    if(r.hae) tokens(r.hae).forEach(t=>tf.set(t,(tf.get(t)||0)+1));
    r._tf=tf; for(const t of tf.keys()) DF.set(t,(DF.get(t)||0)+1);
  });
  STD.forEach(r=>{ r._v=vecFromTf(r._tf); });
}
function vecFromTf(tf){
  const v=new Map(); let s=0;
  for(const [t,f] of tf){ const df=DF.get(t); if(!df||df>N*0.35) continue;
    const w=(1+Math.log(f))*Math.log(N/df); v.set(t,w); s+=w*w; }
  const nr=Math.sqrt(s)||1; for(const [t,w] of v) v.set(t,w/nr); return v;
}
function vecOfText(t){ const tf=new Map(); tokens(t).forEach(x=>tf.set(x,(tf.get(x)||0)+1)); return vecFromTf(tf); }
function cos(a,b){ let d=0; const s=a.size<b.size?a:b, g=s===a?b:a;
  for(const [t,w] of s){ const u=g.get(t); if(u) d+=w*u; } return d; }

const areaOf = r => AREAIDX.get(r.b+'|'+r.s+'|'+r.ak);

const guideKey = r => (GUIDE[r.subj+'|'+r.a] ? r.subj+'|'+r.a
                     : (GUIDE[r.subj+'|'+(r.dom||'')] ? r.subj+'|'+(r.dom||'') : null));

/* 과학은 단원마다 <탐구 활동>을 따로 제시한다. 고려 사항과 섞으면 안 된다. */

/* 고려 사항 가운데 이 성취기준을 바로 풀이하는 대목을 가려낸다.
   그런 대목은 해설과 함께 인용으로 드러내야 선생님이 놓치지 않는다. */
function guideRows(r){
  if(r._gr) return r._gr;
  const k=guideKey(r); if(!k) return r._gr=[];
  const gd=GUIDE[k]||[], pgs=(typeof GUIDEPG!=='undefined'? (GUIDEPG[k]||[]) : []);
  const key=(r.t+' '+(r.hae||'')).replace(/\s/g,'');
  return r._gr=gd.map((t,i)=>{
    const a=t.replace(/\s/g,''); let hit=0;
    for(let j=0;j+3<=a.length;j++) if(key.includes(a.slice(j,j+3))) hit++;
    const need=Math.max(4, Math.min(10, Math.round(a.length*0.10)));
    return {t:t, pg:pgs[i], direct: a.length>=28 && hit>=need};
  });
}
/* 내용 체계에서 이 성취기준 학년군의 범주별 내용 요소 */
/* 교과마다 내용 체계의 결이 다르다. 국어·사회·과학·영어는 한 영역이 다시
   하위 범주로 갈린다(과학의 '고체 지구·유체 지구·천체' 등). 성취기준이 어느
   하위 범주에 놓이는지 가려내야 엉뚱한 내용 요소가 딸려 오지 않는다. */
function subPick(r){
  if(r._sub!==undefined) return r._sub;
  const d=domOf(r);
  r._sub=null;
  if(d&&d.sub){
    const own=(r.t+' '+(r.hae||'')+' '+((guideOf(r)||[]).join(' '))+' '+(r.a||'')).replace(/\s/g,'');
    // 여러 하위 범주에 두루 나오는 말('우리나라의' 같은)은 가려내는 힘이 없다
    if(!d._sw){
      const cnt={}, nsub=new Set();
      CATS.forEach(c2=>{ const it=(d.content[c2]||{})[r.band]||[], sv=((d.sub||{})[c2]||{})[r.band]||[];
        it.forEach((x,i)=>{ if(!sv[i]) return; nsub.add(sv[i]);
          const a=x.replace(/\s/g,''); const seen=new Set();
          for(let j=0;j+2<=a.length;j++) seen.add(a.slice(j,j+2));
          seen.forEach(w=>{ (cnt[w]=cnt[w]||new Set()).add(sv[i]); }); }); });
      d._sw=new Set(Object.keys(cnt).filter(w=>cnt[w].size > Math.max(1, nsub.size/2)));
    }
    const sc={};
    CATS.forEach(c=>{
      const items=(d.content[c]||{})[r.band]||[], subs=((d.sub||{})[c]||{})[r.band]||[];
      items.forEach((it,i)=>{ const sb=subs[i]; if(!sb) return;
        const a=it.replace(/\s/g,''); let n=0;
        for(let j=0;j+2<=a.length;j++){ const w=a.slice(j,j+2);
          if(!d._sw.has(w) && own.includes(w)) n++; }
        sc[sb]=(sc[sb]||0)+n; });
    });
    const ks=Object.keys(sc).sort((x,y)=>sc[y]-sc[x]);
    if(ks.length && sc[ks[0]]>=3 && sc[ks[0]] > (sc[ks[1]]||0)) r._sub=ks[0];
  }
  return r._sub;
}
function contentOf(r){
  const d=domOf(r); if(!d) return null;
  const sb=subPick(r);
  const out={}; let any=false;
  CATS.forEach(c=>{ let v=(d.content[c]||{})[r.band]; if(!v||!v.length) return;
    if(sb){ const subs=((d.sub||{})[c]||{})[r.band]||[];
      const f=v.filter((x,i)=>!subs[i]||subs[i]===sb);
      if(f.length) v=f; }
    out[c]=v; any=true; });
  return any?out:null;
}
/* 그 영역 전체(하위 범주로 좁히기 전)의 내용 요소 */
function contentAllOf(r){
  const d=domOf(r); if(!d) return null;
  const out={}; let any=false;
  CATS.forEach(c=>{ const v=(d.content[c]||{})[r.band]; if(v&&v.length){ out[c]=v; any=true; } });
  return any?out:null;
}

/* ---------- 개념어 ----------
   개념 기반 탐구의 '개념'은 옮겨 쓸 수 있는 이름씨여야 한다.
   조사를 단서로 이름씨만 뽑고, 관형어(중요한)와 용언 어간(일어난·고려하)은 버린다. */
const JOSA_N = /([가-힣]{2,8})(으로써|으로서|이라는|에서의|에게서|이나|에게|에서|으로|보다|처럼|과의|와의|을|를|이|가|은|는|의|에|와|과|로|도)(?=[\s,.]|$)/g;
const STEM_N = /[하되지나오우거려]$/;
/* 개념으로 삼을 수 없는 두루뭉술한 말 */
/* 개념 목록에는 남기되, 일반화 문장의 짝으로는 쓰지 않는 말 */
const ABSTRACT = /^(의미|뜻|특징|특성|유형|종류|조건|기준|역할|성질|상태|형태|모양|생김새|원리|개념|요소|대상|방법|과정|결과|위치|기능|쓰임|구조|모형|기법|주법|표현|감상|이해|활용|적용|분류|비교|관찰|조사|탐구|설명|파악|확인|점검|조정|생성|추론|해석|수집|계산|측정|실천|참여|변화|관계|영향|정의|종류별|사례|자료|정보|내용별|측정기|장치|기구|도구|자료|기준별)$/;
const NOTCON = /^(내용|것|때|수|방법|활동|생각|사람|우리|자신|여러|다양|이해|사용|관련|필요|중요|모습|경우|이것|저것|여기|거기|정도|하나|가지|자기|서로|모두|다른|같은|위해|통해|바탕|중심|이상|이하|이때|무엇|어떤|여러 가지|점|일|말|글|것들|친구|선생|학교|공부|학습|수업|시간|장소|측정기|장치|기구|일상생활|생활|사회|주변|있음|자연|세계|현상|종류|상황|과학|물체들|것임|위해서|대해서|통해서|위하여|이루|자라|한살|하기|되기|흥미|관심|호기심|즐거움|보람|자신감|참여|노력|실천)$/;
const ACTION_N = /^(파악|확인|조직|활용|표현|비교|분석|조사|관찰|이해|감상|정리|구성|점검|조정|선별|재구성|생성|추론|평가|해석|적용|탐색|탐구|설명|제시|수집|계산|측정|분류|실천|참여)$/;
function nounsOf(text){
  const out=[]; const re=new RegExp(JOSA_N.source,'g'); let m;
  while((m=re.exec((text||'')+' '))!==null){
    let w=m[1].replace(/들$/,'').replace(/적$/,'');
    if(m[2]==='이' && w.length<=3) continue;      // '말놀이'가 '말놀'로 잘리는 것을 막는다
    if(w.length<2) continue;
    if(w.length<=5 && STEM_N.test(w)) continue;
    if(NOTCON.test(w)) continue;
    if(/(으|인가|는가|ㄴ가)$/.test(w)) continue;
    if(!out.includes(w)) out.push(w);
  }
  return out;
}
/* 내용 요소에서 개념 뽑기 — 지식·이해는 통째로, 과정·기능은 다루는 대상만 */
function conceptOfElement(x, whole){
  let s=(x||'').replace(/\s*하기$/,'').trim();
  if(!s) return null;
  if(whole) return (s.length>=2 && s.length<=14) ? s : null;
  const byJosa=nounsOf(s);
  if(byJosa.length) return byJosa[0];
  let w=s.split(/\s+/);
  if(w.length>1 && ACTION_N.test(w[w.length-1])) w=w.slice(0,-1);
  let c=(w[w.length-1]||'').replace(/(으로|로|에|을|를|이|가|은|는|의|와|과)$/,'');
  if(c.length<2 || (c.length<=5 && STEM_N.test(c)) || NOTCON.test(c)) return null;
  return c.length<=12 ? c : null;
}
/* 내용 요소가 이 성취기준과 실제로 맞물리는지 (헛겹침을 막으려 3글자 이상으로 본다) */
function relatedTo(x, own){
  if(!x) return false;
  const a=(x||'').replace(/\s/g,''), b=(own||'').replace(/\s/g,'');
  if(a.length<2) return false;
  if(a.length<=3) return b.includes(a);
  for(let i=0;i+3<=a.length;i++) if(b.includes(a.slice(i,i+3))) return true;
  return false;
}
/* 내용 요소가 이 성취기준을 정말 가리키는지 — 요소의 알맹이 낱말이 성취기준에 있어야 한다.
   '동물의 생활' 성취기준에 '동물의 한살이'가 딸려 오는 것을 막는다. */
function coreWord(x){
  const w=(x||'').replace(/[·,()]/g,' ').split(/\s+/).filter(Boolean);
  if(!w.length) return '';
  return w[w.length-1].replace(/(의|을|를|이|가|은|는|와|과|에|로)$/,'');
}
function relatedCore(x, own){
  const cw=coreWord(x);
  if(cw.length<2) return false;
  return own.replace(/\s/g,'').includes(cw);
}
/* 성취기준이 다루는 대상을 뽑는다.
   목적어('~을/를')를 먼저 보고, 없으면 주어('~은/는/이/가')를 본다.
   '계절 변화의 원인을 …' -> '계절 변화',  '뼈와 근육의 생김새를 …' -> '뼈와 근육' */
const MODI=/^(여러 가지|여러|다양한|간단한|기본적인|알맞은|적절한|주변의|일상생활에서|생활 속|우리|하루 동안|자신의|서로 다른)\s+/;
function topicOf(r){
  if(r._topic!==undefined) return r._topic;
  const t=(r.t||'').replace(/\s+/g,' ');
  let head='';
  // '낮과 밤이 생기는 이유', '계절 변화의 원인' — 까닭이 걸린 그 대상이 주제다
  const mc=t.match(/([가-힣][가-힣\s]{1,20}?)(?:이|가|의)?\s*(?:생기는|나타나는|일어나는|달라지는|되는)?\s*(?:원인|이유|까닭)/);
  if(mc){
    let h=mc[1].replace(/^.*?(?:을|를|으로|로|에서)\s+/,'').trim();
    h=h.replace(MODI,'').trim();
    h=h.replace(/\s*(발생하는|생기는|나타나는|일어나는|되는|하는)$/,'').trim();
    h=h.replace(/(이|가|은|는)$/,'').trim();
    if(h.length>=2 && h.length<=14 && !NOTCON.test(h)) return r._topic=h;
  }
  const m=t.match(/^(.*?)(?:을|를)\s/);
  if(m) head=m[1];
  else { const m2=t.match(/^(.*?)(?:은|는|이|가)\s/); if(m2) head=m2[1]; }
  if(!head) head=t;
  // 여럿을 늘어놓았으면 첫 번째가 대표다
  head=head.split(/\s*,\s*/)[0];
  // 앞에 붙은 조건·도구 구절을 덜어 낸다
  head=head.replace(/^.*?(?:으로써|으로서|로써|로서|을 통해|를 통해|을 통하여|를 통하여|에서)\s+/, '');
  head=head.replace(/^.*?(?:으로|로)\s+/, '');
  head=head.replace(/^(인해|말미암아|하여|해서|인하여)\s+/, '');
  head=head.replace(MODI, '').trim();
  // '~의 원인/특징/방법' 같은 꼬리를 덜어 대상만 남긴다
  let x=trimTail(head) || head;
  x=x.replace(/(과|와)\s*같은.*$/, '').trim();
  // 'A와 B 사이의 …' 는 A가 대표다
  x=x.replace(/(\s|^)사이$/,'').trim();
  if(x.length>14){
    const cut=x.match(/^(.*?)(?:과|와)\s/);          // 여럿을 늘어놓았으면 앞것
    if(cut && cut[1].trim().length>=2) x=cut[1].trim();
    if(x.length>14){ const w=x.split(' '); x=w.slice(-2).join(' '); }
  }
  x=trimTail(x) || x;
  // 이름씨가 아니면 개념으로 쓸 수 없다. 조각이면 아예 버리고 내용 요소에 맡긴다.
  if(/(때|것|수|점|일)$/.test(x) && x.length<=6) x='';
  if(/(하는|되는|이는|있는|없는|가는|오는|주는|짓는|한|된|운|는)$/.test(x)) x='';
  if(/(함|됨|짐|림|남|늠)$/.test(x)) x='';
  if(/(하고|하며|하여|되어|되고|이고|보고|알고|치고|나고)$/.test(x)) x='';
  if(/(에|에서|으로|로|와|과|의|을|를|이|가|은|는|도|만)$/.test(x)) x='';
  if(/(되|하)$/.test(x)) x='';
  if(/(다|을|를|은|는|의|과|와)$/.test(x) && /\s/.test(x)) x='';
  if(/(적|간)$/.test(x) && x.length<=4) x='';
  if(/(하는|되는|드는|나는|지는|생기는|발생하는)$/.test(x)) x='';
  if(/(하고|하며|하여|되어|되고)\s[가-힣]$/.test(x)) x='';   // '관찰하고 그' 같은 조각
  if(/(지|나|오|우|거|려|리|치|피|비)$/.test(x) && x.length<=4) x='';
  if(x.length<2 || NOTCON.test(x) || ABSTRACT.test(x)) x='';
  return r._topic=x;
}
/* '동물 분류·바다의 특징·도구의 이용'처럼 뒤에 붙은 행위·속성 말을 떼어
   가리키는 대상만 남긴다. 남는 말이 시원치 않으면 그 개념은 버린다. */
const TAIL=/\s*(의)?\s*(분류|이용|활용|특징|특성|조건|성질|상태|방법|과정|구조|기능|역할|종류|모습|현상|원인|이유|까닭|생김새|차이|관계|의미|필요성|중요성|사례|정도|경우|영향)$/;
const ATTTAIL=/\s*(에|에 대한|을|를)?\s*(흥미|관심|호기심|즐거움|자신감|태도|습관|의욕)$/;
function trimTail(x){
  x=(x||'').trim();
  if(ATTTAIL.test(x)){
    const h=x.replace(ATTTAIL,'').replace(/(의|을|를|이|가|은|는|에)$/,'').trim();
    if(h.length>=2 && !NOTCON.test(h)) return h;
    return '';
  }
  x=(x||'').trim();
  if(!TAIL.test(x)) return x;
  const head=x.replace(TAIL,'').replace(/(의|을|를|이|가|은|는)$/,'').trim();
  if(head.length<2) return '';
  if(NOTCON.test(head) || /^(세|네|두|여러|다양한|여러 가지|한|자라는|이루는)/.test(head)) return '';
  return head;
}
/* 개념은 문장에 넣어 읽을 만큼 짧아야 한다 */
function shortConcept(x){
  x=(x||'').trim();
  if(x.length<=9) return x;
  const w=x.split(/\s+/);
  if(w.length>=2){ const t=w.slice(-2).join(' '); if(t.length<=12) return t; }
  return w[w.length-1] || x;
}
function conceptsOf(r,k){
  if(!r._con){
    const ct=contentOf(r)||{};
    const out=[];
    const push=x=>{ if(!x||x.length<2||NOTCON.test(x)) return;
      if(/(하고|하며|하여|되어|되$|하$|함$|됨$)/.test(x)) return;
      if(/적$/.test(x) && x.length<=4) return;        // '음악적' 같은 매김씨는 개념이 아니다
      if(/(을|를|은|는|의|과|와|에|로|가|이)$/.test(x) && /\s/.test(x)) return;
      if(/(하는|되는|나타난|믿은|같은|다른|여러)$/.test(x)) return;
      if(/(다|을|를|은|는|이|가|의|과|와)$/.test(x) && x.length<=6 && /\s/.test(x)) return;
      if(out.some(o=>o===x||o.includes(x)||x.includes(o))) return;
      out.push(x); };
    const own = r.t + ' ' + (r.hae || '');
    const related = x => relatedTo(x, own);
    // ⓪ 성취기준이 다루는 대상이 으뜸이다.
    //    내용 요소에 같은 것을 가리키는 말이 있으면 원문 표현을 쓴다.
    const tp = topicOf(r);
    if(tp){
      const flat0 = tp.replace(/\s/g,'');
      let best = '';
      (ct['지식·이해']||[]).filter(usable).forEach(x=>{
        const cc = trimTail(shortConcept(conceptOfElement(x,true)));
        if(!cc) return;
        const a = cc.replace(/\s/g,'');
        if(a===flat0 || flat0.includes(a) || a.includes(flat0)){
          if(!best || Math.abs(cc.length-tp.length) < Math.abs(best.length-tp.length)) best=cc;
        }
      });
      push(best || tp);
    }
    // ① 내용 요소는 교육과정이 쓴 낱말 그대로라 가장 믿을 만하다.
    //    하위 범주로 좁혀 두었으므로 이 성취기준과 맞물리는 것만 남는다.
    const flat=own.replace(/\s/g,'');
    const ov=x=>{ const a=(x||'').replace(/\s/g,''); let n=0;
      for(let i=0;i+2<=a.length;i++) if(flat.includes(a.slice(i,i+2))) n++;
      return n; };
    (ct['지식·이해']||[]).filter(usable).filter(x=>relatedCore(x, own))
      .map(x=>[x, ov(x)]).sort((a,b)=>b[1]-a[1])
      .forEach(z=>{ const cc=conceptOfElement(z[0],true);
        if(cc) push(trimTail(shortConcept(cc))); });
    // ② 그 다음이 성취기준에서 뽑은 이름씨
    nounsOf(r.t).slice(0,4).forEach(push);
    (ct['과정·기능']||[]).filter(usable).forEach(x=>{ const cc=conceptOfElement(x,false);
      if(cc && related(cc)) push(trimTail(shortConcept(cc))); });
    if(out.length<2){
      (ct['지식·이해']||[]).filter(usable).slice(0,2)
        .forEach(x=>push(trimTail(shortConcept(conceptOfElement(x,true)))));
    }
    if(!out.length) push(areaKeyOf(r));
    r._con=out.slice(0,6);
  }
  return k? r._con.slice(0,k) : r._con;
}
const CONIDX=new Map();
function buildConceptIndex(){
  STD.forEach(r=>conceptsOf(r,6).forEach(t=>{ if(!CONIDX.has(t)) CONIDX.set(t,[]); CONIDX.get(t).push(r); }));
}

const CATRULE=[
  [/이해한다|이해하고|안다|알고|알며|설명한다|설명하고|파악한다|파악하고|인식한다|구별한다|구분한다|의미를|개념을|특징을|원리를/g,0],
  [/탐구한다|탐구하고|조사한다|조사하고|분석한다|분석하고|비교한다|비교하고|관찰한다|관찰하고|표현한다|표현하고|나타낸다|만든다|만들고|설계한다|해결한다|활용한다|수행한다|그린다|연주한다|발표한다|토의한다|토론한다|측정한다|계산한다|읽는다|쓴다|말한다|듣는다/g,1],
  [/태도를|흥미를|관심을|실천한다|실천하며|존중한다|존중하며|노력한다|즐긴다|참여한다|참여하며|기른다|가진다|지닌다|갖는다|배려한다|감상한다|공감한다/g,2],
];
const AVEC=new Map();
function areaCatVec(a,cat){
  const k=a.b+'|'+a.s+'|'+a.ak+'|'+cat;
  if(!AVEC.has(k)){ let t='';
    for(const L of ['A','B','C']){ const d=a.L[L]; if(d) for(const c in d) if(c===cat) t+=' '+d[c]; }
    AVEC.set(k, t.trim()? vecOfText(t) : new Map()); }
  return AVEC.get(k);
}
function catProfile(r){
  if(r._prof) return r._prof;
  const rule=[0,0,0];
  CATRULE.forEach(([re,i])=>{ const m=r.t.match(re); if(m) rule[i]+=m.length; });
  const sim=[0,0,0], a=areaOf(r);
  if(a) CATS.forEach((c,i)=>{ sim[i]=cos(r._v, areaCatVec(a,c)); });
  const nz=(v,sm)=>{ const w=v.map(x=>x+sm), s=w.reduce((x,y)=>x+y,0); return w.map(x=>x/s); };
  const R=nz(rule.map(x=>Math.log(1+x)),0.32), S=nz(sim,0.02);
  let p=[0,1,2].map(i=>R[i]*0.62+S[i]*0.38);
  const s=p.reduce((x,y)=>x+y,0);
  return r._prof = s>0? p.map(x=>x/s) : [1/3,1/3,1/3];
}
const mainCat = r => CATS[catProfile(r).indexOf(Math.max(...catProfile(r)))];

/* 받침에 따라 조사를 고른다 */
function jong(w){ if(!w) return false; const c=w.charCodeAt(w.length-1);
  if(c<0xAC00||c>0xD7A3) return /[013678lmnprt]$/i.test(w); return ((c-0xAC00)%28)!==0; }
function J(w,a,b){
  w=(w||'').trim();
  if((a==='으로'&&b==='로')||(a==='로'&&b==='으로')){
    const c=w.charCodeAt(w.length-1);
    const jc=(c>=0xAC00&&c<=0xD7A3)?((c-0xAC00)%28):0;
    return w + ((jc===0||jc===8)?'로':'으로');     // 받침 없거나 'ㄹ' 이면 '로'
  }
  return w + (jong(w)?a:b);
}

  if(!x) return false;

/* 영역마다 결이 다르다. 성취기준 낱말로 가려지지 않을 때 여기에 기댄다. */
const DOMLENS={

const SUBJLENS={'국어':'소통','수학':'패턴과 규칙','사회':'관계','과학':'체계와 구조','도덕':'책임과 실천',
  '체육':'형태와 기능','음악':'표현','미술':'표현','영어':'소통','실과':'형태와 기능',
  '바른 생활':'책임과 실천','슬기로운 생활':'형태와 기능','즐거운 생활':'표현'};
function lensOf(r){
  if(r._lens) return r._lens;
  const w=[[r.t,5],[r.hae||'',2]];
  const ok=SUBJLENSOK[r.subj];
  // 글자·맞춤법 같은 기초 기능은 규칙의 문제다
  if(/자모|소릿값|소리 내어|띄어 읽|맞춤법|문장 부호|표기가 다|바르게 쓴다|정확하게 소리/.test(r.t)){
    const Lb=LENSES.find(L=>L.n==='체계와 구조');
    if(Lb && (!SUBJLENSOK[r.subj] || SUBJLENSOK[r.subj].indexOf('체계와 구조')>=0)) return r._lens=Lb;
  }
  // 성취기준이 대놓고 까닭을 묻는다면 렌즈는 정해진 것이나 다름없다
  if(/원인|이유|까닭|때문|왜 그러|영향을 미치/.test(r.t)){
    const L0=LENSES.find(L=>L.n==='원인과 결과');
    if(L0 && (!ok || ok.indexOf('원인과 결과')>=0)) return r._lens=L0;
  }
  let best=null, bs=0;
  for(const L of LENSES){
    if(ok && ok.indexOf(L.n)<0) continue;
    let sc=0;
    w.forEach(p=>{ const m=(p[0]||'').match(L.re); if(m) sc+=m.length*p[1]; });
    // 짝이 되는 말이 함께 있어야 성립하는 렌즈가 있다(형태 ↔ 기능)
    if(L.re2){ if(!L.re2.test(w.map(p=>p[0]).join(' '))) sc=0; }
    if(sc>bs){ best=L; bs=sc; }
  }
  if(!best){
    const dm=domOf(r);
    const key=r.subj+'|'+(dm?dm.name:'');
    const nm=DOMLENS[key] || SUBJLENS[r.subj] || '관계';
    best=LENSES.find(L=>L.n===nm)||LENSES[1];
  }
  return r._lens=best;
}
/* 영속적 이해: 그 영역의 핵심 아이디어 가운데 이 성취기준과 가장 가까운 원문 문장 */
function enduringOf(r){
  if(r._end!==undefined) return r._end;
  const d=domOf(r);
  if(!d||!d.idea||!d.idea.length) return r._end=null;
  /* 영역 안 모든 핵심 아이디어에 두루 나오는 말('지구와 우주'의 '지구' 같은)은
     가려내는 힘이 없다. 절반 넘게 나오는 말은 빼고 견준다. */
  if(!d._common){
    const cnt={};
    d.idea.forEach(x=>{ const seen=new Set();
      (x.match(/[가-힣]{2,}/g)||[]).forEach(w=>{
        for(let n=2;n<=Math.min(4,w.length);n++) for(let j=0;j+n<=w.length;j++) seen.add(w.slice(j,j+n));
      });
      seen.forEach(w=>cnt[w]=(cnt[w]||0)+1); });
    d._common=new Set(Object.keys(cnt).filter(w=>cnt[w] > d.idea.length/2));
  }
  const sibs=STD.filter(o=>o.s===r.s&&o.b===r.b&&o.a===r.a).map(o=>o.t).join(' ');
  const ct=contentOf(r)||{};
  const bag=r.t+' '+(r.hae||'')+' '+((guideOf(r)||[]).join(' '))+' '+sibs+' '
          + CATS.map(c=>(ct[c]||[]).join(' ')).join(' ');
  // 성취기준 쪽 낱말 조각 (영역 공통어는 뺀다)
  const keys=new Set();
  ((r.t+' '+(r.a||'')+' '+(r.hae||'')).match(/[가-힣]{2,}/g)||[]).forEach(w=>{
    for(let n=2;n<=Math.min(4,w.length);n++) for(let j=0;j+n<=w.length;j++){
      const s=w.slice(j,j+n); if(!d._common.has(s)) keys.add(s); } });
  const V=vecOfText(bag);
  const scored=d.idea.map(x=>{
    let ov=0; keys.forEach(k=>{ if(x.includes(k)) ov += (k.length>=3? 1 : 0.4); });
    return {t:x, ov:ov, cs:cos(V, vecOfText(x))};
  }).sort((a,b)=> (b.ov-a.ov) || (b.cs-a.cs));
  const top=scored[0];
  // 겹치는 말이 없으면 이 영역에 딱 맞는 문장이 없다는 뜻이다. 단정하지 않는다.
  const weak = top.ov < 1.2;
  return r._end={text:top.t, all:d.idea, domain:d.name, weak:weak,
    others:scored.slice(1,3).filter(z=>z.ov>=1.2).map(z=>z.t), sub:subPick(r)};
}
/* 일반화에 쓸 개념 짝을 고른다.
   A는 될 수 있으면 실체를 가리키는 말, B는 A와 겹치지 않는 다른 개념. */
function pickPair(cons, L, fallback){
  const solid = cons.filter(x=>!ABSTRACT.test(x));
  const A = solid[0] || cons[0] || fallback;
  const clash=(x,y)=>!x||!y||x===y||x.includes(y)||y.includes(x);
  let B = '';
  if(!L.fixB) B = solid.find(x=>!clash(x,A)) || '';
  if(!B) B = clash(L.B,A) ? (L.altB||L.B) : L.B;
  if(clash(A,B)){
    const A2 = solid.find(x=>!clash(x,B)) || cons.find(x=>!clash(x,B));
    if(A2) return [A2, B];
  }
  return [A, B];
}

/* ---------- 일반화 문장 만들기 ----------
   틀에 개념만 갈아 끼우면 611개가 스무 가지 문장으로 찍혀 나온다.
   교육과정 원문에 이미 알맹이가 있으니 그것을 먼저 쓴다. */

/* 한글 종성 붙이기 ('생기' + ㄴ -> '생긴') */
function addJong(ch, j){
  const c=ch.charCodeAt(0);
  if(c<0xAC00||c>0xD7A3) return ch;
  if((c-0xAC00)%28!==0) return ch;
  return String.fromCharCode(c+j);
}
/* '~생김을 이해하게 한다' -> '~생긴다' 처럼 이름꼴을 풀이꼴로 되돌린다 */
function toStatement(t){
  let x=(t||'').replace(/\s+/g,' ').trim().replace(/[.]+$/,'');
  // 뒤에 붙은 지도 지시를 걷어 낸다
  x=x.replace(/([가-힣])ㅁ?을\s*(이해하게|알게|알도록|이해하도록|깨닫게|인식하게)\s*한다$/, '$1');
  x=x.replace(/\s*(음|임|함|됨|김|남|짐)을\s*(이해하게|알게|알도록|이해하도록|깨닫게|인식하게|파악하게)\s*한다$/, '\u0001$1');
  const m=x.match(/^(.*)\u0001(음|임|함|됨|김|남|짐)$/);
  if(m){
    const head=m[1], kind=m[2];
    if(kind==='임') return head+'이다';
    if(kind==='음') return head+'다';
    // 함/됨/김/남/짐 -> 하 /되 /기 /나 /지 + ㄴ다
    const stem={'함':'하','됨':'되','김':'기','남':'나','짐':'지'}[kind];
    return head + addJong(stem, 4) + '다';
  }
  x=x.replace(/\u0001/g,'');
  return x;
}
/* 지도 방법을 이르는 문장인지 (일반화로 쓸 수 없다) */
const TEACHY=/(지도|유의|다루지 않|다룬다|다루고|다루며|중심으로|초점을|중점을|주안점|활동에|활동을|제시하|평가하|차시|교사|학생들이|설명하지 않|설정하|설정한|취지는)/;
/* 명제로 읽히는 문장인지 */
const CLAIMY=/(때문에|므로|으로써|에 따라|하면|이면|면서|관계가|영향을|까닭|원인|덕분에|덕에|나타난다|달라진다|이루어진다|생긴다|필요하다)/;

/* 해설에서 일반화로 쓸 만한 문장을 고른다 */
function genFromHae(r){
  if(!r.hae) return null;
  let t=r.hae.replace(/^\[[^\]]+\]\s*/,'');
  const sents=t.split(/(?<=[.])\s+/).map(x=>x.trim()).filter(Boolean);
  let best=null, bs=0;
  sents.forEach(st=>{
    if(st.length<18 || st.length>120) return;
    if(TEACHY.test(st)) return;
    if(/^이 성취기준은/.test(st)) return;
    if(/^(은|는|이|가|을|를|와|과|도|만|의|에|로|며|고)\s/.test(st)) return;   // 앞이 잘린 조각
    if(/^[가-힣]{1,2}\s/.test(st) && /^(은|는|이|가|을|를)/.test(st)) return;
    if(!CLAIMY.test(st)) return;              // 까닭·조건을 말하지 않으면 일반화가 아니다
    let sc=3;
    if(/(이해하게 한다|알게 한다|이해하도록 한다|파악하게 한다|아는 데 중점을 둔다)$/.test(st)) sc+=2;
    if(st.length<=80) sc+=1;
    if(sc>bs){ bs=sc; best=st; }
  });
  if(!best || bs<3) return null;
  let out=toStatement(best);
  out=out.replace(/(하는 데 중점을 둔다|에 중점을 둔다|에 초점을 맞춘다|에 주안점을 둔다)$/,'');
  out=out.replace(/\s*(등을 학습한다|을 학습한다|를 학습한다)$/,'');
  out=out.replace(/\s*(하도록 한다|하게 한다|할 수 있도록 한다)$/,'한다');
  out=out.replace(/\s+/g,' ').trim();
  if(out.length<16) return null;
  if(!/[다]$/.test(out)) return null;
  if(TEACHY.test(out)) return null;            // 다듬고 나서도 지도 지침이면 쓰지 않는다
  if(/(하도록 한다|하게 한다|않는다|않으며|않고)$/.test(out)) return null;
  return out;
}

/* 성취기준에서 까닭·수단·조건 구를 뽑는다 */
function causeOf(r){
  const t=(r.t||'').replace(/\s+/g,' ');
  const tidy=x=>{
    x=(x||'').trim().replace(/^(그|이|저)\s+/,'');
    x=x.replace(/\s*(것|점|일)$/,'');
    return x.trim();
  };
  let m=t.match(/원인을\s*(.+?)(?:으로|로)\s*설명/);            if(m) return {k:'cause', v:tidy(m[1])};
  m=t.match(/^(.+?)(?:을|를)\s*알고,?\s*.*(?:생기는|나타나는|일어나는)\s*(?:원인|이유|까닭)/);
  if(m) return {k:'cause', v:tidy(m[1])};

  m=t.match(/이유를\s*(.+?)(?:으로|로)\s*설명/);                if(m) return {k:'cause', v:tidy(m[1])};
  m=t.match(/(.+?)(?:으로|로)\s*(?:인해|말미암아)/);             if(m) return {k:'cause', v:tidy(m[1])};
  m=t.match(/(.+?)에\s*따라\s*(?:달라지|변하|나타나)/);         if(m) return {k:'cond',  v:tidy(m[1])};
  return null;
}
/* '~하는' 꼴을 '~하기' 꼴로 (문장에 넣기 좋게) */
function asNounPhrase(x){
  x=(x||'').trim();
  x=x.replace(/(하는|되는|지는|나는|오는|가는|주는)$/, m=>({'하는':'하기','되는':'되기','지는':'지기',
      '나는':'나기','오는':'오기','가는':'가기','주는':'주기'}[m]));
  return x;
}

      a=>J(a,'은','는')+' 정해진 규칙에 따라 짜여 있어, 그 규칙을 알면 바르게 읽고 쓸 수 있다.'],
    [/기관|몸|계통|생물/, a=>J(a,'은','는')+' 여러 부분이 서로 이어져 하나로 움직이며, 한 부분이 맡은 일을 못 하면 전체가 흔들린다.'],
  ],
  '변화':[
    [/역사|시대|과거|옛/, a=>J(a,'은','는')+' 그때의 형편과 사람들의 선택이 쌓여 오늘의 모습이 되었다.'],
  ],
  '책임과 실천':[
    [/흥미|관심|즐겨|즐기|좋아하|호기심/,
      a=>J(a,'을','를')+' 즐기는 마음은 시켜서 생기지 않고, 스스로 해 보며 조금씩 자란다.'],
    [/환경|생태|자원|기후/, a=>J(a,'을','를')+' 지키는 일은 한 사람의 마음가짐에서 비롯되어 여럿의 실천으로 이어진다.'],
    [/안전|위험|예방/,      a=>J(a,'은','는')+' 미리 알고 몸에 익혀 두어야 위급할 때 몸이 먼저 움직인다.'],
  ],
};
function genVariant(L, A, hint){
  const list=GENVAR[L.n]; if(!list) return '';
  for(const v of list){ if(v[0].test(hint)) return v[1](A); }
  return '';
}

function cbi(r){
  if(r._cbi) return r._cbi;
  const cons=conceptsOf(r,5);
  const L=lensOf(r);
  const ct=contentOf(r)||{};
  const own=r.t+' '+(r.hae||'');
  const pick=list=>(list||[]).filter(usable).filter(x=>relatedTo(x,own));
  const know=pick(ct['지식·이해']), skill=pick(ct['과정·기능']), val=pick(ct['가치·태도']);
  const knowAll=(ct['지식·이해']||[]).filter(usable);
  const act=lessonTitle(r);
  let area=r.a || areaKeyOf(r);
  if(/[?？]$|까$/.test(area)) area='이 단원';
  const pr=pickPair(cons, L, areaKeyOf(r)), A=pr[0], B=pr[1];

  /* 일반화 — 원문에 알맹이가 있으면 그것을 먼저 쓴다 */
  const gen=[], genSrc=[];
  const fromHae=genFromHae(r);
  if(fromHae){ gen.push(fromHae); genSrc.push('해설'); }
  const cz=causeOf(r);
  if(cz && cz.v && cz.v.length>=4 && cz.v.length<=42
     && cz.v.replace(/\s/g,'')!==A.replace(/\s/g,'')
     && !cz.v.replace(/\s/g,'').includes(A.replace(/\s/g,''))){
    const v=asNounPhrase(cz.v);
    let line='';
    if(cz.k==='cause') line=J(A,'은','는')+' '+v+' 때문에 일어난다.';
    else if(cz.k==='cond') line=J(A,'은','는')+' '+J(v,'에','에')+' 따라 달라진다.';
    else {
      const va=v.replace(/\s/g,''), aa=A.replace(/\s/g,'');
      line=(va===aa||va.includes(aa)||aa.includes(va)) ? ''
         : J(v,'을','를')+' 살펴보면 '+J(A,'을','를')+' 더 또렷이 알 수 있다.';
    }
    if(line && !gen.some(g=>g===line)){ gen.push(line); genSrc.push('성취기준'); }
  }
  const hint=A+' '+(r.a||'')+' '+r.t;
  if(gen.length<2){
    const vr=genVariant(L, A, hint);
    if(vr && !gen.some(g=>g===vr)){ gen.push(vr); genSrc.push('렌즈'); }
  }
  while(gen.length<2){
    const cand=L.gen[gen.length===0?0:1](A,B);
    if(gen.some(g=>g===cand)) break;
    gen.push(cand); genSrc.push('렌즈');
  }
  if(val.length && gen.length<3){
    gen.push(J(elemNoun(val[0]),'은','는')
      + (area.length<=10 ? ' '+J(area,'을','를')+' 배우는 내내' : ' 이 배움 내내') + ' 길러진다.');
    genSrc.push('내용 요소');
  }

  /* 탐구 질문 */
  const fact=[J(A,'은','는')+' 무엇인가?'];
  const k0=know[0]||knowAll[0];
  if(k0) fact.push(/[?？]$/.test(k0) ? '“'+k0+'”' 
                                     : J(elemNoun(k0),'에는','에는')+' 어떤 것들이 있는가?');
  const k1=know[1]||knowAll[1];
  if(B && B!==A && cons.indexOf(B)>=0) fact.push(J(B,'은','는')+' 무엇인가?');
  else if(k1 && !/[?？]$/.test(k1)) fact.push(J(elemNoun(k1),'은','는')+' 어떠한가?');
  else fact.push(J(A,'은','는')+' 어디에서 찾아볼 수 있는가?');

  const conc=[L.cq[0](A,B), L.cq[1](A,B)];
  if(skill.length) conc.push(elemAct(skill[0])+' 활동에서는 무엇을 눈여겨보아야 하는가?');

  const deb=[L.dq[0](A, area)];
  if(val.length) deb.push(J(elemNoun(val[0]),'은','는')+' 왜 필요한가?');
  else deb.push(area+'에서 '+J(A,'은','는')+' 얼마나 중요한가?');

  const tidy=x=>(x||'').replace(/\s+/g,' ').replace(/\s+([,.?!])/g,'$1').trim();
  [gen,fact,conc,deb].forEach(arr=>{ for(let i=0;i<arr.length;i++) arr[i]=tidy(arr[i]); });
  const hit=(r.t.match(L.re)||[])[0];
  return r._cbi={lens:L.n,
    lensWhy: hit? "성취기준의 '"+hit+"'에 기대어 골랐습니다" : r.subj+'과에서 자주 쓰이는 렌즈입니다',
    concepts:cons, pair:[A,B], gen, genSrc:genSrc, q:{fact:fact, conc:conc, deb:deb},
    enduring:enduringOf(r), content:ct, activity:act};
}

/* ---------- 연관 / 위계 ---------- */
function scopeFilter(r,o,mode){
  if(mode==='bandCross') return o.b===r.b && o.s!==r.s;
  if(mode==='band')      return o.b===r.b;
  if(mode==='subject')   return o.s===r.s;
  return true;
}
function similar(r,mode,catOnly){
  const out=[];
  for(const o of STD){
    if(o===r||!scopeFilter(r,o,mode)) continue;
    if(catOnly&&mainCat(o)!==catOnly) continue;
    const d=cos(r._v,o._v);
    if(d>0.04) out.push({o,s:d});
  }
  out.sort((a,b)=>b.s-a.s);
  return out.slice(0,14);
}
function commonKw(a,b){
  const arr=[];
  for(const [t,w] of a._v){ const u=b._v.get(t); if(u) arr.push([t,w*u]); }
  arr.sort((x,y)=>y[1]-x[1]);
  const out=[];
  for(const [t] of arr){
    if(DF.get(t)>N*0.06) continue;
    const i=out.findIndex(o=>o.startsWith(t)||t.startsWith(o));
    if(i>=0){ if(t.length>out[i].length) out[i]=t; continue; }
    out.push(t); if(out.length>=5) break;
  }
  return out;
}
const SERIES=new Map();
function buildSeries(){ STD.forEach(r=>{ if(r.sr){ if(!SERIES.has(r.sr)) SERIES.set(r.sr,[]); SERIES.get(r.sr).push(r); } }); }
const seriesOf = r => r.sr? SERIES.get(r.sr) : null;
function seqGuess(r,band){
  return STD.filter(o=>o.s===r.s&&o.b===band).map(o=>({o,s:cos(r._v,o._v)}))
    .filter(x=>x.s>0.08).sort((a,b)=>b.s-a.s).slice(0,3);
}

/* ---------- 검색 ---------- */
function splitCandidates(t){
  const n=t.length,res=[];
  if(n<4||n>14) return res;
  for(let i=2;i<=n-2;i++){ res.push([t.slice(0,i),t.slice(i)]);
    for(let j=i+2;j<=n-2;j++) res.push([t.slice(0,i),t.slice(i,j),t.slice(j)]); }
  return res;
}
function scoreIn(hay,t,hit){
  if(hay.includes(t)){ hit&&hit.add(t); return 2; }
  for(const p of splitCandidates(t)) if(p.every(x=>hay.includes(x))){ hit&&p.forEach(x=>hit.add(x)); return 1; }
  return 0;
}
function greedyPieces(t){
  if(ALLTEXT===null) ALLTEXT=STD.map(r=>r._head+r._body).join('');
  const res=[]; let i=0;
  while(i<t.length){ let best='';
    for(let len=Math.min(9,t.length-i);len>=2;len--){ const p=t.slice(i,i+len); if(ALLTEXT.includes(p)){ best=p; break; } }
    if(best){ res.push(best); i+=best.length; } else i++; }
  return res;
}
let HILITE=[], RELAX=null;
/* 학년군·교과·영역을 고른 채 검색하면 그 범위 안에서만 찾는다.
   범위 밖에 걸리는 것이 있는지 알려 주어야 '왜 안 나오지' 하는 일이 없다. */
function searchAllScope(){
  const b=new Set(S.bands), s=new Set(S.subjs), a=new Set(S.areas);
  S.bands.clear(); S.subjs.clear(); S.areas.clear();
  let out=[];
  try{ out=filtered(); } finally {
    b.forEach(x=>S.bands.add(x)); s.forEach(x=>S.subjs.add(x)); a.forEach(x=>S.areas.add(x));
  }
  return out;
}
function filtered(){
  const raw=S.q.trim();
  const base=STD.filter(r=>
    (!S.bands.size||S.bands.has(r.b)) && (!S.subjs.size||S.subjs.has(r.s)) && (!S.areas.size||S.areas.has(r.subj+'|'+areaKeyOf(r))));
  HILITE=[]; RELAX=null;
  if(!raw) return base;
  if(isChoQuery(raw)){ const c=raw.replace(/\s+/g,''); return base.filter(r=>r._cho.includes(c)); }
  const terms=raw.split(/\s+/).map(norm).filter(Boolean);
  if(!terms.length) return base;
  const hits=new Set(), out=[];
  for(const r of base){
    let sc=0,ok=true,inBody=false;
    for(const t of terms){
      const h=scoreIn(r._head,t,hits), b=h?0:scoreIn(r._body,t,hits);
      if(!h&&!b){ ok=false; break; }
      sc+= h? h*2:b; if(!h) inBody=true;
    }
    if(ok){ r._sc=sc; r._inBody=inBody; out.push(r); }
  }
  if(!out.length){
    const ps=[...new Set(terms.flatMap(greedyPieces))].filter(p=>p.length>=2);
    if(ps.length&&!(ps.length===1&&ps[0]===terms[0])){
      RELAX=ps;
      for(const r of base){ let sc=0,inBody=false;
        for(const p of ps){ if(r._head.includes(p)){ sc+=4; hits.add(p); }
          else if(r._body.includes(p)){ sc+=1; inBody=true; hits.add(p); } }
        if(sc>0){ r._sc=sc; r._inBody=inBody; out.push(r); } }
    }
  }
  HILITE=[...hits];
  if(S.sort==='rel') out.sort((a,b)=>b._sc-a._sc||a.b-b.b||a.s-b.s||(a.c<b.c?-1:1));
  return out;
}
function hl(text,terms){
  const frag=document.createDocumentFragment();
  text=text||'';
  if(!terms||!terms.length){ frag.appendChild(document.createTextNode(text)); return frag; }
  const map=[]; let n='';
  for(let i=0;i<text.length;i++){ const c=norm(text[i]); if(c){ n+=c; for(let k=0;k<c.length;k++) map.push(i); } }
  const marks=new Array(text.length).fill(false);
  terms.forEach(t=>{ let p=0; while(t&&(p=n.indexOf(t,p))>=0){ for(let k=p;k<p+t.length;k++) marks[map[k]]=true; p+=t.length; } });
  let buf='',on=false;
  const flush=()=>{ if(!buf) return; frag.appendChild(on? el('mark',null,buf):document.createTextNode(buf)); buf=''; };
  for(let i=0;i<text.length;i++){ if(marks[i]!==on){ flush(); on=marks[i]; } buf+=text[i]; }
  flush(); return frag;
}

/* ============================================================
   수업·평가 계획 초안 (AI 생성 — 반드시 교사 검토)
   ============================================================ */
/* 성취기준이 속한 '영역' — 내용 체계 영역을 우선한다 (사용자가 고른 값 포함) */
const areaKeyOf = r => domName(r) || r.a;

/* ---------- 성취기준을 '~하기' 꼴 활동 이름으로 다듬기 ----------
   정보공시 '교수·학습 내용' 칸에 그대로 쓰는 값이라 자르지 않고 한 문구로 만든다. */
function stripJong(ch){                      // '할' -> '하'
  const c=ch.charCodeAt(0);
  if(c<0xAC00||c>0xD7A3) return ch;
  const j=(c-0xAC00)%28;
  return j? String.fromCharCode(c-j) : ch;
}
/* 어간이 본디 'ㄹ'로 끝나는 풀이씨 — 받침을 지우면 안 된다 */
const LKEEP=/(만들|들|알|살|열|팔|놀|걸|물|밀|길|빌|풀|줄|늘|썰|졸|불)$/;
function toActivity(t){
  let x=(t||'').trim().replace(/[.\s]+$/,'');
  // ① '~ㄹ/을 수 있다'
  let m=x.match(/^(.*?)([가-힣])\s*수\s*있다$/);
  if(m){
    let head=m[1], last=m[2];
    if(/을$/.test(last)) return head.replace(/\s+$/,'')+'기';          // 찾을 수 있다 -> 찾기
    const stem=(head+last).replace(/\s+$/,'');
    if(LKEEP.test(stem)) return stem+'기';                             // 만들 수 있다 -> 만들기
    return head+stripJong(last)+'기';                                  // 할/볼/쓸 -> 하기/보기/쓰기
  }
  // ② '~는다' / '~ㄴ다'
  if(/는다$/.test(x)) return x.replace(/는다$/,'')+'기';               // 읽는다 -> 읽기
  m=x.match(/^(.*?)([가-힣])다$/);
  if(m){
    const last=m[2], c=last.charCodeAt(0), j=(c>=0xAC00&&c<=0xD7A3)?((c-0xAC00)%28):0;
    if(j===4){                                                          // 종성 'ㄴ'
      const stem=m[1]+stripJong(last);
      if(/보$/.test(stem)) return stem+'기';                            // 본다 -> 보기
      return stem+'기';                                                 // 한다/기른다/가진다 -> 하기/기르기/가지기
    }
    if(/[았었]$/.test(last)) return x;
  }
  // ③ 그밖에 '~다'로 끝나면 '기'로
  if(/다$/.test(x)) return x.replace(/다$/,'')+'기';
  return x;
}
/* 정보공시 칸 문구 — 자르지 않고, 길면 앞쪽 조건·도구 수식만 덜어 낸다 */
const TRIM=[
  /^[^,]{2,26}?(?:을|를)\s*(?:통해|통하여|활용하여|이용하여|바탕으로|중심으로)\s+/,
  /^[^,]{2,26}?(?:와|과)\s*(?:연결하여|관련지어|비교하여)\s+/,
  /^[^,]{2,22}?(?:으로|로)\s+/,
  /^[^,]{2,22}?에서\s+/,
];
function lessonTitle(r){
  let x=toActivity(r.t);
  for(const re of TRIM){
    if(x.length<=46) break;
    const y=x.replace(re,'');
    if(y.length>=12 && y!==x) x=y;
  }
  return x;
}
/* 정보공시 '단원명(교수·학습 내용)' 칸에 쓰는 서술.
   성취기준만 옮기면 한 문장짜리가 많아 무엇을 가르치는지 드러나지 않는다.
   그 학년군 내용 요소를 앞뒤에 붙여, 가르칠 내용이 보이도록 풀어 쓴다. */
const LEAD_CUT=/^(간단한|다양한|여러 가지|여러|기본적인|알맞은|적절한)\s+/;
function teachContent(r){
  if(r._tc) return r._tc;
  let full=toActivity((r.t||'').trim());
  // 성취수준 B는 성취기준을 '무엇을 어느 만큼' 하는지로 풀어 쓴 원문이다.
  // 성취기준보다 자세하면 그쪽을 뼈대로 삼아야 가르칠 내용이 드러난다.
  if(r.B){
    const b2=toActivity(r.B.replace(/\s+/g,' ').trim());
    if(b2.length >= full.length*1.25 && b2.length <= 130) full=b2;
  }
  const ct=contentOf(r)||{};
  const own=r.t+' '+(r.hae||'');
  const flat=s=>(s||'').replace(/\s+/g,' ').trim();
  // 성취기준에 이미 담긴 말인지 (3글자 잇달아 겹치면 담긴 것으로 본다)
  const inStd=x=>{ const a=flat(x).replace(/\s/g,''), b=full.replace(/\s/g,'');
    if(a.length<3) return b.includes(a);
    let hit=0;
    for(let i2=0;i2+3<=a.length;i2++) if(b.includes(a.slice(i2,i2+3))) hit++;
    return hit >= (a.length-2)*0.6; };
  const rel=cat=>(ct[cat]||[]).filter(usable).filter(x=>relatedTo(x,own)).filter(x=>!inStd(x));

  // 바탕이 되는 앎 하나만 앞에 놓는다. 둘을 엮으면 문장이 무너진다.
  let lead='';
  const k=rel('지식·이해')[0];
  if(k) lead=J(flat(k).replace(LEAD_CUT,''),'을','를')+' 알아보고, ';
  else {
    const s2=rel('과정·기능')[0];
    if(s2 && full.length<30) lead=elemAct(flat(s2))+', ';
  }
  let out=lead+full;
  if(out.length>100){
    for(const re of TRIM){
      if(out.length<=100) break;
      const y=out.replace(new RegExp(re.source.replace('^',''),''),'');
      if(y.length>=30 && y!==out) out=y;
    }
  }
  return r._tc=flat(out);
}
/* 성취기준을 이어지는 활동으로 갈라 교수·학습 내용을 만든다 (정보공시 서술용) */
const CONJ = /(?<=하고|되고|이고|보고|알고|갖고|주고|넣고|짓고|쓰고|읽고|듣고|찾고|세고|기르고|만들고)[,]?\s+/;
function lessonActs(r){
  const t=(r.t||'').replace(/\s*\.$/,'');
  let parts = t.split(CONJ).map(x=>x.trim()).filter(Boolean);
  // 너무 짧은 조각은 앞 조각에 붙인다 ('듣고' + '말한다')
  const merged=[];
  parts.forEach(x=>{
    if(merged.length && x.replace(/\s/g,'').length < 7) merged[merged.length-1] += ' ' + x;
    else merged.push(x);
  });
  parts = merged;
  const acts=[];
  parts.forEach(x=>{
    let a=x.replace(/(하고|하며|하여|되고|이고|보고|알고|갖고|주고|넣고|짓고|쓰고|읽고|듣고|찾고|세고)$/,
      m=>({'하고':'하기','하며':'하기','하여':'하기','되고':'되기','이고':'이기','보고':'보기','알고':'알기',
           '갖고':'갖기','주고':'주기','넣고':'넣기','짓고':'짓기','쓰고':'쓰기','읽고':'읽기','듣고':'듣기',
           '찾고':'찾기','세고':'세기'}[m]||m));
    a=toActivity(a);
    a=a.replace(/^(그리고|또한|또)\s+/,'').trim();
    if(a.length>2) acts.push(a.length>52? a.slice(0,52)+'…' : a);
  });
  return acts.length? acts : [toActivity(t)];
}

/* 교수·학습 내용 초안: 성취기준을 차시 흐름으로 펼친다 (정보공시 서술용) */
const STEPCAT=['지식·이해','지식·이해','과정·기능','과정·기능','과정·기능','가치·태도'];
function teachDraft(r){
  if(r._teach) return r._teach;
  const ct = contentOf(r) || {};
  const own = r.t + ' ' + (r.hae || '');
  const rel = list => (list||[]).filter(usable).filter(x=>relatedTo(x, own));
  const all = list => (list||[]).filter(usable);
  const know = rel(ct['지식·이해']).concat(all(ct['지식·이해']).filter(x=>!relatedTo(x,own)));
  const skill= rel(ct['과정·기능']).concat(all(ct['과정·기능']).filter(x=>!relatedTo(x,own)));
  const val  = rel(ct['가치·태도']);
  const cons = conceptsOf(r,3);
  const cb0 = cbi(r);
  const A = cb0.pair[0] || cons[0] || r.a;
  const B = cb0.pair[1] || '';
  const acts = lessonActs(r);
  const summary = teachContent(r);         // 정보공시 칸: 화살표·줄임표 없이 한 문구
  const inq = (r.q||[]).filter(x=>x&&x.length>3);
  let topic = r.a || areaKeyOf(r);
  if(/[?？]$|까$/.test(topic)) topic = cons[0] || '오늘 배울 내용';
  const cb = cb0;

  const S=[];
  const add=(ph,t,d,cat,ev)=>S.push({ph:ph, t:t, d:d.filter(Boolean), cat:cat, ev:!!ev});

  add('1차시','만나기 — 배움 문제 세우기',[
    J(topic,'과','와')+' 관련된 경험을 떠올려 이야기 나누기',
    '배움 문제 확인하기 — “'+summary+'”',
    cb.q.fact[0]+' (사실적 질문으로 출발점 살피기)'
  ],'지식·이해');

  add('2차시','알아보기 — 바탕이 되는 앎 다지기',[
    know[0]? elemNoun(know[0])+' 알아보기'
           : J(A,'의','의')+' 뜻과 특징을 보기를 들어 알아보기',
    know[1]? elemNoun(know[1])+' 살펴보고 정리하기'
           : (B && cons.indexOf(B)>=0
                ? J(B,'과','와')+' 견주어 보며 '+J(A,'을','를')+' 정리하기'
                : J(A,'에','에')+' 대해 알게 된 것을 우리 말로 정리하기'),
    r.hae? '교육과정 해설에 제시된 내용을 짚어 가며 확인하기' : null
  ],'지식·이해');

  add('3차시','탐구하기 ① — 직접 해 보기',[
    acts[0] || summary,
    skill[0]? elemAct(skill[0]) : '살펴본 것을 표나 그림으로 나타내기',
    inq[0] || null
  ],'과정·기능', true);

  add('4차시','탐구하기 ② — 넓혀 가기',[
    acts[1] || inq[1] || (skill[1]? elemAct(skill[1]) : '다른 사례에 같은 방법을 적용해 보기'),
    skill[1] && acts[1]? elemAct(skill[1]) : '모둠별 결과를 견주어 같은 점과 다른 점 찾기',
    cb.q.conc[0]+' (개념적 질문으로 생각 넓히기)'
  ],'과정·기능', true);

  add('5차시','나누기 — 생각을 견주고 다듬기',[
    '모둠에서 알게 된 것을 발표하고 서로 묻고 답하기',
    '친구 의견에 견주어 내 생각을 다듬어 다시 쓰기',
    '“'+cb.gen[0].replace(/[.\s]+$/,'')+'”로 우리 말로 정리해 보기'
  ],'과정·기능', true);

  add('6차시','다지기 — 생활로 잇기',[
    val[0]? elemNoun(val[0])+' 되짚기'
          : J(A,'을','를')+' 배우며 느낀 점 나누기',
    cb.q.deb[0]+' (논쟁적 질문으로 따져 보기)',
    '배운 것을 생활에서 쓸 곳을 찾아 실천 계획 세우기'
  ],'가치·태도');

  return r._teach = {steps:S, summary:summary, acts:acts, topic:topic,
    // 옛 화면이 쓰던 두 칸 짜리 흐름도 함께 둔다
    brief:S.map(s=>[s.ph, s.d[0]])};
}

function toolName(r, m){

  return TOOLNAME[m] || m;

/* 성취기준이 무엇을 하라고 하는지에 따라 평가 방법의 차례가 달라져야 한다.
   '설명한다'를 선택형으로 재는 것은 맞지 않는다. */
const VERBWAY=[

                                                                    '관찰평가(체크리스트)'],
];
/* 서술어로 가려지지 않을 때 기대는 교과의 평소 평가 방식 */
const SUBJDEFAULT={'체육':'수행평가(실험·실습·실기)','음악':'수행평가(실험·실습·실기)',
  '미술':'수행평가(프로젝트·산출물)','실과':'수행평가(실험·실습·실기)',
  '바른 생활':'관찰평가(체크리스트)','즐거운 생활':'수행평가(관찰)'};
function evalDraft(r){
  if(r._eval) return r._eval;
  const p = catProfile(r), order = CATS.map((c,i)=>[c,p[i]]).sort((a,b)=>b[1]-a[1]);
  const ways = [];
  order.forEach((o,i)=>{ (EVALWAY[o[0]]||[]).slice(0, i===0?2:1).forEach(w=>ways.push({m:w[0],why:w[1],cat:o[0]})); });
  const ct = contentOf(r) || {};
  const own = r.t + ' ' + (r.hae || '');
  const rel = c => (ct[c]||[]).filter(usable).filter(x=>relatedTo(x,own));
  const any = c => (ct[c]||[]).filter(usable);

  /* 평가 요소 — 성취기준 자체를 첫 요소로, 범주마다 하나씩 보탠다 */
  const el = [];
  const put = (t,cat)=>{ t=(t||'').trim(); if(!t) return;
    if(el.some(e=>e.t===t)) return; el.push({t:t, cat:cat}); };
  put(toActivity(r.t), order[0][0]);
  CATS.forEach(c=>{ const s=rel(c)[0]||any(c)[0]; if(s) put(elemAct(s), c); });
  const sk = rel('과정·기능')[1]; if(sk) put(elemAct(sk), '과정·기능');
  if(el.length<2) lessonActs(r).forEach(a=>{ if(el.length<3) put(a, order[0][0]); });
  if(el.length<2 && (r.q||[]).length) put(r.q[0], order[0][0]);

  /* 채점 관점 — 성취수준 원문에서 가르는 말을 뽑는다 */
  const cut = t => (t||'').replace(/\s+/g,' ').trim();
  const rubric = [['A', cut(r.A)], ['B', cut(r.B)], ['C', cut(r.C)]].filter(x=>x[1]);

  /* 서술어가 가리키는 방법을 앞으로 끌어온다 */
  const hintText = r.t + ' ' + (r.hae||'');
  const wanted=[];
  VERBWAY.forEach(v=>{ if(v[0].test(hintText) && wanted.indexOf(v[1])<0) wanted.push(v[1]); });
  if(!wanted.length && SUBJDEFAULT[r.subj]) wanted.push(SUBJDEFAULT[r.subj]);
  // 과학은 탐구가 바탕이라 탐구 보고서를 늘 후보에 둔다
  if(r.subj==='과학' && wanted.indexOf('수행평가(실험·실습·실기)')<0)
    wanted.push('수행평가(실험·실습·실기)');
  if(wanted.length){
    const pool={};
    CATS.forEach(c2=>(EVALWAY[c2]||[]).forEach(w=>{ pool[w[0]]={m:w[0],why:w[1],cat:c2}; }));
    wanted.slice(0,2).reverse().forEach(m=>{
      const i=ways.findIndex(w=>w.m===m);
      if(i>=0) ways.unshift(ways.splice(i,1)[0]);
      else if(pool[m]) ways.unshift(pool[m]);
    });
    while(ways.length>4) ways.pop();
  }
  const samples = (window.__EVAL && window.__EVAL[r.c]) || [];
  return r._eval = {ways:ways, elements: el.map(e=>e.t), elementRows: el,
    thin: el.length<2,
    mainCat: order[0][0], samples:samples, rubric:rubric,
    feedback: FEEDBACK[order[0][0]], when: order[0][0]==='가치·태도' ? '3~6차시(지속)' : '3~5차시',
    area: areaKeyOf(r), count: order[0][0]==='가치·태도' ? '1회(지속 관찰)' : '1~2회'};
}

function chipsInto(host,items,set,onChange){
  host.innerHTML='';
  items.forEach(it=>{
    const b=el('button','chip'+(set.has(it.v)?' on':''));
    b.appendChild(document.createTextNode(it.label));
    if(it.hi) b.appendChild(el('span','hi',it.hi));
    b.onclick=()=>{ set.has(it.v)?set.delete(it.v):set.add(it.v); onChange(); };
    host.appendChild(b);
  });
}
function currentAreas(){
  const seen=new Map();
  STD.forEach(r=>{
    if(S.bands.size&&!S.bands.has(r.b)) return;
    if(S.subjs.size&&!S.subjs.has(r.s)) return;
    const k=r.subj+'|'+areaKeyOf(r);
    if(!seen.has(k)) seen.set(k,{v:k,label:areaKeyOf(r),n:0,bands:new Set(),sr:r.sr,s:r.s,units:new Set()});
    const e=seen.get(k); e.n++; e.units.add(r.a);
  });
  seen.forEach(e=>STD.forEach(r=>{ if(r.subj+'|'+areaKeyOf(r)===e.v) e.bands.add(r.b); }));
  return [...seen.values()];
}
function renderFilters(){
  chipsInto($('#fBand'),BANDS.map((b,i)=>({v:i,label:shortBand(b)})),S.bands,()=>{ syncAreas(); render(); });
  chipsInto($('#fSubj'),SUBJ.map((s,i)=>({v:i,label:s})),S.subjs,()=>{ syncAreas(); render(); });

let NAVHIST=[];
function goto(o,opt){
  opt=opt||{};
  if(S.sel && S.sel!==o){ NAVHIST.push({r:S.sel, tab:S.tab}); if(NAVHIST.length>30) NAVHIST.shift(); }
  S.sel=o; S.map=null;
  if(opt.tab) S.tab=opt.tab;
  if(!filtered().includes(o)){ S.areas.clear(); S.subjs.clear(); S.bands.clear(); }
  render(); if(!opt.keepScroll) $('#detailcol').scrollTop=0; }
function goBack(){
  const h=NAVHIST.pop(); if(!h) return;
  S.sel=h.r; S.tab=h.tab||S.tab; S.map=null;
  if(!filtered().includes(h.r)){ S.areas.clear(); S.subjs.clear(); S.bands.clear(); }
  render(); }

/* ============================================================
   개념 지도 — 힘 기반 배치, 확대·이동·끌기·펼치기
   ============================================================ */
const MAPCFG={scope:'bandCross',showDom:true,showSeq:true,depth:1};

function newMap(root){
  return {nodes:new Map(),links:[],center:root.c,expanded:new Set(),
          tx:0,ty:0,k:1,started:false};
}
function nodeId(t,v){ return t+':'+v; }
function addNode(M,t,v,label,sub,ref){
  const id=nodeId(t,v);
  if(!M.nodes.has(id)){
    const a=Math.random()*6.283, rr=120+Math.random()*120;
    M.nodes.set(id,{id,type:t,key:v,label,sub,ref,
      x:460+Math.cos(a)*rr,y:280+Math.sin(a)*rr,vx:0,vy:0,fx:null,fy:null});
  }
  return M.nodes.get(id);
}
function addLink(M,a,b,type){
  if(a===b) return;
  if(M.links.some(l=>(l.a===a&&l.b===b)||(l.a===b&&l.b===a))) return;
  M.links.push({a,b,type:type||''});
}
function expandStd(M,r,isCenter){
  const c=addNode(M,'std',r.c,r.c,`${r.subj} · ${r.a}`,r);
  if(isCenter) c.center=true;
  if(MAPCFG.showDom&&r.dom){
    const d=addNode(M,'dom',r.subj+'|'+r.dom,r.dom,r.subj+' 영역',null);
    addLink(M,c,d,'dom');
  }
  conceptsOf(r,5).forEach(t=>{
    const n=addNode(M,'con',t,t,'개념',null);
    addLink(M,c,n,'con');
  });
  if(MAPCFG.showSeq){
    const ser=seriesOf(r);
    if(ser){
      [-1,1].forEach(dir=>{
        const tb=r.b+dir; if(tb<0||tb>=BANDS.length) return;
        const cand=ser.filter(o=>o.b===tb).map(o=>({o,s:cos(r._v,o._v)})).sort((x,y)=>y.s-x.s)[0];
        if(cand){ const n=addNode(M,'std',cand.o.c,cand.o.c,`${shortBand(cand.o.band)} · ${cand.o.subj}`,cand.o);
          addLink(M,c,n,'seq'); }
      });
    }
  }
  M.expanded.add('std:'+r.c);
}
function expandConcept(M,tok){
  const n=M.nodes.get(nodeId('con',tok)); if(!n) return;
  const root=STD.find(r=>r.c===M.center);
  const pool=(CONIDX.get(tok)||[]).filter(o=>o.c!==M.center&&scopeFilter(root,o,MAPCFG.scope))
    .map(o=>({o,s:cos(root._v,o._v)})).sort((a,b)=>b.s-a.s).slice(0,4);
  pool.forEach(({o})=>{
    const s=addNode(M,'std',o.c,o.c,`${shortBand(o.band)} · ${o.subj}`,o);
    addLink(M,n,s,'con');
  });
  M.expanded.add('con:'+tok);
}
function buildMap(r){
  const M=newMap(r);
  expandStd(M,r,true);
  conceptsOf(r,5).forEach(t=>expandConcept(M,t));
  return M;
}
/* --- 힘 계산 --- */
function tick(M,steps){
  const ns=[...M.nodes.values()];
  const LEN={con:155,dom:200,seq:215,'':160};
  for(let s=0;s<(steps||1);s++){
    for(let i=0;i<ns.length;i++){
      const a=ns[i];
      for(let j=i+1;j<ns.length;j++){
        const b=ns[j];
        let dx=b.x-a.x, dy=b.y-a.y, d2=dx*dx+dy*dy;
        if(d2<1){ dx=Math.random()-0.5; dy=Math.random()-0.5; d2=1; }
        const d=Math.sqrt(d2);
        if(d>500) continue;
        const f=(a.type==='std'||b.type==='std'? 13000:7000)/d2;
        const ux=dx/d*f, uy=dy/d*f;
        a.vx-=ux; a.vy-=uy; b.vx+=ux; b.vy+=uy;
      }
    }
    M.links.forEach(l=>{
      const L=LEN[l.type]||130;
      let dx=l.b.x-l.a.x, dy=l.b.y-l.a.y;
      const d=Math.sqrt(dx*dx+dy*dy)||1;
      const f=(d-L)*0.045, ux=dx/d*f, uy=dy/d*f;
      l.a.vx+=ux; l.a.vy+=uy; l.b.vx-=ux; l.b.vy-=uy;
    });
    ns.forEach(n=>{
      n.vx+=(460-n.x)*0.004; n.vy+=(280-n.y)*0.004;
      if(n.center){ n.vx+=(460-n.x)*0.06; n.vy+=(280-n.y)*0.06; }
      if(n.fx!=null){ n.x=n.fx; n.y=n.fy; n.vx=0; n.vy=0; return; }
      n.vx*=0.82; n.vy*=0.82;
      n.x+=Math.max(-24,Math.min(24,n.vx));
      n.y+=Math.max(-24,Math.min(24,n.vy));
    });
  }
}

    .forEach(([k,l])=>{ const b=el('button','btn sm'+(MAPCFG.scope===k?' on':''),l);

  svg.addEventListener('pointermove',ev=>{

  svg.addEventListener('pointerup',ev=>{

      if(!drag.moved){

      n.fx=null; n.fy=null; drag=null;

  },{passive:false});
}

function planCSV(rows){
  /* 정보공시 평가 계획 표 그대로: 한 성취기준을 성취수준 세 줄로 편다.
     앞 칸은 첫 줄에만 채워, 엑셀에서 셀을 합치면 원래 표 모양이 된다. */
  const head=['성취기준','단원명(교수학습 내용)','평가 영역','평가 요소','평가 방법',
              '성취 수준','성취 수준 내용'];
  const GRADE=[['잘함','A'],['보통','B'],['노력 요함','C']];
  const out=[head.join(',')];
  rows.forEach(r=>{
    const td=teachDraft(r), ed=evalDraft(r);
    const unit=(r.a||ed.area||'').trim();
    const cell = unit ? unit + String.fromCharCode(10) + '(' + td.summary + ')' : td.summary;
    const std = r.c + ' ' + r.t;
    const elem = ed.elements[0] || toActivity(r.t);
    const way = ed.ways.length? toolName(r, ed.ways[0].m) : '';
    GRADE.forEach((g,i)=>{
      out.push([ i===0? std:'', i===0? cell:'', i===0? ed.area:'',
                 i===0? elem:'', i===0? way:'', g[0], r[g[1]]||'' ].map(csvEsc).join(','));
    });
  });
  return String.fromCharCode(0xFEFF)+out.join(String.fromCharCode(13)+String.fromCharCode(10));

}
const csvEsc=v=>{ v=(v==null?'':String(v)); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; };
function toCSV(rows){

    '성취수준A','성취수준B','성취수준C','탐구활동','핵심아이디어','개념적렌즈','핵심개념'];
  const body=rows.map(r=>{ const k=cbi(r), dm=domOf(r);

      dm?dm.idea.join(' / '):'',k.lens,k.concepts.join(', ')].map(csvEsc).join(','); });

function download(name,text,mime){

}
function copy(text,btn){
  const done=()=>{ if(btn){ const t=btn.textContent; btn.textContent='복사했습니다'; setTimeout(()=>btn.textContent=t,1200); } };
  const fb=()=>{ const ta=document.createElement('textarea'); ta.value=text;
    ta.style.cssText='position:fixed;opacity:0'; document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); done(); }catch(e){ alert('복사에 실패했습니다.'); } ta.remove(); };
  if(navigator.clipboard&&window.isSecureContext) navigator.clipboard.writeText(text).then(done,fb); else fb();
}

  H.push(`<h2>1. 평가 계획 표 (정보공시 서술용)</h2>`);
  H.push(`<table><tr><th>시기</th><th>교과</th><th>성취기준</th><th>영역</th>

  rows.forEach(r=>{ const td=teachDraft(r), ed=evalDraft(r);

      <td>${esc2(r.c)}<br>${esc2(r.t)}</td><td>${esc2(ed.area)}</td>
      <td>${esc2(td.summary)}</td><td>${esc2(ed.elements.join(' / '))}</td>

  H.push(`</table>`);

  rows.forEach(r=>{
    const k=cbi(r), dm=domOf(r), ct=contentOf(r), a=areaOf(r), gd=guideOf(r), td=teachDraft(r), ed=evalDraft(r);
    H.push(`<h2>${esc2(r.c)} ${esc2(r.subj)} · ${esc2(shortBand(r.band))}</h2>`);
    H.push(`<table><tr><th style="width:14%">성취기준</th><td>${esc2(r.t)}</td></tr>`);
    H.push(`<tr><th>영역</th><td>${esc2(r.a)}${dm&&dm.name!==r.a?` (내용 체계 영역: ${esc2(dm.name)})`:''}</td></tr>`);
    if(r.hae) H.push(`<tr><th>성취기준 해설</th><td>${esc2(r.hae)}</td></tr>`);
    H.push(`<tr><th>성취수준 A</th><td>${esc2(r.A)}</td></tr>`);
    H.push(`<tr><th>성취수준 B</th><td>${esc2(r.B)}</td></tr>`);
    H.push(`<tr><th>성취수준 C</th><td>${esc2(r.C)}</td></tr></table>`);
    H.push(`<h3>교수·학습 내용 (초안)</h3><p><b>${esc2(td.summary)}</b></p><ul>`);
    td.steps.forEach(st=>{ H.push(`<li><b>${esc2(st.ph)} ${esc2(st.t)}</b> (${esc2(st.cat)}${st.ev?', 평가':''})<ul>`

    H.push(`</ul>`);
    if(r.q&&r.q.length){ H.push(`<h3>교육과정에 제시된 탐구 활동</h3><ul>`);
      r.q.forEach(x=>H.push(`<li>${esc2(x)}</li>`)); H.push(`</ul>`); }
    if(dm&&dm.idea.length){ H.push(`<h3>핵심 아이디어 (${esc2(dm.name)} 영역)</h3><ul>`);
      dm.idea.forEach(x=>H.push(`<li>${esc2(x)}</li>`)); H.push(`</ul>`); }
    if(ct){ H.push(`<h3>내용 요소 (${esc2(shortBand(r.band))})</h3><table>`);
      CATS.forEach(c=>{ if(ct[c]) H.push(`<tr><th style="width:14%">${esc2(c)}</th><td>${esc2(ct[c].join(' / '))}</td></tr>`); });
      H.push(`</table>`); }
    H.push(`<h3>평가 계획 (초안)</h3><table>
      <tr><th style="width:14%">평가 영역</th><td>${esc2(ed.area)} (중심 범주 ${esc2(ed.mainCat)})</td></tr>
      <tr><th>평가 요소</th><td>${esc2(ed.elements.join(' / '))}</td></tr>
      <tr><th>평가 시기·횟수</th><td>${esc2(ed.when+' 무렵 / '+ed.count)}</td></tr>
      <tr><th>피드백 방안</th><td>${esc2(ed.feedback)}</td></tr>
      <tr><th>평가 방법</th><td>${esc2(ed.ways.map(x=>x.m+' — '+x.why).join('<br>')).replace(/&lt;br&gt;/g,'<br>')}</td></tr>
      <tr><th>평가 횟수</th><td>${esc2(ed.count)}</td></tr></table>`);
    if(ed.samples.length){ H.push(`<h3>예시 평가 도구 (원문)</h3><ul>`);
      ed.samples.forEach(s2=>H.push(`<li>${esc2(s2.tool||'')}${s2.score?' / 배점 '+esc2(s2.score):''}${s2.theme?' / '+esc2(s2.theme):''}
        ${(s2.elements||[]).length? '<br>평가 요소: '+esc2(s2.elements.join(' / ')):''}</li>`));
      H.push(`</ul>`); }
    H.push(`<h3>개념 기반 탐구 (초안)</h3><table>
      <tr><th style="width:14%">개념적 렌즈</th><td>${esc2(k.lens)}</td></tr>
      <tr><th>핵심 개념</th><td>${esc2(k.concepts.join(', '))}</td></tr>`);
    if(k.enduring) H.push(`<tr><th>영속적 이해<br><span class="src">(핵심 아이디어 원문)</span></th><td>${esc2(k.enduring.text)}</td></tr>`);
    H.push(`<tr><th>일반화</th><td>${k.gen.map(esc2).join('<br>')}</td></tr>
      <tr><th>사실적 질문</th><td>${k.q.fact.map(esc2).join('<br>')}</td></tr>
      <tr><th>개념적 질문</th><td>${k.q.conc.map(esc2).join('<br>')}</td></tr>
      <tr><th>논쟁적 질문</th><td>${k.q.deb.map(esc2).join('<br>')}</td></tr></table>`);
    if(gd&&gd.length){ H.push(`<h3>성취기준 적용 시 고려 사항 (원문)</h3><ul>`);
      gd.forEach(x=>H.push(`<li>${esc2(x)}</li>`)); H.push(`</ul>`); }
  });
  H.push(`</body></html>`);
  return H.join('\n');
}

/* ============================================================
   수업 바구니 · 교과 살펴보기 · 도움말 · 시작
   ============================================================ */
function saveCart(){ try{ localStorage.setItem('cart2022',JSON.stringify([...S.cart])); }catch(e){} updateCart(); }
function updateCart(){ $('#cart').hidden=S.cart.size===0; $('#cartN').textContent=S.cart.size+'개'; }
const cartRows=()=>STD.filter(r=>S.cart.has(r.c));

function bindEvents(){
  $('#btnAll').onclick=()=>{ filtered().forEach(r=>S.cart.add(r.c)); saveCart(); render(); };
  $('#btnSort').onclick=()=>{ S.sort=S.sort==='rel'?'code':'rel'; render(); };
  $('#cartCsv').onclick=()=>download(`수업바구니_${S.cart.size}건.csv`,toCSV(cartRows()));
  $('#cartPlan').onclick=()=>download(`평가계획_${S.cart.size}건.csv`,planCSV(cartRows()));
  $('#cartMd').onclick=()=>download(`수업설계자료_${S.cart.size}건.md`,mdOf(cartRows()),'text/markdown');
  $('#cartDoc').onclick=()=>download(`수업평가계획_${S.cart.size}건.doc`,docOf(cartRows()),'application/msword');
  $('#cartClear').onclick=()=>{ if(confirm('담은 성취기준을 모두 비울까요?')){ S.cart.clear(); saveCart(); render(); } };
  $('#cartCopy').onclick=()=>copy(['성취기준코드\t학년군\t교과\t영역\t성취기준',
    ...cartRows().map(r=>[r.c,r.band,r.subj,r.a,r.t].join('\t'))].join('\n'),$('#cartCopy'));
  $('#cartView').onclick=()=>{
    $('#dlgTitle').textContent=`수업 바구니 (${S.cart.size}개)`;
    const b=$('#dlgBody'); b.innerHTML='';
    const by={}; cartRows().forEach(r=>{ const k=shortBand(r.band)+' · '+r.subj; (by[k]=by[k]||[]).push(r); });
    for(const [k,rows] of Object.entries(by)){
      b.appendChild(el('h4',null,k)); const ul=el('ul');
      rows.forEach(r=>{ const li=el('li'); li.appendChild(el('code',null,r.c));
        li.appendChild(document.createTextNode(' '+r.t+' '));
        const x=el('button','btn sm','빼기');
        x.onclick=()=>{ S.cart.delete(r.c); saveCart(); render(); $('#cartView').click(); };
        li.appendChild(x); ul.appendChild(li); });
      b.appendChild(ul);
    }
    if(!S.cart.size) b.appendChild(el('p',null,'담은 성취기준이 없습니다.'));
    $('#dlg').showModal();
  };
  $('#cartPrint').onclick=()=>{
    const pa=$('#printarea'); pa.innerHTML='';
    pa.appendChild(el('h2',null,'프로젝트 수업 성취기준 모음'));
    (window.__SRC||[]).forEach(s=>{ const p=el('p',null,s); p.style.cssText='font-size:11px;color:#666;margin:2px 0'; pa.appendChild(p); });
    cartRows().forEach(r=>{
      const dm=domOf(r), k=cbi(r);
      const box=el('div'); box.style.cssText='margin:13px 0;padding:9px 0;border-top:1px solid #ccc;page-break-inside:avoid';
      const m=el('div',null,`${r.band} · ${r.subj} · ${r.a}`); m.style.cssText='font-size:11px;color:#666'; box.appendChild(m);
      const h=el('div',null,`${r.c} ${r.t}`); h.style.cssText='font-weight:700;margin:3px 0 5px'; box.appendChild(h);
      if(r.hae){ const p=el('div',null,'[해설] '+r.hae); p.style.cssText='font-size:12px;margin:2px 0'; box.appendChild(p); }
      ['A','B','C'].forEach(L=>{ const p=el('div',null,`[${L}] ${r[L]}`);
        p.style.cssText='font-size:12.5px;margin:2px 0'; box.appendChild(p); });
      if(dm&&dm.idea.length){ const p=el('div',null,'[핵심 아이디어] '+dm.idea.join(' / '));
        p.style.cssText='font-size:12px;margin:4px 0;color:#333'; box.appendChild(p); }
      const p2=el('div',null,`[개념 기반 탐구 초안 — AI 생성, 검토 필요] 렌즈: ${k.lens} / 개념: ${k.concepts.join(', ')}`);
      p2.style.cssText='font-size:12px;margin:4px 0;color:#333'; box.appendChild(p2);
      pa.appendChild(box);
    });
    window.print();
  };
  let timer;
  $('#q').addEventListener('input',e=>{ S.q=e.target.value; clearTimeout(timer); timer=setTimeout(render,120); });
  $('#clr').onclick=()=>{ S.q=''; $('#q').value=''; render(); $('#q').focus(); };
  document.addEventListener('keydown',e=>{
    if(e.key==='/'&&document.activeElement.tagName!=='INPUT'){ e.preventDefault(); $('#q').focus(); $('#q').select(); }
    if(e.key==='Escape'&&document.activeElement===$('#q')) $('#q').blur();
  });
  $('#btnTheme').onclick=()=>{
    const dark=document.documentElement.dataset.theme==='dark';
    document.documentElement.dataset.theme=dark?'':'dark';
    $('#btnTheme').textContent=dark?'야간':'주간';
    try{ localStorage.setItem('theme2022',dark?'':'dark'); }catch(e){}
  };
  if(document.documentElement.dataset.theme==='dark') $('#btnTheme').textContent='주간';
  $('#btnGuide').onclick=openGuide;
  $('#btnHelp').onclick=openHelp;
}

/* 교과 살펴보기 — 교과 성격·목표·역량·영역별 내용 체계 */
function openGuide(){
  const subj=(S.sel&&S.sel.subj)||SUBJ[0];
  $('#dlgTitle').textContent='교과 살펴보기';
  const b=$('#dlgBody'); b.innerHTML='';
  const pick=el('div'); pick.style.marginBottom='10px';
  SUBJ.forEach(s=>{ const x=el('button','btn sm'+(s===subj?' on':''),s);
    x.style.margin='2px'; x.onclick=()=>showSubject(s); pick.appendChild(x); });
  b.appendChild(pick);
  const body=el('div'); b.appendChild(body);
  function showSubject(s){
    [...pick.children].forEach(c=>c.classList.toggle('on',c.textContent===s));
    body.innerHTML='';
    const m=SMETA[s];
    if(!m){ body.appendChild(el('p',null,'이 교과는 교육과정 원문이 없습니다. (통합교과는 별책 4가 필요합니다)')); return; }
    if(m.comp&&m.comp.length){ body.appendChild(el('h4',null,'교과 역량'));
      const w=el('div'); m.comp.forEach(c=>w.appendChild(el('span','pill',c))); body.appendChild(w); }
    (m.compText||[]).forEach(t=>{ const c=el('div','card'); c.textContent=t; body.appendChild(c); });
    if(m.nature){ body.appendChild(el('h4',null,'성격')); const c=el('div','card plain'); c.textContent=m.nature; body.appendChild(c); }
    if(m.goalText){ body.appendChild(el('h4',null,'목표')); const c=el('div','card plain'); c.textContent=m.goalText; body.appendChild(c); }
    const doms=DOM[s]||[];
    if(doms.length){
      body.appendChild(el('h4',null,`내용 체계 — ${doms.length}개 영역`));
      doms.forEach(d=>{
        const det=el('details');
        const sm=el('summary'); sm.style.cssText='cursor:pointer;font-weight:700;margin:6px 0';
        sm.textContent=d.name; det.appendChild(sm);
        if(d.idea.length){ det.appendChild(el('div','catname','핵심 아이디어'));
          const ul=el('ul','tight'); d.idea.forEach(x=>ul.appendChild(el('li',null,x))); det.appendChild(ul); }
        CATS.forEach(c=>{
          const bands=d.content[c]; if(!bands) return;
          det.appendChild(el('div','catname',c));
          const ul=el('ul','tight');
          BANDS.forEach(bn=>{ if(bands[bn]) ul.appendChild(el('li',null,`${shortBand(bn)}: ${bands[bn].join(' / ')}`)); });
          det.appendChild(ul);
        });
        const btn=el('button','btn sm','이 영역 성취기준 보기');
        btn.onclick=()=>{ S.subjs.clear(); S.subjs.add(SUBJ.indexOf(s)); S.areas.clear();
          S.areas.add(s+'|'+d.name);
          $('#dlg').close(); renderFilters(); render(); };
        det.appendChild(btn);
        body.appendChild(det);
      });
    }
  }
  showSubject(subj);
  $('#dlg').showModal();
}

    <li><b>영속적 이해</b>는 그 영역의 <b>핵심 아이디어 원문</b>을 그대로 가져옵니다.</li>
    <li><b>개념</b>은 성취기준의 이름씨(명사)를 먼저 뽑고, 내용 체계의 내용 요소 가운데 그 성취기준과
        맞물리는 것을 보태어 정합니다.</li>
    <li><b>개념적 렌즈·일반화 문장·탐구 질문</b>은 <b>인공지능이 만든 초안</b>입니다. 반드시 검토하고 고쳐 쓰세요.</li>
    <li><b>MD 파일</b> 끝에는 인공지능에게 줄 <b>설계 진행 지시문</b>이 들어 있습니다.
        바로 설계안을 쓰지 않고 수업 의도·차시·활동·평가를 먼저 물어본 뒤 설계하도록 되어 있습니다.</li>
  </ul>
  <h4>개념 지도</h4>
  <ul>
    <li>동그라미(개념)를 누르면 그 개념을 함께 다루는 성취기준이 <b>펼쳐집니다</b>.</li>
    <li>네모(성취기준)를 누르면 그 성취기준으로 옮겨 갑니다.</li>
    <li>배경을 끌면 이동, 휠은 확대·축소, 노드를 끌면 자리를 옮깁니다.</li>
  </ul>
  <h4>내려받기</h4>
  <ul>
    <li><b>MD 내려받기</b> — 성취기준·해설·성취수준·내용 체계·탐구 초안이 담긴 마크다운 파일.
        인공지능 대화창에 그대로 붙여 넣어 수업 설계를 이어갈 수 있습니다.</li>
    <li><b>CSV</b>는 엑셀·한셀에서, <b>표로 복사</b>는 한글(HWP)에 붙여 넣으면 표가 됩니다.</li>
    <li><b>인쇄/PDF</b>에서 <i>대상: PDF로 저장</i>을 고르면 PDF가 됩니다.</li>
  </ul>
  <h4>자료 출처</h4>
  <ul>${(window.__SRC||[]).map(s=>'<li>'+s+'</li>').join('')}</ul>
  <p style="color:var(--dim);font-size:12.5px">통합교과(바른 생활·슬기로운 생활·즐거운 생활)는 교육과정 원문이 포함되지 않아
  성취기준과 성취수준만 제공합니다.</p>`;
  $('#dlg').showModal();
}

/* ---------- 시작 ---------- */
function boot(data){
  BANDS=data.bands; SUBJ=data.subjects; STD=data.std; AREA=data.area;
  DOM=data.dom; GUIDE=data.guide; GUIDEPG=data.guidePg||{}; INQACT=data.inqAct||{}; SMETA=data.subjMeta;
  window.__SRC=data.meta.src||[];
  window.__EVAL=data.eval||{};
  buildIndex(); buildSeries(); buildConceptIndex();
  $('#srcline').innerHTML=(data.meta.src||[]).join('<br>')+
    `<br>성취기준 ${data.meta.nStd}개 · 성취기준 해설 ${data.meta.nHae}개 · 영역별 성취수준 ${data.meta.nArea}개`;
  renderFilters(); bindEvents(); updateCart(); render();
  $('#loading').remove();
}

fetch('data/app.json').then(r=>r.json()).then(boot).catch(e=>{
  document.getElementById('loading').textContent='자료를 불러오지 못했습니다: '+e;
});
</script>
</body>
</html>
